<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reports — OHT Accounting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  /* Everything visual now comes from theme.css. What stays here is the page
     skeleton and — untouched — the print rules. */
  html,body{height:100%;}
  body{display:flex;flex-direction:column;}
  main{flex:1;overflow-y:auto;padding:16px 14px 28px;}
  .toolbar h1{font-size:16px;margin:0 8px 0 0;font-weight:700;}
  main > .toolbar.filters{max-width:980px; margin:0 auto 4px; padding-left:0; padding-right:0;}
  @media print{
    @page{size:A4;}
    body{background:#fff;color:#000;}
    .toolbar,.tabs,button,input,select{display:none !important;}
    .card,.stat{border:1px solid #999;background:#fff;}
    th,td{border-bottom:1px solid #999;}
    .poweredBy{
      display:block; position:fixed; left:0; right:0; bottom:8mm; font-size:10px; color:#666;
      border-top:1.5px solid #A67C2E; padding-top:5px; padding-left:15mm; padding-right:15mm;
    }
  }
  .poweredBy{display:none;}
</style>
</head>
<body>

<div class="toolbar tabs-wrap">
  <h1>Reports</h1>
  <div class="tabs" id="tabs"></div>
</div>

<main id="content"></main>
<div class="poweredBy">Powered by "OHT Solutions"</div>
<div id="toastStack" class="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'active') {
      d.active ? sb.auth.startAutoRefresh && sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh && sb.auth.stopAutoRefresh();
      return;
    }
    // Deep-link from another module (Masters' sidebar report links):
    //   masters.html -> parent: { oht:'open', app:'reports', arg:'<tabkey>' }
    //   index.html   -> here:   { oht:'goto', app:'reports', arg:'<tabkey>' }
    // `arg` is one of this file's TABS keys. A goto that arrives before
    // init() has finished just sets activeTab — init() then renders it.
    if (d.oht === 'goto' && (!d.app || d.app === 'reports')) {
      var key = d.arg;
      if (!key || !VIEWS[key]) return;
      activeTab = key;
      if (inited) { buildTabs(); render(); }
    }
  });

  // ---- shared toast helper (§14) — same helper index.html/masters.html use;
  // each module is its own document, so each carries its own copy. ----
  var MAX_TOASTS = 3;
  function toast(message, isError) {
    var stack = document.getElementById('toastStack');
    if (!stack) return;
    while (stack.children.length >= MAX_TOASTS) stack.removeChild(stack.firstChild);
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });
    setTimeout(function () {
      el.classList.remove('on');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, isError ? 5200 : 3200);
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtQty(n) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 3 }); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function firstOfMonth() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }

  // Shared date-range filter markup + quick-range buttons, used by the
  // material-consumption reports below (mirrors §21 Profit & Loss's own
  // From/To + quick-range pattern, factored out since three views share it).
  function dateRangeFilterHtml(prefix, from, to) {
    return '<div class="field"><label for="' + prefix + '_from">From</label><input type="date" id="' + prefix + '_from" value="' + from + '"></div>' +
      '<div class="field"><label for="' + prefix + '_to">To</label><input type="date" id="' + prefix + '_to" value="' + to + '"></div>' +
      '<button type="button" class="btn" id="' + prefix + '_today">Today</button>' +
      '<button type="button" class="btn" id="' + prefix + '_month">This month</button>' +
      '<button type="button" class="btn" id="' + prefix + '_lastmonth">Last month</button>' +
      '<button type="button" class="btn" id="' + prefix + '_year">This year</button>';
  }
  function setDateRange(prefix, f, t, onRun) {
    document.getElementById(prefix + '_from').value = f;
    document.getElementById(prefix + '_to').value = t;
    onRun();
  }
  function wireDateRangeButtons(prefix, onRun) {
    document.getElementById(prefix + '_today').addEventListener('click', function () { setDateRange(prefix, todayStr(), todayStr(), onRun); });
    document.getElementById(prefix + '_month').addEventListener('click', function () { setDateRange(prefix, firstOfMonth(), todayStr(), onRun); });
    document.getElementById(prefix + '_lastmonth').addEventListener('click', function () {
      var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
      var f = d.toISOString().slice(0, 10);
      var endD = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      setDateRange(prefix, f, endD.toISOString().slice(0, 10), onRun);
    });
    document.getElementById(prefix + '_year').addEventListener('click', function () {
      var y = new Date().getFullYear();
      setDateRange(prefix, y + '-01-01', todayStr(), onRun);
    });
  }
  function itemSelectOptions(selected) {
    return '<option value="">All</option>' + itemsCache.map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === selected ? ' selected' : '') + '>' + esc(i.name) + '</option>';
    }).join('');
  }
  function partySelectOptions(selected) {
    return '<option value="">All</option>' + partiesCache.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === selected ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
  }
  function warehouseSelectOptions(selected) {
    return '<option value="">All</option>' + warehousesCache.map(function (w) {
      return '<option value="' + w.id + '"' + (w.id === selected ? ' selected' : '') + '>' + esc(w.name) + '</option>';
    }).join('');
  }

  var TABS = [
    { key: 'trial', label: 'Trial Balance' },
    { key: 'aging', label: 'Receivable Aging' },
    { key: 'pl', label: 'Profit & Loss' },
    { key: 'statement', label: 'Statement of Account' },
    { key: 'stockledger', label: 'Item Stock Ledger' },
    { key: 'matcons', label: 'Material Consumption' },
    { key: 'matprofit', label: 'Material Cost & Profit' },
    { key: 'mataudit', label: 'Consumption Audit' }
  ];
  var activeTab = 'trial';
  var inited = false;
  var partiesCache = [], itemsCache = [], warehousesCache = [];

  // ---- letterhead (§12) -------------------------------------------------
  // Presentation only: the default firm's name/address heads every report the
  // way it heads a printed statement. Never used in any calculation.
  var firm = null;
  async function loadFirm() {
    if (firm) return firm;
    var res = await sb.from('companies').select('name,city,phone,ntn,is_default').is('deleted_at', null).order('is_default', { ascending: false });
    var rows = (res && res.data) || [];
    firm = rows[0] || { name: 'OHT Accounting', city: '', phone: '', ntn: '' };
    return firm;
  }
  function firmMark() {
    var n = (firm && firm.name ? firm.name : 'OHT').trim();
    return esc(n.charAt(0).toUpperCase() || 'O');
  }
  function firmAddr() {
    if (!firm) return '';
    return [firm.city, firm.phone, firm.ntn ? 'NTN ' + firm.ntn : ''].filter(Boolean).join(' · ');
  }
  function emptyState(big, sub) {
    return '<div class="empty-state"><div class="empty-big">' + esc(big) + '</div>' +
      '<div class="empty-sub">' + esc(sub) + '</div></div>';
  }
  // Every report body opens with this: letterhead + serif title + sub-line.
  function docHead(title, sub) {
    return '<div class="letterhead">' +
        '<div class="mark2">' + firmMark() + '</div>' +
        '<div><div class="firm-name">' + esc(firm ? firm.name : 'OHT Accounting') + '</div>' +
        '<div class="firm-addr">' + esc(firmAddr()) + '</div></div>' +
      '</div>' +
      '<h2 class="stmt-title">' + esc(title) + '</h2>' +
      '<div class="stmt-sub">' + esc(sub || '') + '</div>';
  }

  // Cost-visibility gate for raw-material figures — mirrors billing.html's
  // canViewMaterialCost() exactly (same me.isAdmin / me.perms.material_cost_view
  // check, same app_users.perms source, populated in init() below).
  var me = { isAdmin: false, perms: {} };
  function canViewMaterialCost() { return me.isAdmin || !!me.perms.material_cost_view; }

  function buildTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = t.label;
      b.className = t.key === activeTab ? 'on' : '';
      b.addEventListener('click', function () { activeTab = t.key; buildTabs(); render(); });
      el.appendChild(b);
    });
  }

  // ===================================================================
  // Trial Balance (§19)
  // ===================================================================
  var trialView = {
    async render() {
      await loadFirm();
      var asOf = document.getElementById('tb_asof') ? document.getElementById('tb_asof').value : todayStr();
      var html = '<div class="toolbar filters">' +
        '<div class="field"><label for="tb_asof">As of</label><input type="date" id="tb_asof" value="' + asOf + '"></div>' +
        '<button type="button" class="btn" id="tb_reload">Refresh</button>' +
        '<button type="button" class="btn" id="tb_reconcile">Run reconciliation check</button></div>';
      html += '<div class="doc-sheet" id="tb_body">Loading…</div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('tb_reload').addEventListener('click', trialView.render);
      document.getElementById('tb_reconcile').addEventListener('click', trialView.runReconcile);

      var { data, error } = await sb.rpc('trial_balance', { p_as_of: asOf });
      var body = document.getElementById('tb_body');
      if (error) { body.innerHTML = docHead('Trial Balance', 'As of ' + asOf) + '<p class="warn">' + esc(error.message) + '</p>'; return; }
      var totalDr = 0, totalCr = 0;
      (data || []).forEach(function (r) { if (r.side === 'dr') totalDr += Number(r.balance); else totalCr += Number(r.balance); });
      var h = docHead('Trial Balance', 'As of ' + asOf);
      h += '<div id="tb_recon"></div>';
      h += '<table class="doc-table"><thead><tr><th>Party</th><th class="num">Balance</th><th>Side</th></tr></thead><tbody>';
      (data || []).forEach(function (r) {
        h += '<tr><td>' + esc(r.party_name) + '</td><td class="num mono">' + fmt(r.balance) + '</td>' +
          '<td class="' + (r.side === 'dr' ? 'bucket-b60' : 'bucket-payable') + '">' + r.side.toUpperCase() + '</td></tr>';
      });
      h += '</tbody><tfoot><tr><td>Total Dr</td><td class="num mono">' + fmt(totalDr) + '</td><td></td></tr>' +
        '<tr><td>Total Cr</td><td class="num mono">' + fmt(totalCr) + '</td><td></td></tr></tfoot></table>';
      body.innerHTML = h;
    },
    async runReconcile() {
      var asOf = document.getElementById('tb_asof').value;
      var out = document.getElementById('tb_recon');
      var { data, error } = await sb.rpc('aging_reconcile', { p_as_of: asOf });
      if (error) { toast(error.message, true); return; }
      if (!data || !data.length) {
        if (out) out.innerHTML = '';
        toast('Reconciliation OK — Trial Balance and Receivable Aging agree for every party.');
        return;
      }
      toast('Reconciliation found ' + data.length + ' discrepant party(ies) — listed above the table.', true);
      if (!out) return;
      out.innerHTML = '<table class="doc-table" style="margin-bottom:14px"><thead><tr>' +
        '<th>Party with a Trial Balance / Aging discrepancy</th><th class="num">Difference</th></tr></thead><tbody>' +
        data.map(function (r) {
          return '<tr><td>' + esc(r.party_name) + '</td><td class="num mono warn">' + fmt(r.difference) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
  };

  // ===================================================================
  // Receivable Aging (§20)
  // ===================================================================
  var agingView = {
    async render() {
      await loadFirm();
      var asOf = document.getElementById('ag_asof') ? document.getElementById('ag_asof').value : todayStr();
      var html = '<div class="toolbar filters">' +
        '<div class="field"><label for="ag_asof">As of</label><input type="date" id="ag_asof" value="' + asOf + '"></div>' +
        '<button type="button" class="btn" id="ag_reload">Refresh</button></div>';
      html += '<div class="doc-sheet" id="ag_body">Loading…</div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('ag_reload').addEventListener('click', agingView.render);

      var { data, error } = await sb.rpc('receivable_aging', { p_as_of: asOf });
      var body = document.getElementById('ag_body');
      if (error) { body.innerHTML = docHead('Receivable Aging', 'As of ' + asOf) + '<p class="warn">' + esc(error.message) + '</p>'; return; }
      var rows = (data || []).sort(function (a, b) { return b.outstanding - a.outstanding; });
      var buckets = { notdue: 0, b0: 0, b30: 0, b60: 0, b90: 0, payable: 0, advance: 0 };
      rows.forEach(function (r) { buckets[r.bucket] = (buckets[r.bucket] || 0) + Number(r.outstanding); });
      var bucketKeys = ['notdue', 'b0', 'b30', 'b60', 'b90'];
      var bucketLabels = { notdue: 'Not due', b0: '1-30 days', b30: '31-60 days', b60: '61-90 days', b90: '90+ days' };
      var h = docHead('Receivable Aging', 'As of ' + asOf);
      h += '<table class="doc-table" style="margin-bottom:16px"><thead><tr>' +
        bucketKeys.map(function (k) { return '<th class="num">' + bucketLabels[k] + '</th>'; }).join('') +
        '</tr></thead><tbody><tr>' +
        bucketKeys.map(function (k) { return '<td class="num mono bucket-' + k + '">' + fmt(buckets[k]) + '</td>'; }).join('') +
        '</tr></tbody></table>';
      h += '<table class="doc-table"><thead><tr><th>Party</th><th>Doc</th><th>Date</th><th>Due</th><th class="num">Original</th><th class="num">Outstanding</th><th class="num">Days</th><th>Bucket</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        h += '<tr><td>' + esc(r.party_name) + '</td><td class="mono">' + esc(r.doc_no) + '</td><td class="mono">' + (r.doc_date || '') + '</td><td class="mono">' + (r.due_date || '') + '</td>' +
          '<td class="num mono">' + fmt(r.original_amount) + '</td><td class="num mono">' + fmt(r.outstanding) + '</td>' +
          '<td class="num mono">' + (r.days_overdue || 0) + '</td><td class="bucket-' + r.bucket + '">' + esc(bucketLabels[r.bucket] || r.bucket) + '</td></tr>';
      });
      h += '</tbody></table>';
      body.innerHTML = h;
    }
  };

  // ===================================================================
  // Profit & Loss (§21) — computed client-side per spec, no DB function
  // ===================================================================
  var plView = {
    async render() {
      var from = document.getElementById('pl_from') ? document.getElementById('pl_from').value : firstOfMonth();
      var to = document.getElementById('pl_to') ? document.getElementById('pl_to').value : todayStr();
      await loadFirm();
      var html = '<div class="toolbar filters">' +
        '<div class="field"><label for="pl_from">From</label><input type="date" id="pl_from" value="' + from + '"></div>' +
        '<div class="field"><label for="pl_to">To</label><input type="date" id="pl_to" value="' + to + '"></div>' +
        '<button type="button" class="btn" id="pl_today">Today</button><button type="button" class="btn" id="pl_month">This month</button>' +
        '<button type="button" class="btn" id="pl_lastmonth">Last month</button><button type="button" class="btn" id="pl_year">This year</button>' +
        '<button type="button" class="btn pri" id="pl_run">Run</button></div>';
      html += '<div class="doc-sheet" id="pl_body">Pick a range and click Run.</div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('pl_run').addEventListener('click', plView.run);
      document.getElementById('pl_today').addEventListener('click', function () { setRange(todayStr(), todayStr()); });
      document.getElementById('pl_month').addEventListener('click', function () { setRange(firstOfMonth(), todayStr()); });
      document.getElementById('pl_lastmonth').addEventListener('click', function () {
        var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
        var f = d.toISOString().slice(0, 10);
        var endD = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        setRange(f, endD.toISOString().slice(0, 10));
      });
      document.getElementById('pl_year').addEventListener('click', function () {
        var y = new Date().getFullYear();
        setRange(y + '-01-01', todayStr());
      });
      function setRange(f, t) { document.getElementById('pl_from').value = f; document.getElementById('pl_to').value = t; plView.run(); }
      function firstOfMonth() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
      plView.run();
    },

    async run() {
      var from = document.getElementById('pl_from').value, to = document.getElementById('pl_to').value;
      var body = document.getElementById('pl_body');
      body.innerHTML = 'Computing…';

      var [{ data: sales }, { data: returns }, { data: linesData }, { data: serviceInv }, { data: expenseSheets }] = await Promise.all([
        sb.from('vouchers').select('id,sub_total,discount,grand_total,loading_on,loading_amt,cartage_on,cartage_amt,cutting_on,cutting_amt')
          .eq('vtype', 'sale').is('deleted_at', null).gte('vdate', from).lte('vdate', to),
        sb.from('sales_returns').select('id,grand_total,sale_id,deleted_at').gte('rdate', from).lte('rdate', to),
        sb.from('voucher_lines').select('voucher_id,cost_amount'),
        sb.from('service_invoices').select('sub_total,discount').neq('status', 'cancelled').is('deleted_at', null).gte('sidate', from).lte('sidate', to),
        sb.from('sheets').select('rows').is('deleted_at', null).gte('sheet_date', from).lte('sheet_date', to)
      ]);

      var grossSales = (sales || []).reduce(function (s, v) { return s + Number(v.sub_total); }, 0);
      var discounts = (sales || []).reduce(function (s, v) { return s + Number(v.discount); }, 0);
      var salesReturnsInRange = (returns || []).filter(function (r) { return !r.deleted_at; }).reduce(function (s, r) { return s + Number(r.grand_total); }, 0);
      var netSales = grossSales - salesReturnsInRange - discounts;

      var saleIds = (sales || []).map(function (v) { return v.id; });
      var cogs = (linesData || []).filter(function (l) { return saleIds.indexOf(l.voucher_id) >= 0; })
        .reduce(function (s, l) { return s + Number(l.cost_amount || 0); }, 0);

      // Returns' cost is removed from COGS too — need each in-range return's lines' cost_amount,
      // filtered to non-deleted parent returns only (§21's documented real bug to avoid).
      var { data: returnLines } = await sb.from('sales_return_lines').select('return_id,cost_amount');
      var validReturnIds = (returns || []).filter(function (r) { return !r.deleted_at; }).map(function (r) { return r.id; });
      var returnsCost = (returnLines || []).filter(function (rl) { return validReturnIds.indexOf(rl.return_id) >= 0; })
        .reduce(function (s, rl) { return s + Number(rl.cost_amount || 0); }, 0);
      cogs -= returnsCost;

      var grossProfit = netSales - cogs;
      var grossMarginPct = netSales !== 0 ? (grossProfit / netSales) * 100 : 0;

      var otherIncome = (sales || []).reduce(function (s, v) {
        return s + (v.loading_on ? Number(v.loading_amt) : 0) + (v.cartage_on ? Number(v.cartage_amt) : 0) + (v.cutting_on ? Number(v.cutting_amt) : 0);
      }, 0);

      var serviceRevenue = (serviceInv || []).reduce(function (s, si) { return s + (Number(si.sub_total) - Number(si.discount)); }, 0);
      var totalRevenue = netSales + serviceRevenue;

      // Operating expenses / finance charges: cash-book DEBIT rows linked to an expense-kind party.
      var { data: expenseParties } = await sb.from('parties').select('id,expense_type').eq('kind', 'expense').is('deleted_at', null);
      var expenseMap = {}; (expenseParties || []).forEach(function (p) { expenseMap[p.id] = p.expense_type; });
      var opEx = 0, financeCharges = 0;
      (expenseSheets || []).forEach(function (s) {
        (s.rows || []).forEach(function (r) {
          var partyId = r[7];
          if (partyId && expenseMap.hasOwnProperty(partyId)) {
            var amt = Number(r[0]) || 0;
            if (expenseMap[partyId] === 'bank_charges') financeCharges += amt; else opEx += amt;
          }
        });
      });

      var operatingProfit = grossProfit + serviceRevenue + otherIncome - opEx;
      var netProfit = operatingProfit - financeCharges;
      var netMarginPct = netSales !== 0 ? (netProfit / netSales) * 100 : 0;

      function row(label, val, bold) {
        return '<tr' + (bold ? ' class="sum"' : '') + '><td>' + label + '</td><td class="num mono' +
          (Number(val) < 0 ? ' warn' : '') + '">' + fmt(val) + '</td></tr>';
      }
      var h = docHead('Profit & Loss', from + '  to  ' + to);
      h += '<table class="doc-table"><tbody>' +
        row('Gross Sales', grossSales) + row('Sales Returns', -salesReturnsInRange) + row('Discounts', -discounts) +
        row('Net Sales', netSales, true) + row('COGS', -cogs) + row('Gross Profit', grossProfit, true) +
        '<tr class="note"><td colspan="2">Gross Margin: ' + grossMarginPct.toFixed(1) + '%</td></tr>' +
        row('Other Income (Loading/Cartage/Cutting)', otherIncome) + row('Service Revenue', serviceRevenue) +
        row('Total Revenue (Net Sales + Service Revenue)', totalRevenue) +
        row('Operating Expenses', -opEx) + row('Operating Profit', operatingProfit, true) +
        row('Finance/Bank Charges', -financeCharges) +
        '</tbody><tfoot>' +
        '<tr><td>Net Profit</td><td class="num mono' + (netProfit < 0 ? ' warn' : '') + '">' + fmt(netProfit) + '</td></tr>' +
        '<tr class="note"><td colspan="2">Net Margin: ' + netMarginPct.toFixed(1) + '%</td></tr>' +
        '</tfoot></table>';
      body.innerHTML = h;
    }

  // Shared event-building function (§11) — used by both screen and (future) print.
  async function buildLedgerEvents(partyId) {
    var { data: party } = await sb.from('parties').select('*').eq('id', partyId).single();
    var events = [];
    if (party.opening) {
      events.push({ date: party.opening_date || '0000-01-01', desc: 'Opening balance', dr: party.opening_side === 'dr' ? party.opening : 0, cr: party.opening_side === 'cr' ? party.opening : 0 });
    }
    var { data: sales } = await sb.from('vouchers').select('vno,vdate,grand_total,paid').eq('party_id', partyId).eq('vtype', 'sale').is('deleted_at', null);
    (sales || []).forEach(function (v) {
      events.push({ date: v.vdate, desc: 'Sale ' + v.vno, dr: v.grand_total, cr: 0 });
      if (v.paid > 0) events.push({ date: v.vdate, desc: 'Received with ' + v.vno, dr: 0, cr: v.paid });
    });
    var { data: purchases } = await sb.from('vouchers').select('vno,vdate,grand_total,paid').eq('party_id', partyId).eq('vtype', 'purchase').is('deleted_at', null);
    (purchases || []).forEach(function (v) {
      events.push({ date: v.vdate, desc: 'Purchase ' + v.vno, dr: 0, cr: v.grand_total });
      if (v.paid > 0) events.push({ date: v.vdate, desc: 'Paid with ' + v.vno, dr: v.paid, cr: 0 });
    });
    var { data: returns } = await sb.from('sales_returns').select('rno,rdate,grand_total').eq('party_id', partyId).is('deleted_at', null);
    (returns || []).forEach(function (r) { events.push({ date: r.rdate, desc: 'Return ' + r.rno, dr: 0, cr: r.grand_total }); });
    var { data: svc } = await sb.from('service_invoices').select('sino,sidate,grand_total,paid').eq('party_id', partyId).neq('status', 'cancelled').is('deleted_at', null);
    (svc || []).forEach(function (si) {
      events.push({ date: si.sidate, desc: 'Service ' + si.sino, dr: si.grand_total, cr: 0 });
      if (si.paid > 0) events.push({ date: si.sidate, desc: 'Received with ' + si.sino, dr: 0, cr: si.paid });
    });
    var { data: sheetsData } = await sb.from('sheets').select('sheet_date,rows').is('deleted_at', null);
    var normName = party.name.trim().toLowerCase().replace(/\s+/g, ' ');
    (sheetsData || []).forEach(function (s) {
      (s.rows || []).forEach(function (r) {
        if (r[6] === partyId) { // credit-side link: cash received FROM them
          var remark = stripOwnName(r[3] || '', normName);
          events.push({ date: s.sheet_date, desc: remark || 'Cash received', dr: 0, cr: Number(r[2]) || 0 });
        }
        if (r[7] === partyId) { // debit-side link: cash paid TO them
          var remark2 = stripOwnName(r[1] || '', normName);
          events.push({ date: s.sheet_date, desc: remark2 || 'Cash paid', dr: Number(r[0]) || 0, cr: 0 });
        }
      });
    });

    events.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var running = 0;
    events.forEach(function (e) { running += (e.dr || 0) - (e.cr || 0); e.running = running; });
    return events;
  }

  function stripOwnName(text, normName) {
    var norm = text.trim().toLowerCase().replace(/\s+/g, ' ');
    if (norm.indexOf(normName) === 0) {
      return text.trim().slice(normName.length).trim();
    }
    return text;
  }

  var matProfitView = {

      var { data: vouchers, error: vErr } = await sb.from('vouchers').select('id,vno,vdate,party_id')
        .eq('vtype', 'sale').is('deleted_at', null).gte('vdate', from).lte('vdate', to);
      if (vErr) { body.innerHTML = head + '<p class="warn">' + esc(vErr.message) + '</p>'; return; }
      var voucherMap = {}; (vouchers || []).forEach(function (v) { voucherMap[v.id] = v; });
      var voucherIds = (vouchers || []).map(function (v) { return v.id; });
      if (!voucherIds.length) { body.innerHTML = head + emptyState('Nothing to show', 'No consumption rows match these filters.'); return; }

      var lq = sb.from('voucher_lines').select('id,voucher_id,item_id,amount').eq('consumption_type', 'raw_material_consumption').in('voucher_id', voucherIds);
      if (item) lq = lq.eq('item_id', item);
      var { data: lines, error: lErr } = await lq;
      if (lErr) { body.innerHTML = head + '<p class="warn">' + esc(lErr.message) + '</p>'; return; }

      var costByLine = {};
      (consump || []).forEach(function (c) { costByLine[c.voucher_line_id] = (costByLine[c.voucher_line_id] || 0) + Number(c.cost_amount || 0); });

      var lineRows = lines.map(function (l) {
        var cost = costByLine[l.id] || 0;
        var sale = Number(l.amount || 0);
        return { line: l, sale: sale, cost: cost };
      });

      var groups = {};
      lineRows.forEach(function (lr) {
        var key = groupBy === 'invoice' ? lr.line.voucher_id : (lr.line.item_id || 'none');
        if (!groups[key]) groups[key] = { key: key, sale: 0, cost: 0 };

      });
      var groupArr = Object.keys(groups).map(function (k) {
        var g = groups[k]; g.margin = g.sale - g.cost; g.marginPct = g.sale !== 0 ? (g.margin / g.sale) * 100 : 0; return g;

      if (groupBy === 'invoice') {
        groupArr.sort(function (a, b) {

          label = it ? esc(it.name) : '(deleted item)';
        }
        h += '<tr><td>' + label + '</td>' + extraCells +
          '<td class="num mono">' + fmt(g.sale) + '</td>' +
          (showCost ? '<td class="num mono">' + fmt(g.cost) + '</td><td class="num mono' + (g.margin < 0 ? ' warn' : '') + '">' + fmt(g.margin) + '</td><td class="num mono">' + g.marginPct.toFixed(1) + '%</td>' : '') +
          '</tr>';
      });
      var totalMargin = totalSale - totalCost;
      var totalMarginPct = totalSale !== 0 ? (totalMargin / totalSale) * 100 : 0;
      var labelColspan = groupBy === 'invoice' ? 3 : 1;
      h += '</tbody><tfoot><tr><td colspan="' + labelColspan + '">Total</td>' +
        '<td class="num mono">' + fmt(totalSale) + '</td>' +
        (showCost ? '<td class="num mono">' + fmt(totalCost) + '</td><td class="num mono' + (totalMargin < 0 ? ' warn' : '') + '">' + fmt(totalMargin) + '</td><td class="num mono">' + totalMarginPct.toFixed(1) + '%</td>' : '') +
        '</tr></tfoot>';
      h += '</table>';
      body.innerHTML = h;
    }
  };

  // ===================================================================
  // Reversed / Cancelled Consumption Audit — consumption rows tied to a
  // soft-deleted sale voucher and/or (fully or partially) restored via a
  // sales return, so an admin can see exactly what got reversed.
  // ===================================================================
  var matAuditView = {
    async render() {
      await matConsumptionView.loadCaches();
      var from = document.getElementById('ma_from') ? document.getElementById('ma_from').value : firstOfMonth();
      var to = document.getElementById('ma_to') ? document.getElementById('ma_to').value : todayStr();
      var finalItem = document.getElementById('ma_final') ? document.getElementById('ma_final').value : '';
      var rawItem = document.getElementById('ma_raw') ? document.getElementById('ma_raw').value : '';

      await loadFirm();
      var html = '<div class="toolbar filters">' + dateRangeFilterHtml('ma', from, to) +
        '<div class="field"><label for="ma_final">Final Product</label><select id="ma_final">' + itemSelectOptions(finalItem) + '</select></div>' +
        '<div class="field"><label for="ma_raw">Raw Material</label><select id="ma_raw">' + itemSelectOptions(rawItem) + '</select></div>' +
        '<button type="button" class="btn pri" id="ma_run">Run</button></div>';
      html += '<div class="doc-sheet" id="ma_body">Loading…</div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('ma_run').addEventListener('click', matAuditView.run);
      wireDateRangeButtons('ma', matAuditView.run);
      matAuditView.run();
    },
    async run() {
      var from = document.getElementById('ma_from').value, to = document.getElementById('ma_to').value;
      var finalItem = document.getElementById('ma_final').value, rawItem = document.getElementById('ma_raw').value;
      var body = document.getElementById('ma_body');
      var head = docHead('Consumption Audit', from + '  to  ' + to + ' · cancelled invoices and returned material');
      body.innerHTML = head + '<p class="stmt-sub">Loading…</p>';

      // Deliberately NOT filtered on deleted_at — a cancelled invoice is
      // exactly what this audit needs to surface.
      var { data: vouchers, error: vErr } = await sb.from('vouchers').select('id,vno,vdate,party_id,deleted_at')
        .eq('vtype', 'sale').gte('vdate', from).lte('vdate', to);
      if (vErr) { body.innerHTML = head + '<p class="warn">' + esc(vErr.message) + '</p>'; return; }
      var voucherMap = {}; (vouchers || []).forEach(function (v) { voucherMap[v.id] = v; });
      var voucherIds = (vouchers || []).map(function (v) { return v.id; });
      if (!voucherIds.length) { body.innerHTML = head + emptyState('Nothing to show', 'No consumption rows match these filters.'); return; }

      var lq = sb.from('voucher_lines').select('id,voucher_id,item_id').eq('consumption_type', 'raw_material_consumption').in('voucher_id', voucherIds);
      if (finalItem) lq = lq.eq('item_id', finalItem);
      var { data: lines, error: lErr } = await lq;
      if (lErr) { body.innerHTML = head + '<p class="warn">' + esc(lErr.message) + '</p>'; return; }
      if (!lines || !lines.length) { body.innerHTML = head + emptyState('Nothing to show', 'No consumption rows match these filters.'); return; }
      var lineMap = {}; lines.forEach(function (l) { lineMap[l.id] = l; });
      var lineIds = lines.map(function (l) { return l.id; });

      var cq = sb.from('voucher_line_material_consumption').select('id,voucher_line_id,raw_item_id,qty,unit,cost_amount').in('voucher_line_id', lineIds).range(0, 1999);
      if (rawItem) cq = cq.eq('raw_item_id', rawItem);
      var { data: consump, error: cErr } = await cq;
      if (cErr) { body.innerHTML = head + '<p class="warn">' + esc(cErr.message) + '</p>'; return; }
      if (!consump || !consump.length) { body.innerHTML = head + emptyState('Nothing to show', 'No consumption rows match these filters.'); return; }
      var consumpIds = consump.map(function (c) { return c.id; });

      var { data: restorations, error: rErr } = await sb.from('sales_return_material_restoration').select('consumption_id,qty').in('consumption_id', consumpIds);
      if (rErr) { body.innerHTML = head + '<p class="warn">' + esc(rErr.message) + '</p>'; return; }
      var restoredByConsumption = {};
      (restorations || []).forEach(function (r) { restoredByConsumption[r.consumption_id] = (restoredByConsumption[r.consumption_id] || 0) + Number(r.qty || 0); });

      var rows = consump.map(function (c) {
        var line = lineMap[c.voucher_line_id];
        var v = line ? voucherMap[line.voucher_id] : null;
        var restored = restoredByConsumption[c.id] || 0;
        return { c: c, line: line, voucher: v, restored: restored, remaining: Number(c.qty) - restored };
      }).filter(function (r) { return (r.voucher && r.voucher.deleted_at) || r.restored > 0; });

      if (!rows.length) { body.innerHTML = head + emptyState('Nothing reversed', 'No cancelled or returned consumption matches these filters.'); return; }

      rows.sort(function (a, b) {
        var da = a.voucher ? a.voucher.vdate : '', db = b.voucher ? b.voucher.vdate : '';
        return da < db ? 1 : da > db ? -1 : 0;
      });

      var showCost = canViewMaterialCost();
      var totalCost = 0, totalRestoredQty = 0;
      var h = head + '<table class="doc-table"><thead><tr><th>Date</th><th>Invoice No</th><th>Status</th><th>Final Product</th><th>Raw Material</th>' +
        '<th class="num">Qty Consumed</th><th class="num">Qty Restored</th><th class="num">Net Consumption</th>' +
        (showCost ? '<th class="num">Cost</th>' : '') + '</tr></thead><tbody>';
      rows.forEach(function (r) {
        var v = r.voucher, line = r.line;
        var finalItm = line ? itemsCache.filter(function (i) { return i.id === line.item_id; })[0] : null;
        var rawItm = itemsCache.filter(function (i) { return i.id === r.c.raw_item_id; })[0];
        var badge = (v && v.deleted_at) ? '<span class="badge b-void">Cancelled</span>' : (r.restored > 0 ? '<span class="badge b-supplier">Returned</span>' : '');
        totalCost += Number(r.c.cost_amount || 0);
        totalRestoredQty += r.restored;
        h += '<tr><td class="mono">' + (v ? v.vdate : '') + '</td><td class="mono">' + (v ? esc(v.vno) : '') + '</td><td>' + badge + '</td>' +
          '<td>' + (finalItm ? esc(finalItm.name) : '(deleted item)') + '</td>' +
          '<td>' + (rawItm ? esc(rawItm.name) : '(deleted item)') + '</td>' +
          '<td class="num mono">' + fmtQty(r.c.qty) + '</td>' +
          '<td class="num mono">' + (r.restored ? fmtQty(r.restored) : '—') + '</td>' +
          '<td class="num mono">' + fmtQty(r.remaining) + '</td>' +
          (showCost ? '<td class="num mono">' + fmt(r.c.cost_amount) + '</td>' : '') +
          '</tr>';
      });
      h += '</tbody><tfoot><tr><td colspan="6">Total (' + rows.length + ' row(s))</td>' +
        '<td class="num mono">' + fmtQty(totalRestoredQty) + '</td><td></td>' +
        (showCost ? '<td class="num mono">' + fmt(totalCost) + '</td>' : '') + '</tr></tfoot>';
      h += '</table>';
      body.innerHTML = h;
    }
  };

  var VIEWS = {
    trial: trialView, aging: agingView, pl: plView, statement: statementView, stockledger: stockLedgerView,
    matcons: matConsumptionView, matprofit: matProfitView, mataudit: matAuditView
  };

  async function render() {
    var v = VIEWS[activeTab];
    if (v) await v.render();
  }

  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('content').innerHTML = '<p>Please sign in from the main app.</p>';
      return;
    }
    var { data: profile } = await sb.from('app_users').select('is_admin,perms').eq('id', userData.user.id).maybeSingle();
    if (profile) { me.isAdmin = profile.is_admin; me.perms = profile.perms || {}; }
    await loadFirm();
    inited = true;
    buildTabs();
    render();
  })();
})();
</script>
</body>
</html>
