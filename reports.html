<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reports — OHT Accounting System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  // Hosted inside the shell's iframe (index.html) almost always — the shell's
  // own sidebar lists all 8 reports directly, so this module's own tab strip
  // (still fully functional when this file is opened on its own) would just
  // be duplicate navigation. Set before first paint to avoid a flash of it.
  if (window.self !== window.top) document.documentElement.className += ' embedded';
</script>
<style>
  /* Everything visual now comes from theme.css. What stays here is the page
     skeleton and — untouched — the print rules. */
  html,body{height:100%;}
  body{display:flex;flex-direction:column;}
  .embedded .tabs, .embedded .toolbar.tabs-wrap h1{display:none !important;}
  main{flex:1;overflow-y:auto;padding:0;}
  .toolbar h1{font-size:16px;margin:0 8px 0 0;font-weight:700;}
  .embedded .toolbar.tabs-wrap{display:none !important;}
  .poweredBy{display:none;}

  /* Page pattern (theme.css .pg-*) — hero is full-bleed, its content and the
     body below share one centred column so cards line up under the title. */
  .pg-hero > *{max-width:1100px; margin-left:auto; margin-right:auto;}
  .pg-body{max-width:1148px; margin-left:auto; margin-right:auto;}
  .pg-hero .pg-fld select{max-width:220px;}
  .print-head{display:none;}
  .rpt-warn{padding:14px 16px; color:var(--debit); font-size:13px;}
  .rpt-note{padding:8px 14px; color:var(--mute); font-size:12px; border-bottom:1px solid var(--hair);}
  #content .doc-table{margin:0;}

  @media print{
    @page{size:A4;}
    body{background:#fff;color:#000;}
    main{padding:0;}
    .toolbar,.tabs,button,input,select,.pg-hero,.pg-kpis,.pg-ch .pg-cnt,.pg-ch .pg-lh,.pg-ch .pg-title{display:none !important;}
    .pg-body{margin:0 !important; max-width:none !important; padding:0 20px !important;}
    .pg-card{border:none !important; border-radius:0 !important; box-shadow:none !important; background:#fff !important;}
    .pg-card .pg-ch{border:none !important; padding:0 !important;}
    .print-head{display:block;}
    .pg-card table.doc-table tbody tr:nth-child(even){background:transparent;}
    th,td{border-bottom:1px solid #999;}
    .poweredBy{
      display:block !important; position:fixed; left:20px; right:20px; bottom:8mm; font-size:10px; color:#666;
      border-top:1.5px solid #A67C2E; padding-top:5px;
    }
  }
</style>
</head>
<body>

<div class="toolbar tabs-wrap">
  <h1>Reports</h1>
  <div class="tabs" id="tabs"></div>
</div>

<main id="content"></main>
<div class="poweredBy">Powered by "OHT Solutions"</div>
<div id="toastStack" class="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'active') {
      d.active ? sb.auth.startAutoRefresh && sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh && sb.auth.stopAutoRefresh();
      return;
    }
    // Deep-link from another module (Masters' sidebar report links):
    //   masters.html -> parent: { oht:'open', app:'reports', arg:'<tabkey>' }
    //   index.html   -> here:   { oht:'goto', app:'reports', arg:'<tabkey>' }
    // `arg` is one of this file's TABS keys. A goto that arrives before
    // init() has finished just sets activeTab — init() then renders it.
    if (d.oht === 'goto' && (!d.app || d.app === 'reports')) {
      var key = d.arg;
      if (!key || !VIEWS[key]) return;
      activeTab = key;
      if (inited) { buildTabs(); render(); }
    }
  });

  // ---- shared toast helper (§14) — same helper index.html/masters.html use;
  // each module is its own document, so each carries its own copy. ----
  var MAX_TOASTS = 3;
  function toast(message, isError) {
    var stack = document.getElementById('toastStack');
    if (!stack) return;
    while (stack.children.length >= MAX_TOASTS) stack.removeChild(stack.firstChild);
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });
    setTimeout(function () {
      el.classList.remove('on');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, isError ? 5200 : 3200);
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtQty(n) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 3 }); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function firstOfMonth() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }

  // Shared date-range filter markup + quick-range buttons, used by the
  // material-consumption reports below (mirrors §21 Profit & Loss's own
  // From/To + quick-range pattern, factored out since three views share it).
  function dateRangeFilterHtml(prefix, from, to) {
    return '<div class="field"><label for="' + prefix + '_from">From</label><input type="date" id="' + prefix + '_from" value="' + from + '"></div>' +
      '<div class="field"><label for="' + prefix + '_to">To</label><input type="date" id="' + prefix + '_to" value="' + to + '"></div>' +
      '<button type="button" class="btn" id="' + prefix + '_today">Today</button>' +
      '<button type="button" class="btn" id="' + prefix + '_month">This month</button>' +
      '<button type="button" class="btn" id="' + prefix + '_lastmonth">Last month</button>' +
      '<button type="button" class="btn" id="' + prefix + '_year">This year</button>';
  }
  function setDateRange(prefix, f, t, onRun) {
    document.getElementById(prefix + '_from').value = f;
    document.getElementById(prefix + '_to').value = t;
    onRun();
  }
  function wireDateRangeButtons(prefix, onRun) {
    document.getElementById(prefix + '_today').addEventListener('click', function () { setDateRange(prefix, todayStr(), todayStr(), onRun); });
    document.getElementById(prefix + '_month').addEventListener('click', function () { setDateRange(prefix, firstOfMonth(), todayStr(), onRun); });
    document.getElementById(prefix + '_lastmonth').addEventListener('click', function () {
      var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
      var f = d.toISOString().slice(0, 10);
      var endD = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      setDateRange(prefix, f, endD.toISOString().slice(0, 10), onRun);
    });
    document.getElementById(prefix + '_year').addEventListener('click', function () {
      var y = new Date().getFullYear();
      setDateRange(prefix, y + '-01-01', todayStr(), onRun);
    });
  }
  function itemSelectOptions(selected) {
    return '<option value="">All</option>' + itemsCache.map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === selected ? ' selected' : '') + '>' + esc(i.name) + '</option>';
    }).join('');
  }
  function partySelectOptions(selected) {
    return '<option value="">All</option>' + partiesCache.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === selected ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
  }
  function warehouseSelectOptions(selected) {
    return '<option value="">All</option>' + warehousesCache.map(function (w) {
      return '<option value="' + w.id + '"' + (w.id === selected ? ' selected' : '') + '>' + esc(w.name) + '</option>';
    }).join('');
  }

  var TABS = [
    { key: 'trial', label: 'Trial Balance' },
    { key: 'aging', label: 'Receivable Aging' },
    { key: 'pl', label: 'Profit & Loss' },
    { key: 'statement', label: 'Statement of Account' },
    { key: 'stockledger', label: 'Item Stock Ledger' },
    { key: 'matcons', label: 'Material Consumption' },
    { key: 'matprofit', label: 'Material Cost & Profit' },
    { key: 'mataudit', label: 'Consumption Audit' }
  ];
  var activeTab = 'trial';
  var inited = false;
  var partiesCache = [], itemsCache = [], warehousesCache = [];

  // ---- letterhead (§12) -------------------------------------------------
  // Presentation only: the default firm's name/address heads every report the
  // way it heads a printed statement. Never used in any calculation.
  var firm = null;
  async function loadFirm() {
    if (firm) return firm;
    var res = await sb.from('companies').select('name,city,phone,ntn,logo,is_default').is('deleted_at', null).order('is_default', { ascending: false });
    var rows = (res && res.data) || [];
    firm = rows[0] || { name: 'OHT Accounting System', city: '', phone: '', ntn: '', logo: null };
    return firm;
  }
  function firmMark() {
    if (firm && firm.logo) return '<img src="' + esc(firm.logo) + '" alt="">';
    var n = (firm && firm.name ? firm.name : 'OHT').trim();
    return esc(n.charAt(0).toUpperCase() || 'O');
  }
  function firmAddr() {
    if (!firm) return '';
    return [firm.city, firm.phone, firm.ntn ? 'NTN ' + firm.ntn : ''].filter(Boolean).join(' · ');
  }
  function emptyState(big, sub) {
    return '<div class="empty-state"><div class="empty-big">' + esc(big) + '</div>' +
      '<div class="empty-sub">' + esc(sub) + '</div></div>';
  }
  // Every report body opens with this: letterhead + serif title + sub-line.
  function docHead(title, sub) {
    return '<div class="letterhead">' +
        '<div class="mark2">' + firmMark() + '</div>' +
        '<div><div class="firm-name">' + esc(firm ? firm.name : 'OHT Accounting System') + '</div>' +
        '<div class="firm-addr">' + esc(firmAddr()) + '</div></div>' +
      '</div>' +
      '<h2 class="stmt-title">' + esc(title) + '</h2>' +
      '<div class="stmt-sub">' + esc(sub || '') + '</div>';
  }
  // ---- page pattern (theme.css .pg-*) -----------------------------------
  // Every report = hero band (title, sub-line, actions, filters/chips) +
  // body (KPI cards from the report's own already-computed numbers + one
  // content card holding the table). Filter inputs keep their ids so every
  // existing handler below is untouched. `p` is the view's id prefix.
  function pageShell(p, o) {
    return '<div class="pg-hero">' +
        '<div class="pg-crumb">' + esc(o.crumb || 'Reports') + '</div>' +
        '<div class="pg-row"><div><h2>' + esc(o.title) + '</h2><div class="pg-sub" id="' + p + '_sub">' + esc(o.sub || '') + '</div></div>' +
          '<div class="pg-sp"></div><div class="pg-acts">' + (o.actions || '') +
          '<button type="button" class="pg-hb pri" id="' + p + '_print">Print</button></div></div>' +
        '<div class="pg-ctl">' + (o.ctl || '') + '</div>' +
      '</div>' +
      '<div class="pg-body">' +
        '<div class="pg-kpis" id="' + p + '_kpis" style="display:none"></div>' +
        '<div class="pg-card">' +
          '<div class="pg-ch"><span class="pg-title" id="' + p + '_ctitle">' + esc(o.cardTitle || o.title) + '</span>' +
            '<span class="pg-lh"><span class="mk">' + firmMark() + '</span>' + esc(firm ? firm.name : 'OHT Accounting System') + (firm && firm.city ? ' · ' + esc(firm.city) : '') + '</span>' +
            '<span class="pg-cnt" id="' + p + '_cnt"></span></div>' +
          '<div id="' + p + '_body"><div class="pg-empty">' + esc(o.empty || 'Loading…') + '</div></div>' +
        '</div>' +
      '</div>';
  }
  function wirePrint(p) {
    var b = document.getElementById(p + '_print');
    if (b) b.addEventListener('click', function () { window.print(); });
  }
  function setKpis(p, items) {
    var el = document.getElementById(p + '_kpis');
    if (!el) return;
    if (!items || !items.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    el.innerHTML = items.map(function (it) {
      return '<div class="pg-kpi"><div><div class="k">' + esc(it.label) + '</div><div class="v ' + (it.cls || '') + '">' +
        (it.text != null ? esc(it.text) : fmt(it.val)) + '</div></div><div class="pg-ring ' + (it.cls || 'n') + '">' + esc(it.ring || '') + '</div></div>';
    }).join('');
  }
  function setCount(p, n, word) {
    var el = document.getElementById(p + '_cnt');
    if (el) el.textContent = n == null ? '' : (n + ' ' + (word || 'rows'));
  }
  function setSub(p, text) {
    var el = document.getElementById(p + '_sub');
    if (el) el.textContent = text;
  }
  function setBody(p, html) {
    var el = document.getElementById(p + '_body');
    if (el) el.innerHTML = html;
  }
  function warnHtml(msg) { return '<div class="rpt-warn">' + esc(msg) + '</div>'; }
  function emptyCard(big, sub) {
    return '<div class="pg-empty"><div class="big">' + esc(big) + '</div>' + esc(sub || '') + '</div>';
  }
  // Letterhead + title that only shows on paper (the hero is screen-only).
  function printHead(title, sub) { return '<div class="print-head">' + docHead(title, sub) + '</div>'; }
  function fldDate(id, label, value) {
    return '<span class="pg-fld"><label for="' + id + '">' + esc(label) + '</label><input type="date" id="' + id + '" value="' + esc(value) + '"></span>';
  }
  function fldSelect(id, label, optionsHtml) {
    return '<span class="pg-fld"><label for="' + id + '">' + esc(label) + '</label><select id="' + id + '">' + optionsHtml + '</select></span>';
  }
  function chip(id, label, on) {
    return '<button type="button" class="pg-chip' + (on ? ' on' : '') + '" id="' + id + '">' + esc(label) + '</button>';
  }
  // Which quick range (if any) the current From/To equal — so its chip lights up.
  function rangeKey(from, to) {
    var t = todayStr();
    if (from === t && to === t) return 'today';
    if (from === firstOfMonth() && to === t) return 'month';
    var y = new Date().getFullYear();
    if (from === y + '-01-01' && to === t) return 'year';
    var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    var lf = d.toISOString().slice(0, 10), le = new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0, 10);
    if (from === lf && to === le) return 'lastmonth';
    return '';
  }
  function rangeChips(prefix, from, to) {
    var k = rangeKey(from, to);
    return chip(prefix + '_month', 'This month', k === 'month') + chip(prefix + '_today', 'Today', k === 'today') +
      chip(prefix + '_lastmonth', 'Last month', k === 'lastmonth') + chip(prefix + '_year', 'This year', k === 'year') +
      '<span class="pg-sepv"></span>' + fldDate(prefix + '_from', 'From', from) + fldDate(prefix + '_to', 'To', to);
  }
  function fmtRange(from, to) { return from + ' to ' + to; }

  // Cost-visibility gate for raw-material figures — mirrors billing.html's
  // canViewMaterialCost() exactly (same me.isAdmin / me.perms.material_cost_view
  // check, same app_users.perms source, populated in init() below).
  var me = { isAdmin: false, perms: {} };
  function canViewMaterialCost() { return me.isAdmin || !!me.perms.material_cost_view; }

  function buildTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = t.label;
      b.className = t.key === activeTab ? 'on' : '';
      b.addEventListener('click', function () { activeTab = t.key; buildTabs(); render(); });
      el.appendChild(b);
    });
  }

  // ===================================================================
  // Trial Balance (§19)
  // ===================================================================
  var trialView = {
    async render() {
      await loadFirm();
      var asOf = document.getElementById('tb_asof') ? document.getElementById('tb_asof').value : todayStr();
      var t = todayStr(), y = new Date().getFullYear();
      var monthEnd = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);
      document.getElementById('content').innerHTML = pageShell('tb', {
        crumb: 'Reports / Financial', title: 'Trial Balance', sub: 'As of ' + asOf, cardTitle: 'Balances by party',
        actions: '<button type="button" class="pg-hb" id="tb_reload">Refresh</button><button type="button" class="pg-hb" id="tb_reconcile">Reconcile check</button>',
        ctl: fldDate('tb_asof', 'As of', asOf) + chip('tb_q_today', 'Today', asOf === t) + chip('tb_q_month', 'Month end', asOf === monthEnd) + chip('tb_q_year', 'Year end', asOf === y + '-12-31')
      });
      wirePrint('tb');
      document.getElementById('tb_reload').addEventListener('click', trialView.render);
      document.getElementById('tb_reconcile').addEventListener('click', trialView.runReconcile);
      document.getElementById('tb_asof').addEventListener('change', trialView.render);
      [['tb_q_today', t], ['tb_q_month', monthEnd], ['tb_q_year', y + '-12-31']].forEach(function (q) {
        document.getElementById(q[0]).addEventListener('click', function () { document.getElementById('tb_asof').value = q[1]; trialView.render(); });
      });

      var { data, error } = await sb.rpc('trial_balance', { p_as_of: asOf });
      if (error) { setBody('tb', warnHtml(error.message)); return; }
      var totalDr = 0, totalCr = 0, nDr = 0, nCr = 0;
      (data || []).forEach(function (r) { if (r.side === 'dr') { totalDr += Number(r.balance); nDr++; } else { totalCr += Number(r.balance); nCr++; } });
      setSub('tb', 'As of ' + asOf + ' · ' + (data || []).length + ' parties with a balance');
      setCount('tb', (data || []).length);
      setKpis('tb', [
        { cls: 'dr', label: 'Total Debit', val: totalDr, ring: 'DR' },
        { cls: 'cr', label: 'Total Credit', val: totalCr, ring: 'CR' },
        { cls: 'wn', label: 'Difference', val: Math.abs(totalDr - totalCr), ring: '±' }
      ]);
      var h = printHead('Trial Balance', 'As of ' + asOf) + '<div id="tb_recon"></div>';
      if (!(data || []).length) { setBody('tb', h + emptyCard('No balances', 'No party has a balance as of this date.')); return; }
      h += '<table class="doc-table"><thead><tr><th>Party</th><th class="num">Balance</th><th>Side</th></tr></thead><tbody>';
      (data || []).forEach(function (r) {
        h += '<tr><td>' + esc(r.party_name) + '</td><td class="num mono">' + fmt(r.balance) + '</td>' +
          '<td><span class="pg-pill ' + (r.side === 'dr' ? 'dr' : 'cr') + '">' + r.side.toUpperCase() + '</span></td></tr>';
      });
      h += '</tbody><tfoot><tr><td>Total Dr</td><td class="num mono">' + fmt(totalDr) + '</td><td></td></tr>' +
        '<tr><td>Total Cr</td><td class="num mono">' + fmt(totalCr) + '</td><td></td></tr></tfoot></table>';
      setBody('tb', h);
    },
    async runReconcile() {
      var asOf = document.getElementById('tb_asof').value;
      var out = document.getElementById('tb_recon');
      var { data, error } = await sb.rpc('aging_reconcile', { p_as_of: asOf });
      if (error) { toast(error.message, true); return; }
      if (!data || !data.length) {
        if (out) out.innerHTML = '';
        toast('Reconciliation OK — Trial Balance and Receivable Aging agree for every party.');
        return;
      }
      toast('Reconciliation found ' + data.length + ' discrepant party(ies) — listed above the table.', true);
      if (!out) return;
      out.innerHTML = '<div class="rpt-note">Reconciliation — parties where Trial Balance and Receivable Aging disagree</div><table class="doc-table" style="margin-bottom:14px"><thead><tr>' +
        '<th>Party</th><th class="num">Difference</th></tr></thead><tbody>' +
        data.map(function (r) {
          return '<tr><td>' + esc(r.party_name) + '</td><td class="num mono warn">' + fmt(r.difference) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
  };

  // ===================================================================
  // Receivable Aging (§20)
  // ===================================================================
  var agingView = {
    async render() {
      await loadFirm();
      var asOf = document.getElementById('ag_asof') ? document.getElementById('ag_asof').value : todayStr();
      var t = todayStr();
      var monthEnd = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);
      document.getElementById('content').innerHTML = pageShell('ag', {
        crumb: 'Reports / Financial', title: 'Receivable Aging', sub: 'As of ' + asOf + ' · outstanding by age', cardTitle: 'Outstanding documents',
        actions: '<button type="button" class="pg-hb" id="ag_reload">Refresh</button>',
        ctl: fldDate('ag_asof', 'As of', asOf) + chip('ag_q_today', 'Today', asOf === t) + chip('ag_q_month', 'Month end', asOf === monthEnd)
      });
      wirePrint('ag');
      document.getElementById('ag_reload').addEventListener('click', agingView.render);
      document.getElementById('ag_asof').addEventListener('change', agingView.render);
      document.getElementById('ag_q_today').addEventListener('click', function () { document.getElementById('ag_asof').value = t; agingView.render(); });
      document.getElementById('ag_q_month').addEventListener('click', function () { document.getElementById('ag_asof').value = monthEnd; agingView.render(); });

      var { data, error } = await sb.rpc('receivable_aging', { p_as_of: asOf });
      if (error) { setBody('ag', warnHtml(error.message)); return; }
      var rows = (data || []).sort(function (a, b) { return b.outstanding - a.outstanding; });
      var buckets = { notdue: 0, b0: 0, b30: 0, b60: 0, b90: 0, payable: 0, advance: 0 };
      rows.forEach(function (r) { buckets[r.bucket] = (buckets[r.bucket] || 0) + Number(r.outstanding); });
      var bucketKeys = ['notdue', 'b0', 'b30', 'b60', 'b90'];
      var bucketLabels = { notdue: 'Not due', b0: '1-30 days', b30: '31-60 days', b60: '61-90 days', b90: '90+ days', payable: 'Payable', advance: 'Advance' };
      var bucketCls = { notdue: 'cr', b0: 'n', b30: 'wn', b60: 'wn', b90: 'dr' };
      var bucketRing = { notdue: '✓', b0: '30', b30: '60', b60: '90', b90: '!' };
      var pillCls = { notdue: 'g', b0: 'n', b30: 'a', b60: 'a', b90: 'r', payable: 'b', advance: 'b' };
      setCount('ag', rows.length);

  // ===================================================================
  // Profit & Loss (§21) — computed client-side per spec, no DB function
  // ===================================================================
  var plView = {
    async render() {
      var from = document.getElementById('pl_from') ? document.getElementById('pl_from').value : firstOfMonth();
      var to = document.getElementById('pl_to') ? document.getElementById('pl_to').value : todayStr();
      await loadFirm();
      document.getElementById('content').innerHTML = pageShell('pl', {
        crumb: 'Reports / Financial', title: 'Profit & Loss', sub: fmtRange(from, to), cardTitle: 'Statement',
        actions: '<button type="button" class="pg-hb" id="pl_run">Run</button>',
        ctl: rangeChips('pl', from, to), empty: 'Computing…'
      });
      wirePrint('pl');
      document.getElementById('pl_run').addEventListener('click', plView.run);
      document.getElementById('pl_from').addEventListener('change', plView.run);
      document.getElementById('pl_to').addEventListener('change', plView.run);
      document.getElementById('pl_today').addEventListener('click', function () { setRange(todayStr(), todayStr()); });
      document.getElementById('pl_month').addEventListener('click', function () { setRange(firstOfMonth(), todayStr()); });
      document.getElementById('pl_lastmonth').addEventListener('click', function () {
        var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
        var f = d.toISOString().slice(0, 10);
        var endD = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        setRange(f, endD.toISOString().slice(0, 10));
      });
      document.getElementById('pl_year').addEventListener('click', function () {
        var y = new Date().getFullYear();
        setRange(y + '-01-01', todayStr());
      });
      function setRange(f, t) { document.getElementById('pl_from').value = f; document.getElementById('pl_to').value = t; plView.run(); }
      function firstOfMonth() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
      plView.run();
    },

    async run() {
      var from = document.getElementById('pl_from').value, to = document.getElementById('pl_to').value;
      setBody('pl', '<div class="pg-empty">Computing…</div>');
      setSub('pl', fmtRange(from, to));
      Array.prototype.forEach.call(document.querySelectorAll('#content .pg-chip'), function (c) {
        c.classList.toggle('on', c.id === 'pl_' + rangeKey(from, to));
      });

      var [{ data: sales }, { data: returns }, { data: linesData }, { data: serviceInv }, { data: sheetsInRange }] = await Promise.all([
        sb.from('vouchers').select('id,sub_total,discount,grand_total,loading_on,loading_amt,cartage_on,cartage_amt,cutting_on,cutting_amt')
          .eq('vtype', 'sale').is('deleted_at', null).gte('vdate', from).lte('vdate', to),
        sb.from('sales_returns').select('id,grand_total,sale_id,deleted_at').gte('rdate', from).lte('rdate', to),
        sb.from('voucher_lines').select('voucher_id,cost_amount'),
        sb.from('service_invoices').select('sub_total,discount').neq('status', 'cancelled').is('deleted_at', null).gte('sidate', from).lte('sidate', to),
        sb.from('sheets').select('id').is('deleted_at', null).gte('sheet_date', from).lte('sheet_date', to)
      ]);
      var sheetIdsInRange = (sheetsInRange || []).map(function (s) { return s.id; });
      var { data: expenseRows } = sheetIdsInRange.length
        ? await sb.from('sheet_rows').select('d_amt,c_party').in('sheet_id', sheetIdsInRange)
        : { data: [] };

      var grossSales = (sales || []).reduce(function (s, v) { return s + Number(v.sub_total); }, 0);
      var discounts = (sales || []).reduce(function (s, v) { return s + Number(v.discount); }, 0);
      var salesReturnsInRange = (returns || []).filter(function (r) { return !r.deleted_at; }).reduce(function (s, r) { return s + Number(r.grand_total); }, 0);
      var netSales = grossSales - salesReturnsInRange - discounts;

      var saleIds = (sales || []).map(function (v) { return v.id; });
      var cogs = (linesData || []).filter(function (l) { return saleIds.indexOf(l.voucher_id) >= 0; })
        .reduce(function (s, l) { return s + Number(l.cost_amount || 0); }, 0);

      // Returns' cost is removed from COGS too — need each in-range return's lines' cost_amount,
      // filtered to non-deleted parent returns only (§21's documented real bug to avoid).
      var { data: returnLines } = await sb.from('sales_return_lines').select('return_id,cost_amount');
      var validReturnIds = (returns || []).filter(function (r) { return !r.deleted_at; }).map(function (r) { return r.id; });
      var returnsCost = (returnLines || []).filter(function (rl) { return validReturnIds.indexOf(rl.return_id) >= 0; })
        .reduce(function (s, rl) { return s + Number(rl.cost_amount || 0); }, 0);
      cogs -= returnsCost;

      var grossProfit = netSales - cogs;
      var grossMarginPct = netSales !== 0 ? (grossProfit / netSales) * 100 : 0;

      var otherIncome = (sales || []).reduce(function (s, v) {
        return s + (v.loading_on ? Number(v.loading_amt) : 0) + (v.cartage_on ? Number(v.cartage_amt) : 0) + (v.cutting_on ? Number(v.cutting_amt) : 0);
      }, 0);

      var serviceRevenue = (serviceInv || []).reduce(function (s, si) { return s + (Number(si.sub_total) - Number(si.discount)); }, 0);
      var totalRevenue = netSales + serviceRevenue;

      // Operating expenses / finance charges: cash-book DEBIT rows linked to an expense-kind party.
      var { data: expenseParties } = await sb.from('parties').select('id,expense_type').eq('kind', 'expense').is('deleted_at', null);
      var expenseMap = {}; (expenseParties || []).forEach(function (p) { expenseMap[p.id] = p.expense_type; });
      var opEx = 0, financeCharges = 0;
      (expenseRows || []).forEach(function (r) {
        var partyId = r.c_party;
        if (partyId && expenseMap.hasOwnProperty(partyId)) {
          var amt = Number(r.d_amt) || 0;
          if (expenseMap[partyId] === 'bank_charges') financeCharges += amt; else opEx += amt;
        }
      });

      var operatingProfit = grossProfit + serviceRevenue + otherIncome - opEx;
      var netProfit = operatingProfit - financeCharges;
      var netMarginPct = netSales !== 0 ? (netProfit / netSales) * 100 : 0;

      function row(label, val, bold) {
        return '<tr' + (bold ? ' class="sum"' : '') + '><td>' + label + '</td><td class="num mono' +
          (Number(val) < 0 ? ' warn' : '') + '">' + fmt(val) + '</td></tr>';
      }
      setKpis('pl', [
        { cls: 'cr', label: 'Net Sales', val: netSales, ring: '₨' },
        { cls: grossProfit < 0 ? 'dr' : 'cr', label: 'Gross Profit', val: grossProfit, ring: 'GP' },
        { cls: netProfit < 0 ? 'dr' : 'cr', label: 'Net Profit', val: netProfit, ring: 'NP' }
      ]);
      setCount('pl', null);
      var h = printHead('Profit & Loss', fmtRange(from, to));
      h += '<table class="doc-table"><tbody>' +
        row('Gross Sales', grossSales) + row('Sales Returns', -salesReturnsInRange) + row('Discounts', -discounts) +
        row('Net Sales', netSales, true) + row('COGS', -cogs) + row('Gross Profit', grossProfit, true) +
        '<tr class="note"><td colspan="2">Gross Margin: ' + grossMarginPct.toFixed(1) + '%</td></tr>' +
        row('Other Income (Loading/Cartage/Cutting)', otherIncome) + row('Service Revenue', serviceRevenue) +
        row('Total Revenue (Net Sales + Service Revenue)', totalRevenue) +
        row('Operating Expenses', -opEx) + row('Operating Profit', operatingProfit, true) +
        row('Finance/Bank Charges', -financeCharges) +
        '</tbody><tfoot>' +
        '<tr><td>Net Profit</td><td class="num mono' + (netProfit < 0 ? ' warn' : '') + '">' + fmt(netProfit) + '</td></tr>' +
        '<tr class="note"><td colspan="2">Net Margin: ' + netMarginPct.toFixed(1) + '%</td></tr>' +
        '</tfoot></table>';
      setBody('pl', h);
    }
  };

  // Shared event-building function (§11) — used by both screen and (future) print.
  async function buildLedgerEvents(partyId) {
    var { data: party } = await sb.from('parties').select('*').eq('id', partyId).single();
    var events = [];
    if (party.opening) {
      events.push({ date: party.opening_date || '0000-01-01', desc: 'Opening balance', dr: party.opening_side === 'dr' ? party.opening : 0, cr: party.opening_side === 'cr' ? party.opening : 0 });
    }
    var { data: sales } = await sb.from('vouchers').select('vno,vdate,grand_total,paid').eq('party_id', partyId).eq('vtype', 'sale').is('deleted_at', null);
    (sales || []).forEach(function (v) {
      events.push({ date: v.vdate, desc: 'Sale ' + v.vno, dr: v.grand_total, cr: 0 });
      if (v.paid > 0) events.push({ date: v.vdate, desc: 'Received with ' + v.vno, dr: 0, cr: v.paid });
    });
    var { data: purchases } = await sb.from('vouchers').select('vno,vdate,grand_total,paid').eq('party_id', partyId).eq('vtype', 'purchase').is('deleted_at', null);
    (purchases || []).forEach(function (v) {
      events.push({ date: v.vdate, desc: 'Purchase ' + v.vno, dr: 0, cr: v.grand_total });
      if (v.paid > 0) events.push({ date: v.vdate, desc: 'Paid with ' + v.vno, dr: v.paid, cr: 0 });
    });
    var { data: returns } = await sb.from('sales_returns').select('rno,rdate,grand_total').eq('party_id', partyId).is('deleted_at', null);
    (returns || []).forEach(function (r) { events.push({ date: r.rdate, desc: 'Return ' + r.rno, dr: 0, cr: r.grand_total }); });
    var { data: svc } = await sb.from('service_invoices').select('sino,sidate,grand_total,paid').eq('party_id', partyId).neq('status', 'cancelled').is('deleted_at', null);
    (svc || []).forEach(function (si) {
      events.push({ date: si.sidate, desc: 'Service ' + si.sino, dr: si.grand_total, cr: 0 });
      if (si.paid > 0) events.push({ date: si.sidate, desc: 'Received with ' + si.sino, dr: 0, cr: si.paid });
    });
    var { data: sheetsData } = await sb.from('sheets').select('id,sheet_date').is('deleted_at', null);
    var sheetDateById = {}; (sheetsData || []).forEach(function (s) { sheetDateById[s.id] = s.sheet_date; });
    var sheetIdsForParty = Object.keys(sheetDateById);
    var { data: sheetRowsData } = sheetIdsForParty.length
      ? await sb.from('sheet_rows').select('sheet_id,d_amt,d_rem,c_amt,c_rem,d_party,c_party')
          .in('sheet_id', sheetIdsForParty).or('d_party.eq.' + partyId + ',c_party.eq.' + partyId)
      : { data: [] };
    var normName = party.name.trim().toLowerCase().replace(/\s+/g, ' ');
    (sheetRowsData || []).forEach(function (r) {
      var sheetDate = sheetDateById[r.sheet_id];
      if (r.d_party === partyId) { // credit-side link: cash received FROM them
        var remark = stripOwnName(r.c_rem || '', normName);
        events.push({ date: sheetDate, desc: remark || 'Cash received', dr: 0, cr: Number(r.c_amt) || 0 });
      }
      if (r.c_party === partyId) { // debit-side link: cash paid TO them
        var remark2 = stripOwnName(r.d_rem || '', normName);
        events.push({ date: sheetDate, desc: remark2 || 'Cash paid', dr: Number(r.d_amt) || 0, cr: 0 });
      }
    });

    events.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var running = 0;
    events.forEach(function (e) { running += (e.dr || 0) - (e.cr || 0); e.running = running; });
    return events;
  }

  function stripOwnName(text, normName) {
    var norm = text.trim().toLowerCase().replace(/\s+/g, ' ');
    if (norm.indexOf(normName) === 0) {
      return text.trim().slice(normName.length).trim();
    }
    return text;
  }

      var head = printHead('Material Consumption', fmtRange(from, to));
      setBody('mc', '<div class="pg-empty">Loading…</div>'); setSub('mc', fmtRange(from, to)); setKpis('mc', []); setCount('mc', null);
      Array.prototype.forEach.call(document.querySelectorAll('#content .pg-chip'), function (c) { c.classList.toggle('on', c.id === 'mc_' + rangeKey(from, to)); });
      var nothing = function () { setBody('mc', head + emptyCard('Nothing to show', 'No consumption rows match these filters.')); };

      var vq = sb.from('vouchers').select('id,vno,vdate,party_id').eq('vtype', 'sale').is('deleted_at', null).gte('vdate', from).lte('vdate', to);
      if (party) vq = vq.eq('party_id', party);
      var { data: vouchers, error: vErr } = await vq;
      if (vErr) { setBody('mc', warnHtml(vErr.message)); return; }
      var voucherMap = {}; (vouchers || []).forEach(function (v) { voucherMap[v.id] = v; });
      var voucherIds = (vouchers || []).map(function (v) { return v.id; });
      if (!voucherIds.length) { nothing(); return; }

      var lq = sb.from('voucher_lines').select('id,voucher_id,item_id,amount').eq('consumption_type', 'raw_material_consumption').in('voucher_id', voucherIds);
      if (finalItem) lq = lq.eq('item_id', finalItem);
      var { data: lines, error: lErr } = await lq;
      if (lErr) { setBody('mc', warnHtml(lErr.message)); return; }
      var lineMap = {}; (lines || []).forEach(function (l) { lineMap[l.id] = l; });
      var lineIds = (lines || []).map(function (l) { return l.id; });
      if (!lineIds.length) { nothing(); return; }

      var cq = sb.from('voucher_line_material_consumption').select('id,voucher_line_id,raw_item_id,warehouse_id,qty,unit,cost_amount,notes,created_at')
        .in('voucher_line_id', lineIds).order('created_at', { ascending: false }).range(0, 1999);
      if (rawItem) cq = cq.eq('raw_item_id', rawItem);
      if (wh) cq = cq.eq('warehouse_id', wh);
      var { data: rows, error: cErr } = await cq;
      if (cErr) { setBody('mc', warnHtml(cErr.message)); return; }
      if (!rows || !rows.length) { nothing(); return; }

      var showCost = canViewMaterialCost();
      var totalCost = 0, totalQty = 0;
      rows.forEach(function (r) { totalQty += Number(r.qty) || 0; });
      var h = head;
      if (rows.length >= 2000) h += '<div class="rpt-note">Showing the first 2000 matching rows — narrow the filters for a complete result.</div>';
      h += '<table class="doc-table"><thead><tr><th>Date</th><th>Invoice No</th><th>Customer</th><th>Final Product</th><th>Raw Material</th>' +
        '<th class="num">Qty</th><th>Unit</th><th>Warehouse</th>' + (showCost ? '<th class="num">Cost</th>' : '') + '</tr></thead><tbody>';
      rows.forEach(function (r) {
        var line = lineMap[r.voucher_line_id];
        var v = line ? voucherMap[line.voucher_id] : null;
        var p = v ? partiesCache.filter(function (x) { return x.id === v.party_id; })[0] : null;
        var finalItm = line ? itemsCache.filter(function (i) { return i.id === line.item_id; })[0] : null;
        var rawItm = itemsCache.filter(function (i) { return i.id === r.raw_item_id; })[0];
        var w = warehousesCache.filter(function (x) { return x.id === r.warehouse_id; })[0];
        totalCost += Number(r.cost_amount || 0);
        h += '<tr><td class="mono">' + (v ? v.vdate : '') + '</td><td class="mono">' + (v ? esc(v.vno) : '') + '</td>' +
          '<td>' + (p ? esc(p.name) : '—') + '</td>' +
          '<td>' + (finalItm ? esc(finalItm.name) : '(deleted item)') + '</td>' +
          '<td>' + (rawItm ? esc(rawItm.name) : '(deleted item)') + '</td>' +
          '<td class="num mono">' + fmtQty(r.qty) + '</td><td>' + esc(r.unit || '') + '</td>' +
          '<td>' + (w ? esc(w.name) : '—') + '</td>' +
          (showCost ? '<td class="num mono">' + fmt(r.cost_amount) + '</td>' : '') +
          '</tr>';
      });
      h += '</tbody><tfoot><tr><td colspan="8">Total (' + rows.length + ' row(s))</td>' +
        (showCost ? '<td class="num mono">' + fmt(totalCost) + '</td>' : '') + '</tr></tfoot>';
      h += '</table>';
      setBody('mc', h);
      setCount('mc', rows.length);
      var k = [{ cls: 'n', label: 'Rows', text: String(rows.length), ring: '#' }, { cls: 'wn', label: 'Total Qty', text: fmtQty(totalQty), ring: 'Σ' }];
      if (showCost) k.push({ cls: 'dr', label: 'Total Cost', val: totalCost, ring: '₨' });
      setKpis('mc', k);
    }
  };

  // ===================================================================
  // Material Cost & Profit Report — for each raw-material-type sale line,
  // sale amount vs. total raw material cost consumed, grouped by invoice
  // or by final product.
  // ===================================================================
  var matProfitView = {
    async render() {
      await matConsumptionView.loadCaches();
      var from = document.getElementById('mp_from') ? document.getElementById('mp_from').value : firstOfMonth();
      var to = document.getElementById('mp_to') ? document.getElementById('mp_to').value : todayStr();
      var groupBy = document.getElementById('mp_group') ? document.getElementById('mp_group').value : 'invoice';
      var item = document.getElementById('mp_item') ? document.getElementById('mp_item').value : '';

      await loadFirm();
      document.getElementById('content').innerHTML = pageShell('mp', {
        crumb: 'Reports / Materials', title: 'Material Cost & Profit', sub: fmtRange(from, to) + ' · grouped by ' + (groupBy === 'invoice' ? 'invoice' : 'final product'),
        cardTitle: 'Cost & margin',
        actions: '<button type="button" class="pg-hb" id="mp_run">Run</button>',
        ctl: rangeChips('mp', from, to) + '<span class="pg-sepv"></span>' +
          chip('mp_g_invoice', 'By invoice', groupBy === 'invoice') + chip('mp_g_item', 'By final product', groupBy === 'item') +
          '<select id="mp_group" style="display:none"><option value="invoice"' + (groupBy === 'invoice' ? ' selected' : '') + '>Invoice</option>' +
          '<option value="item"' + (groupBy === 'item' ? ' selected' : '') + '>Final Product</option></select>' +
          fldSelect('mp_item', 'Final Product', itemSelectOptions(item))
      });
      wirePrint('mp');
      document.getElementById('mp_run').addEventListener('click', matProfitView.run);
      wireDateRangeButtons('mp', matProfitView.run);
      ['mp_from', 'mp_to', 'mp_item'].forEach(function (id) { document.getElementById(id).addEventListener('change', matProfitView.run); });
      document.getElementById('mp_g_invoice').addEventListener('click', function () { document.getElementById('mp_group').value = 'invoice'; matProfitView.run(); });
      document.getElementById('mp_g_item').addEventListener('click', function () { document.getElementById('mp_group').value = 'item'; matProfitView.run(); });
      matProfitView.run();
    },
    async run() {
      var from = document.getElementById('mp_from').value, to = document.getElementById('mp_to').value;
      var groupBy = document.getElementById('mp_group').value, item = document.getElementById('mp_item').value;
      var head = printHead('Material Cost & Profit', fmtRange(from, to) + ' · grouped by ' + (groupBy === 'invoice' ? 'invoice' : 'final product'));
      setBody('mp', '<div class="pg-empty">Computing…</div>'); setKpis('mp', []); setCount('mp', null);
      setSub('mp', fmtRange(from, to) + ' · grouped by ' + (groupBy === 'invoice' ? 'invoice' : 'final product'));
      Array.prototype.forEach.call(document.querySelectorAll('#content .pg-chip'), function (c) {
        if (c.id === 'mp_g_invoice' || c.id === 'mp_g_item') c.classList.toggle('on', c.id === 'mp_g_' + groupBy);
        else c.classList.toggle('on', c.id === 'mp_' + rangeKey(from, to));
      });
      var nothing = function () { setBody('mp', head + emptyCard('Nothing to show', 'No consumption rows match these filters.')); };

      var { data: vouchers, error: vErr } = await sb.from('vouchers').select('id,vno,vdate,party_id')
        .eq('vtype', 'sale').is('deleted_at', null).gte('vdate', from).lte('vdate', to);
      if (vErr) { setBody('mp', warnHtml(vErr.message)); return; }
      var voucherMap = {}; (vouchers || []).forEach(function (v) { voucherMap[v.id] = v; });
      var voucherIds = (vouchers || []).map(function (v) { return v.id; });
      if (!voucherIds.length) { nothing(); return; }

      var lq = sb.from('voucher_lines').select('id,voucher_id,item_id,amount').eq('consumption_type', 'raw_material_consumption').in('voucher_id', voucherIds);
      if (item) lq = lq.eq('item_id', item);
      var { data: lines, error: lErr } = await lq;
      if (lErr) { setBody('mp', warnHtml(lErr.message)); return; }
      if (!lines || !lines.length) { nothing(); return; }
      var lineIds = lines.map(function (l) { return l.id; });

      var { data: consump, error: cErr } = await sb.from('voucher_line_material_consumption').select('voucher_line_id,cost_amount').in('voucher_line_id', lineIds);
      if (cErr) { setBody('mp', warnHtml(cErr.message)); return; }
      var costByLine = {};
      (consump || []).forEach(function (c) { costByLine[c.voucher_line_id] = (costByLine[c.voucher_line_id] || 0) + Number(c.cost_amount || 0); });

      var lineRows = lines.map(function (l) {
        var cost = costByLine[l.id] || 0;
        var sale = Number(l.amount || 0);
        return { line: l, sale: sale, cost: cost };
      });

      var groups = {};
      lineRows.forEach(function (lr) {
        var key = groupBy === 'invoice' ? lr.line.voucher_id : (lr.line.item_id || 'none');
        if (!groups[key]) groups[key] = { key: key, sale: 0, cost: 0 };
        groups[key].sale += lr.sale; groups[key].cost += lr.cost;
      });
      var groupArr = Object.keys(groups).map(function (k) {
        var g = groups[k]; g.margin = g.sale - g.cost; g.marginPct = g.sale !== 0 ? (g.margin / g.sale) * 100 : 0; return g;
      });
      if (groupBy === 'invoice') {
        groupArr.sort(function (a, b) {
          var va = voucherMap[a.key], vb = voucherMap[b.key];
          return (va && vb) ? (va.vdate < vb.vdate ? 1 : va.vdate > vb.vdate ? -1 : 0) : 0;
        });
      } else {
        groupArr.sort(function (a, b) {
          var ia = itemsCache.filter(function (i) { return i.id === a.key; })[0];
          var ib = itemsCache.filter(function (i) { return i.id === b.key; })[0];
          return (ia && ib) ? ia.name.localeCompare(ib.name) : 0;
        });
      }

      var showCost = canViewMaterialCost();
      var totalSale = 0, totalCost = 0;
      var labelHeader = groupBy === 'invoice' ? 'Invoice' : 'Final Product';
      var h = head + '<table class="doc-table"><thead><tr><th>' + labelHeader + '</th>' + (groupBy === 'invoice' ? '<th>Date</th><th>Customer</th>' : '') +
        '<th class="num">Sale Amount</th>' +
        (showCost ? '<th class="num">Material Cost</th><th class="num">Margin</th><th class="num">Margin %</th>' : '') +
        '</tr></thead><tbody>';
      groupArr.forEach(function (g) {
        totalSale += g.sale; totalCost += g.cost;
        var label, extraCells = '';
        if (groupBy === 'invoice') {
          var v = voucherMap[g.key];
          label = v ? esc(v.vno) : '(deleted invoice)';
          var p = v ? partiesCache.filter(function (x) { return x.id === v.party_id; })[0] : null;
          extraCells = '<td class="mono">' + (v ? v.vdate : '') + '</td><td>' + (p ? esc(p.name) : '—') + '</td>';
        } else {
          var it = itemsCache.filter(function (x) { return x.id === g.key; })[0];
          label = it ? esc(it.name) : '(deleted item)';
        }
        h += '<tr><td>' + label + '</td>' + extraCells +
          '<td class="num mono">' + fmt(g.sale) + '</td>' +
          (showCost ? '<td class="num mono">' + fmt(g.cost) + '</td><td class="num mono' + (g.margin < 0 ? ' warn' : '') + '">' + fmt(g.margin) + '</td><td class="num mono">' + g.marginPct.toFixed(1) + '%</td>' : '') +
          '</tr>';
      });
      var totalMargin = totalSale - totalCost;
      var totalMarginPct = totalSale !== 0 ? (totalMargin / totalSale) * 100 : 0;
      var labelColspan = groupBy === 'invoice' ? 3 : 1;
      h += '</tbody><tfoot><tr><td colspan="' + labelColspan + '">Total</td>' +
        '<td class="num mono">' + fmt(totalSale) + '</td>' +
        (showCost ? '<td class="num mono">' + fmt(totalCost) + '</td><td class="num mono' + (totalMargin < 0 ? ' warn' : '') + '">' + fmt(totalMargin) + '</td><td class="num mono">' + totalMarginPct.toFixed(1) + '%</td>' : '') +
        '</tr></tfoot>';
      h += '</table>';
      setBody('mp', h);
      setCount('mp', groupArr.length);
      var k = [{ cls: 'cr', label: 'Sale Amount', val: totalSale, ring: '₨' }];
      if (showCost) {
        k.push({ cls: 'dr', label: 'Material Cost', val: totalCost, ring: '₨' });
        k.push({ cls: totalMargin < 0 ? 'dr' : 'cr', label: 'Margin', val: totalMargin, ring: totalMarginPct.toFixed(0) + '%' });
      }
      setKpis('mp', k);
    }
  };

  // ===================================================================
  // Reversed / Cancelled Consumption Audit — consumption rows tied to a
  // soft-deleted sale voucher and/or (fully or partially) restored via a
  // sales return, so an admin can see exactly what got reversed.
  // ===================================================================
  var matAuditView = {
    async render() {
      await matConsumptionView.loadCaches();
      var from = document.getElementById('ma_from') ? document.getElementById('ma_from').value : firstOfMonth();
      var to = document.getElementById('ma_to') ? document.getElementById('ma_to').value : todayStr();
      var finalItem = document.getElementById('ma_final') ? document.getElementById('ma_final').value : '';
      var rawItem = document.getElementById('ma_raw') ? document.getElementById('ma_raw').value : '';

      await loadFirm();
      document.getElementById('content').innerHTML = pageShell('ma', {
        crumb: 'Reports / Materials', title: 'Consumption Audit', sub: fmtRange(from, to) + ' · cancelled invoices and returned material',
        cardTitle: 'Audit trail',
        actions: '<button type="button" class="pg-hb" id="ma_run">Run</button>',
        ctl: rangeChips('ma', from, to) + '<span class="pg-sepv"></span>' +
          fldSelect('ma_final', 'Final Product', itemSelectOptions(finalItem)) + fldSelect('ma_raw', 'Raw Material', itemSelectOptions(rawItem))
      });
      wirePrint('ma');
      document.getElementById('ma_run').addEventListener('click', matAuditView.run);
      wireDateRangeButtons('ma', matAuditView.run);
      ['ma_from', 'ma_to', 'ma_final', 'ma_raw'].forEach(function (id) { document.getElementById(id).addEventListener('change', matAuditView.run); });
      matAuditView.run();
    },
    async run() {
      var from = document.getElementById('ma_from').value, to = document.getElementById('ma_to').value;
      var finalItem = document.getElementById('ma_final').value, rawItem = document.getElementById('ma_raw').value;
      var head = printHead('Consumption Audit', fmtRange(from, to) + ' · cancelled invoices and returned material');
      setBody('ma', '<div class="pg-empty">Loading…</div>'); setKpis('ma', []); setCount('ma', null);
      setSub('ma', fmtRange(from, to) + ' · cancelled invoices and returned material');
      Array.prototype.forEach.call(document.querySelectorAll('#content .pg-chip'), function (c) { c.classList.toggle('on', c.id === 'ma_' + rangeKey(from, to)); });
      var nothing = function (big, sub) { setBody('ma', head + emptyCard(big || 'Nothing to show', sub || 'No consumption rows match these filters.')); };

      // Deliberately NOT filtered on deleted_at — a cancelled invoice is
      // exactly what this audit needs to surface.
      var { data: vouchers, error: vErr } = await sb.from('vouchers').select('id,vno,vdate,party_id,deleted_at')
        .eq('vtype', 'sale').gte('vdate', from).lte('vdate', to);
      if (vErr) { setBody('ma', warnHtml(vErr.message)); return; }
      var voucherMap = {}; (vouchers || []).forEach(function (v) { voucherMap[v.id] = v; });
      var voucherIds = (vouchers || []).map(function (v) { return v.id; });
      if (!voucherIds.length) { nothing(); return; }

      var lq = sb.from('voucher_lines').select('id,voucher_id,item_id').eq('consumption_type', 'raw_material_consumption').in('voucher_id', voucherIds);
      if (finalItem) lq = lq.eq('item_id', finalItem);
      var { data: lines, error: lErr } = await lq;
      if (lErr) { setBody('ma', warnHtml(lErr.message)); return; }
      if (!lines || !lines.length) { nothing(); return; }
      var lineMap = {}; lines.forEach(function (l) { lineMap[l.id] = l; });
      var lineIds = lines.map(function (l) { return l.id; });

      var cq = sb.from('voucher_line_material_consumption').select('id,voucher_line_id,raw_item_id,qty,unit,cost_amount').in('voucher_line_id', lineIds).range(0, 1999);
      if (rawItem) cq = cq.eq('raw_item_id', rawItem);
      var { data: consump, error: cErr } = await cq;
      if (cErr) { setBody('ma', warnHtml(cErr.message)); return; }
      if (!consump || !consump.length) { nothing(); return; }
      var consumpIds = consump.map(function (c) { return c.id; });

      var { data: restorations, error: rErr } = await sb.from('sales_return_material_restoration').select('consumption_id,qty').in('consumption_id', consumpIds);
      if (rErr) { setBody('ma', warnHtml(rErr.message)); return; }
      var restoredByConsumption = {};
      (restorations || []).forEach(function (r) { restoredByConsumption[r.consumption_id] = (restoredByConsumption[r.consumption_id] || 0) + Number(r.qty || 0); });

      var rows = consump.map(function (c) {
        var line = lineMap[c.voucher_line_id];
        var v = line ? voucherMap[line.voucher_id] : null;
        var restored = restoredByConsumption[c.id] || 0;
        return { c: c, line: line, voucher: v, restored: restored, remaining: Number(c.qty) - restored };
      }).filter(function (r) { return (r.voucher && r.voucher.deleted_at) || r.restored > 0; });

      if (!rows.length) { nothing('Nothing reversed', 'No cancelled or returned consumption matches these filters.'); return; }

      rows.sort(function (a, b) {
        var da = a.voucher ? a.voucher.vdate : '', db = b.voucher ? b.voucher.vdate : '';
        return da < db ? 1 : da > db ? -1 : 0;
      });

      var showCost = canViewMaterialCost();
      var totalCost = 0, totalRestoredQty = 0, totalConsumedQty = 0, totalNetQty = 0;
      var h = head + '<table class="doc-table"><thead><tr><th>Date</th><th>Invoice No</th><th>Status</th><th>Final Product</th><th>Raw Material</th>' +
        '<th class="num">Qty Consumed</th><th class="num">Qty Restored</th><th class="num">Net Consumption</th>' +
        (showCost ? '<th class="num">Cost</th>' : '') + '</tr></thead><tbody>';
      rows.forEach(function (r) {
        var v = r.voucher, line = r.line;
        var finalItm = line ? itemsCache.filter(function (i) { return i.id === line.item_id; })[0] : null;
        var rawItm = itemsCache.filter(function (i) { return i.id === r.c.raw_item_id; })[0];
        var badge = (v && v.deleted_at) ? '<span class="pg-pill r">Cancelled</span>' : (r.restored > 0 ? '<span class="pg-pill b">Returned</span>' : '');
        totalCost += Number(r.c.cost_amount || 0);
        totalRestoredQty += r.restored;
        totalConsumedQty += Number(r.c.qty) || 0;
        totalNetQty += Number(r.remaining) || 0;
        h += '<tr><td class="mono">' + (v ? v.vdate : '') + '</td><td class="mono">' + (v ? esc(v.vno) : '') + '</td><td>' + badge + '</td>' +
          '<td>' + (finalItm ? esc(finalItm.name) : '(deleted item)') + '</td>' +
          '<td>' + (rawItm ? esc(rawItm.name) : '(deleted item)') + '</td>' +
          '<td class="num mono">' + fmtQty(r.c.qty) + '</td>' +
          '<td class="num mono">' + (r.restored ? fmtQty(r.restored) : '—') + '</td>' +
          '<td class="num mono">' + fmtQty(r.remaining) + '</td>' +
          (showCost ? '<td class="num mono">' + fmt(r.c.cost_amount) + '</td>' : '') +
          '</tr>';
      });
      h += '</tbody><tfoot><tr><td colspan="6">Total (' + rows.length + ' row(s))</td>' +
        '<td class="num mono">' + fmtQty(totalRestoredQty) + '</td><td></td>' +
        (showCost ? '<td class="num mono">' + fmt(totalCost) + '</td>' : '') + '</tr></tfoot>';
      h += '</table>';
      setBody('ma', h);
      setCount('ma', rows.length);
      var k = [
        { cls: 'dr', label: 'Consumed', text: fmtQty(totalConsumedQty), ring: '−' },
        { cls: 'cr', label: 'Restored', text: fmtQty(totalRestoredQty), ring: '+' },
        { cls: 'wn', label: 'Net Consumption', text: fmtQty(totalNetQty), ring: '=' }
      ];
      if (showCost) k.push({ cls: 'dr', label: 'Cost', val: totalCost, ring: '₨' });
      setKpis('ma', k);
    }
  };

  var VIEWS = {
    trial: trialView, aging: agingView, pl: plView, statement: statementView, stockledger: stockLedgerView,
    matcons: matConsumptionView, matprofit: matProfitView, mataudit: matAuditView
  };

  async function render() {
    var v = VIEWS[activeTab];
    if (v) await v.render();
  }

  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('content').innerHTML = '<p>Please sign in from the main app.</p>';
      return;
    }
    var { data: profile } = await sb.from('app_users').select('is_admin,perms').eq('id', userData.user.id).maybeSingle();
    if (profile) { me.isAdmin = profile.is_admin; me.perms = profile.perms || {}; }
    await loadFirm();
    inited = true;
    buildTabs();
    render();
  })();
})();
</script>
