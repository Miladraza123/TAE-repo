<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OHT Accounting System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2A2620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OHT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2933; --slate:#3E4C59; --mute:#7B8794; --line:#CBD2D9; --hair:#E4E7EB;
    --paper:#FFFFFF; --desk:#DDE1E6; --panel:#F5F7F8;
    --debit:#9B2C2C; --credit:#14614A; --accent:#A67C2E; --cash:#0B6E99;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--desk); color:var(--ink); display:flex; flex-direction:column;
  }
  #topbar{
    display:flex; align-items:center; gap:2px; padding:0 8px;
    height:46px; background:var(--ink); border-bottom:1px solid #111820;
    flex-wrap:nowrap;
  }
  #topbar .mark{
    flex:none; width:26px; height:26px; border:1.5px solid var(--accent); border-radius:5px;
    display:grid; place-items:center; font-size:9.5px; color:var(--accent);
    font-weight:700; letter-spacing:.3px; margin-right:8px;
  }
  #topbar .brand{font-weight:600; margin-right:16px; color:var(--desk); white-space:nowrap; font-size:14px;}
  #tabs{display:flex; gap:2px; min-width:0; overflow-x:auto; scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  #topbar .tab{
    flex:none; padding:8px 13px; border-radius:7px; cursor:pointer; color:#9AA5B1;
    border:none; user-select:none; font-size:13.5px; font-weight:600; position:relative;
    white-space:nowrap;
  }
  #topbar .tab:hover{background:#2C3742; color:var(--desk);}
  #topbar .tab.active{background:#2C3742; color:#fff;}
  #topbar .tab.active::after{
    content:''; position:absolute; left:13px; right:13px; bottom:3px;
    height:2px; border-radius:2px; background:var(--accent);
  }
  #topbar .spacer{flex:1;}
  #topbar .status{font-size:11.5px; color:#9AA5B1; margin-right:10px; white-space:nowrap;}
  #topbar .status.offline{color:#E8A5A5;}
  #topbar button.signout{
    flex:none; background:#2C3742; border:1px solid var(--slate); color:var(--desk);
    padding:6px 12px; border-radius:7px; cursor:pointer; font-size:12.5px; font-weight:500;
  }
  #topbar button.signout:hover{background:#374350;}
  #frames{flex:1; position:relative; background:var(--desk);}
  #frames iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--desk);
  }
  #frames iframe.active{display:block;}
  #authScreen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--desk);
  }
  #authScreen .card{
    background:var(--paper); border-radius:12px; box-shadow:0 10px 34px rgba(31,41,51,.16);
    padding:28px; width:100%; max-width:360px;
  }
  #authScreen h1{font-size:17px; margin:0 0 18px; font-weight:600; color:var(--ink);}
  #authScreen input{
    width:100%; padding:10px 12px; margin-bottom:10px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px;
    font-family:inherit;
  }
  #authScreen input:focus{outline:none; border-color:var(--accent);}
  #authScreen button{
    width:100%; padding:10px; border-radius:8px; border:0; background:var(--accent);
    color:#fff; font-size:14px; cursor:pointer; font-weight:600; font-family:inherit;
  }
  #authScreen button:hover{background:#8F6B27;}
  #authScreen .err{color:var(--debit); font-size:13px; margin-top:10px; min-height:16px;}
  #loading{flex:1; display:flex; align-items:center; justify-content:center; color:var(--slate); background:var(--desk);}
</style>
</head>
<body>

<div id="loading">Loading…</div>

<div id="authScreen" style="display:none">
  <div class="card">
    <h1>OHT Accounting System — Sign in</h1>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="authBtn">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="topbar" style="display:none">
  <span class="mark">OHT</span>
  <span class="brand">OHT Accounting</span>
  <div id="tabs"></div>
  <div class="spacer"></div>
  <span class="status offline" id="failedStatus" style="display:none"></span>
  <span class="status" id="netStatus"></span>
  <button class="signout" id="signOutBtn">Sign out</button>
</div>
<div id="frames"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  // Supabase anon key is safe to ship in client code by design — RLS is the
  // real gate, not this key. See AGENTS.md/README for how to point this shell
  // at a different Supabase project.
  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });
  window.__sb = sb; // modules loaded in child iframes don't share this window,
                     // each module creates its own client with the same constants.

  // Modules hosted in persistent iframes. Add an entry here once its .html file exists.
  var MODULES = [
    { key: 'masters', label: 'Masters', src: 'masters.html' },
    { key: 'billing', label: 'Billing', src: 'billing.html' },
    { key: 'ledger', label: 'Daily Ledger', src: 'daily-ledger.html' },
    { key: 'reports', label: 'Reports', src: 'reports.html' }
  ];

  var loadingEl = document.getElementById('loading');
  var authEl = document.getElementById('authScreen');
  var topbarEl = document.getElementById('topbar');
  var tabsEl = document.getElementById('tabs');
  var framesEl = document.getElementById('frames');
  var netStatusEl = document.getElementById('netStatus');

  var activeKey = null;
  var frames = {};

  function updateNetStatus() {
    var online = navigator.onLine;
    netStatusEl.textContent = online ? 'Online' : 'Offline — changes will sync later';
    netStatusEl.className = 'status' + (online ? '' : ' offline');
  }
  window.addEventListener('online', updateNetStatus);
  window.addEventListener('offline', updateNetStatus);

  // localStorage is shared across same-origin iframes (unlike each module's
  // own OfflineQueue JS object), so the shell can surface a queued op that
  // permanently failed to sync (§14) without the module that queued it
  // needing to still be open.
  var failedStatusEl = document.getElementById('failedStatus');
  function checkFailedQueue() {
    var failed;
    try { failed = JSON.parse(localStorage.getItem('oht:offlineQueueFailed') || '[]'); } catch (e) { failed = []; }
    if (failed.length) {
      failedStatusEl.style.display = '';
      failedStatusEl.textContent = failed.length + ' change(s) could not sync — contact admin';
      failedStatusEl.title = 'These edits could not be saved even after coming back online. They are kept in this browser only — do not clear site data before resolving.';
    } else {
      failedStatusEl.style.display = 'none';
    }
  }
  checkFailedQueue();
  setInterval(checkFailedQueue, 15000);

  function buildTabs() {
    tabsEl.innerHTML = '';
    MODULES.forEach(function (m) {
      var t = document.createElement('div');
      t.className = 'tab';
      t.textContent = m.label;
      t.dataset.key = m.key;
      t.addEventListener('click', function () { activate(m.key); });
      tabsEl.appendChild(t);
    });
  }

  function ensureFrame(key) {
    if (frames[key]) return frames[key];
    var m = MODULES.filter(function (x) { return x.key === key; })[0];
    if (!m) return null;
    var f = document.createElement('iframe');
    f.src = m.src;
    f.dataset.key = key;
    framesEl.appendChild(f);
    frames[key] = f;
    return f;
  }

  function activate(key) {
    var f = ensureFrame(key);
    if (!f) return;
    activeKey = key;
    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('active', k === key);
    });
    Array.prototype.forEach.call(tabsEl.children, function (t) {
      t.classList.toggle('active', t.dataset.key === key);
    });
    // Only the foreground module is allowed to auto-refresh the shared auth
    // token, so multiple open modules never race each other on refresh.
    Object.keys(frames).forEach(function (k) {
      frames[k].contentWindow && frames[k].contentWindow.postMessage(
        { oht: 'active', active: k === key }, '*'
      );
    });
    try { localStorage.setItem('oht:lastTab', key); } catch (e) {}
  }

  // Cross-module postMessage relay (§3/§14): refresh broadcasts and deep-links
  // pass through the shell to every other open module.
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'refresh' || d.oht === 'goto') {
      Object.keys(frames).forEach(function (k) {
        if (frames[k].contentWindow !== ev.source) {
          frames[k].contentWindow.postMessage(d, '*');
        }
      });
    }
  });

  function showAuth(err) {
    loadingEl.style.display = 'none';
    topbarEl.style.display = 'none';
    authEl.style.display = 'flex';
    document.getElementById('authErr').textContent = err || '';
  }

  function showApp() {
    authEl.style.display = 'none';
    loadingEl.style.display = 'none';
    topbarEl.style.display = 'flex';
    buildTabs();
    var last = 'masters';
    try { last = localStorage.getItem('oht:lastTab') || 'masters'; } catch (e) {}
    activate(last);
  }

  async function checkProfileAndEnter() {
    var { data: userData } = await sb.auth.getUser();
    var user = userData && userData.user;
    if (!user) { showAuth(); return; }
    var { data: profile, error } = await sb
      .from('app_users')
      .select('id, is_active, is_admin')
      .eq('id', user.id)
      .maybeSingle();
    if (error) { showAuth('Could not load your profile: ' + error.message); return; }
    if (!profile) {
      await sb.auth.signOut();
      showAuth('Your account is not set up yet — contact your admin.');
      return;
    }
    if (!profile.is_active) {
      await sb.auth.signOut();
      showAuth('Your access has been disabled — contact your admin.');
      return;
    }
    showApp();
  }

  document.getElementById('authBtn').addEventListener('click', async function () {
    var email = document.getElementById('authEmail').value.trim();
    var pass = document.getElementById('authPass').value;
    var errEl = document.getElementById('authErr');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Enter email and password.'; return; }
    var { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error) { errEl.textContent = error.message; return; }
    checkProfileAndEnter();
  });

  document.getElementById('signOutBtn').addEventListener('click', async function () {
    await sb.auth.signOut();
    Object.keys(frames).forEach(function (k) { frames[k].remove(); });
    frames = {};
    showAuth();
  });

  updateNetStatus();
  checkProfileAndEnter();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
