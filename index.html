<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OHT Accounting System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2A2620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OHT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  /* Shell layout only — every visual token/component comes from theme.css.
     The sign-in screen below is deliberately EXCLUDED from the redesign and
     keeps its own original palette, scoped to #authScreen/#loading so the
     rest of the shell can use theme.css's tokens. */
  html,body{height:100%;}
  body{display:flex; flex-direction:column;}

  #frames{flex:1; position:relative; background:var(--desk); display:none;}
  #frames iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--desk);
  }
  #frames iframe.active{display:block;}

  /* ---- sign-in screen: untouched original design (scoped palette) ---- */
  #authScreen, #loading{
    --ink:#1F2933; --slate:#3E4C59; --mute:#7B8794; --line:#CBD2D9; --hair:#E4E7EB;
    --paper:#FFFFFF; --desk:#DDE1E6; --warmbg:#FCFAF7; --panel:#F5F0E8;
    --debit:#9B2C2C; --credit:#14614A; --accent:#A67C2E; --cash:#0B6E99;
    --loginAccent:#A0522D; --loginAccentHover:#8B4226;
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #authScreen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:16px 16px 32px; background:var(--warmbg);
  }
  #authScreen .authInner{ width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; }
  #authScreen .logoWrap{ margin-bottom:28px; }
  #authScreen .logoPlate{ display:block; }
  #authScreen .logoPlate img{ width:190px; display:block; margin:0 auto; }
  #authScreen .card{
    background:var(--paper); border-radius:16px; box-shadow:0 10px 34px rgba(31,41,51,.10);
    padding:28px; width:100%;
  }
  #authScreen label{ display:block; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  #authScreen input{
    width:100%; padding:12px 14px; margin-bottom:18px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px;
    font-family:inherit;
  }
  #authScreen input:focus{outline:none; border-color:var(--loginAccent);}
  #authScreen button{
    width:100%; padding:13px; border-radius:10px; border:0; background:var(--loginAccent);
    color:#fff; font-size:15px; cursor:pointer; font-weight:600; font-family:inherit;
  }
  #authScreen button:hover{background:var(--loginAccentHover);}
  #authScreen .err{color:var(--debit); font-size:13px; margin-top:10px; min-height:16px;}
  #authScreen .powered{ margin-top:20px; font-size:13px; color:var(--mute); text-align:center; }
  #loading{flex:1; display:flex; align-items:center; justify-content:center; color:var(--slate); background:var(--warmbg);}

  /* Dark mode (§ sign-in screen only — matches the two approved previews;
     the rest of the app, inside #topbar/#frames, keeps its one light
     "paper and ink" theme, which was never part of what was previewed). */
  @media (prefers-color-scheme: dark){
    #authScreen, #loading{ background:#14181F; }
    #authScreen .logoPlate{
      background:#fff; border-radius:14px; padding:20px 26px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
    }
    #authScreen .card{
      background:#1C222C; border:1px solid #2C3440; box-shadow:none;
    }
    #authScreen label{ color:#E4E7EB; }
    #authScreen input{ background:#11151C; border-color:#2C3440; color:#E4E7EB; }
    #authScreen button{ background:#D2823E; }
    #authScreen button:hover{ background:#C06F2C; }
    #authScreen .powered{ color:#8A93A0; }
    #loading{ color:#8A93A0; }
  }
</style>
</head>
<body>

<div id="loading">Loading…</div>

<div id="authScreen" style="display:none">
  <div class="authInner">
    <div class="logoWrap">
      <div class="logoPlate"><img src="icons/oht-solutions-logo.png" alt="OHT Solutions"></div>
    </div>
    <div class="card">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" placeholder="you@company.com" autocomplete="username">
      <label for="authPass">Password</label>
      <input id="authPass" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="authBtn">Sign in</button>
      <div class="err" id="authErr"></div>
    </div>
    <div class="powered">Powered by "OHT Solutions"</div>
  </div>
</div>

<div class="topbar" id="topbar" style="display:none">
  <span class="mark">OHT</span>
  <span class="brand">OHT Accounting System</span>
  <div class="tabstrip" id="tabs"></div>
  <div class="spacer"></div>
  <span class="status offline" id="failedStatus" style="display:none"></span>
  <span class="status" id="netStatus"></span>
  <button class="abtn" id="reloadBtn" title="Load the newest version of the app">⟳</button>
  <button class="abtn" id="installBtn" style="display:none">⭳ Install</button>
  <button class="abtn" id="signOutBtn">Sign out</button>
</div>
<div id="frames"></div>

<div class="confirm-scrim" id="installStepsModal">
  <div class="confirm-card">
    <h4>Install the app</h4>
    <p id="installStepsBody">…</p>
    <div class="acts"><button class="btn pri" id="installStepsClose">OK</button></div>
  </div>
</div>

<div id="toastStack" class="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  // Supabase anon key is safe to ship in client code by design — RLS is the
  // real gate, not this key. See AGENTS.md/README for how to point this shell
  // at a different Supabase project.
  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });
  window.__sb = sb; // modules loaded in child iframes don't share this window,
                     // each module creates its own client with the same constants.

  // -----------------------------------------------------------------
  // Shared UI helpers (§14) — toast + confirm dialog. Each module is a
  // separate document with no shared JS runtime, so every module carries
  // its own copy of these same two helpers.
  // -----------------------------------------------------------------
  var MAX_TOASTS = 3;
  function toast(message, isError) {
    var stack = document.getElementById('toastStack');
    if (!stack) return;
    // Queue/history discipline: a new toast never replaces an unread one —
    // they stack (column-reverse), and only the oldest is evicted once more
    // than MAX_TOASTS are on screen at the same time.
    while (stack.children.length >= MAX_TOASTS) stack.removeChild(stack.firstChild);
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });
    setTimeout(function () {
      el.classList.remove('on');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, isError ? 5200 : 3200);
  }

  function confirmDialog(title, body, confirmLabel, isDangerous) {
    return new Promise(function (resolve) {
      var scrim = document.createElement('div');
      scrim.className = 'confirm-scrim on';
      var card = document.createElement('div');
      card.className = 'confirm-card';
      var h = document.createElement('h4'); h.textContent = title;
      var p = document.createElement('p'); p.textContent = body;
      var acts = document.createElement('div'); acts.className = 'acts';
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn'; cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
      var okBtn = document.createElement('button');
      okBtn.className = 'btn ' + (isDangerous ? 'dgr' : 'pri'); okBtn.type = 'button';
      okBtn.textContent = confirmLabel || 'OK';
      acts.appendChild(cancelBtn); acts.appendChild(okBtn);
      card.appendChild(h); card.appendChild(p); card.appendChild(acts);
      scrim.appendChild(card);

      function close(val) {
        document.removeEventListener('keydown', onKey, true);
        if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
        resolve(val);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(false); }
        else if (e.key === 'Enter') { e.preventDefault(); close(true); }
      }
      cancelBtn.addEventListener('click', function () { close(false); });
      okBtn.addEventListener('click', function () { close(true); });
      scrim.addEventListener('click', function (e) { if (e.target === scrim) close(false); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(scrim);
      okBtn.focus();
    });
  }

  // Modules hosted in persistent iframes. Add an entry here once its .html file exists.
  // `hidden: true` keeps a module loadable/addressable (via the oht:'open'
  // cross-frame message) without giving it a top-level tab of its own —
  // Reports is reached from Masters' sidebar report links instead.
  var MODULES = [
    { key: 'masters', label: 'Masters', src: 'masters.html' },
    { key: 'billing', label: 'Billing', src: 'billing.html' },
    { key: 'ledger', label: 'Daily Ledger', src: 'daily-ledger.html' },
    { key: 'reports', label: 'Reports', src: 'reports.html', hidden: true }
  ];

  var loadingEl = document.getElementById('loading');
  var authEl = document.getElementById('authScreen');
  var topbarEl = document.getElementById('topbar');
  var tabsEl = document.getElementById('tabs');
  var framesEl = document.getElementById('frames');
  var netStatusEl = document.getElementById('netStatus');

  var activeKey = null;
  var frames = {};
  var frameReady = {};   // key -> true once the iframe document has loaded
  var pendingGoto = {};  // key -> message to deliver as soon as it is ready

  var wasOnline = navigator.onLine;
  function updateNetStatus() {
    var online = navigator.onLine;
    // Idle/online state shows nothing here — only something actionable
    // (offline, a failed sync, a save in progress) earns space in this bar.
    netStatusEl.textContent = online ? '' : 'Offline — changes will sync later';
    netStatusEl.className = 'status' + (online ? '' : ' offline');
    if (online !== wasOnline) {
      wasOnline = online;
      toast(online ? 'Back online — queued changes will sync.'
                   : 'You are offline. Changes are saved in this browser and will sync later.', !online);
    }
  }
  window.addEventListener('online', updateNetStatus);
  window.addEventListener('offline', updateNetStatus);

  // localStorage is shared across same-origin iframes (unlike each module's
  // own OfflineQueue JS object), so the shell can surface a queued op that
  // permanently failed to sync (§14) without the module that queued it
  // needing to still be open.
  var failedStatusEl = document.getElementById('failedStatus');
  var lastFailedCount = 0;
  function checkFailedQueue() {
    var failed;
    try { failed = JSON.parse(localStorage.getItem('oht:offlineQueueFailed') || '[]'); } catch (e) { failed = []; }
    if (failed.length) {
      failedStatusEl.style.display = '';
      failedStatusEl.textContent = failed.length + ' change(s) could not sync — contact admin';
      failedStatusEl.title = 'These edits could not be saved even after coming back online. They are kept in this browser only — do not clear site data before resolving.';
      if (failed.length > lastFailedCount) {
        toast(failed.length + ' change(s) could not sync — contact your admin before clearing site data.', true);
      }
    } else {
      failedStatusEl.style.display = 'none';
    }
    lastFailedCount = failed.length;
  }
  checkFailedQueue();
  setInterval(checkFailedQueue, 15000);

  function buildTabs() {
    tabsEl.innerHTML = '';
    MODULES.forEach(function (m) {
      if (m.hidden) return;
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'tab';
      t.textContent = m.label;
      t.dataset.key = m.key;
      t.addEventListener('click', function () { activate(m.key); });
      tabsEl.appendChild(t);
    });
  }

  function ensureFrame(key) {
    if (frames[key]) return frames[key];
    var m = MODULES.filter(function (x) { return x.key === key; })[0];
    if (!m) return null;
    var f = document.createElement('iframe');
    f.addEventListener('load', function () {
      frameReady[key] = true;
      if (pendingGoto[key]) {
        f.contentWindow && f.contentWindow.postMessage(pendingGoto[key], '*');
        delete pendingGoto[key];
      }
      // A frame created by a deep-link is the visible one, so it must also
      // learn it is active (the activate() broadcast below can fire before
      // the document exists to hear it).
      f.contentWindow && f.contentWindow.postMessage({ oht: 'active', active: activeKey === key }, '*');
    });
    f.src = m.src + '?v=' + reloadStamp;
    f.dataset.key = key;
    framesEl.appendChild(f);
    frames[key] = f;
    return f;
  }

  // Reload button (§ app-wide): re-fetches every currently open module with
  // a fresh cache-busting query param, so a newly-deployed update takes
  // effect immediately without the user clearing cache or reinstalling the
  // PWA. Only re-loads frames that already exist — doesn't open new ones.
  var reloadStamp = Date.now();
  document.getElementById('reloadBtn').addEventListener('click', function () {
    reloadStamp = Date.now();
    Object.keys(frames).forEach(function (key) {
      var m = MODULES.filter(function (x) { return x.key === key; })[0];
      if (!m) return;
      frameReady[key] = false;
      frames[key].src = m.src + '?v=' + reloadStamp;
    });
    toast('Reloading the latest version…');
  });

  function activate(key) {
    var f = ensureFrame(key);
    if (!f) return;
    activeKey = key;
    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('active', k === key);
    });
    Array.prototype.forEach.call(tabsEl.children, function (t) {
      t.classList.toggle('on', t.dataset.key === key);
    });
    // Only the foreground module is allowed to auto-refresh the shared auth
    // token, so multiple open modules never race each other on refresh.
    Object.keys(frames).forEach(function (k) {
      frames[k].contentWindow && frames[k].contentWindow.postMessage(
        { oht: 'active', active: k === key }, '*'
      );
    });
    try { localStorage.setItem('oht:lastTab', key); } catch (e) {}
  }

  // Deep-link into a module: open/switch to it, then hand it the argument as
  // an oht:'goto' message. If its iframe is being created right now, the goto
  // is held until the document has loaded (see ensureFrame's load handler).
  function openModule(app, arg) {
    var m = MODULES.filter(function (x) { return x.key === app; })[0];
    if (!m) return;
    var existed = !!frames[app];
    activate(app);
    if (arg === undefined || arg === null) return;
    var msg = { oht: 'goto', app: app, arg: arg };
    if (existed && frameReady[app]) {
      frames[app].contentWindow && frames[app].contentWindow.postMessage(msg, '*');
    } else {
      pendingGoto[app] = msg;
    }
  }

  // Cross-module postMessage relay (§3/§14): refresh broadcasts and deep-links
  // pass through the shell to every other open module.
  //   { oht:'open', app:'<moduleKey>', arg:<any> }  -> shell opens/switches to
  //     that module and delivers { oht:'goto', app, arg } into its frame.
  //   { oht:'goto' | 'refresh', ... }               -> broadcast to siblings.
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'open') { openModule(d.app, d.arg); return; }
    if (d.oht === 'installPrompt') { installBtn.click(); return; }
    if (d.oht === 'signOut') { document.getElementById('signOutBtn').click(); return; }
    if (d.oht === 'refresh' || d.oht === 'goto') {
      Object.keys(frames).forEach(function (k) {
        if (frames[k].contentWindow !== ev.source) {
          frames[k].contentWindow.postMessage(d, '*');
        }
      });
    }
  });

  function showAuth(err) {
    loadingEl.style.display = 'none';
    topbarEl.style.display = 'none';
    authEl.style.display = 'flex';
    document.getElementById('authErr').textContent = err || '';
  }

  function showApp() {
    authEl.style.display = 'none';
    loadingEl.style.display = 'none';
    topbarEl.style.display = 'flex';
    framesEl.style.display = 'block';
    buildTabs();
    var last = 'masters';
    try { last = localStorage.getItem('oht:lastTab') || 'masters'; } catch (e) {}
    activate(last);
  }

  async function checkProfileAndEnter() {
    var { data: userData } = await sb.auth.getUser();
    var user = userData && userData.user;
    if (!user) { showAuth(); return; }
    var { data: profile, error } = await sb
      .from('app_users')
      .select('id, is_active, is_admin')
      .eq('id', user.id)
      .maybeSingle();
    if (error) { showAuth('Could not load your profile: ' + error.message); return; }
    if (!profile) {
      await sb.auth.signOut();
      showAuth('Your account is not set up yet — contact your admin.');
      return;
    }
    if (!profile.is_active) {
      await sb.auth.signOut();
      showAuth('Your access has been disabled — contact your admin.');
      return;
    }
    showApp();
  }

  document.getElementById('authBtn').addEventListener('click', async function () {
    var email = document.getElementById('authEmail').value.trim();
    var pass = document.getElementById('authPass').value;
    var errEl = document.getElementById('authErr');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Enter email and password.'; return; }
    var { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error) { errEl.textContent = error.message; return; }
    checkProfileAndEnter();
  });

  document.getElementById('signOutBtn').addEventListener('click', async function () {
    var ok = await confirmDialog(
      'Sign out of OHT Accounting System?',
      'Every open module closes and you are returned to the sign-in screen. Anything still waiting to sync stays queued in this browser and syncs the next time you sign in on this device.',
      'Sign out', true
    );
    if (!ok) return;
    await sb.auth.signOut();
    Object.keys(frames).forEach(function (k) { frames[k].remove(); });
    frames = {};
    frameReady = {};
    pendingGoto = {};
    activeKey = null;
    showAuth();
  });

  updateNetStatus();
  if (!navigator.onLine) {
    toast('You are offline. Changes are saved in this browser and will sync later.', true);
  }
  checkProfileAndEnter();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  // ---------------------------------------------------------------
  // PWA install button — always visible until installed, whether or not
  // the browser offers its own native prompt: Chrome/Edge get the native
  // install popup via 'beforeinstallprompt'; Safari/Firefox/anything else
  // gets manual steps instead, so the button works everywhere.
  // ---------------------------------------------------------------
  var deferredInstallPrompt = null;
  var installBtn = document.getElementById('installBtn');
  function alreadyInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua);
  var isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
  var isFirefox = /firefox|fxios/i.test(ua);

  if (!alreadyInstalled()) {
    installBtn.style.display = '';
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredInstallPrompt = e;
    });
  }
  window.addEventListener('appinstalled', function () { installBtn.style.display = 'none'; });

  installBtn.addEventListener('click', function () {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function () {
        deferredInstallPrompt = null;
        installBtn.style.display = 'none';
      });
      return;
    }
    var steps;
    if (isIOS && isSafari) {
      steps = 'Tap the <b>Share</b> button (⬆️) below, then choose <b>"Add to Home Screen"</b>.';
    } else if (isSafari) {
      steps = 'From Safari’s <b>File</b> menu, choose <b>"Add to Dock"</b> (or "Add to Home Screen").';
    } else if (isFirefox) {
      steps = 'Firefox does not support the install button yet. Copy this page’s link and open it in Chrome/Edge to install.';
    } else {
      steps = 'Open the browser’s <b>3-dot menu</b> (⋮) and choose <b>"Install app"</b> or <b>"Add to Home screen"</b>.';
    }
    document.getElementById('installStepsBody').innerHTML = steps;
    document.getElementById('installStepsModal').classList.add('on');
  });
  document.getElementById('installStepsClose').addEventListener('click', function () {
    document.getElementById('installStepsModal').classList.remove('on');
  });
})();
</script>
</body>
</html>
