<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OHT Accounting System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2A2620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OHT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  /* Shell layout only — every visual token/component comes from theme.css.
     The sign-in screen below is deliberately EXCLUDED from the redesign and
     keeps its own original palette, scoped to #authScreen/#loading so the
     rest of the shell can use theme.css's tokens. */
  html,body{height:100%;}
  body{display:flex; flex-direction:column;}

  #appShell{flex:1; min-height:0; height:auto; display:none;}
  #appShell.on{display:flex;}
  #frames{flex:1; position:relative; background:var(--desk);}
  #frames iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--desk);
  }
  #frames iframe.active{display:block;}

  /* ---- shell sidebar: categories that expand/collapse, mirroring the
     .subgrp/caret pattern daily-ledger.html's own sidebar already uses,
     just on the shell's dark sidebar instead of its light variant. ---- */
  #sidebar .cat{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:none; background:none;
    color:#E8E2D5; font-size:13px; font-weight:700; margin-bottom:2px;
  }
  #sidebar .cat:hover{background:var(--abtn-bg); color:#fff;}
  #sidebar .cat .caret{margin-left:auto; color:#8C8577; font-size:11px; transition:transform .16s;}
  #sidebar .cat[aria-expanded="true"] .caret{transform:rotate(90deg);}
  /* category / top-level icons sit in a soft accent-tinted chip (approved) */
  #sidebar .ico-chip{
    width:26px; height:26px; border-radius:7px; flex:none; display:grid; place-items:center;
    background:rgba(176,130,74,.16); color:#C9A063;
  }
  #sidebar .ico-chip svg{width:15px; height:15px;}
  #sidebar .cat[aria-expanded="true"] .ico-chip{background:rgba(176,130,74,.28); color:#DDB877;}
  #sidebar .navitem.on .ico-chip{background:rgba(176,130,74,.28); color:#DDB877;}
  #sidebar .subgrp .navitem{font-size:12.8px; padding:7px 10px 7px 44px;}

  /* ---- shell header: replaces the old horizontal .topbar tabstrip ---- */
  .shellbar{
    display:flex; align-items:center; gap:10px; height:50px; padding:0 16px;
    background:var(--paper); border-bottom:1px solid var(--hair); flex:none;
  }
  .shellbar h1{font-size:15px; margin:0; font-weight:700; color:var(--ink);}
  .shellbar .grow{flex:1;}
  .shellbar .status{font-size:11.5px; color:var(--mute); white-space:nowrap;}
  .shellbar .status.offline{color:var(--debit);}
  .appbar .title{flex:1;}
  .appbar .status{font-size:11px; color:#B8AF9E; white-space:nowrap;}
  .appbar .status.offline{color:#D19A80;}

  /* ---- sign-in screen: untouched original design (scoped palette) ---- */
  #authScreen, #loading{
    --ink:#1F2933; --slate:#3E4C59; --mute:#7B8794; --line:#CBD2D9; --hair:#E4E7EB;
    --paper:#FFFFFF; --desk:#DDE1E6; --warmbg:#FCFAF7; --panel:#F5F0E8;
    --debit:#9B2C2C; --credit:#14614A; --accent:#A67C2E; --cash:#0B6E99;
    --loginAccent:#A0522D; --loginAccentHover:#8B4226;
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #authScreen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:16px 16px 32px; background:var(--warmbg);
  }
  #authScreen .authInner{ width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; }
  #authScreen .logoWrap{ margin-bottom:28px; }
  #authScreen .logoPlate{ display:block; }
  #authScreen .logoPlate img{ width:190px; display:block; margin:0 auto; }
  #authScreen .card{
    background:var(--paper); border-radius:16px; box-shadow:0 10px 34px rgba(31,41,51,.10);
    padding:28px; width:100%;
  }
  #authScreen label{ display:block; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  #authScreen input{
    width:100%; padding:12px 14px; margin-bottom:18px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px;
    font-family:inherit;
  }
  #authScreen input:focus{outline:none; border-color:var(--loginAccent);}
  #authScreen button{
    width:100%; padding:13px; border-radius:10px; border:0; background:var(--loginAccent);
    color:#fff; font-size:15px; cursor:pointer; font-weight:600; font-family:inherit;
  }
  #authScreen button:hover{background:var(--loginAccentHover);}
  #authScreen .err{color:var(--debit); font-size:13px; margin-top:10px; min-height:16px;}
  #authScreen .powered{ margin-top:20px; font-size:13px; color:var(--mute); text-align:center; }
  #loading{flex:1; display:flex; align-items:center; justify-content:center; color:var(--slate); background:var(--warmbg);}

  /* Dark mode (§ sign-in screen only — matches the two approved previews;
     the rest of the app, inside #topbar/#frames, keeps its one light
     "paper and ink" theme, which was never part of what was previewed). */
  @media (prefers-color-scheme: dark){
    #authScreen, #loading{ background:#14181F; }
    #authScreen .logoPlate{
      background:#fff; border-radius:14px; padding:20px 26px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
    }
    #authScreen .card{
      background:#1C222C; border:1px solid #2C3440; box-shadow:none;
    }
    #authScreen label{ color:#E4E7EB; }
    #authScreen input{ background:#11151C; border-color:#2C3440; color:#E4E7EB; }
    #authScreen button{ background:#D2823E; }
    #authScreen button:hover{ background:#C06F2C; }
    #authScreen .powered{ color:#8A93A0; }
    #loading{ color:#8A93A0; }
  }
</style>
</head>
<body>

<div id="loading">Loading…</div>

<div id="authScreen" style="display:none">
  <div class="authInner">
    <div class="logoWrap">
      <div class="logoPlate"><img src="icons/oht-solutions-logo.png" alt="OHT Solutions"></div>
    </div>
    <div class="card">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" placeholder="you@company.com" autocomplete="username">
      <label for="authPass">Password</label>
      <input id="authPass" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="authBtn">Sign in</button>
      <div class="err" id="authErr"></div>
    </div>
    <div class="powered">Powered by "OHT Solutions"</div>
  </div>
</div>

<div class="app-shell" id="appShell">

  <nav class="sidebar" id="sidebar">
    <div class="head">
      <span class="mark">OHT</span>
      <span class="title">OHT Accounting System</span>
      <button class="close" id="navClose" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="grp" id="navPrimary"></div>

    <hr class="sep">
    <div class="grp">
      <div class="grp-lbl">Tools</div>
      <div id="navTools"></div>
    </div>

    <hr class="sep">
    <div class="grp">
      <div class="grp-lbl">Account</div>
      <div id="navAccount"></div>
      <button type="button" class="navitem dgr" id="signOutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </nav>

  <div class="scrim" id="navScrim"></div>

  <div class="main">
    <div class="appbar">
      <button class="hamburger" id="navOpen" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="title" id="appbarTitle">OHT Accounting System</span>
      <span class="status offline" id="failedStatusM" style="display:none"></span>
      <span class="status" id="netStatusM"></span>
    </div>

    <div class="shellbar">
      <h1 id="shellTitle">OHT Accounting System</h1>
      <div class="grow"></div>
      <span class="status offline" id="failedStatus" style="display:none"></span>
      <span class="status" id="netStatus"></span>
      <button class="abtn" id="reloadBtn" title="Load the newest version of the app">⟳</button>
      <button class="abtn" id="installBtn" style="display:none">⭳ Install</button>
    </div>

    <div id="frames"></div>
  </div>
</div>

<div class="confirm-scrim" id="installStepsModal">
  <div class="confirm-card">
    <h4>Install the app</h4>
    <p id="installStepsBody">…</p>
    <div class="acts"><button class="btn pri" id="installStepsClose">OK</button></div>
  </div>
</div>

<div id="toastStack" class="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  // Supabase anon key is safe to ship in client code by design — RLS is the
  // real gate, not this key. See AGENTS.md/README for how to point this shell
  // at a different Supabase project.
  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });
  window.__sb = sb; // modules loaded in child iframes don't share this window,
                     // each module creates its own client with the same constants.

  // -----------------------------------------------------------------
  // Shared UI helpers (§14) — toast + confirm dialog. Each module is a
  // separate document with no shared JS runtime, so every module carries
  // its own copy of these same two helpers.
  // -----------------------------------------------------------------
  var MAX_TOASTS = 3;
  function toast(message, isError) {
    var stack = document.getElementById('toastStack');
    if (!stack) return;
    // Queue/history discipline: a new toast never replaces an unread one —
    // they stack (column-reverse), and only the oldest is evicted once more
    // than MAX_TOASTS are on screen at the same time.
    while (stack.children.length >= MAX_TOASTS) stack.removeChild(stack.firstChild);
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });
    setTimeout(function () {
      el.classList.remove('on');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, isError ? 5200 : 3200);
  }

  function confirmDialog(title, body, confirmLabel, isDangerous) {
    return new Promise(function (resolve) {
      var scrim = document.createElement('div');
      scrim.className = 'confirm-scrim on';
      var card = document.createElement('div');
      card.className = 'confirm-card';
      var h = document.createElement('h4'); h.textContent = title;
      var p = document.createElement('p'); p.textContent = body;
      var acts = document.createElement('div'); acts.className = 'acts';
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn'; cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
      var okBtn = document.createElement('button');
      okBtn.className = 'btn ' + (isDangerous ? 'dgr' : 'pri'); okBtn.type = 'button';
      okBtn.textContent = confirmLabel || 'OK';
      acts.appendChild(cancelBtn); acts.appendChild(okBtn);
      card.appendChild(h); card.appendChild(p); card.appendChild(acts);
      scrim.appendChild(card);

      function close(val) {
        document.removeEventListener('keydown', onKey, true);
        if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
        resolve(val);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(false); }
        else if (e.key === 'Enter') { e.preventDefault(); close(true); }
      }
      cancelBtn.addEventListener('click', function () { close(false); });
      okBtn.addEventListener('click', function () { close(true); });
      scrim.addEventListener('click', function (e) { if (e.target === scrim) close(false); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(scrim);
      okBtn.focus();
    });
  }

  // Modules hosted in persistent iframes. Add an entry here once its .html file exists.
  var MODULES = [
    { key: 'masters', label: 'Masters', src: 'masters.html' },
    { key: 'billing', label: 'Billing', src: 'billing.html' },
    { key: 'ledger', label: 'Daily Ledger', src: 'daily-ledger.html' },
    { key: 'reports', label: 'Reports', src: 'reports.html' }
  ];

  // The sidebar's full nav tree — every leaf deep-links into a module via
  // the existing oht:'open'/'goto' postMessage relay (openModule below).
  // `arg` values are each module's own view/tab keys, verified against that
  // module's own file (masters.html's VIEWS, billing.html's ALL_TABS,
  // reports.html's TABS).
  var NAV = [
    { group: 'Masters', items: [
      { app: 'masters', arg: 'parties', label: 'Parties' },
      { app: 'masters', arg: 'items', label: 'Items' },
      { app: 'masters', arg: 'services', label: 'Services' },
      { app: 'masters', arg: 'companies', label: 'Firms' },
      { app: 'masters', arg: 'warehouses', label: 'Warehouses' },
      { app: 'masters', arg: 'partykinds', label: 'Party Kinds' }
    ] },
    { group: 'Sales & Billing', items: [
      { app: 'billing', arg: 'sale', label: 'Sale' },
      { app: 'billing', arg: 'purchase', label: 'Purchase' },
      { app: 'billing', arg: 'quotation', label: 'Quotation' },
      { app: 'billing', arg: 'po', label: 'Purchase order' },
      { app: 'billing', arg: 'sinvoice', label: 'Service invoice' },
      { app: 'billing', arg: 'squote', label: 'Service quotation' },
      { app: 'billing', arg: 'return', label: 'Sales return' },
      { app: 'billing', arg: 'transfer', label: 'Stock transfer' }
    ] },
    { single: { app: 'ledger', label: 'Daily Ledger' } },
    { group: 'Reports', items: [
      { app: 'reports', arg: 'trial', label: 'Trial Balance' },
      { app: 'reports', arg: 'aging', label: 'Receivable Aging' },
      { app: 'reports', arg: 'pl', label: 'Profit & Loss' },
      { app: 'reports', arg: 'statement', label: 'Statement of Account' },
      { app: 'reports', arg: 'stockledger', label: 'Item Stock Ledger' },
      { app: 'reports', arg: 'matcons', label: 'Material Consumption' },
      { app: 'reports', arg: 'matprofit', label: 'Material Cost & Profit' },
      { app: 'reports', arg: 'mataudit', label: 'Consumption Audit' }
    ] }
  ];
  var NAV_TOOLS = [
    { app: 'masters', arg: 'backup', label: 'Backup / Restore' },
    { app: 'masters', arg: 'recyclebin', label: 'Recycle Bin' },
    { app: 'masters', arg: 'periodlock', label: 'Period Lock' }
  ];
  var NAV_ACCOUNT = [
    { app: 'masters', arg: 'users', label: 'Manage Users' },
    { app: 'masters', arg: 'changepw', label: 'Change Password' }
  ];

  function svgIco(path) {
    return '<span class="ico-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg></span>';
  }
  var GROUP_ICON = {
    'Masters': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
    'Sales & Billing': '<path d="M4 2v20l2.5-2 2.5 2 2.5-2 2.5 2 2.5-2 2.5 2V2l-2.5 2L14 2l-2.5 2L9 2 6.5 4z"/><path d="M8 8h8"/><path d="M8 12h6"/>',
    'Reports': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
    'Daily Ledger': '<path d="M6 3h12a1 1 0 0 1 1 1v16l-3.5-2-3.5 2-3.5-2-3.5 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6M9 16h3"/>'
  };

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }

  var loadingEl = document.getElementById('loading');
  var authEl = document.getElementById('authScreen');
  var appShellEl = document.getElementById('appShell');
  var framesEl = document.getElementById('frames');
  var netStatusEl = document.getElementById('netStatus');
  var netStatusMEl = document.getElementById('netStatusM');

  var activeKey = null;
  var frames = {};
  var frameReady = {};   // key -> true once the iframe document has loaded
  var pendingGoto = {};  // key -> message to deliver as soon as it is ready

  var wasOnline = navigator.onLine;
  function updateNetStatus() {
    var online = navigator.onLine;
    // Idle/online state shows nothing here — only something actionable
    // (offline, a failed sync, a save in progress) earns space in this bar.
    netStatusEl.textContent = online ? '' : 'Offline — changes will sync later';
    netStatusEl.className = 'status' + (online ? '' : ' offline');
    netStatusMEl.textContent = netStatusEl.textContent;
    netStatusMEl.className = netStatusEl.className;
    if (online !== wasOnline) {
      wasOnline = online;
      toast(online ? 'Back online — queued changes will sync.'
                   : 'You are offline. Changes are saved in this browser and will sync later.', !online);
    }
  }
  window.addEventListener('online', updateNetStatus);
  window.addEventListener('offline', updateNetStatus);

  // localStorage is shared across same-origin iframes (unlike each module's
  // own OfflineQueue JS object), so the shell can surface a queued op that
  // permanently failed to sync (§14) without the module that queued it
  // needing to still be open.
  var failedStatusEl = document.getElementById('failedStatus');
  var failedStatusMEl = document.getElementById('failedStatusM');
  var lastFailedCount = 0;
  function checkFailedQueue() {
    var failed;
    try { failed = JSON.parse(localStorage.getItem('oht:offlineQueueFailed') || '[]'); } catch (e) { failed = []; }
    [failedStatusEl, failedStatusMEl].forEach(function (el) {
      if (failed.length) {
        el.style.display = '';
        el.textContent = failed.length + ' change(s) could not sync — contact admin';
        el.title = 'These edits could not be saved even after coming back online. They are kept in this browser only — do not clear site data before resolving.';
      } else {
        el.style.display = 'none';
      }
    });
    if (failed.length > lastFailedCount) {
      toast(failed.length + ' change(s) could not sync — contact your admin before clearing site data.', true);
    }
    lastFailedCount = failed.length;
  }
  checkFailedQueue();
  setInterval(checkFailedQueue, 15000);

  function navItemHtml(it) {
    return '<button type="button" class="navitem" data-app="' + it.app + '"' + (it.arg ? ' data-arg="' + it.arg + '"' : '') + '>' +
      '<span>' + esc(it.label) + '</span></button>';
  }

  function buildSidebar() {
    var primaryHtml = '';
    NAV.forEach(function (entry, gi) {
      if (entry.single) {
        primaryHtml += '<button type="button" class="navitem" data-app="' + entry.single.app + '">' +
          svgIco(GROUP_ICON[entry.single.label] || '') + '<span>' + esc(entry.single.label) + '</span></button>';
        return;
      }
      primaryHtml += '<button type="button" class="cat" data-gi="' + gi + '" aria-expanded="false">' +
        svgIco(GROUP_ICON[entry.group] || '') + '<span>' + esc(entry.group) + '</span><span class="caret">&#8250;</span></button>' +
        '<div class="subgrp" data-gi="' + gi + '">' + entry.items.map(navItemHtml).join('') + '</div>';
    });
    document.getElementById('navPrimary').innerHTML = primaryHtml;
    document.getElementById('navTools').innerHTML = NAV_TOOLS.map(navItemHtml).join('');
    document.getElementById('navAccount').innerHTML = NAV_ACCOUNT.map(navItemHtml).join('');

    document.getElementById('sidebar').addEventListener('click', function (e) {
      var cat = e.target.closest('.cat');
      if (cat) {
        var open = cat.getAttribute('aria-expanded') === 'true';
        cat.setAttribute('aria-expanded', open ? 'false' : 'true');
        var sub = cat.nextElementSibling;
        if (sub) sub.classList.toggle('on', !open);
        return;
      }
      var item = e.target.closest('.navitem[data-app]');
      if (item) {
        setDrawer(false);
        openModule(item.dataset.app, item.dataset.arg || null);
      }
    });
  }

  function navLabelFor(app, arg) {
    for (var i = 0; i < NAV.length; i++) {
      var entry = NAV[i];
      if (entry.single && entry.single.app === app && !arg) return entry.single.label;
      if (entry.items) {
        for (var j = 0; j < entry.items.length; j++) {
          if (entry.items[j].app === app && entry.items[j].arg === arg) return entry.items[j].label;
        }
      }
    }
    var flat = NAV_TOOLS.concat(NAV_ACCOUNT).filter(function (x) { return x.app === app && x.arg === arg; })[0];
    if (flat) return flat.label;
    var m = MODULES.filter(function (x) { return x.key === app; })[0];
    return m ? m.label : 'OHT Accounting System';
  }

  function updateSidebarActive(app, arg) {
    Array.prototype.forEach.call(document.querySelectorAll('#sidebar .navitem[data-app]'), function (b) {
      var on = b.dataset.app === app && (b.dataset.arg || null) === (arg || null);
      b.classList.toggle('on', on);
      if (on) {
        var sub = b.closest('.subgrp');
        if (sub) {
          sub.classList.add('on');
          var cat = sub.previousElementSibling;
          if (cat && cat.classList.contains('cat')) cat.setAttribute('aria-expanded', 'true');
        }
      }
    });
  }

  // ---- off-canvas drawer (≤860px; theme.css owns the transform/backdrop) ----
  function setDrawer(open) {
    document.getElementById('sidebar').classList.toggle('open', !!open);
    document.getElementById('navScrim').classList.toggle('on', !!open);
  }
  document.getElementById('navOpen').addEventListener('click', function () { setDrawer(true); });
  document.getElementById('navClose').addEventListener('click', function () { setDrawer(false); });
  document.getElementById('navScrim').addEventListener('click', function () { setDrawer(false); });

  function ensureFrame(key) {
    if (frames[key]) return frames[key];
    var m = MODULES.filter(function (x) { return x.key === key; })[0];
    if (!m) return null;
    var f = document.createElement('iframe');
    f.addEventListener('load', function () {
      frameReady[key] = true;
      if (pendingGoto[key]) {
        f.contentWindow && f.contentWindow.postMessage(pendingGoto[key], '*');
        delete pendingGoto[key];
      }
      // A frame created by a deep-link is the visible one, so it must also
      // learn it is active (the activate() broadcast below can fire before
      // the document exists to hear it).
      f.contentWindow && f.contentWindow.postMessage({ oht: 'active', active: activeKey === key }, '*');
    });
    f.src = m.src + '?v=' + reloadStamp;
    f.dataset.key = key;
    framesEl.appendChild(f);
    frames[key] = f;
    return f;
  }

  // Reload button (§ app-wide): re-fetches every currently open module with
  // a fresh cache-busting query param, so a newly-deployed update takes
  // effect immediately without the user clearing cache or reinstalling the
  // PWA. Only re-loads frames that already exist — doesn't open new ones.
  var reloadStamp = Date.now();
  document.getElementById('reloadBtn').addEventListener('click', function () {
    reloadStamp = Date.now();
    Object.keys(frames).forEach(function (key) {
      var m = MODULES.filter(function (x) { return x.key === key; })[0];
      if (!m) return;
      frameReady[key] = false;
      frames[key].src = m.src + '?v=' + reloadStamp;
    });
    toast('Reloading the latest version…');
  });

  function activate(key) {
    var f = ensureFrame(key);
    if (!f) return;
    activeKey = key;
    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('active', k === key);
    });
    // Only the foreground module is allowed to auto-refresh the shared auth
    // token, so multiple open modules never race each other on refresh.
    Object.keys(frames).forEach(function (k) {
      frames[k].contentWindow && frames[k].contentWindow.postMessage(
        { oht: 'active', active: k === key }, '*'
      );
    });
  }

  // Deep-link into a module: open/switch to it, then hand it the argument as
  // an oht:'goto' message. If its iframe is being created right now, the goto
  // is held until the document has loaded (see ensureFrame's load handler).
  // Also the single path that keeps the sidebar's highlighted leaf/expanded
  // group and the header title in sync — called both by sidebar clicks and
  // by a module's own { oht:'open', ... } deep-link (e.g. Masters' report
  // links), so either origin ends up in the same, consistent state.
  function openModule(app, arg) {
    var m = MODULES.filter(function (x) { return x.key === app; })[0];
    if (!m) return;
    var existed = !!frames[app];
    activate(app);
    updateSidebarActive(app, arg || null);
    var label = navLabelFor(app, arg || null);
    document.getElementById('shellTitle').textContent = label;
    document.getElementById('appbarTitle').textContent = label;
    try { if (currentUserId) localStorage.setItem('oht:lastNav:' + currentUserId, JSON.stringify({ app: app, arg: arg || null })); } catch (e) {}
    if (arg === undefined || arg === null) return;
    var msg = { oht: 'goto', app: app, arg: arg };
    if (existed && frameReady[app]) {
      frames[app].contentWindow && frames[app].contentWindow.postMessage(msg, '*');
    } else {
      pendingGoto[app] = msg;
    }
  }

  // Cross-module postMessage relay (§3/§14): refresh broadcasts and deep-links
  // pass through the shell to every other open module.
  //   { oht:'open', app:'<moduleKey>', arg:<any> }  -> shell opens/switches to
  //     that module and delivers { oht:'goto', app, arg } into its frame.
  //   { oht:'goto' | 'refresh', ... }               -> broadcast to siblings.
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'open') { openModule(d.app, d.arg); return; }
    if (d.oht === 'installPrompt') { installBtn.click(); return; }
    if (d.oht === 'signOut') { document.getElementById('signOutBtn').click(); return; }
    if (d.oht === 'refresh' || d.oht === 'goto') {
      Object.keys(frames).forEach(function (k) {
        if (frames[k].contentWindow !== ev.source) {
          frames[k].contentWindow.postMessage(d, '*');
        }
      });
    }
  });

  function showAuth(err) {
    loadingEl.style.display = 'none';
    appShellEl.classList.remove('on');
    authEl.style.display = 'flex';
    document.getElementById('authErr').textContent = err || '';
  }

  // §33: lastNav is scoped per signed-in account (currentUserId) — two
  // different admin accounts used on the same device/browser must not
  // silently inherit each other's last-open screen.
  var currentUserId = null;
  var currentUserEmail = null;

  function showApp() {
    authEl.style.display = 'none';
    loadingEl.style.display = 'none';
    appShellEl.classList.add('on');
    buildSidebar();
    var last = { app: 'masters', arg: 'parties' };
    try {
      var saved = JSON.parse(localStorage.getItem('oht:lastNav:' + currentUserId) || 'null');
      if (saved && saved.app) last = saved;
    } catch (e) {}
    openModule(last.app, last.arg);
  }

  async function checkProfileAndEnter() {
    var { data: userData } = await sb.auth.getUser();
    var user = userData && userData.user;
    if (!user) { showAuth(); return; }
    var { data: profile, error } = await sb
      .from('app_users')
      .select('id, username, is_active, is_admin')
      .eq('id', user.id)
      .maybeSingle();
    if (error) { showAuth('Could not load your profile: ' + error.message); return; }
    if (!profile) {
      await sb.auth.signOut();
      showAuth('Your account is not set up yet — contact your admin.');
      return;
    }
    if (!profile.is_active) {
      await sb.auth.signOut();
      showAuth('Your access has been disabled — contact your admin.');
      return;
    }
    currentUserId = user.id;
    currentUserEmail = user.email;
    showApp();
  }

  document.getElementById('authBtn').addEventListener('click', async function () {
    var email = document.getElementById('authEmail').value.trim();
    var pass = document.getElementById('authPass').value;
    var errEl = document.getElementById('authErr');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Enter email and password.'; return; }
    var { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error) { errEl.textContent = error.message; return; }
    checkProfileAndEnter();
  });

  document.getElementById('signOutBtn').addEventListener('click', async function () {
    var ok = await confirmDialog(
      'Sign out of OHT Accounting System?',
      'Every open module closes and you are returned to the sign-in screen. Anything still waiting to sync stays queued in this browser and syncs the next time you sign in on this device.',
      'Sign out', true
    );
    if (!ok) return;
    await sb.auth.signOut();
    Object.keys(frames).forEach(function (k) { frames[k].remove(); });
    frames = {};
    frameReady = {};
    pendingGoto = {};
    activeKey = null;
    currentUserId = null;
    currentUserEmail = null;
    showAuth();
  });

  updateNetStatus();
  if (!navigator.onLine) {
    toast('You are offline. Changes are saved in this browser and will sync later.', true);
  }
  checkProfileAndEnter();

  // §26: sw.js already calls skipWaiting()/clients.claim() unconditionally,
  // so a new version activates itself in the background the moment it is
  // installed — the only piece missing was ever telling the user, since
  // this page's already-loaded JS/HTML keeps running the OLD version until
  // an actual reload happens. A fresh install (no prior controller) is not
  // an update and must not prompt.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        if (!reg) return;
        // A worker could already be sitting in "waiting" from before this
        // page load (e.g. it finished installing in a background tab).
        if (reg.waiting && navigator.serviceWorker.controller) promptForUpdate();
        reg.addEventListener('updatefound', function () {
          var installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', function () {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              promptForUpdate();
            }
          });
        });
      }).catch(function () {});
    });
  }
  var updatePromptShown = false;
  function promptForUpdate() {
    if (updatePromptShown) return;
    updatePromptShown = true;
    confirmDialog(
      'New version available',
      'An updated version of OHT Accounting System is ready. Refresh to start using it — anything still syncing in the background is not affected.',
      'Refresh', false
    ).then(function (ok) {
      updatePromptShown = false;
      if (ok) window.location.reload();
    });
  }

  // ---------------------------------------------------------------
  // PWA install button — always visible until installed, whether or not
  // the browser offers its own native prompt: Chrome/Edge get the native
  // install popup via 'beforeinstallprompt'; Safari/Firefox/anything else
  // gets manual steps instead, so the button works everywhere.
  // ---------------------------------------------------------------
  var deferredInstallPrompt = null;
  var installBtn = document.getElementById('installBtn');
  function alreadyInstalled() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua);
  var isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
  var isFirefox = /firefox|fxios/i.test(ua);

  if (!alreadyInstalled()) {
    installBtn.style.display = '';
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredInstallPrompt = e;
    });
  }
  window.addEventListener('appinstalled', function () { installBtn.style.display = 'none'; });

  installBtn.addEventListener('click', function () {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function () {
        deferredInstallPrompt = null;
        installBtn.style.display = 'none';
      });
      return;
    }
    var steps;
    if (isIOS && isSafari) {
      steps = 'Tap the <b>Share</b> button (⬆️) below, then choose <b>"Add to Home Screen"</b>.';
    } else if (isSafari) {
      steps = 'From Safari’s <b>File</b> menu, choose <b>"Add to Dock"</b> (or "Add to Home Screen").';
    } else if (isFirefox) {
      steps = 'Firefox does not support the install button yet. Copy this page’s link and open it in Chrome/Edge to install.';
    } else {
      steps = 'Open the browser’s <b>3-dot menu</b> (⋮) and choose <b>"Install app"</b> or <b>"Add to Home screen"</b>.';
    }
    document.getElementById('installStepsBody').innerHTML = steps;
    document.getElementById('installStepsModal').classList.add('on');
  });
  document.getElementById('installStepsClose').addEventListener('click', function () {
    document.getElementById('installStepsModal').classList.remove('on');
  });
})();
</script>
</body>
</html>
