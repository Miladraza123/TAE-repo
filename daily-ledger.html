        headerOriginal: mergeOriginal, headerNew: header,
        lineTable: 'sheet_rows', lineFkCol: 'sheet_id',
        lineOriginal: origLines, lineNew: myLines
      });
      afterSaveSuccess(header, state.sheet.rows);
      setSaveStatus('Offline — will sync', 'warn');
      noteStatus('No internet — saved locally and will sync when back online.');
      state.dirty = false;
    }

    if (!navigator.onLine) { queueSheetEdit(); return; }
    setSaveStatus('Saving…', '');

    // 1. Header (opening / side / firm / page). rows and cash_opening are
    //    no longer columns on sheets, so they are simply not in the payload.
    var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
      p_table: 'sheets', p_id: headerId, p_original: mergeOriginal, p_new: header
    });
    if (mergeErr) {
      if (OfflineQueue.isNetworkError(mergeErr)) { queueSheetEdit(); return; }
      setSaveStatus('', '');
      noteStatus(mergeErr.message);
      return;
    }
    if (mergeRes.status === 'deleted') {
      showConflict('Is din ki sheet kisi aur ne delete kar di. Aap ki entries yahin mehfooz hain — ' +
        'reload karke dekhein ke ab sheet kya hai.');
      return;
    }
    if (mergeRes.status === 'conflict') {
      // NOT auto-retried: retrying with the current row as the new
      // "original" but the SAME unchanged payload would make the merge see
      // "nobody changed it since [now]" and silently overwrite whatever
      // the other person just saved — the opposite of what this whole
      // feature is for. Surface it instead (§14/§27).
      showConflict('Kisi aur ne isi waqt is din ki sheet mein "' + mergeRes.conflicts.join(', ') +
        '" badal diya — reload karke dobara try karein.');
      return;
    }

    // 2. Rows. Different rows touched by two people merge silently; only
    //    the SAME row changed two different ways comes back as a conflict.
    var { data: lineRes, error: lineErr } = await sb.rpc('smart_merge_lines', {
      p_line_table: 'sheet_rows', p_fk_col: 'sheet_id', p_fk_id: headerId,
      p_original_lines: origLines, p_new_lines: myLines,
      p_ignore: ['id', 'created_at', 'sheet_id', 'line_no']
    });
    if (lineErr) {
      if (OfflineQueue.isNetworkError(lineErr)) { queueSheetEdit(); return; }
      setSaveStatus('', '');
      noteStatus(lineErr.message);
      return;
    }

    var finalRows, resolved = false;
    if (lineRes.status === 'ok') {
      finalRows = lineRes.lines || [];
    } else {
      resolved = true;
      // Partial result (migration 0026): everything that merged cleanly is
      // already done and is reused as-is — the user is only ever asked
      // about the row(s) that genuinely clash.
      var current = lineRes.current || [];
      var ids = conflictRowIds(lineRes.conflicts, myLines, current);
      if (!ids.length) {
        showConflict('Kisi aur ne isi waqt yehi lines badlin — reload karke dobara try karein.');
        return;
      }
      setSaveStatus('Not saved', 'warn');
      // Auto-save stays paused for as long as the modal is up, and the
      // rows on screen are not touched until the user has decided (§5/§7).
      state.autosavePaused = true;
      if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
      var decisions = await resolveRowConflicts(ids, myLines, current);
      if (!decisions) {
        showConflict('Ye save abhi rok diya gaya kyunke kuch lines par faisla nahi hua. Aap ki entries yahin mehfooz hain — ' +
          'dobara "Save day" dabakar faisla karein, ya reload karke taaza sheet lein.');
        return;
      }
      setSaveStatus('Saving…', '');
      finalRows = buildFinalRows(myLines, lineRes.merged_lines || [], current, decisions);
    }

    // 3. Persist the decided set. Conflict-free by construction: either
    //    smart_merge_lines said so, or this IS the user's final decision.
    var { data: applied, error: applyErr } = await sb.rpc('apply_merged_lines', {
      p_line_table: 'sheet_rows', p_fk_col: 'sheet_id', p_fk_id: headerId,
      p_result_lines: finalRows.map(sanitizeForApply)
    });
    if (applyErr) {
      setSaveStatus('', '');
      noteStatus(applyErr.message);
      return;
    }

    if (resolved) {
      // The resolution modal held the keyboard for the whole round trip, so
      // nothing can have been typed into the register meanwhile — take the
      // server's set wholesale, which is also what makes "Keep theirs" show
      // up on screen instead of leaving a phantom unsaved change.
      afterSaveSuccess(mergeRes.current, (applied || []).slice().sort(byLineNo).map(normRow));
      state.dirty = false;
    } else {
      commitRows(submittedObjs, myLines, finalRows, applied);
      finishSave(mergeRes.current);
      settleDirty(seq);
    }
    setSaveStatus('Saved', 'ok');
  }

  // smart_merge_lines reports conflicts as "<line table>.item_id or the row
  // id" — sheet_rows has no item_id, so these are always row ids. Keep only
  // the ones we can actually show both sides of.
  function conflictRowIds(conflicts, myLines, current) {
    var mine = {}, theirs = {};
    myLines.forEach(function (l) { if (l.id) mine[l.id] = l; });
    (current || []).forEach(function (l) { if (l && l.id) theirs[l.id] = l; });
    return (conflicts || []).filter(function (id) { return mine[id] && theirs[id]; });
  }

  // Build the exact row set to persist, in the order it is on screen:
  // my rows first (each either as merged, or as the user just decided),
  // then any row somebody else added concurrently.
  function buildFinalRows(myLines, mergedLines, currentLines, decisions) {
    var mergedById = {}, mergedNew = [], currentById = {}, mine = {};
    mergedLines.forEach(function (l) {
      if (l && l.id) mergedById[l.id] = l; else if (l) mergedNew.push(l);
    });
    (currentLines || []).forEach(function (l) { if (l && l.id) currentById[l.id] = l; });

    var out = [], newPtr = 0;
    myLines.forEach(function (my) {
      if (!my.id) { out.push(mergedNew[newPtr] || my); newPtr++; return; }
      mine[my.id] = true;
      var dec = decisions[my.id];
      if (dec) {
        var their = currentById[my.id];
        if (dec === 'mine') { out.push(my); return; }
        if (dec === 'theirs') { if (their) out.push(their); return; }
        // "Keep both": my row stays at its id (updated in place) and their
        // version comes back as a brand-new row — id stripped so
        // apply_merged_lines inserts it rather than overwriting mine.
        out.push(my);
        if (their) { var clone = sanitizeForApply(their); delete clone.id; out.push(clone); }
        return;
      }
      if (mergedById[my.id]) out.push(mergedById[my.id]);
      // else: deleted by someone else while we typed — smart_merge_lines
      // already dropped it, and so do we.
    });

    // Rows added concurrently by someone else survive untouched.
    mergedLines.forEach(function (l) { if (l && l.id && !mine[l.id]) out.push(l); });
    return out;
  }

  function describeRowVersion(r) {
    var parts = [];
    var d = Number(r.d_amt) || 0, c = Number(r.c_amt) || 0;
    if (d || r.d_rem) parts.push('Debit ' + (d ? fmtNum(d) : '—') + (r.d_rem ? ' · ' + r.d_rem : '') + (r.d_tick ? ' · cash' : ''));
    if (c || r.c_rem) parts.push('Credit ' + (c ? fmtNum(c) : '—') + (r.c_rem ? ' · ' + r.c_rem : '') + (r.c_tick ? ' · cash' : ''));
    return parts.length ? parts.join('\n') : '(blank line)';
  }

  // Per-row resolution modal (§7). Built from the same scrim/card
  // primitives confirmDialog() uses. Resolves to a {rowId: 'both'|'mine'|
  // 'theirs'} map, or null if the user backed out (nothing is saved then,
  // and nothing on screen is touched).
  function resolveRowConflicts(ids, myLines, currentLines) {
    return new Promise(function (resolve) {
      var mine = {}, theirs = {}, lineNo = {};
      myLines.forEach(function (l, i) { if (l.id) { mine[l.id] = l; lineNo[l.id] = i + 1; } });
      (currentLines || []).forEach(function (l) { if (l && l.id) theirs[l.id] = l; });

      var decisions = {};
      ids.forEach(function (id) { decisions[id] = 'both'; }); // recommended default

      var scrim = document.createElement('div');
      scrim.className = 'confirm-scrim on';
      var card = document.createElement('div');
      card.className = 'confirm-card conf-card';

      var h = document.createElement('h4');
      h.textContent = ids.length === 1 ? 'Someone else changed the same line' : 'Someone else changed the same lines';
      var p = document.createElement('p');
      p.textContent = 'Nothing has been saved yet, and nothing on your page has been changed. ' +
        'Everything else you both typed has already merged cleanly — only ' +
        (ids.length === 1 ? 'this line was' : 'these ' + ids.length + ' lines were') +
        ' edited by both of you. Choose what to keep.';

      var list = document.createElement('div');
      list.className = 'conf-list';

      ids.forEach(function (id) {
        var item = document.createElement('div');
        item.className = 'conf-item';

        var ttl = document.createElement('div');
        ttl.className = 'conf-ttl';
        ttl.textContent = 'Line ' + (lineNo[id] || '?');
        item.appendChild(ttl);

        var vers = document.createElement('div');
        vers.className = 'conf-vers';
        [['mine', 'Yours (on this screen)', mine[id]], ['theirs', 'Theirs (already saved)', theirs[id]]].forEach(function (v) {
          var box = document.createElement('div');
          box.className = 'conf-ver ' + v[0];
          var tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = v[1];
          var txt = document.createElement('div');
          txt.className = 'txt';
          txt.style.whiteSpace = 'pre-line';
          txt.textContent = describeRowVersion(v[2] || {});
          box.appendChild(tag); box.appendChild(txt);
          vers.appendChild(box);
        });
        item.appendChild(vers);

        var btns = document.createElement('div');
        btns.className = 'conf-btns';
        [['both', 'Keep both'], ['mine', 'Keep mine'], ['theirs', 'Keep theirs']].forEach(function (b) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn' + (b[0] === 'both' ? ' pri on' : '');
          btn.textContent = b[1];
          btn.addEventListener('click', function () {
            decisions[id] = b[0];
            Array.prototype.forEach.call(btns.children, function (x) { x.classList.remove('on'); });
            btn.classList.add('on');
          });
          btns.appendChild(btn);
        });
        item.appendChild(btns);
        list.appendChild(item);
      });

      var acts = document.createElement('div');
      acts.className = 'acts';
      var cancel = document.createElement('button');
      cancel.type = 'button'; cancel.className = 'btn'; cancel.textContent = 'Not now';
      var ok = document.createElement('button');
      ok.type = 'button'; ok.className = 'btn pri'; ok.textContent = 'Save with these choices';
      acts.appendChild(cancel); acts.appendChild(ok);

      card.appendChild(h); card.appendChild(p); card.appendChild(list); card.appendChild(acts);
      scrim.appendChild(card);
      document.body.appendChild(scrim);

      function done(v) {
        document.removeEventListener('keydown', onKey);
        scrim.remove();
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); done(null); } }
      cancel.addEventListener('click', function () { done(null); });
      ok.addEventListener('click', function () { done(decisions); });
      scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) done(null); });
      document.addEventListener('keydown', onKey);
      ok.focus();
    });
  }

  async function gotoDate(d) {
    if (state.dirty) {
      var ok = await confirmDialog(
        'Unsaved changes',
        'This day\'s sheet has entries that have not been saved yet. Switching to another day discards them — ' +
        'they are not kept anywhere and cannot be recovered.',
        'Discard and switch', true
      );
      if (!ok) return;
    }
    state.date = d;
    state.dirty = false;
    await loadSheet(d);
    renderSheetsList();
    loadStripDates();
  }

  // The one explicit, user-initiated way to replace what is on screen with
  // the server's copy (§5) — offered only while a conflict is standing.
  async function reloadFromServer() {
    var ok = await confirmDialog(
      'Reload this day?',
      'The latest saved version of ' + longDate(state.date) + ' will be loaded from the server. ' +
      'Anything you have typed on this page that has not been saved will be REPLACED by it and cannot be recovered. ' +
      'Copy down anything you still need before continuing.',
      'Reload and replace', true
    );
    if (!ok) return;
    state.dirty = false;
    clearStatusLine();
    setSaveStatus('', '');
    await loadSheet(state.date);
    renderSheetsList();
    loadRecentSheets();
  }

  // ---------------------------------------------------------------
  // Recent sheets list (drawer) — last 20 saved days with their closing
  // balance, computed with the same computeClosing() the page itself uses.
  // ---------------------------------------------------------------
  var recentSheets = [];
  // sheet_date -> true for every saved day the hero's day strip may show.
  var stripDates = {};

  async function loadRecentSheets() {
    if (!navigator.onLine) { renderSheetsList(); renderDayStrip(); return; }
    var { data, error } = await sb.from('sheets')
      .select('id,sheet_date,opening,side')
      .is('deleted_at', null)
      .order('sheet_date', { ascending: false })
      .limit(20);
    if (error) { renderSheetsList(); return; }
    var sheets = data || [];
    loadStripDates();
    // The closing balance each row shows is computed with the very same
    // computeClosing() the page uses — which now needs the child rows.
    var ids = sheets.map(function (s) { return s.id; });
    var byId = {};
    sheets.forEach(function (s) { s.rows = []; byId[s.id] = s; });
    if (ids.length) {
      var lr = await sb.from('sheet_rows').select('sheet_id,d_amt,c_amt').in('sheet_id', ids);
      (lr.data || []).forEach(function (r) { if (byId[r.sheet_id]) byId[r.sheet_id].rows.push(normRow(r)); });
    }
    recentSheets = sheets;
    renderSheetsList();
  }

  // Which of the seven days on the strip have a saved sheet. One light
  // query (dates only) over the window the strip shows for the current day.
  async function loadStripDates() {
    if (!navigator.onLine) return;
    var to = state.date;
    var from = new Date(to + 'T00:00:00'); from.setDate(from.getDate() - 6);
    from = from.getFullYear() + '-' + String(from.getMonth() + 1).padStart(2, '0') + '-' + String(from.getDate()).padStart(2, '0');
    var res = await sb.from('sheets').select('sheet_date')
      .gte('sheet_date', from).lte('sheet_date', to).is('deleted_at', null);
    if (res.error) return;
    stripDates = {};
    (res.data || []).forEach(function (r) { stripDates[r.sheet_date] = true; });
    if (to === state.date) renderDayStrip();
  }

  function renderSheetsList() {
    var el = document.getElementById('sheetsList');
    if (!recentSheets.length) {
      el.innerHTML = '<div class="sheets-empty">' +
        (navigator.onLine ? 'No saved sheets yet.' : 'Offline — recent sheets will appear once you are back online.') +
        '</div>';
      return;
    }
    var seenCurrent = false;
    var html = recentSheets.map(function (s) {
      var on = s.sheet_date === state.date;
      if (on) seenCurrent = true;
      return '<button type="button" class="sheetrow' + (on ? ' on' : '') + '" data-date="' + esc(s.sheet_date) + '">' +
        '<span class="d">' + esc(shortDate(s.sheet_date)) + '</span>' +
        '<span class="count">' + fmtBal(computeClosing(s)) + '</span>' +
        '</button>';
    }).join('');
    if (!seenCurrent) {
      html = '<button type="button" class="sheetrow on" data-date="' + esc(state.date) + '">' +
        '<span class="d">' + esc(shortDate(state.date)) + '</span>' +
        '<span class="count">unsaved</span></button>' + html;
    }
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.sheetrow'), function (b) {
      b.addEventListener('click', function () {
        closeDrawer();
        if (b.dataset.date === state.date) return;
        gotoDate(b.dataset.date);
      });
    });
  }

  // ---------------------------------------------------------------
  // Soft-delete this day's sheet (§13/§22). Permission (ledger_delete) and
  // period-lock rules live in the database triggers — exactly as in
  // saveSheet(), whatever the server refuses is surfaced verbatim rather
  // than guessed at in the client.
  // ---------------------------------------------------------------
  async function deleteSheet() {
    closeDrawer();
    var errEl = document.getElementById('ledgerErr');
    errEl.textContent = '';
    if (!state.sheet || !state.sheet.id) {
      toast('This day has never been saved, so there is no sheet to delete.', true);
      return;
    }
    if (!navigator.onLine) {
      toast('You are offline. Deleting a sheet needs an internet connection — try again once you are back online.', true);
      return;
    }
    var lines = (state.sheet.rows || []).filter(function (r) {
      return (Number(r.d_amt) || 0) || (Number(r.c_amt) || 0) || r.d_rem || r.c_rem;
    }).length;
    var ok = await confirmDialog(
      'Delete this sheet?',
      'The cash book for ' + longDate(state.date) + ' (' + lines + ' entr' + (lines === 1 ? 'y' : 'ies') +
      ', closing ' + fmtBal(computeClosing(state.sheet)) + ') will be moved to the Recycle Bin. It stops showing in the ledger and in reports straight away. Nothing is erased permanently — an admin can restore it from Masters → Recycle Bin.',
      'Delete sheet', true
    );
    if (!ok) return;

    var { error } = await sb.from('sheets')
      .update({ deleted_at: new Date().toISOString() })
      .eq('id', state.sheet.id);
    if (error) {
      errEl.textContent = error.message;
      toast(error.message, true);
      return;
    }
    try { localStorage.removeItem(LOCAL_KEY_PREFIX + state.date); } catch (e) {}
    state.dirty = false;
    state.sheet = null;
    state.originalSheet = null;
    state.originalRows = [];
    toast('Sheet for ' + longDate(state.date) + ' moved to the Recycle Bin.');
    window.parent.postMessage({ oht: 'refresh', kind: 'sheets' }, '*');
    await loadSheet(state.date);
    loadRecentSheets();
  }

  // New sheet: go to today if we are looking at another day, otherwise
  // clear today's lines back to a blank register.
  async function newSheet() {
    closeDrawer();
    if (state.date !== todayStr()) { gotoDate(todayStr()); return; }
    var ok = await confirmDialog(
      'Clear today\'s sheet?',
      'Every line on today\'s page is cleared back to one blank row. The opening balance stays as it is. Anything already saved on the server stays there until you press "Save day" again.',
      'Clear sheet', true
    );
    if (!ok) return;
    state.sheet.rows = [emptyRow()];
    markDirty();
    render();
    toast('Sheet cleared — press "Save day" to keep it.');
  }

  // ---------------------------------------------------------------
  // Print (§9/§25) — A4 letterhead + register + footer totals, same
  // "Powered by" footer convention as billing.html / reports.html.
  // ---------------------------------------------------------------
  // Letterhead details for the firm named on the sheet (logo, city, phone,
  // NTN) — looked up once per firm name when printing; falls back to the
  // default firm, and to the bare name when offline.
  var firmCache = {};
  async function firmForPrint(name) {
    var key = (name || '').trim().toLowerCase() || '_default';
    if (firmCache[key]) return firmCache[key];
    var rows = [];
    if (navigator.onLine) {
      try {
        var res = await sb.from('companies').select('name,city,phone,ntn,logo,signature,stamp,is_default').is('deleted_at', null).order('is_default', { ascending: false });
        rows = (res && res.data) || [];
      } catch (e) { rows = []; }
    }
    var row = rows.filter(function (c) { return (c.name || '').trim().toLowerCase() === key; })[0] ||
      (name ? { name: name } : (rows[0] || { name: 'OHT Accounting System' }));
    firmCache[key] = row;
    return row;
  }
  function firmMarkHtml(f) {
    if (f && f.logo) return '<img src="' + esc(f.logo) + '" alt="">';
    return esc(((f && f.name) || 'O').trim().charAt(0).toUpperCase() || 'O');
  }
  function firmAddrText(f) {
    return f ? [f.city, f.phone, f.ntn ? 'NTN ' + f.ntn : ''].filter(Boolean).join(' \u00B7 ') : '';
  }
  function printStamp() {
    var d = new Date();
    return d.toISOString().slice(0, 10) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // Same signature-line row and print-options dialog as billing.html /
  // reports.html (§25) — the firm's real uploaded signature/stamp only
  // ever appear on the one line the user chooses, asked once per print.
  function pdSigHtml(labels, sigIndex, sigImg, stampImg) {
    return '<div class="pd-sig">' + labels.map(function (s, i) {
      var extra = '';
      if (i === sigIndex && (sigImg || stampImg)) {
        extra = '<span class="sig-wrap">' +
          (sigImg ? '<img class="sig-img" src="' + esc(sigImg) + '">' : '') +
          (stampImg ? '<img class="stamp-img" src="' + esc(stampImg) + '">' : '') +
          '</span>';
      }
      return '<div>' + extra + esc(s) + '</div>';
    }).join('') + '</div>';
  }
  function askPrintOptions(company, sigLabels) {
    var hasSig = !!(company && company.signature);
    var hasStamp = !!(company && company.stamp);
    if (!hasSig && !hasStamp) return Promise.resolve({ sigIndex: -1, stampOn: false });
    return new Promise(function (resolve) {
      var scrim = document.getElementById('printOptScrim');
      var defaultIdx = sigLabels.length - 1;
      var radios = hasSig ? '<div class="po-lbl">Place the signature on</div><div class="po-opt">' +
        sigLabels.map(function (s, i) {
          return '<label class="po-radio"><input type="radio" name="poSig" value="' + i + '"' + (i === defaultIdx ? ' checked' : '') + '> ' + esc(s) + '</label>';
        }).join('') +
        '<label class="po-radio"><input type="radio" name="poSig" value="-1"> None</label></div>' : '';
      var stampRow = hasStamp ? '<label class="po-check"><input type="checkbox" id="poStamp" checked> Include company stamp</label>' : '';
      scrim.innerHTML =
        '<div class="confirm-card po-card" role="dialog" aria-modal="true">' +
          '<h4>Print options</h4>' + radios + stampRow +
          '<div class="acts">' +
            '<button type="button" class="btn" data-a="0">Cancel</button>' +
            '<button type="button" class="btn pri" data-a="1">Print</button>' +
          '</div>' +
        '</div>';
      scrim.classList.add('on');
      var done = false;
      function finish(result) {
        if (done) return;
        done = true;
        scrim.classList.remove('on'); scrim.innerHTML = '';
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onKey(ev) { if (ev.key === 'Escape') finish(null); }
      scrim.querySelector('[data-a="0"]').addEventListener('click', function () { finish(null); });
      scrim.querySelector('[data-a="1"]').addEventListener('click', function () {
        var sel = scrim.querySelector('input[name="poSig"]:checked');
        finish({
          sigIndex: hasSig && sel ? Number(sel.value) : -1,
          stampOn: hasStamp && !!scrim.querySelector('#poStamp').checked
        });
      });
      scrim.addEventListener('click', function (ev) { if (ev.target === scrim) finish(null); });
      document.addEventListener('keydown', onKey);
    });
  }

  // Print (§9/§25) — classic A4 document (theme.css §17 .pd-*): letterhead
  // with logo + meta box, summary cells, the numbered register, signatures
  // and the "Powered by" footer. Same figures as the screen, nothing more.
  async function printSheet() {
    closeDrawer();
    var s = state.sheet;
    if (!s) return;
    var firmRow = await firmForPrint(s.firm);
    var sigLabels = ['Prepared by', 'Checked by', 'Approved by'];
    var po = await askPrintOptions(firmRow, sigLabels);
    if (!po) return;
    var running = s.side === 'dr' ? s.opening : -s.opening;
    var opening = running;
    var totD = 0, totC = 0, body = '', n = 0;
    (s.rows || []).forEach(function (r) {
      var d = Number(r.d_amt) || 0, c = Number(r.c_amt) || 0;
      if (!d && !c && !r.d_rem && !r.c_rem) return; // blank filler rows don't belong on paper
      totD += d; totC += c; running += d - c; n++;
      body += '<tr>' +
        '<td class="idx mono">' + n + '</td>' +
        '<td class="num">' + (d ? fmtNum(d) : '') + '</td>' +
        '<td>' + esc(r.d_rem) + (r.d_party ? ' <span class="pill n">' + esc(partyName(r.d_party)) + '</span>' : '') + '</td>' +
        '<td class="tick">' + (r.d_tick ? '&#10003;' : '') + '</td>' +
        '<td class="num split">' + (c ? fmtNum(c) : '') + '</td>' +
        '<td>' + esc(r.c_rem) + (r.c_party ? ' <span class="pill n">' + esc(partyName(r.c_party)) + '</span>' : '') + '</td>' +
        '<td class="tick">' + (r.c_tick ? '&#10003;' : '') + '</td>' +
        '<td class="num bal">' + fmtBal(running) + '</td></tr>';
    });
    var pcash = computeCash(s);
    var subLine = 'Receipts and payments of ' + longDate(state.date);

    var html = '<div class="pd">' +
      '<div class="pd-lh">' +
        '<div class="mk">' + firmMarkHtml(firmRow) + '</div>' +
        '<div><div class="fn">' + esc(firmRow.name || 'OHT Accounting System') + '</div>' +
          '<div class="fa">' + esc(firmAddrText(firmRow)) + '</div><div class="tag">Daily cash book</div></div>' +
        '<div class="pd-meta">' +
          '<div><b>Date</b><span class="mono">' + esc(longDate(state.date)) + '</span></div>' +
          '<div><b>Page</b><span class="mono">' + esc(s.page || '\u2014') + '</span></div>' +
          '<div><b>Entries</b><span class="mono">' + n + '</span></div>' +
          '<div><b>Printed</b><span class="mono">' + esc(printStamp()) + '</span></div>' +
        '</div>' +
      '</div><div class="pd-rule"></div><div class="pd-rule2"></div>' +
      '<div class="pd-ttl"><h1>Daily Cash Book</h1><span class="sub">' + esc(subLine) + '</span><span class="basis">Amounts in PKR</span></div>' +
      '<div class="pd-sum">' +
        '<div class="c wn"><div class="k">Opening b/f</div><div class="v">' + fmtBal(opening) + '</div><div class="n">from ' + esc(longDate(prevDateStr(state.date))) + ': ' + fmtBal(state.prevClosing) + '</div></div>' +
        '<div class="c cr"><div class="k">Received</div><div class="v">' + fmtNum(totD) + '</div><div class="n">total debit side</div></div>' +
        '<div class="c dr"><div class="k">Paid</div><div class="v">' + fmtNum(totC) + '</div><div class="n">total credit side</div></div>' +
        '<div class="c wn"><div class="k">Closing c/f</div><div class="v">' + fmtBal(running) + '</div><div class="n">carried forward</div></div>' +
        '<div class="c cash"><div class="k">Cash in hand</div><div class="v">' + fmtNum(pcash.inHand) + '</div><div class="n">this day only \u00B7 in ' + fmtNum(pcash.received) + ' / out ' + fmtNum(pcash.paid) + '</div></div>' +
      '</div>' +
      '<table class="reg-p"><thead><tr>' +
        '<th class="idx">#</th><th class="num dr">Received</th><th class="dr">Particulars</th><th class="dr">Cash</th>' +
        '<th class="num cr split">Paid</th><th class="cr">Particulars</th><th class="cr">Cash</th><th class="num">Balance</th></tr></thead>' +
      '<tbody>' +
        '<tr class="note"><td></td><td colspan="6">Opening balance (' + esc(String(s.side).toUpperCase()) + ')</td><td class="num">' + fmtBal(opening) + '</td></tr>' +
        (body || '<tr><td></td><td colspan="7" style="color:#6B6357">No entries on this day</td></tr>') +
      '</tbody>' +
      '<tfoot>' +
        '<tr><td></td><td class="num">' + fmtNum(totD) + '</td><td colspan="2">Total received</td><td class="num split">' + fmtNum(totC) + '</td><td colspan="2">Total paid</td><td class="num">' + fmtNum(totD - totC) + '</td></tr>' +
        '<tr><td></td><td colspan="6">Closing balance carried forward</td><td class="num">' + fmtBal(running) + '</td></tr>' +
      '</tfoot></table>' +
      '<div class="pd-spacer"></div>' +
      '<div class="pd-foot">' + pdSigHtml(sigLabels, po.sigIndex, firmRow.signature, po.stampOn ? firmRow.stamp : null) +
        '<div class="pd-fl"><span>Powered by "OHT Solutions"</span><span>Daily Cash Book \u00B7 ' + esc(longDate(state.date)) + '</span></div></div>' +
      '</div>';

    document.getElementById('printArea').innerHTML = html;
    document.body.classList.add('pd-on');
    var oldTitle = document.title;
    document.title = 'Cash Book ' + state.date + '.pdf';
    try { window.top.document.title = document.title; } catch (e) {}
    window.addEventListener('afterprint', function restore() {
      document.title = oldTitle;
      try { window.top.document.title = oldTitle; } catch (e) {}
      document.body.classList.remove('pd-on');
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  }

  // ---------------------------------------------------------------
  // Zoom / fit (§13). A CSS transform does not change layout size, so the
  // .scaler wrapper ALSO gets explicit pixel dimensions (page size x zoom)
  // after every change — that pair is what keeps the desk's scrollbars
  // sized to what is actually painted.
  // ---------------------------------------------------------------
  // The register is a fluid card now (not a fixed-size paper replica), so
  // zoom scales the register's text and row height via the --z custom
  // property instead of transforming a page. Remembered per device.
  var zoom = 1;
  try { zoom = Math.min(1.6, Math.max(0.7, Number(localStorage.getItem('oht:ledgerZoom')) || 1)); } catch (e) {}

  function applyZoom() {
    var area = document.getElementById('ledgerArea');
    if (area) area.style.setProperty('--z', zoom);
    put('zoomPct', Math.round(zoom * 100) + '%');
    var fit = document.getElementById('fitBtn');
    if (fit) fit.classList.toggle('on', zoom === 1);
    try { localStorage.setItem('oht:ledgerZoom', String(zoom)); } catch (e) {}
  }

  function setZoom(z) {
    zoom = Math.min(1.6, Math.max(0.7, Math.round(z * 10) / 10));
    applyZoom();
  }

  function fitZoom() { zoom = 1; applyZoom(); }

  // The zoom controls live in the register card's header, which render()
  // rebuilds — so they are (re)wired from there.
  function wireZoom() {
    var zi = document.getElementById('zoomIn'), zo = document.getElementById('zoomOut'), fit = document.getElementById('fitBtn');
    if (zi) zi.addEventListener('click', function () { setZoom(zoom + 0.1); });
    if (zo) zo.addEventListener('click', function () { setZoom(zoom - 0.1); });
    if (fit) fit.addEventListener('click', fitZoom);
    applyZoom();
  }

  // ---------------------------------------------------------------
  // Toolbar + drawer wiring
  // ---------------------------------------------------------------
  document.getElementById('dateInput').addEventListener('change', function () {
    var el = this;
    gotoDate(el.value).then(function () { el.value = state.date; });
  });
  document.getElementById('prevBtn').addEventListener('click', function () {
    var d = new Date(state.date); d.setDate(d.getDate() - 1); gotoDate(d.toISOString().slice(0, 10));
  });
  document.getElementById('nextBtn').addEventListener('click', function () {
    var d = new Date(state.date); d.setDate(d.getDate() + 1); gotoDate(d.toISOString().slice(0, 10));
  });
  document.getElementById('todayBtn').addEventListener('click', function () { gotoDate(todayStr()); });

  // Same handler the in-table "+ Add row" button used to carry, just
  // triggered from the drawer now.
  document.getElementById('addRowBtn').addEventListener('click', function () {
    addRow(true);
    closeDrawer();
  });

  // The manual fallback stays available at all times, including while
  // auto-save is paused on a standing conflict (§5) — pressing it then
  // simply re-runs the same save and re-shows the same conflict.
  document.getElementById('saveBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    saveSheet().then(function () {
      btn.disabled = false;
      if (!document.getElementById('ledgerErr').textContent) toast('Saved.');
      loadRecentSheets();
    }, function (e) {
      btn.disabled = false;
      setSaveStatus('', '');
      noteStatus((e && e.message) || String(e));
    });
  });

  document.getElementById('reloadBtn').addEventListener('click', reloadFromServer);

  document.getElementById('printBtn').addEventListener('click', printSheet);
  document.getElementById('deleteSheetBtn').addEventListener('click', deleteSheet);
  document.getElementById('newSheetBtn').addEventListener('click', newSheet);

  // ---------------------------------------------------------------
  // Cross-frame actions. Backup/Restore is Masters' feature and is NOT
  // reimplemented here — the shell is asked to switch to Masters already
  // showing its Backup / Restore view. Install and Sign out belong to the
  // TOP window (the install prompt is a browser API tied to it, and the
  // session is the shell's). See the handover note: index.html must
  // listen for these.
  // ---------------------------------------------------------------
  function openMastersBackup() {
    closeDrawer();
    window.parent.postMessage({ oht: 'open', app: 'masters', arg: 'backup' }, '*');
  }
  document.getElementById('backupBtn').addEventListener('click', openMastersBackup);
  document.getElementById('restoreBtn').addEventListener('click', openMastersBackup);

  document.getElementById('installBtn').addEventListener('click', function () {
    closeDrawer();
    try { window.top.postMessage({ oht: 'installPrompt' }, '*'); } catch (e) {}
  });
  document.getElementById('signOutBtn').addEventListener('click', async function () {
    var ok = await confirmDialog(
      'Sign out?',
      'You will be returned to the sign-in screen. Anything saved is safe; anything typed but not yet saved on this page is lost.',
      'Sign out', false
    );
    if (!ok) return;
    closeDrawer();
    try { window.top.postMessage({ oht: 'signOut' }, '*'); } catch (e) {}
  });

  (async function init() {
    updateNetStatus();
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('ledgerArea').innerHTML = '<p class="loading">Please sign in from the main app.</p>';
      return;
    }
    await Promise.all([loadParties(), loadCompanies()]);
    await loadSheet(state.date);
    loadRecentSheets();
    syncNow();
  })();
})();
</script>
</body>
</html>
