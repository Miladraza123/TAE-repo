<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Daily Ledger — OHT Accounting System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  // Hosted inside the shell's iframe (index.html) almost always — the shell's
  // sidebar already carries navigation, Tools and Account, so this module's
  // own sidebar/appbar (still there when the file is opened on its own)
  // would only duplicate it. Set before first paint to avoid a flash of it.
  if (window.self !== window.top) document.documentElement.className += ' embedded';
</script>
<style>
  /* ------------------------------------------------------------------
     Daily Cash Book v2 — page-specific styles only. The hero band, hero
     buttons/chips/fields and the content card come from theme.css (.pg-*);
     what is here is the day strip, the flow summary card and the register.
     ------------------------------------------------------------------ */
  html, body { height:100%; }
  body { overflow:hidden; }
  .embedded .sidebar, .embedded .appbar { display:none !important; }
  .main { min-height:0; }
  .dl-scroll { flex:1; min-height:0; overflow-y:auto; }
  .pg-hero.dl-hero { padding-bottom:44px; }
  .pg-hero.dl-hero > * { max-width:1100px; margin-left:auto; margin-right:auto; }
  .pg-body.dl-body { max-width:1148px; margin-left:auto; margin-right:auto; margin-top:-28px; }
  .pg-hero .pg-row { align-items:center; }
  .pg-hero .pg-acts .pg-hb { padding:6px 11px; font-size:12px; }

  /* ---------- day strip ---------- */
  .dl-days { display:flex; align-items:center; gap:6px; margin-top:14px; flex-wrap:wrap; }
  .dl-days .strip { display:flex; align-items:center; gap:6px; overflow-x:auto; max-width:100%; padding-bottom:2px; }
  .dl-days .d {
    width:46px; flex:none; padding:5px 0 6px; border-radius:9px; text-align:center;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#E8E2D5;
  }
  .dl-days .d:hover { background:rgba(255,255,255,.12); }
  .dl-days .d small { display:block; font-size:9.5px; letter-spacing:.4px; text-transform:uppercase; color:#B8AF9E; }
  .dl-days .d b { display:block; font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; margin-top:1px; }
  .dl-days .d i { display:block; width:5px; height:5px; border-radius:50%; margin:4px auto 0; border:1px solid rgba(255,255,255,.25); }
  .dl-days .d.has i { background:#A9C99A; border-color:#A9C99A; }
  .dl-days .d.on { background:#fff; color:var(--ink); border-color:#fff; }
  .dl-days .d.on small { color:var(--mute); }
  .dl-days .d.on i { border-color:var(--line); }
  .dl-days .d.on.has i { background:var(--credit); border-color:var(--credit); }
  .dl-days .nav {
    flex:none; width:32px; height:44px; border-radius:9px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); color:#E8E2D5; font-size:16px; line-height:1;
  }
  .dl-days .nav:hover { background:rgba(255,255,255,.12); }
  .dl-days .pick { margin-left:6px; }
  .dl-days .pick svg { flex:none; }
  .dl-days .pick input[type="date"] { width:118px; }
  .dl-days .pick input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(1); opacity:.6; }
  .dl-days .pg-hb.sm { padding:6px 10px; font-size:11.5px; }
  .dl-st { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:11.5px; color:#B8AF9E; white-space:nowrap; }
  .save-state { color:#B8AF9E; }
  .save-state:not(:empty)::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:currentColor; margin-right:6px; vertical-align:1px; }
  .save-state.ok { color:#A9C99A; font-weight:600; }
  .save-state.warn { color:#E8A88C; font-weight:600; }
  .net { color:#A9C99A; }
  .net.off { color:#E8A88C; font-weight:600; }

  /* "Sheets" drop-down (recent saved days) */
  .dl-sheets { position:relative; }
  .dl-menu {
    display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:70; min-width:230px; max-height:320px; overflow:auto;
    background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 28px rgba(31,25,20,.22); padding:6px;
  }
  .dl-menu.on { display:block; }
  .dl-menu .grp-lbl { font-size:9.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--mute); padding:4px 8px 6px; font-weight:700; }
  .dl-menu .sheetrow {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:7px 9px; border-radius:7px;
    border:none; background:none; color:var(--ink); font-size:12.5px;
  }
  .dl-menu .sheetrow:hover { background:var(--panel); }
  .dl-menu .sheetrow.on { background:var(--ink); color:#fff; }
  .dl-menu .sheetrow .d { font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .dl-menu .sheetrow .count { margin-left:auto; font-size:11px; color:var(--mute); font-family:'IBM Plex Mono',monospace; }
  .dl-menu .sheetrow.on .count { color:#C9C1B2; }
  .sheets-empty { padding:8px 10px; font-size:12px; color:var(--mute); line-height:1.5; }

  /* Collapses to zero height while there is no message, so it never shows
     as an empty strip. #ledgerErr keeps its id: saveSheet() writes every
     save/merge/offline message straight into it, unchanged. */
  .statusbar { max-width:1148px; margin:0 auto; padding:0 24px; }
  .statusbar .err:not(:empty) {
    display:block; padding:14px 0 0; color:var(--debit); font-size:12.5px;
    font-weight:600; line-height:1.5;
  }
  .statusbar .reload-btn { margin:8px 0 0; padding:5px 10px; font-size:12px; }
  .statusbar .reload-btn[hidden] { display:none; }
  .statusbar.on { padding-bottom:12px; }

  /* ---------- flow summary card: Opening + Received − Paid = Closing | Cash ---------- */
  .dl-flow {
    background:var(--paper); border-radius:12px; box-shadow:0 6px 18px rgba(31,25,20,.14);
    display:grid; grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr 1.15fr; align-items:center;
    padding:12px 16px; margin-bottom:12px;
  }
  .dl-flow .seg { min-width:0; }
  .dl-flow .seg .k { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--mute); white-space:nowrap; }
  .dl-flow .seg .v { font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; margin-top:3px; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--ink); overflow:hidden; text-overflow:ellipsis; }
  .dl-flow .seg .v.dr { color:var(--debit); } .dl-flow .seg .v.cr { color:var(--credit); } .dl-flow .seg .v.wn { color:#8A6425; }
  .dl-flow .op { text-align:center; font-size:16px; color:var(--mute); font-weight:700; }
  .dl-flow .cashbox { border-left:1px solid var(--hair); padding-left:16px; display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
  .dl-flow .cashbox .v { color:var(--cash); }
  .dl-flow .cashbox.neg .v { color:var(--debit); }

  /* ---------- register card ---------- */
  .dl-reg .pg-ch { gap:10px; }
  .dl-reg .pg-ch .firm-wrap { min-width:160px; flex:1; }
  .dl-reg .pg-ch .firm-name {
    background:transparent; border:none; padding:0; margin:0; width:100%;
    font-family:'IBM Plex Serif',serif; font-weight:600; font-size:14.5px; color:var(--ink);
    border-bottom:1px solid transparent; cursor:pointer;
  }
  .dl-reg .pg-ch .firm-name::placeholder { color:var(--mute); opacity:.75; }
  .dl-reg .pg-ch .firm-name:hover { border-bottom-color:var(--line); }
  .dl-reg .pg-ch .firm-name:focus { outline:none; border-bottom-color:var(--accent); }
  .dl-reg .pg-ch .mt { color:var(--mute); font-size:11.5px; font-weight:500; white-space:nowrap; }
  .dl-reg .pg-ch .sp { flex:1; }
  .dl-reg .pg-ch .fld {
    display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:var(--mute); border:1px solid var(--line); border-radius:7px; padding:3px 8px; background:var(--panel);
  }
  .dl-reg .pg-ch .fld i { font-style:normal; font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600; font-size:12px; text-transform:none; letter-spacing:0; }
  .opening-block input {
    width:96px; padding:3px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; text-align:right;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; color:var(--ink);
  }
  .opening-block select { padding:3px 4px; border:1px solid var(--line); border-radius:5px; background:#fff; font-size:11.5px; color:var(--ink); }
  .opening-block input:focus, .opening-block select:focus { outline:none; border-color:var(--cash); box-shadow:var(--focus-ring); }
  .dl-reg .pg-ch .fld.zoom { padding:2px 4px; gap:2px; }
  .dl-reg .pg-ch .fld.zoom .icb { width:22px; height:22px; font-size:14px; line-height:1; border:none; background:none; color:var(--slate); border-radius:5px; }
  .dl-reg .pg-ch .fld.zoom .icb:hover { background:var(--paper); }
  .dl-reg .pg-ch .fld.zoom .pct { font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:11.5px; min-width:38px; text-align:center; letter-spacing:0; }
  .dl-reg .pg-ch .fld.zoom .btn { padding:2px 7px; font-size:10.5px; border-radius:5px; }
  .dl-reg .pg-ch .fld.zoom .btn.on { display:none; }

  .reg-wrap { overflow-x:auto; }
  #ledgerArea { --z:1; }
  table.reg { width:100%; border-collapse:collapse; table-layout:fixed; font-size:calc(12.5px * var(--z)); min-width:720px; }
  table.reg thead th { padding:0; }
  table.reg .colhead {
    display:flex; align-items:center; justify-content:space-between; padding:8px 12px;
    font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  }
  table.reg .colhead.dr { background:var(--credit-wash); color:var(--credit); }
  table.reg .colhead.cr { background:var(--debit-wash); color:var(--debit); }
  table.reg .colhead.bal { background:#F5F1E6; color:var(--slate); justify-content:center; }
  table.reg .colhead span { font-size:10px; font-weight:600; letter-spacing:0; text-transform:none; opacity:.8; }
  table.reg th.sub {
    font-size:9.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--mute);
    border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; background:#FBF9F4;
  }
  table.reg th.sub.c { text-align:center; }
  table.reg th.sub.r { text-align:right; }
  table.reg td { border-bottom:1px dotted #CFC6B3; padding:0; vertical-align:middle; }
  table.reg tbody tr:nth-child(even) td { background:#FCFAF5; }
  table.reg .split { border-left:2px solid var(--ink); }
  table.reg col.c-n { width:30px; }
  table.reg col.c-amt { width:13%; }
  table.reg col.c-rem { width:24%; }
  table.reg col.c-chk { width:38px; }
  table.reg col.c-bal { width:12%; }
  table.reg col.c-act { width:28px; }
  table.reg td.n { color:var(--mute); font-family:'IBM Plex Mono',monospace; font-size:.85em; text-align:center; }
  table.reg input.cell {
    width:100%; border:none; background:transparent; padding:calc(7px * var(--z)) 8px;
    font-size:inherit; color:var(--ink); font-family:inherit;
  }
  table.reg input.cell:focus { outline:none; background:#FBF6E8; box-shadow:inset 0 0 0 2px rgba(74,109,147,.25); }
  table.reg input.cell[type="number"] {
    text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
    font-weight:600; -moz-appearance:textfield;
  }
  table.reg input.cell[type="number"]::-webkit-outer-spin-button,
  table.reg input.cell[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  table.reg td.chk { text-align:center; }
  table.reg td.chk input { margin:0; width:15px; height:15px; accent-color:var(--credit); vertical-align:middle; }
  table.reg td.bal {
    text-align:right; padding:0 8px; font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums; font-size:.95em; color:var(--slate); background:#FAF7F0;
  }
  table.reg td.act { text-align:center; }
  table.reg td.act .rmRow {
    background:none; border:none; color:var(--mute); font-size:12px; padding:4px 6px;
    border-radius:5px; line-height:1;
  }
  table.reg td.act .rmRow:hover { background:var(--debit-wash); color:var(--debit); }
  table.reg tfoot td {
    font-weight:700; border-top:1.5px solid var(--ink); border-bottom:none; background:#F5F1E6; padding:7px 8px; font-size:.95em;
  }
  table.reg tfoot td.m { text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  table.reg tfoot td.lbl-cell { font-size:.8em; text-transform:uppercase; letter-spacing:.6px; color:var(--slate); }
  table.reg tfoot tr.closing td { border-top:none; background:#EDE7D8; font-size:1em; }
  table.reg tfoot tr.closing td.m { color:#8A6425; }
  .party-chip { display:block; font-size:9px; color:var(--accent); font-weight:600; padding:3px 8px 0; letter-spacing:.2px; }

  .dl-reg .ft {
    display:flex; align-items:center; gap:8px; padding:9px 14px; border-top:1px solid var(--hair);
    background:var(--paper); font-size:11.5px; color:var(--mute); flex-wrap:wrap;
  }
  .dl-reg .ft .cp { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px; padding:3px 10px; background:#fff; }
  .dl-reg .ft .cp .v { font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--cash); font-variant-numeric:tabular-nums; }
  .dl-reg .ft .cp.hand { background:#E4ECF4; border-color:#9FBCD6; color:#33506E; }
  .dl-reg .ft .cp.hand.neg .v { color:var(--debit); }
  .dl-reg .ft .prev { font-size:11px; }
  .dl-reg .ft .sp { flex:1; }
  .dl-reg .ft .add { border:1px dashed var(--line); border-radius:7px; padding:4px 10px; color:var(--slate); font-weight:600; background:none; font-size:11.5px; }
  .dl-reg .ft .add:hover { background:var(--panel); }
  .loading { color:var(--mute); font-size:13px; padding:24px 16px; }

  /* ---------- party picker (kept: same class the picker JS creates) ---------- */
  .partylist {
    position:fixed; background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius-md); max-height:190px; overflow:auto; z-index:75;
    min-width:210px; box-shadow:0 8px 24px rgba(31,25,20,.18);
  }
  .partylist div { padding:8px 11px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--hair); }
  .partylist div:last-child { border-bottom:none; }
  .partylist div:hover,
  .partylist div.on { background:#EFE7D8; }
  .partylist div.on { box-shadow:inset 3px 0 0 var(--accent); }

  /* ---------- per-row conflict resolution modal (§7) ----------
     Same scrim/card primitives confirmDialog() uses (theme.css), only wider
     and with a decision block per conflicting line. */
  .conf-card { max-width:620px; }
  .conf-card .conf-list { max-height:48vh; overflow:auto; margin:0 0 16px; }
  .conf-item { border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:10px; }
  .conf-item:last-child { margin-bottom:0; }
  .conf-item .conf-ttl {
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px;
    color:var(--slate); margin-bottom:7px;
  }
  .conf-vers { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
  .conf-ver { flex:1; min-width:210px; border:1px solid var(--hair); border-radius:7px; padding:7px 9px; background:var(--panel); }
  .conf-ver .tag {
    display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.7px; padding:1px 6px; border-radius:4px; margin-bottom:4px;
  }
  .conf-ver.mine .tag { background:var(--cash); color:#fff; }
  .conf-ver.theirs .tag { background:var(--accent); color:#fff; }
  .conf-ver .txt { font-size:12.5px; color:var(--ink); line-height:1.5; word-break:break-word; }
  .conf-btns { display:flex; gap:7px; flex-wrap:wrap; }
  .conf-btns .btn { padding:5px 11px; font-size:12px; }
  .conf-btns .btn.on { background:var(--ink); border-color:var(--ink); color:#fff; }

  @media (max-width:860px) {
    .pg-body.dl-body { margin-top:-24px; }
    .dl-days .strip { order:5; width:100%; }
    .dl-days .pick { margin-left:0; }
    .dl-st { margin-left:0; width:100%; }
    .dl-flow { grid-template-columns:1fr 1fr; gap:10px 14px; padding:12px 14px; }
    .dl-flow .op { display:none; }
    .dl-flow .cashbox { grid-column:1 / -1; border-left:none; border-top:1px solid var(--hair); padding-left:0; padding-top:10px; }
    .dl-reg .pg-ch .firm-wrap { flex-basis:100%; }
    .dl-reg .pg-ch .mt { display:none; }
    .dl-reg .pg-ch .fld.zoom { display:none; }
  }

  /* ---------- print: the classic document in #printArea (theme.css §17 .pd-*) ---------- */
  #printArea { display:none; }
  @media print {
    @page { size:A4; margin:14mm 14mm 18mm; }
    /* The on-screen body is a fixed-height app shell; taken out of flow so
       it cannot throw blank sheets at the printer. */
    body.pd-on .app-shell { display:none !important; }
    body.pd-on #printArea { display:block; }
    body.pd-on .pd table.reg-p th.split, body.pd-on .pd table.reg-p td.split { border-left:2px solid #2A2620; }
    body.pd-on .pd table.reg-p th.dr { background:#5F7A4E; }
    body.pd-on .pd table.reg-p th.cr { background:#A0532E; }
    body.pd-on .pd table.reg-p td.tick { text-align:center; width:34px; color:#5F7A4E; font-weight:700; }
    body.pd-on .pd table.reg-p td.bal { color:#6B6357; }
    /* Five summary cells across A4: slightly smaller figures so "12,345.00 Dr" never wraps. */
    body.pd-on .pd-sum .v { font-size:14px; }
    body.pd-on .pd-sum { grid-template-columns:repeat(5, 1fr); }
  }
</style>
</head>
<body>

<div class="app-shell">

  <!-- Standalone use only (hidden when embedded in the shell, which carries
       navigation, Tools and Account itself). -->
  <aside class="sidebar light" id="sidebar">
    <div class="head">
      <span class="mark">OHT</span>
      <span class="title">Cash Book</span>
      <button class="close" id="drawerClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="grp">
      <button class="navitem" id="moreToggle" aria-expanded="false" aria-controls="moreGrp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        More…
        <span class="caret">&#8250;</span>
      </button>
      <div class="subgrp" id="moreGrp">
        <button class="navitem" id="backupBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Save backup file
        </button>
        <button class="navitem" id="restoreBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Restore from file
        </button>
        <button class="navitem" id="installBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
          Install on this device
        </button>
        <button class="navitem" id="signOutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Sign out
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="appbar">
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="title">Daily Cash Book</span>
    </div>

    <div class="dl-scroll" id="dlScroll">
      <div class="pg-hero dl-hero">
        <div class="pg-crumb">Daily Cash Book</div>
        <div class="pg-row">
          <div style="min-width:0">
            <h2 id="dlTitle">&nbsp;</h2>
            <div class="pg-sub" id="dlSub"></div>
          </div>
          <div class="pg-sp"></div>
          <div class="pg-acts">
            <button type="button" class="pg-hb" id="addRowBtn">+ Add rows</button>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  // A number field defaulting to "0" (Opening balance on a brand-new day,
  // etc.) otherwise has to be selected and erased before the real figure
  // can be typed. Auto-select it on focus instead — the first keystroke
  // just replaces it — while a genuinely saved 0 still reads as 0 when
  // the field isn't focused.
  document.addEventListener('focusin', function (ev) {
    var el = ev.target;
    if (el && el.tagName === 'INPUT' && el.type === 'number' && el.value === '0') el.select();
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'active') {
      d.active ? sb.auth.startAutoRefresh && sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh && sb.auth.stopAutoRefresh();
      return;
    }
    // Cross-module refresh (§14): a party renamed in Masters shows up in the
    // d_party/c_party pickers and the register's own name lookups; a firm
    // added/edited in Masters shows up in the Firm dropdown (§2) and its
    // print letterhead (the per-name firmCache is cleared so a changed
    // logo/signature/stamp isn't served stale on the next print).
    if (d.oht === 'refresh' && state.sheet) {
      if (d.kind === 'parties') loadParties().then(render);
      else if (d.kind === 'companies') { firmCache = {}; loadCompanies().then(render); }
    }
  });

  // originalRows (§7) is the row-level twin of originalSheet: the snapshot
  // smart_merge_lines diffs against, captured at exactly the same moments.
  // autosavePaused (§5) is what stops a standing conflict from being
  // re-surfaced every couple of seconds while the user keeps typing.
  var state = {
    date: new Date().toISOString().slice(0, 10),
    sheet: null, originalSheet: null, originalRows: [],
    parties: [], companies: [], dirty: false, prevClosing: 0,
    autosavePaused: false, saving: false, editSeq: 0
  };

  // Every edit bumps editSeq. A save compares it before and after its round
  // trip: if it moved, the user typed WHILE the save was in flight, and the
  // copy the server just handed back is older than those keystrokes.
  function markDirty() { state.dirty = true; state.editSeq++; }

  var LOCAL_KEY_PREFIX = 'oht:sheet:';
  // Marks "a first save for this day is already sitting in the offline
  // queue". Kept in localStorage, not just in memory, so a reload while
  // still offline does not queue the same new day a second time.
  var NEWSHEET_FLAG_PREFIX = 'oht:sheetQueued:';
  function newSheetQueued(d) {
    try { return localStorage.getItem(NEWSHEET_FLAG_PREFIX + d) === '1'; } catch (e) { return false; }
  }
  function setNewSheetQueued(d, on) {
    try {
      if (on) localStorage.setItem(NEWSHEET_FLAG_PREFIX + d, '1');
      else localStorage.removeItem(NEWSHEET_FLAG_PREFIX + d);
    } catch (e) {}
  }

  // sheet_rows columns this client owns. sheet_id/created_at/line_no are
  // deliberately NOT in here: apply_merged_lines() supplies the fk itself
  // (passing it again in the row object would duplicate the column in its
  // generated INSERT) and re-numbers line_no from the array position, which
  // is what keeps the persisted order equal to the order on screen.
  var ROW_COLS = ['d_amt', 'd_rem', 'd_tick', 'd_party', 'c_amt', 'c_rem', 'c_tick', 'c_party'];
  // Left-to-right keyboard order of the editable cells in one register row (§4).
  var FIELD_ORDER = ['d_amt', 'd_rem', 'd_tick', 'c_amt', 'c_rem', 'c_tick'];

  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function updateNetStatus() {
    var el = document.getElementById('netStatus');
    el.textContent = navigator.onLine ? 'Online' : 'Offline — will sync when back online';
    el.className = 'net' + (navigator.onLine ? '' : ' off');
  }
  window.addEventListener('online', function () { updateNetStatus(); syncNow(); });
  window.addEventListener('offline', updateNetStatus);

  // ---------------------------------------------------------------
  // Offline queue (§14): uses the shared OfflineQueue module (same
  // localStorage key this page's own inline queue used before) instead of
  // duplicating its retry/dedup logic here.
  // ---------------------------------------------------------------
  function sheetDateOfOp(op) {
    if (op.table === 'sheets' && op.payload) return op.payload.sheet_date;
    if (op.kind === 'doc_edit_merge' && op.headerTable === 'sheets' && op.headerNew) return op.headerNew.sheet_date;
    return null;
  }
  // Once a queued write for the currently-viewed date actually lands, pull
  // the real row back down (real id, fresh version) so the NEXT save goes
  // through the merge path below instead of staying stuck re-queuing blind
  // upserts — but never if the user typed more since queueing (state.dirty),
  // or that unsaved typing would be silently overwritten by the reload.
  async function onQueueDrained(op, res) {
    var d = sheetDateOfOp(op);
    if (!d) return;

    // A brand-new day saved while offline goes up as the sheets header
    // alone — sheet_rows needs the header's id, which only exists once the
    // insert lands. So the rows are pushed here, read from the local cache
    // at THIS moment so they are the latest ones typed offline rather than
    // a copy frozen when the op was queued.
    if (op.ohtNewSheet) {
      setNewSheetQueued(d, false);
      if (res && res.error) {
        // A duplicate key here means the date was taken while this device
        // was offline. If we already hold a real id for the day it was our
        // own earlier queued op that created it, which is not a conflict.
        var ours = state.sheet && state.sheet.sheet_date === d && state.sheet.id;
        if (res.error.code === '23505' && d === state.date && !ours) {
          showConflict('Jab aap offline the, is din ki sheet kisi aur ne bana di. Aap ki yahan likhi entries mehfooz hain ' +
            'lekin sync nahi ho sakin — "Reload this day from the server" dabakar taaza sheet dekhein.');
        }
        return;
      }
      var hdr = await sb.from('sheets').select('id').eq('sheet_date', d).is('deleted_at', null).maybeSingle();
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(LOCAL_KEY_PREFIX + d) || 'null'); } catch (e) {}
      if (hdr.data && cached) {
        // The header went up with whatever was typed when the op was first
        // queued; bring it in line with the last offline edit. Safe to write
        // flat: this row was created a moment ago by this very op, so there
        // is no second editor's version of it to merge against yet.
        await sb.from('sheets').update({
          opening: cached.opening, side: cached.side,
          firm: cached.firm || null, page: cached.page || null
        }).eq('id', hdr.data.id);
      }
      var pend = ((cached && cached.rows) || []).map(normRow).filter(function (r) { return !r.id; });
      if (hdr.data && pend.length) {
        await sb.from('sheet_rows').insert(pend.map(function (r, i) {
          var o = sanitizeForApply(r);
          delete o.id;
          o.sheet_id = hdr.data.id;
          o.line_no = i + 1;
          return o;
        }));
      }
    }

    if (d !== state.date || state.dirty) return;
    if (res && res.error && res.error.code !== '23505') return; // genuine failure — leave local state as-is
    loadSheet(state.date);
  }
  function syncNow() { OfflineQueue.flush(sb, onQueueDrained); }
  setInterval(syncNow, 15000); // backstop poll, §14

  // ---------------------------------------------------------------
  // Toast + confirm dialog (§14) — per-document copies of the shared
  // pattern: these separate HTML documents have no common JS runtime, so
  // the markup/classes are shared via theme.css and the few lines of
  // behaviour are repeated in each module.
  // ---------------------------------------------------------------
  function toast(msg, isErr) {
    var t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    document.getElementById('toastStack').appendChild(t);
    requestAnimationFrame(function () { t.classList.add('on'); });
    setTimeout(function () {
      t.classList.remove('on');
      setTimeout(function () { t.remove(); }, 250);
    }, isErr ? 6000 : 3200);
  }

  function confirmDialog(title, body, confirmLabel, isDangerous) {
    return new Promise(function (resolve) {
      var scrim = document.getElementById('confirmScrim');
      var ok = document.getElementById('cfOk');
      var cancel = document.getElementById('cfCancel');
      document.getElementById('cfTitle').textContent = title;
      document.getElementById('cfBody').textContent = body;
      ok.textContent = confirmLabel || 'Confirm';
      ok.className = 'btn ' + (isDangerous ? 'dgr' : 'pri');

      function done(v) {
        scrim.classList.remove('on');
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        scrim.removeEventListener('mousedown', onScrim);
        document.removeEventListener('keydown', onKey);
        resolve(v);
      }
      function onOk() { done(true); }
      function onCancel() { done(false); }
      function onScrim(e) { if (e.target === scrim) done(false); }
      function onKey(e) { if (e.key === 'Escape') done(false); }

      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
      scrim.addEventListener('mousedown', onScrim);
      document.addEventListener('keydown', onKey);
      scrim.classList.add('on');
      ok.focus();
    });
  }

  // ---------------------------------------------------------------
  // Drawer (mobile) / persistent sidebar (desktop) — same mechanics and
  // breakpoint as the other modules, only the palette differs.
  // ---------------------------------------------------------------
  function openDrawer() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('scrim').classList.add('on');
  }
  function closeDrawer() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('on');
    setSheetsMenu(false);
  }
  document.getElementById('hamburger').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('scrim').addEventListener('click', closeDrawer);

  // "Sheets ▾" in the hero — the recent saved days list (was in the sidebar).
  function setSheetsMenu(open) {
    var m = document.getElementById('sheetsMenu'), b = document.getElementById('sheetsBtn');
    if (!m || !b) return;
    m.classList.toggle('on', !!open);
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  document.getElementById('sheetsBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    setSheetsMenu(!document.getElementById('sheetsMenu').classList.contains('on'));
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('.dl-sheets')) setSheetsMenu(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setSheetsMenu(false);
  });

  document.getElementById('moreToggle').addEventListener('click', function () {
    var open = document.getElementById('moreGrp').classList.toggle('on');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // ---------------------------------------------------------------
  // Formatting helpers
  // ---------------------------------------------------------------
  function fmtNum(n) {
    return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtBal(n) { return fmtNum(Math.abs(n)) + ' ' + (n >= 0 ? 'Dr' : 'Cr'); }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function longDate(d) {
    var p = String(d).split('-');
    if (p.length !== 3) return String(d);
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }
  function shortDate(d) {
    var p = String(d).split('-');
    if (p.length !== 3) return String(d);
    return p[2] + ' ' + MONTHS[Number(p[1]) - 1];
  }
  var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  // "Friday, 19 September 2026" — the hero title.
  function weekdayDate(d) {
    var p = String(d).split('-');
    if (p.length !== 3) return String(d);
    var dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return DAYS_LONG[dt.getDay()] + ', ' + Number(p[2]) + ' ' + MONTHS_LONG[Number(p[1]) - 1] + ' ' + p[0];
  }

  async function loadParties() {
    var { data } = await sb.from('parties').select('id,name').is('deleted_at', null).order('name');
    state.parties = data || [];
  }

  // Registered firms, for the Firm dropdown (§2) — a free-text field let a
  // typo silently break the print letterhead's logo lookup in firmForPrint().
  async function loadCompanies() {
    var { data } = await sb.from('companies').select('name,is_default').is('deleted_at', null).order('is_default', { ascending: false }).order('name');
    state.companies = data || [];
  }

  // Builds this dropdown's <option>s from state.companies, always keeping
  // the sheet's current firm selected/visible even if it does not (or no
  // longer) match a registered company — never silently changes saved data.
  function firmOptionsHtml(current) {
    var cur = (current || '').trim();
    var have = state.companies.some(function (c) { return (c.name || '').trim().toLowerCase() === cur.toLowerCase(); });
    var html = state.companies.map(function (c) {
      var sel = cur && (c.name || '').trim().toLowerCase() === cur.toLowerCase();
      return '<option value="' + esc(c.name) + '"' + (sel ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');
    if (cur && !have) html += '<option value="' + esc(cur) + '" selected>' + esc(cur) + '</option>';
    return html;
  }

  // ---------------------------------------------------------------
  // Row shape. sheets.rows (a JSONB array-of-arrays) is gone — every line
  // is a sheet_rows record now, so rows are named objects carrying their
  // real sheet_rows.id once persisted (and no id while still in memory,
  // which is exactly how smart_merge_lines tells "new" from "edited").
  // ---------------------------------------------------------------
  function emptyRow() {
    return { id: null, d_amt: 0, d_rem: '', d_tick: false, d_party: null,
             c_amt: 0, c_rem: '', c_tick: false, c_party: null };
  }

  function normRow(r) {
    r = r || {};
    return {
      id: r.id || null,
      d_amt: Number(r.d_amt) || 0, d_rem: r.d_rem == null ? '' : String(r.d_rem),
      d_tick: !!r.d_tick, d_party: r.d_party || null,
      c_amt: Number(r.c_amt) || 0, c_rem: r.c_rem == null ? '' : String(r.c_rem),
      c_tick: !!r.c_tick, c_party: r.c_party || null
    };
  }

  // The one place a row is turned into what the merge RPCs see. BOTH sides
  // of the 3-way diff (originalRows and the live rows) go through it, so a
  // purely cosmetic difference — '' in memory vs NULL in the column — can
  // never be mistaken for an edit and reported as a conflict.
  function toLinePayload(r) {
    var o = {
      d_amt: Number(r.d_amt) || 0, d_rem: r.d_rem ? String(r.d_rem) : null,
      d_tick: !!r.d_tick, d_party: r.d_party || null,
      c_amt: Number(r.c_amt) || 0, c_rem: r.c_rem ? String(r.c_rem) : null,
      c_tick: !!r.c_tick, c_party: r.c_party || null
    };
    if (r.id) o.id = r.id;
    return o;
  }

  // What apply_merged_lines() may be handed: id (when the row already
  // exists) plus the eight data columns, and nothing else — see ROW_COLS.
  function sanitizeForApply(r) {
    var o = {};
    if (r && r.id) o.id = r.id;
    ROW_COLS.forEach(function (k) { if (r && k in r) o[k] = r[k]; });
    return o;
  }

  function snapshotRows(rows) {
    return (rows || []).map(function (r) { return Object.assign({}, r); });
  }

  function rowsOrEmpty(rows) { return (rows && rows.length) ? rows : [emptyRow()]; }

  function byLineNo(a, b) { return (Number(a.line_no) || 0) - (Number(b.line_no) || 0); }

  async function fetchRows(sheetId) {
    var res = await sb.from('sheet_rows').select('*').eq('sheet_id', sheetId).order('line_no');
    if (res.error) throw res.error;
    return (res.data || []).map(normRow);
  }

  async function loadSheet(date) {
    // An explicit (re)load is the ONLY thing allowed to replace what is on
    // screen (§5), so it is also the point where a standing conflict is
    // considered dealt with and auto-save is re-armed.
    resumeAutosave();

    // Optimistic local-first read (§14): show cached copy immediately, then reconcile.
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(LOCAL_KEY_PREFIX + date) || 'null'); } catch (e) {}
    if (cached) {
      cached.rows = rowsOrEmpty((cached.rows || []).map(normRow));
      state.sheet = cached;
      render();
    }

    var { data } = await sb.from('sheets').select('*').eq('sheet_date', date).is('deleted_at', null).maybeSingle();
    if (data) {
      // The server's row is the merge baseline (§27) for this browser's
      // NEXT save — captured fresh here so a second user's changes made
      // before this load are never mistaken for this session's own edits.
      var rows = [];
      try { rows = await fetchRows(data.id); } catch (e) { rows = cached && cached.id === data.id ? cached.rows : []; }
      data.rows = rowsOrEmpty(rows);
      state.sheet = data;
      state.originalSheet = JSON.parse(JSON.stringify(data));
      state.originalRows = snapshotRows(data.rows);
    } else if (!cached) {
      state.sheet = { sheet_date: date, opening: 0, side: 'dr', firm: '', page: '', rows: [emptyRow()] };
      state.originalSheet = null; // never persisted yet — first save bootstraps the row
      state.originalRows = [];
      // Firm name carries forward silently (§2). Unlike the opening
      // balance it is not a figure that needs verifying every morning, so
      // re-typing it on every new day is pure friction.
      state.sheet.firm = await latestFirmBefore(date);
    } else {
      // Offline (or the fetch failed) with only a locally-cached copy —
      // use it as the merge baseline only if it was ever actually saved.
      state.originalSheet = cached.id ? JSON.parse(JSON.stringify(cached)) : null;
      state.originalRows = cached.id ? snapshotRows(state.sheet.rows) : [];
    }
    cacheLocal(state.sheet);

    // Previous day's closing, for display continuity.
    var prevDate = new Date(date); prevDate.setDate(prevDate.getDate() - 1);
    var { data: prevSheet } = await sb.from('sheets').select('*').eq('sheet_date', prevDate.toISOString().slice(0, 10)).is('deleted_at', null).maybeSingle();
    if (prevSheet) {
      var pr = await sb.from('sheet_rows').select('d_amt,c_amt').eq('sheet_id', prevSheet.id);
      prevSheet.rows = (pr.data || []).map(normRow);
      state.prevClosing = computeClosing(prevSheet);
    } else {
      state.prevClosing = 0;
    }

    render();
  }

  // Most recent non-empty firm on any earlier day (§2).
  async function latestFirmBefore(date) {
    if (!navigator.onLine) return '';
    var res = await sb.from('sheets').select('firm')
      .lt('sheet_date', date).is('deleted_at', null)
      .not('firm', 'is', null).neq('firm', '')
      .order('sheet_date', { ascending: false }).limit(1);
    if (res.error || !res.data || !res.data.length) return '';
    return res.data[0].firm || '';
  }

  function cacheLocal(sheet) {
    try { localStorage.setItem(LOCAL_KEY_PREFIX + (sheet.sheet_date || state.date), JSON.stringify(sheet)); } catch (e) {}
  }

  // Unchanged math (§: still only the two amount columns; the cash ticks
  // and party links never touch the running balance) — only the accessors
  // moved from array slots to the sheet_rows column names.
  function computeClosing(sheet) {
    var bal = sheet.side === 'dr' ? sheet.opening : -sheet.opening;
    (sheet.rows || []).forEach(function (r) { bal += (Number(r.d_amt) || 0) - (Number(r.c_amt) || 0); });
    return bal;
  }

  // Cash summary (§3): this sheet only. No carry-forward, by design — the
  // approved replacement for the dropped sheets.cash_opening idea.
  function computeCash(sheet) {
    var received = 0, paid = 0;
    (sheet.rows || []).forEach(function (r) {
      if (r.d_tick) received += Number(r.d_amt) || 0;
      if (r.c_tick) paid += Number(r.c_amt) || 0;
    });
    return { received: received, paid: paid, inHand: received - paid };
  }

  function partyName(id) {
    if (!id) return '';
    var p = state.parties.filter(function (x) { return x.id === id; })[0];
    return p ? p.name : '';
  }

  // ---------------------------------------------------------------
  // Full-page paper replica (§13): a 210x297mm register page, drawn with
  // real rules, edited in place.
  // ---------------------------------------------------------------
  function render() {
    var s = state.sheet;
    var area = document.getElementById('ledgerArea');
    if (!s) { area.innerHTML = '<p class="loading">Loading…</p>'; return; }
    document.getElementById('dateInput').value = state.date;

    // Auto-save fires while the user is still typing, and a save that
    // brings rows back from the server re-renders the whole register — so
    // every render puts the caret back where it was, or the page would
    // yank focus out of the cell being filled in every couple of seconds.
    var focusKey = captureFocus();
    suppressBlurSave = true;

    var running = s.side === 'dr' ? s.opening : -s.opening;
    var totD = 0, totC = 0;

    // Card header: firm name (editable, §2), opening balance (§1), page, zoom.
    var html = '' +
      '<div class="pg-ch">' +
        '<span class="pg-lh"><span class="mk">' + esc((s.firm || 'O').trim().charAt(0).toUpperCase() || 'O') + '</span></span>' +
        '<span class="firm-wrap"><select class="firm-name" id="f_firm" aria-label="Firm name">' +
          '<option value=""' + (!s.firm ? ' selected' : '') + '>Default firm</option>' +
          firmOptionsHtml(s.firm) +
        '</select></span>' +
        '<span class="mt">Daily Cash Book &middot; ' + esc(longDate(state.date)) + '</span>' +
        '<span class="sp"></span>' +
        '<span class="fld opening-block"><span class="ob-lbl">Opening</span>' +
          '<input type="number" step="0.01" id="f_opening" value="' + s.opening + '" aria-label="Opening balance">' +
          '<select id="f_side" aria-label="Opening side">' +
            '<option value="dr"' + (s.side === 'dr' ? ' selected' : '') + '>Dr</option>' +
            '<option value="cr"' + (s.side === 'cr' ? ' selected' : '') + '>Cr</option>' +
          '</select>' +
        '</span>' +
        '<span class="fld">Page <i>' + esc(s.page || '—') + '</i></span>' +
        '<span class="fld zoom">' +
          '<button type="button" class="icb" id="zoomOut" title="Smaller text" aria-label="Zoom out">&minus;</button>' +
          '<span class="pct" id="zoomPct">' + Math.round(zoom * 100) + '%</span>' +
          '<button type="button" class="icb" id="zoomIn" title="Larger text" aria-label="Zoom in">+</button>' +
          '<button type="button" class="btn' + (zoom === 1 ? ' on' : '') + '" id="fitBtn">Reset</button>' +
        '</span>' +
      '</div>';

    html += '<div class="reg-wrap"><table class="reg">' +
      '<colgroup>' +
        '<col class="c-n"><col class="c-amt"><col class="c-rem"><col class="c-chk">' +
        '<col class="c-amt"><col class="c-rem"><col class="c-chk">' +
        '<col class="c-bal"><col class="c-act">' +
      '</colgroup>' +
      '<thead>' +
        '<tr>' +
          '<th colspan="4"><div class="colhead dr">Debit &middot; Received <span>cash / bank in</span></div></th>' +
          '<th colspan="3" class="split"><div class="colhead cr">Credit &middot; Paid <span>cash / bank out</span></div></th>' +
          '<th colspan="2"><div class="colhead bal">Balance</div></th>' +
        '</tr>' +
        '<tr>' +
          '<th class="sub c">#</th><th class="sub r">Amount</th><th class="sub">Particulars</th><th class="sub c" title="Cash">&#10003; cash</th>' +
          '<th class="sub r split">Amount</th><th class="sub">Particulars</th><th class="sub c" title="Cash">&#10003; cash</th>' +
          '<th class="sub r">Running</th><th class="sub"></th>' +
        '</tr>' +
      '</thead><tbody id="regBody">';

    (s.rows || []).forEach(function (r, idx) {
      var d = Number(r.d_amt) || 0, c = Number(r.c_amt) || 0;
      totD += d; totC += c;
      running += d - c;
      var dLinked = r.d_party ? '<span class="party-chip">&#128279; ' + esc(partyName(r.d_party)) + '</span>' : '';
      var cLinked = r.c_party ? '<span class="party-chip">&#128279; ' + esc(partyName(r.c_party)) + '</span>' : '';
      html += '<tr data-idx="' + idx + '">' +
        '<td class="n">' + (idx + 1) + '</td>' +
        '<td class="cell-in"><input type="number" step="0.01" class="cell" data-idx="' + idx + '" data-f="d_amt" value="' + (d ? esc(r.d_amt) : '') + '" aria-label="Debit amount line ' + (idx + 1) + '"></td>' +
        '<td class="cell-in">' + dLinked + '<input class="cell partyable" data-idx="' + idx + '" data-f="d_rem" data-partyslot="d_party" value="' + esc(r.d_rem) + '" aria-label="Debit particulars line ' + (idx + 1) + '"></td>' +
        '<td class="chk"><input type="checkbox" class="cellchk" data-idx="' + idx + '" data-f="d_tick"' + (r.d_tick ? ' checked' : '') + ' aria-label="Debit was cash, line ' + (idx + 1) + '"></td>' +
        '<td class="cell-in split"><input type="number" step="0.01" class="cell" data-idx="' + idx + '" data-f="c_amt" value="' + (c ? esc(r.c_amt) : '') + '" aria-label="Credit amount line ' + (idx + 1) + '"></td>' +
        '<td class="cell-in">' + cLinked + '<input class="cell partyable" data-idx="' + idx + '" data-f="c_rem" data-partyslot="c_party" value="' + esc(r.c_rem) + '" aria-label="Credit particulars line ' + (idx + 1) + '"></td>' +
        '<td class="chk"><input type="checkbox" class="cellchk" data-idx="' + idx + '" data-f="c_tick"' + (r.c_tick ? ' checked' : '') + ' aria-label="Credit was cash, line ' + (idx + 1) + '"></td>' +
        '<td class="bal">' + fmtBal(running) + '</td>' +
        '<td class="act"><button type="button" class="rmRow" data-idx="' + idx + '" title="Remove row" aria-label="Remove row">&#10005;</button></td>' +
        '</tr>';
    });

    html += '</tbody><tfoot>' +
      '<tr>' +
        '<td></td><td class="m" id="ftTotD">' + fmtNum(totD) + '</td><td class="lbl-cell" colspan="2">Total received</td>' +
        '<td class="m split" id="ftTotC">' + fmtNum(totC) + '</td><td class="lbl-cell" colspan="2">Total paid</td>' +
        '<td class="m" id="ftNet">' + fmtNum(totD - totC) + '</td><td></td>' +
      '</tr>' +
      '<tr class="closing">' +
        '<td class="lbl-cell" colspan="7">Closing balance carried forward</td>' +
        '<td class="m" id="ftClose">' + fmtBal(running) + '</td><td></td>' +
      '</tr>' +
      '</tfoot></table></div>';

    // Footer: cash summary (§3 — this day only, never carried forward),
    // brought-forward note, line count, quick add.
    var cash = computeCash(s);
    html += '<div class="ft cash-sum">' +
      '<span class="cp"><span class="k">Cash received</span><span class="v" id="csRec">' + fmtNum(cash.received) + '</span></span>' +
      '<span class="cp"><span class="k">Cash paid</span><span class="v" id="csPaid">' + fmtNum(cash.paid) + '</span></span>' +
      '<span class="cp hand' + (cash.inHand < 0 ? ' neg' : '') + '" id="csHandBox"><span class="k">Cash in hand</span><span class="v" id="csHand">' + fmtNum(cash.inHand) + '</span></span>' +
      '<span class="prev">B/f from ' + esc(longDate(prevDateStr(state.date))) + ': <b>' + fmtBal(state.prevClosing) + '</b></span>' +
      '<span class="sp"></span>' +
      '<span id="lineCount">' + ((s.rows || []).length) + ' line(s)</span>' +
      '<button type="button" class="add" id="addRowsFt">+ Add 5 rows</button>' +
      '</div>';

    area.innerHTML = html;
    updateFlow(totD, totC, running, cash);
    updateHero();
    renderDayStrip();
    wireEvents();
    wireZoom();
    restoreFocus(focusKey);
    setTimeout(function () { suppressBlurSave = false; }, 0);
  }

  // ---------------------------------------------------------------
  // In-place refresh of everything the register DERIVES from the entries:
  // the running-balance column, the footer totals, the closing balance and
  // the cash summary. Nothing else is touched.
  //
  // This exists because a full render() rebuilds every <input>, and Chrome
  // flatly refuses to read or restore a caret position inside an
  // <input type="number"> — so re-rendering on each keystroke (which is
  // what the amount cells used to do, to keep the balance column right)
  // dropped the caret back to position 0 after every digit and turned
  // "12500" into "521". Derived figures are recomputed here instead; a full
  // render is now only for changes that actually alter the page's structure.
  // ---------------------------------------------------------------
  function refreshDerived() {
    var s = state.sheet;
    if (!s || !document.getElementById('regBody')) return;
    var running = s.side === 'dr' ? s.opening : -s.opening;
    var totD = 0, totC = 0;
    var bals = document.querySelectorAll('#regBody td.bal');
    (s.rows || []).forEach(function (r, i) {
      var d = Number(r.d_amt) || 0, c = Number(r.c_amt) || 0;
      totD += d; totC += c; running += d - c;
      if (bals[i]) bals[i].textContent = fmtBal(running);
    });

    put('ftTotD', fmtNum(totD));
    put('ftTotC', fmtNum(totC));
    put('ftNet', fmtNum(totD - totC));
    put('ftClose', fmtBal(running));
    put('lineCount', (s.rows || []).length + ' line(s)');

    var cash = computeCash(s);
    put('csRec', fmtNum(cash.received));
    put('csPaid', fmtNum(cash.paid));
    put('csHand', fmtNum(cash.inHand));
    var hand = document.getElementById('csHandBox');
    if (hand) hand.classList.toggle('neg', cash.inHand < 0);
    updateFlow(totD, totC, running, cash);
    updateHero();
  }

  function put(id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; }

  // Flow summary card above the register: Opening + Received − Paid =
  // Closing | Cash in hand. Pure display of figures the register already
  // computed — nothing here is a second source of truth.
  function updateFlow(totD, totC, running, cash) {
    var s = state.sheet;
    if (!s) return;
    put('fwOpen', fmtBal(s.side === 'dr' ? s.opening : -s.opening));
    put('fwRec', fmtNum(totD));
    put('fwPaid', fmtNum(totC));
    put('fwClose', fmtBal(running));
    put('fwCash', fmtNum(cash.inHand));
    var box = document.getElementById('fwCashBox');
    if (box) box.classList.toggle('neg', cash.inHand < 0);
  }

  // Hero title/sub-line: the day being edited, firm, page and entry count.
  function updateHero() {
    var s = state.sheet;
    put('dlTitle', weekdayDate(state.date));
    if (!s) { put('dlSub', ''); return; }
    var n = (s.rows || []).filter(function (r) {
      return (Number(r.d_amt) || 0) || (Number(r.c_amt) || 0) || r.d_rem || r.c_rem;
    }).length;
    put('dlSub', (s.firm || 'OHT Accounting System') + (s.page ? ' · Page ' + s.page : '') +
      ' · ' + n + ' entr' + (n === 1 ? 'y' : 'ies') + (s.id ? '' : ' · not saved yet'));
  }

  // Day strip in the hero: the six days before the one on screen plus that
  // day. A green dot marks a day that has a saved sheet (see loadRecentSheets).
  function renderDayStrip() {
    var el = document.getElementById('dayStrip');
    if (!el) return;
    var html = '';
    for (var i = 6; i >= 0; i--) {
      var d = new Date(state.date + 'T00:00:00'); d.setDate(d.getDate() - i);
      var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var on = iso === state.date;
      var has = stripDates[iso] || (on && state.sheet && state.sheet.id);
      html += '<button type="button" class="d' + (on ? ' on' : '') + (has ? ' has' : '') + '" data-date="' + iso + '"' +
        ' aria-label="' + esc(longDate(iso)) + (has ? ', has a saved sheet' : '') + '"' + (on ? ' aria-current="date"' : '') + '>' +
        '<small>' + DAYS[d.getDay()] + '</small><b>' + d.getDate() + '</b><i></i></button>';
    }
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.d'), function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.date !== state.date) gotoDate(b.dataset.date);
      });
    });
  }

  // Used where a re-render is wanted but the page's structure has not
  // changed: if the user is mid-entry in a field, leave the inputs exactly
  // as they are (see refreshDerived) and only bring the figures up to date.
  function renderSafely() {
    var area = document.getElementById('ledgerArea');
    var el = document.activeElement;
    var want = (state.sheet && state.sheet.rows) ? state.sheet.rows.length : -1;
    if (area && el && el.tagName === 'INPUT' && area.contains(el) &&
        document.querySelectorAll('#regBody tr').length === want) {
      refreshDerived();
      return;
    }
    render();
  }

  // ---------------------------------------------------------------
  // Focus preservation across a re-render.
  // ---------------------------------------------------------------
  function captureFocus() {
    var el = document.activeElement;
    var area = document.getElementById('ledgerArea');
    if (!el || !area || !area.contains(el)) return null;
    var key = null;
    if (el.id === 'f_opening' || el.id === 'f_side' || el.id === 'f_firm') key = { id: el.id };
    else if (el.dataset && el.dataset.idx != null && el.dataset.f) key = { idx: el.dataset.idx, f: el.dataset.f };
    if (!key) return null;
    try { key.selStart = el.selectionStart; key.selEnd = el.selectionEnd; } catch (e) {}
    return key;
  }

  function restoreFocus(key) {
    if (!key) return;
    var el = key.id
      ? document.getElementById(key.id)
      : document.querySelector('#ledgerArea [data-idx="' + key.idx + '"][data-f="' + key.f + '"]');
    if (!el) return;
    el.focus();
    if (key.selStart != null) { try { el.setSelectionRange(key.selStart, key.selEnd); } catch (e) {} }
  }

  function prevDateStr(date) {
    var p = new Date(date); p.setDate(p.getDate() - 1);
    return p.toISOString().slice(0, 10);
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var suppressBlurSave = false;

  function wireEvents() {
    document.getElementById('f_firm').addEventListener('change', function () {
      state.sheet.firm = this.value; markDirty(); scheduleAutosave();
    });
    document.getElementById('f_firm').addEventListener('blur', autosaveOnBlur);

    document.getElementById('f_opening').addEventListener('input', function () {
      state.sheet.opening = Number(this.value) || 0; markDirty(); scheduleAutosave(); refreshDerived();
    });
    document.getElementById('f_opening').addEventListener('blur', autosaveOnBlur);
    document.getElementById('f_side').addEventListener('change', function () {
      state.sheet.side = this.value; markDirty(); refreshDerived(); autosaveNow();
    });

    Array.prototype.forEach.call(document.querySelectorAll('.rmRow'), function (btn) {
      btn.addEventListener('click', function () {
        state.sheet.rows.splice(Number(btn.dataset.idx), 1);
        if (!state.sheet.rows.length) state.sheet.rows.push(emptyRow());
        markDirty(); render(); autosaveNow();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.cell'), function (el) {
      el.addEventListener('input', function () {
        var idx = Number(el.dataset.idx), f = el.dataset.f;
        var row = state.sheet.rows[idx];
        if (!row) return;
        row[f] = (f === 'd_amt' || f === 'c_amt') ? (Number(el.value) || 0) : el.value;
        // Re-derive party link: keep it only if the remarks text still starts with the linked party's name.
        if (el.dataset.partyslot) {
          var slot = el.dataset.partyslot;
          var linkedName = partyName(row[slot]);
          if (linkedName && String(row[f]).toLowerCase().indexOf(linkedName.toLowerCase()) !== 0) {
            row[slot] = null;
          }
          showPartyPicker(el); // keep the suggestions in step with what is typed
        }
        markDirty();
        scheduleAutosave();
        if (f === 'd_amt' || f === 'c_amt') refreshDerived(); // running balance changed
      });
      el.addEventListener('blur', autosaveOnBlur);
      if (el.dataset.partyslot) {
        el.addEventListener('focus', function () { showPartyPicker(el); });
        // Only tear down the picker that belongs to THIS input: after a
        // pick the register re-renders and a fresh input (with its own
        // picker) may already have taken focus by the time this fires.
        el.addEventListener('blur', function () {
          setTimeout(function () { if (pickerInput === el) hidePartyPicker(); }, 150);
        });
      }
    });

    Array.prototype.forEach.call(document.querySelectorAll('.cellchk'), function (el) {
      el.addEventListener('change', function () {
        var idx = Number(el.dataset.idx), f = el.dataset.f;
        if (!state.sheet.rows[idx]) return;
        state.sheet.rows[idx][f] = el.checked;
        markDirty();
        refreshDerived();  // the cash summary depends on these ticks (§3)
        autosaveNow();
      });
    });

    var body = document.getElementById('regBody');
    if (body) body.addEventListener('keydown', onRegKeydown);

    var addFt = document.getElementById('addRowsFt');
    if (addFt) addFt.addEventListener('click', function () {
      if (!state.sheet) return;
      var first = state.sheet.rows.length;
      for (var i = 0; i < 5; i++) state.sheet.rows.push(emptyRow());
      markDirty(); render();
      focusCell(first, FIELD_ORDER[0], 'start');
    });
  }

  // ---------------------------------------------------------------
  // Keyboard navigation (§4). Additive — nothing here changes what the
  // mouse/touch already does.
  //
  //   Up / Down    same column, previous / next row.
  //   Left / Right previous / next editable cell in the row, but only once
  //                the caret is already at the edge of the text, so normal
  //                within-field editing keeps working. Chrome refuses to
  //                report a caret position for <input type=number>, so an
  //                amount cell hands over on Left/Right only when it is
  //                empty; checkboxes always hand over.
  //   Enter        next field in the same row, wrapping to the first field
  //                of the next row — and on the very last row it appends a
  //                fresh row first, so a whole day can be entered without
  //                ever reaching for the mouse.
  // ---------------------------------------------------------------
  function focusCell(idx, f, caret) {
    var el = document.querySelector('#regBody [data-idx="' + idx + '"][data-f="' + f + '"]');
    if (!el) return false;
    el.focus();
    if (el.type !== 'checkbox') {
      try {
        var len = String(el.value == null ? '' : el.value).length;
        var p = caret === 'start' ? 0 : len;
        el.setSelectionRange(p, p);
      } catch (e) {}
    }
    return true;
  }

  function atEdge(el, which) {
    if (el.type === 'checkbox') return true;
    var val = String(el.value == null ? '' : el.value);
    var s = null, e2 = null;
    try { s = el.selectionStart; e2 = el.selectionEnd; } catch (ex) { return val === ''; }
    if (s == null) return val === '';           // number inputs in some browsers
    if (s !== e2) return false;                 // a selection is in play — leave it alone
    return which === 'start' ? s === 0 : s === val.length;
  }

  function onRegKeydown(e) {
    var el = e.target;
    if (!el || !el.dataset || el.dataset.idx == null || !el.dataset.f) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var key = e.key;

    // The party picker owns the arrow keys / Enter / Escape while it is open.
    if (pickerEl && pickerInput === el) {
      if (key === 'ArrowDown') { e.preventDefault(); pickerHighlight(pickerIdx + 1); return; }
      if (key === 'ArrowUp') { e.preventDefault(); pickerHighlight(pickerIdx - 1); return; }
      if (key === 'Enter' && pickerIdx >= 0 && pickerMatches[pickerIdx]) {
        e.preventDefault(); choosePartyOption(el, pickerMatches[pickerIdx]); return;
      }
      if (key === 'Escape') {
        // Close without selecting; focus stays exactly where it was.
        e.preventDefault(); e.stopPropagation(); hidePartyPicker(); return;
      }
    }

    var idx = Number(el.dataset.idx), f = el.dataset.f;
    var pos = FIELD_ORDER.indexOf(f);
    if (pos < 0) return;
    var last = (state.sheet && state.sheet.rows ? state.sheet.rows.length : 0) - 1;

    if (key === 'ArrowDown') { e.preventDefault(); if (idx < last) focusCell(idx + 1, f); return; }
    if (key === 'ArrowUp') { e.preventDefault(); if (idx > 0) focusCell(idx - 1, f); return; }
    if (key === 'ArrowLeft' && pos > 0 && atEdge(el, 'start')) {
      e.preventDefault(); focusCell(idx, FIELD_ORDER[pos - 1], 'end'); return;
    }
    if (key === 'ArrowRight' && pos < FIELD_ORDER.length - 1 && atEdge(el, 'end')) {
      e.preventDefault(); focusCell(idx, FIELD_ORDER[pos + 1], 'start'); return;
    }
    // A checkbox cell (d_tick/c_tick) toggles on Space only — kept separate
    // from Enter (§4), which always just navigates like every other field
    // and must never also flip the tick in the same keypress.
    if (el.type === 'checkbox' && (key === ' ' || key === 'Spacebar')) {
      e.preventDefault();
      el.checked = !el.checked;
      el.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }

    if (key === 'Enter') {
      e.preventDefault();
      hidePartyPicker();
      if (pos < FIELD_ORDER.length - 1) { focusCell(idx, FIELD_ORDER[pos + 1], 'end'); return; }
      if (idx < last) { focusCell(idx + 1, FIELD_ORDER[0], 'end'); return; }
      addRow(true);
    }
  }

  function addRow(focusIt) {
    if (!state.sheet) return;
    state.sheet.rows.push(emptyRow());
    markDirty();
    render();
    if (focusIt) focusCell(state.sheet.rows.length - 1, FIELD_ORDER[0], 'start');
  }

  // ---------------------------------------------------------------
  // Party picker — mouse as before, plus full keyboard operation (§4).
  // ---------------------------------------------------------------
  var pickerEl = null, pickerInput = null, pickerMatches = [], pickerIdx = -1, pickerTerm = '';
  var suppressPicker = false;

  function hidePartyPicker() {
    if (pickerEl) pickerEl.remove();
    pickerEl = null; pickerInput = null; pickerMatches = []; pickerIdx = -1; pickerTerm = '';
  }

  function pickerHighlight(n) {
    if (!pickerEl || !pickerMatches.length) return;
    pickerIdx = (n + pickerMatches.length) % pickerMatches.length;
    Array.prototype.forEach.call(pickerEl.children, function (d, i) { d.classList.toggle('on', i === pickerIdx); });
    var cur = pickerEl.children[pickerIdx];
    if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }

  function choosePartyOption(inputEl, p) {
    var idx = Number(inputEl.dataset.idx), f = inputEl.dataset.f, slot = inputEl.dataset.partyslot;
    var row = state.sheet.rows[idx];
    if (!row) { hidePartyPicker(); return; }
    var term = pickerTerm;
    var cur = String(row[f] == null ? '' : row[f]);
    var rest = term ? cur.replace(new RegExp('^' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '').trim() : cur.trim();
    row[f] = p.name + (rest ? ' ' + rest : ' ');
    row[slot] = p.id;
    markDirty();
    hidePartyPicker();
    // Don't re-open the picker for the name we just committed.
    suppressPicker = true;
    render();
    focusCell(idx, f, 'end');
    setTimeout(function () { suppressPicker = false; }, 0);
    scheduleAutosave();
  }

  function showPartyPicker(inputEl) {
    hidePartyPicker();
    if (suppressPicker) return;
    var term = String(inputEl.value == null ? '' : inputEl.value).toLowerCase();
    var matches = state.parties.filter(function (p) { return p.name.toLowerCase().indexOf(term) >= 0; }).slice(0, 8);
    if (!matches.length) return;
    pickerEl = document.createElement('div');
    pickerEl.className = 'partylist';
    pickerInput = inputEl;
    pickerMatches = matches;
    pickerIdx = -1;
    pickerTerm = term;
    var rect = inputEl.getBoundingClientRect();
    pickerEl.style.left = (rect.left + window.scrollX) + 'px';
    pickerEl.style.top = (rect.bottom + window.scrollY) + 'px';
    matches.forEach(function (p, i) {
      var opt = document.createElement('div');
      opt.textContent = p.name;
      opt.addEventListener('mouseenter', function () { pickerHighlight(i); });
      opt.addEventListener('mousedown', function (ev) { ev.preventDefault(); choosePartyOption(inputEl, p); });
      pickerEl.appendChild(opt);
    });
    document.body.appendChild(pickerEl);
  }

  // After ANY successful save (online or just-queued-offline), re-baseline
  // both state.sheet and the merge original to it. This editor, unlike the
  // others, stays open across many "Save day" clicks in one sitting — so
  // without re-baselining, the SECOND save of the session would diff
  // against pre-first-save data and see its own earlier save as a phantom
  // conflict (server current would differ from the stale original on every
  // field this session itself already changed).
  function finishSave(newHeader) {
    state.sheet = Object.assign({}, state.sheet, newHeader || {});
    state.originalSheet = JSON.parse(JSON.stringify(state.sheet));
    cacheLocal(state.sheet);
    resumeAutosave();
    renderSafely();
  }

  // Full replace of the rows on screen with the server's set. Only used
  // where nothing can have been typed in between — the offline-queue paths
  // (which never went to the server at all) and the conflict path (where a
  // modal had the keyboard the whole time).
  function afterSaveSuccess(newHeader, newRows) {
    if (newRows) state.sheet.rows = rowsOrEmpty(newRows);
    state.originalRows = snapshotRows(state.sheet.rows);
    finishSave(newHeader);
  }

  // The normal path. A save takes a snapshot of the rows, sends it, and
  // comes back a few hundred milliseconds later — long enough for a quick
  // typist to have filled in the next cell. Replacing the rows with the
  // server's copy would silently swallow exactly those keystrokes, so
  // instead the rows on screen stay put and only the ids the server just
  // handed out are grafted onto them. The new merge baseline is what was
  // actually SUBMITTED, so anything typed in the meantime is correctly seen
  // as a still-unsaved change by the next save rather than disappearing.
  //
  // finalRows is the array handed to apply_merged_lines, and
  // apply_merged_lines numbers line_no by position in it — so the applied
  // set, sorted by line_no, lines up with finalRows index for index.
  function commitRows(submittedObjs, submittedPayload, finalRows, appliedRows) {
    var applied = (appliedRows || []).slice().sort(byLineNo);

    var newObjs = [];
    submittedObjs.forEach(function (o, i) { if (!submittedPayload[i].id) newObjs.push(o); });
    var ptr = 0;
    (finalRows || []).forEach(function (fr, i) {
      var ap = applied[i];
      if (!ap || fr.id) return;
      var owner = newObjs[ptr++];
      if (owner && !owner.id) owner.id = ap.id;
    });

    var have = {};
    state.sheet.rows.forEach(function (r) { if (r.id) have[r.id] = true; });
    var appended = [];
    applied.forEach(function (ap) {
      if (!ap.id || have[ap.id]) return;
      var nr = normRow(ap);          // a row somebody else added concurrently
      state.sheet.rows.push(nr);
      appended.push(nr);
    });

    // Baseline = exactly what the server now holds. Rows the user deleted
    // mid-flight stay in it on purpose, so the NEXT merge still knows to
    // delete them instead of treating them as somebody else's new lines.
    var baseline = [];
    submittedObjs.forEach(function (o, i) {
      if (!o.id) return;
      baseline.push(normRow(Object.assign({}, submittedPayload[i], { id: o.id })));
    });
    appended.forEach(function (r) { baseline.push(Object.assign({}, r)); });
    state.originalRows = baseline;
  }

  // Called at the end of the two paths that can race the user's typing.
  function settleDirty(seqAtStart) {
    if (state.editSeq === seqAtStart) { state.dirty = false; return; }
    state.dirty = true;       // typed during the round trip — save again
    scheduleAutosave();
  }

  // ---------------------------------------------------------------
  // Auto-save (§5). Debounced while typing, immediate on blur, and it
  // stops dead the moment a conflict is standing so the same conflict is
  // never re-surfaced every two seconds while the user keeps working.
  // "Save day" in the drawer stays clickable throughout — pressing it just
  // re-shows the same conflict, harmlessly, until it is resolved.
  // ---------------------------------------------------------------
  var AUTOSAVE_MS = 1700;
  var autosaveTimer = null, savedClearTimer = null;

  function setSaveStatus(txt, cls) {
    var el = document.getElementById('saveStatus');
    if (!el) return;
    if (savedClearTimer) { clearTimeout(savedClearTimer); savedClearTimer = null; }
    el.textContent = txt || '';
    el.className = 'save-state' + (cls ? ' ' + cls : '');
    if (cls === 'ok') savedClearTimer = setTimeout(function () { setSaveStatus('', ''); }, 2000);
  }

  function showConflict(msg) {
    // Never touches state.sheet / state.sheet.rows (§5) — what is on screen
    // is the user's typing and stays untouched until THEY ask for a reload.
    state.autosavePaused = true;
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    document.getElementById('ledgerErr').textContent = msg;
    document.getElementById('statusBar').classList.add('on');
    document.getElementById('reloadBtn').hidden = false;
    setSaveStatus('Not saved', 'warn');
  }

  function resumeAutosave() {
    state.autosavePaused = false;
    var btn = document.getElementById('reloadBtn');
    if (btn) btn.hidden = true;
    var bar = document.getElementById('statusBar');
    if (bar) bar.classList.remove('on');
  }

  function clearStatusLine() {
    document.getElementById('ledgerErr').textContent = '';
    // Keep the bar's rule while the reload escape-hatch is still offered.
    if (document.getElementById('reloadBtn').hidden) {
      document.getElementById('statusBar').classList.remove('on');
    }
  }

  function noteStatus(msg) {
    document.getElementById('ledgerErr').textContent = msg;
    document.getElementById('statusBar').classList.add('on');
  }

  function scheduleAutosave() {
    if (state.autosavePaused) return;
    if (autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(function () { autosaveTimer = null; runAutosave(); }, AUTOSAVE_MS);
  }

  function autosaveNow() {
    if (state.autosavePaused) return;
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    runAutosave();
  }

  function autosaveOnBlur() {
    // A re-render pulls the focused input out of the DOM, which some
    // browsers report as a blur — that is not the user tabbing away and
    // must not turn every keystroke into a save.
    if (suppressBlurSave) return;
    // Deferred by a tick on purpose. During a blur, document.activeElement
    // is still nowhere, so a save that re-renders synchronously (the
    // offline-queue paths do) would rebuild the register before the click
    // or Tab has landed — and the field the user was moving into would be
    // replaced under them. One tick later focus has settled.
    setTimeout(autosaveNow, 0);
  }

  function runAutosave() {
    if (state.autosavePaused || state.saving || !state.dirty || !state.sheet) return;
    saveSheet().then(function () { loadRecentSheets(); }, function (e) {
      setSaveStatus('', '');
      noteStatus((e && e.message) || String(e));
    });
  }

  // ---------------------------------------------------------------
  // Save. One save at a time — the guard also holds for as long as the
  // per-row conflict modal is open, so nothing is applied behind the
  // user's back while they are deciding.
  // ---------------------------------------------------------------
  var inflightSave = null;

  function saveSheet() {
    if (!state.sheet) return Promise.resolve();
    // Blur-save and a "Save day" click land back-to-back all the time
    // (clicking the button blurs the cell first). Handing back the very
    // same promise means the button's "Saved." toast waits for the save
    // that is actually running instead of firing against a no-op.
    if (inflightSave) return inflightSave;
    state.saving = true;
    inflightSave = doSave().then(function (v) {
      state.saving = false; inflightSave = null; return v;
    }, function (e) {
      state.saving = false; inflightSave = null; throw e;
    });
    return inflightSave;
  }

  async function doSave() {
    clearStatusLine();
    var seq = state.editSeq;
    var header = {
      sheet_date: state.sheet.sheet_date || state.date,
      opening: state.sheet.opening,
      side: state.sheet.side,
      firm: state.sheet.firm || null,
      page: state.sheet.page || null
    };
    cacheLocal(Object.assign({}, state.sheet, header));
    if (!state.sheet.id) return await firstSave(header, seq);
    return await mergeSave(header, seq);
  }

  // §6 — the very first save of a never-saved day. The old .upsert(…,
  // {onConflict:'sheet_date'}) silently overwrote whatever a second person
  // had just created for the same date; a plain insert turns that race
  // into a 23505 we can surface instead of a data loss nobody notices.
  async function firstSave(header, seq) {
    var submittedObjs = state.sheet.rows.slice();   // references, not copies
    var rowsPayload = submittedObjs.map(toLinePayload);

    function queueNewSheet() {
      // At most ONE queued op per new day. Everything it needs — the header
      // fields and the rows — is read back out of the local cache when it
      // actually drains, so it is always the latest offline state and never
      // a copy frozen at queue time. A second op would add nothing except a
      // duplicate-key error that looks like somebody else's conflict.
      if (!newSheetQueued(header.sheet_date)) {
        OfflineQueue.enqueue({
          kind: 'insert', table: 'sheets', payload: header, ohtNewSheet: true
        });
        setNewSheetQueued(header.sheet_date, true);
      }
      afterSaveSuccess(header, state.sheet.rows);
      setSaveStatus('Offline — will sync', 'warn');
      noteStatus('No internet — saved locally, will sync automatically.');
      state.dirty = false;
    }

    if (!navigator.onLine) { queueNewSheet(); return; }
    setSaveStatus('Saving…', '');

    var { data, error } = await sb.from('sheets').insert(header).select().single();
    if (error) {
      if (error.code === '23505') {
        showConflict('Is din ki sheet abhi abhi kisi aur ne bana di. Aap ki yahan likhi entries mehfooz hain — ' +
          '"Reload this day from the server" dabakar taaza sheet dekhein, phir apni entries dobara daalein.');
        return;
      }
      if (OfflineQueue.isNetworkError(error)) { queueNewSheet(); return; }
      setSaveStatus('', '');
      noteStatus(error.message);
      return;
    }

    setNewSheetQueued(header.sheet_date, false);

    // Brand-new sheet: every row is genuinely new, so there is nothing to
    // merge against yet — a plain multi-row insert is the whole job.
    var rows = [];
    if (rowsPayload.length) {
      var ins = await sb.from('sheet_rows').insert(rowsPayload.map(function (r, i) {
        var o = sanitizeForApply(r);
        delete o.id;
        o.sheet_id = data.id;
        o.line_no = i + 1;
        return o;
      }));
      if (ins.error) {
        setSaveStatus('', '');
        noteStatus(ins.error.message);
        // Header did land — re-baseline it so the next save takes the merge
        // path against a real id instead of trying to insert the day again.
        afterSaveSuccess(data, null);
        return;
      }
      try {
        rows = await fetchRows(data.id);
      } catch (e) {
        // The lines ARE on the server; we just could not read them back, so
        // their ids cannot be grafted on. Saving again from here would
        // insert the same lines a second time — stop and make the user
        // reload instead.
        finishSave(data);
        showConflict('Sheet ban gayi, lekin uski lines wapas parhi nahi ja sakin. ' +
          '"Reload this day from the server" dabakar taaza sheet dekhein.');
        return;
      }
    }
    // rowsPayload doubles as "the array that was applied": the rows went in
    // in exactly that order, with line_no 1..n, so the fetched set lines up.
    commitRows(submittedObjs, rowsPayload, rowsPayload, rows);
    finishSave(data);
    settleDirty(seq);
    setSaveStatus('Saved', 'ok');
  }

  // §7 — an existing sheet: header merge, then a per-row merge, and only a
  // genuinely same-row clash ever reaches the user.
  async function mergeSave(header, seq) {
    var mergeOriginal = state.originalSheet;
    var headerId = state.sheet.id;
    var submittedObjs = state.sheet.rows.slice();   // references, not copies
    var myLines = submittedObjs.map(toLinePayload);
    var origLines = (state.originalRows || []).map(toLinePayload);

    function queueSheetEdit() {
      OfflineQueue.enqueue({
        kind: 'doc_edit_merge', headerTable: 'sheets', headerId: headerId,
