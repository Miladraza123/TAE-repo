        '<div class="ln-rows">' +
          '<div class="doc-sum-row"><span>Qty returned</span><span class="v">' + esc(l.qty) + '</span></div>' +
          '<div class="doc-sum-row"><span>Rate</span><span class="v">' + esc(l.rate) + '</span></div>' +
          '<div class="doc-sum-row"><span>Amount</span><span class="v">' + fmtMoney(l.amount) + '</span></div>' +
        '</div></div>';
    });
    linesHtml += '</div>';
    renderSheet('Sales Return — ' + r.header.rno, linesHtml,
      '<button type="button" class="btn dgr" id="rt_deleteBtn">Delete</button>' +
      '<button type="button" class="btn" id="rt_printBtn">Print</button>' +
      '<button type="button" class="btn" id="cancelBtn">Cancel</button>');
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    document.getElementById('rt_deleteBtn').addEventListener('click', deleteReturn);
    document.getElementById('rt_printBtn').addEventListener('click', printReturn);
  }

  // Unchanged data flow — only lifted out of the old <select>'s change
  // handler so the combobox can call it.
  async function pickReturnSale(saleId) {
    var r = returnEditing;
    var { data: saleHeader } = await sb.from('vouchers').select('*').eq('id', saleId).single();
    var { data: saleLines } = await sb.from('voucher_lines').select('*').eq('voucher_id', saleId);
    var { data: existingReturns } = await sb.from('sales_return_lines').select('sale_line_id,qty').in('sale_line_id', (saleLines || []).map(function (l) { return l.id; }));
    var matLineIds = (saleLines || []).filter(function (l) { return l.consumption_type === 'raw_material_consumption'; }).map(function (l) { return l.id; });
    var materialsByLine = {};
    if (matLineIds.length) {
      var { data: mats } = await sb.from('voucher_line_material_consumption').select('*').in('voucher_line_id', matLineIds);
      var { data: restored } = await sb.from('sales_return_material_restoration').select('consumption_id,qty').in('consumption_id', (mats || []).map(function (m) { return m.id; }));
      (mats || []).forEach(function (m) {
        var alreadyRestored = (restored || []).filter(function (rr) { return rr.consumption_id === m.id; }).reduce(function (s, rr) { return s + Number(rr.qty); }, 0);
        (materialsByLine[m.voucher_line_id] = materialsByLine[m.voucher_line_id] || []).push(Object.assign({}, m, { restorable: m.qty - alreadyRestored, restoreQty: 0 }));
      });
    }
    r.sale = saleHeader;
    r.saleLines = (saleLines || []).map(function (l) {
      var already = (existingReturns || []).filter(function (er) { return er.sale_line_id === l.id; }).reduce(function (s, er) { return s + Number(er.qty); }, 0);
      return Object.assign({}, l, { returnable: l.qty - already, returnQty: 0, restoreMaterial: false, materials: materialsByLine[l.id] || [] });
    });
    renderReturnEditorLines();
  }

  function renderReturnEditorLines() {
    var r = returnEditing;
    var html = '<div class="lines">';
    r.saleLines.forEach(function (l, idx) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      html += '<div class="ln"><div class="ln-top"><div class="ln-name">' + esc(item ? item.name : '') + '</div></div>' +
        '<div class="ln-rows">' +
          '<div class="doc-sum-row"><span>Sold qty</span><span class="v">' + esc(l.qty) + '</span></div>' +
          '<div class="doc-sum-row"><span>Still returnable</span><span class="v">' + esc(l.returnable) + '</span></div>' +
          '<div class="doc-sum-row"><span>Rate</span><span class="v">' + esc(l.rate) + '</span></div>' +
          '<div class="field"><label>Return qty</label>' +
            '<input type="number" step="0.001" min="0" max="' + l.returnable + '" data-idx="' + idx + '" class="rtQty num" value="' + l.returnQty + '"></div>';
      if (l.consumption_type === 'raw_material_consumption' && l.materials.length && l.returnQty > 0) {
        html += '<div class="sw-row">' +
            '<span class="sw-lbl">Restore Raw Material Stock?<span class="sw-sub">Only what you enter below goes back into stock</span></span>' +
            '<label class="sw"><input type="checkbox" data-idx="' + idx + '" class="rtRestoreToggle"' + (l.restoreMaterial ? ' checked' : '') + '><span class="trk"></span></label>' +
          '</div>' +
          '<div id="rtMatWrap_' + idx + '">' + (l.restoreMaterial ? renderReturnMaterialRows(idx, l) : '') + '</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';

    renderSheet('Sales Return — New (against ' + r.sale.vno + ')', html,
      '<button type="button" class="btn" id="cancelBtn">Cancel</button>' +
      '<button type="button" class="btn pri" id="rt_saveBtn">Save Return</button>');
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    Array.prototype.forEach.call(document.querySelectorAll('.rtQty'), function (el) {
      el.addEventListener('input', function () { r.saleLines[Number(el.dataset.idx)].returnQty = Number(el.value) || 0; renderReturnEditorLines(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.rtRestoreToggle'), function (el) {
      el.addEventListener('change', function () {
        r.saleLines[Number(el.dataset.idx)].restoreMaterial = el.checked;
        renderReturnEditorLines();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.rtMatQty'), function (el) {
      el.addEventListener('input', function () {
        var li = Number(el.dataset.idx), mi = Number(el.dataset.mi);
        r.saleLines[li].materials[mi].restoreQty = Number(el.value) || 0;
      });
    });
    document.getElementById('rt_saveBtn').addEventListener('click', saveReturn);
  }

  function renderReturnMaterialRows(idx, l) {
    var html = '<div class="group-lbl">Raw material to restore</div><div class="lines">';
    l.materials.forEach(function (m, mi) {
      var raw = state.items.filter(function (x) { return x.id === m.raw_item_id; })[0];
      html += '<div class="ln"><div class="ln-top"><div class="ln-name">' + esc(raw ? raw.name : '') + '</div></div>' +
        '<div class="ln-rows">' +
          '<div class="doc-sum-row"><span>Consumed</span><span class="v">' + esc(m.qty) + '</span></div>' +
          '<div class="doc-sum-row"><span>Still restorable</span><span class="v">' + esc(m.restorable) + '</span></div>' +
          '<div class="field"><label>Restore qty</label>' +
            '<input type="number" step="0.001" min="0" max="' + m.restorable + '" data-idx="' + idx + '" data-mi="' + mi + '" class="rtMatQty num" value="' + m.restoreQty + '"></div>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }

  async function saveReturn() {
    var r = returnEditing;
    var errEl = document.getElementById('editorErr');
    var toReturn = r.saleLines.filter(function (l) { return l.returnQty > 0; });
    if (!toReturn.length) { errEl.textContent = 'Enter a return quantity for at least one line'; return; }
    for (var i = 0; i < toReturn.length; i++) {
      if (toReturn[i].returnQty > toReturn[i].returnable + 0.0001) {
        errEl.textContent = 'Return quantity exceeds what is still returnable on that line';
        return;
      }
    }

    var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
    var headerPayload = {
      id: newId, sale_id: r.sale.id, party_id: r.sale.party_id, rdate: new Date().toISOString().slice(0, 10),
      subtotal: toReturn.reduce(function (s, l) { return s + l.returnQty * l.rate; }, 0),
      grand_total: toReturn.reduce(function (s, l) { return s + l.returnQty * l.rate; }, 0)
    };
    var linesPayload = toReturn.map(function (l) {
      return { return_id: newId, sale_line_id: l.id, item_id: l.item_id, qty: l.returnQty, rate: l.rate, amount: l.returnQty * l.rate, warehouse_id: l.warehouse_id };
    });

    if (!navigator.onLine) {
      OfflineQueue.enqueue({ kind: 'insert', table: 'sales_returns', payload: headerPayload });
      OfflineQueue.enqueue({ kind: 'insert', table: 'sales_return_lines', payload: linesPayload });
      toast('No internet — saved locally as pending. It will get its real number once synced.');
      closeEditor(); loadReturnsList(); broadcastRefresh('sales_returns'); broadcastRefresh('items');
      return;
    }

    var { error: insErr } = await sb.from('sales_returns').insert(headerPayload);
    if (insErr) {
      if (OfflineQueue.isNetworkError(insErr)) {
        OfflineQueue.enqueue({ kind: 'insert', table: 'sales_returns', payload: headerPayload });
        OfflineQueue.enqueue({ kind: 'insert', table: 'sales_return_lines', payload: linesPayload });
        toast('No internet — saved locally as pending. It will get its real number once synced.');
        closeEditor(); loadReturnsList(); broadcastRefresh('sales_returns'); broadcastRefresh('items');
        return;
      }
      errEl.textContent = insErr.message; return;
    }

    var { data: insertedReturnLines, error: lineErr } = await sb.from('sales_return_lines').insert(linesPayload).select();
    if (lineErr) {
      if (OfflineQueue.isNetworkError(lineErr)) {
        OfflineQueue.enqueue({ kind: 'insert', table: 'sales_return_lines', payload: linesPayload });
      } else {
        errEl.textContent = lineErr.message; return; // e.g. the DB's own returnable-qty cap trigger firing on a race
      }
    } else {
      // Raw material restoration (§ approved: always explicit, never assumed;
      // not queued offline — needs the real return-line ids just inserted).
      var restorationRows = [];
      toReturn.forEach(function (l) {
        if (!l.restoreMaterial) return;
        var matchedLine = (insertedReturnLines || []).filter(function (rl) { return rl.sale_line_id === l.id; })[0];
        if (!matchedLine) return;
        (l.materials || []).forEach(function (m) {
          if (Number(m.restoreQty) > 0) {
            restorationRows.push({ return_line_id: matchedLine.id, consumption_id: m.id, warehouse_id: m.warehouse_id, qty: m.restoreQty });
          }
        });
      });
      if (restorationRows.length) {
        var { error: restErr } = await sb.from('sales_return_material_restoration').insert(restorationRows);
        if (restErr) { errEl.textContent = restErr.message; return; }
      }
    }

    toast('Sales return saved');
    closeEditor();
    loadReturnsList();
    broadcastRefresh('sales_returns'); broadcastRefresh('items');
  }

  // Print (§9/§25) — classic A4 credit note. sales_returns carries no
  // company_id of its own (a return is always against one existing sale),
  // so the firm printed is the original sale's.
  async function printReturn() {
    var r = returnEditing, h = r.header;
    var saleRes = await sb.from('vouchers').select('vno,company_id').eq('id', h.sale_id).maybeSingle().catch(function () { return { data: null }; });
    var saleInfo = (saleRes && saleRes.data) || {};
    var company = await firmForPrint(saleInfo.company_id);
    var sigLabels = ['Issued by', 'Approved by'];

    if (!po) return;
    var party = state.parties.filter(function (p) { return p.id === h.party_id; })[0];
    var rows = r.picked.map(function (l) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      return ['<td>' + esc(item ? item.name : '') + '</td>',
        '<td class="num">' + esc(l.qty) + '</td>', '<td class="num">' + fmtMoney(l.rate) + '</td>',
        '<td class="num">' + fmtMoney(l.amount) + '</td>'];
    });
    var total = r.picked.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0);
    var html = buildPdDoc({
      firm: company, tag: 'Sales return / credit note',
      docTitle: 'Sales Return', sub: h.rno + ' · ' + h.rdate,
      metaRows: [['Return no', h.rno], ['Date', h.rdate], ['Against sale', saleInfo.vno], ['Printed', printStamp()]],
      parties: [
        { label: 'Credited to', name: party ? party.name : null, sub: party ? party.city : '' },
        { label: 'From', name: company.name, sub: firmAddrText(company) }
      ],
      cols: [{ label: 'Item' }, { label: 'Qty', cls: 'num' }, { label: 'Rate', cls: 'num' }, { label: 'Amount', cls: 'num' }],
      rows: rows,
      totals: [{ label: 'Total returned', value: fmtMoney(total), cls: 'grand' }],
      narrationLabel: 'Narration', narration: h.narration,
      sigLabels: sigLabels, sigIndex: po.sigIndex, sigImg: company.signature, stampImg: po.stampOn ? company.stamp : null,
      footerRight: 'Sales Return · ' + h.rno
    });
    showPrintDoc(html, h.rno + '.pdf');
  }

  async function deleteReturn() {
    var r = returnEditing;
    var ok = await confirmDialog('Delete return ' + r.header.rno + '?',
      'The stock and cost this return put back will be reversed. It can be restored from the Recycle Bin.', 'Delete', true);
    if (!ok) return;
    var { error } = await sb.from('sales_returns').update({ deleted_at: new Date().toISOString() }).eq('id', r.id);
    if (error) { sheetErr(error.message); return; }
    toast(r.header.rno + ' deleted — restore it from the Recycle Bin');
    closeEditor(); loadReturnsList(); broadcastRefresh('sales_returns'); broadcastRefresh('items');
  }

  // ---------------------------------------------------------------
  // Quotations (goods) + Purchase Orders (§15/§16) — paper-only documents,
  // zero stock/ledger impact until converted into a real Sales/Purchase
  // Invoice. Reuses the shared smart_merge save path (§8's "build once").
  // ---------------------------------------------------------------
  var DOC_CONFIG = {
    quotation: { table: 'quotations', lineTable: 'quotation_lines', fk: 'quotation_id', numField: 'qno', dateField: 'qdate',
      partyRoles: ['customer', 'both'], hasCharges: true, convertVtype: 'sale', convertLabel: 'Convert to Sale', title: 'Quotation' },
    po: { table: 'purchase_orders', lineTable: 'po_lines', fk: 'po_id', numField: 'pono', dateField: 'podate',
      partyRoles: ['supplier', 'both'], hasCharges: false, convertVtype: 'purchase', convertLabel: 'Convert to Purchase', title: 'Purchase Order' }
  };
  var docsState = { list: [] };
  var docEditing = null;
  // quotations/purchase_orders name this column "subtotal" (no underscore) —
  // unlike vouchers/service_invoices/service_quotations, which use "sub_total".
  var DOC_IGNORE = ['id', 'created_at', 'created_by', 'updated_at', 'updated_by', 'version', 'deleted_at', 'subtotal', 'tax_total', 'grand_total', 'status', 'converted_invoice_id', 'converted_at'];
  var DOC_IGNORE_MAP = { quotation: DOC_IGNORE.concat(['qno']), po: DOC_IGNORE.concat(['pono']) };

  async function loadDocsList(type) {
    var cfg = DOC_CONFIG[type];
    var { data, error } = await sb.from(cfg.table).select('*').is('deleted_at', null)
      .order(cfg.dateField, { ascending: false }).limit(500);
    if (error) { showListError(error); return; }
    docsState.list = data || [];
    renderDocsList(type);
  }

  function renderDocsList(type) {
    var cfg = DOC_CONFIG[type];
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = docsState.list.filter(function (d) {
      if (!passesFilter(d[cfg.dateField], d.company_id, 0)) return false;
      return !term || (d[cfg.numField] || '').toLowerCase().indexOf(term) >= 0 || partyName(d.party_id).toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '' : emptyStateHtml('No ' + cfg.title.toLowerCase() + 's yet',
      term ? 'Nothing matches “' + term + '”.' : 'It is only a document until you convert it.');
    var total = 0, open = 0, converted = 0;
    rows.forEach(function (d) {
      total += Number(d.grand_total) || 0;
      if (d.status === 'converted') converted++; else open++;
      html += listRowHtml({
        id: d.id, code: type === 'po' ? 'PO' : 'QT', name: d[cfg.numField], sub: partyName(d.party_id) + ' · ' + d[cfg.dateField],
        badge: d.status, badgeCls: d.status === 'converted' ? 'b-ok' : 'b-neutral',
        amount: fmtMoney(d.grand_total)
      });
    });
    document.getElementById('listArea').innerHTML = html;
    wireListRows(function (id) { openDocEditor(type, id); });
    setListKpis([
      { label: 'Total value', val: total, cls: 'n', ring: 'Rs' },
      { label: 'Open', text: String(open), cls: 'wn', ring: '○' },
      { label: 'Converted', text: String(converted), cls: 'cr', ring: '✓' }
    ]);
    setListCount(rows.length, rows.length === 1 ? 'document' : 'documents');
    setListSub(rows.length + ' of ' + docsState.list.length + ' · ' + rangeLabel() + firmLabel());
  }

  function blankDocHeader(type) {
    var cfg = DOC_CONFIG[type];
    var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
    var h = { party_id: null, company_id: defCompany ? defCompany.id : null, narration: '', tax_on: false, discount: 0, status: 'open' };
    h[cfg.dateField] = new Date().toISOString().slice(0, 10);
    if (cfg.hasCharges) { h.loading_on = false; h.loading_amt = 0; h.cartage_on = false; h.cartage_amt = 0; h.cutting_on = false; h.cutting_amt = 0; }
    return h;
  }

  async function openDocEditor(type, id) {
    await loadMasters();
    var cfg = DOC_CONFIG[type];
    if (!id) {
      docEditing = { type: type, isNew: true, id: null, header: blankDocHeader(type), lines: [{ id: null, item_id: null, qty: 0, rate: 0, tax_pct: 0, amount: 0 }], originalHeader: null, originalLines: [] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from(cfg.table).select('*').eq('id', id).single(),
        sb.from(cfg.lineTable).select('*').eq(cfg.fk, id).order('line_no')
      ]);
      if (!header) { toast('This record was deleted by someone else.', true); loadDocsList(type); return; }
      docEditing = {
        type: type, isNew: false, id: id,
        header: JSON.parse(JSON.stringify(header)), lines: JSON.parse(JSON.stringify(lines || [])),
        originalHeader: JSON.parse(JSON.stringify(header)), originalLines: JSON.parse(JSON.stringify(lines || []))
      };
    }
    renderDocEditor();
    showSheet();
  }

  function docTotals() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var sub = 0, tax = 0;
    d.lines.forEach(function (l) {
      var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0);
      l.amount = amt; sub += amt;
      if (d.header.tax_on) tax += amt * (Number(l.tax_pct) || 0) / 100;
    });
    var extra = 0;
    if (cfg.hasCharges) {
      if (d.header.loading_on) extra += Number(d.header.loading_amt) || 0;
      if (d.header.cartage_on) extra += Number(d.header.cartage_amt) || 0;
      if (d.header.cutting_on) extra += Number(d.header.cutting_amt) || 0;
    }
    var disc = Number(d.header.discount) || 0;
    return { sub: sub, tax: tax, extra: extra, grand: sub - disc + tax + extra };
  }

    var totals = docTotals();

    var html = '<div class="f2">' +
      '<div class="field"><label>Date</label><input type="date" id="d_date" value="' + h[cfg.dateField] + '"></div>' +
      '<div class="field"><label>Discount</label><input type="number" step="0.01" class="num" id="d_discount" value="' + h.discount + '"></div>' +
      '</div>';

    html += '<div class="field"><label>Party</label>' +
      comboHtml({
        value: h.party_id,
        options: partyComboOptions(cfg.partyRoles),
        placeholder: 'Search party…',
        empty: PARTY_EMPTY,
        onPick: function (id) { h.party_id = id || null; renderDocEditor(); }
      }) +
      '<div class="hint">This is only a document — it never affects the party\'s account balance.</div></div>';

    html += '<div class="sw-row">' +
      '<span class="sw-lbl">Sales tax</span>' +
      '<label class="sw"><input type="checkbox" id="d_taxon"' + (h.tax_on ? ' checked' : '') + '><span class="trk"></span></label>' +
      '</div>';

    if (cfg.hasCharges) {
      html += '<div class="group-lbl">Extra charges</div>';
      ['loading', 'cartage', 'cutting'].forEach(function (k) {
        html += '<div class="sw-row"><span class="sw-lbl">' + k.charAt(0).toUpperCase() + k.slice(1) + '</span>' +
          '<label class="sw"><input type="checkbox" id="d_' + k + '_on"' + (h[k + '_on'] ? ' checked' : '') + '><span class="trk"></span></label>' +
          '<input type="number" step="0.01" class="amt-in" id="d_' + k + '_amt" value="' + h[k + '_amt'] + '"></div>';
      });
    }

    html += '<div class="group-lbl">Items</div>';
    html += '<div class="lines" id="docLinesWrap"></div>';
    html += '<button type="button" class="btn add-more" id="docAddLineBtn">+ Add line</button>';

    html += '<div class="group-lbl">Note</div>';
    html += '<div class="field"><textarea id="d_narration" rows="2">' + esc(h.narration || '') + '</textarea></div>';

    html += '<div class="doc-sum">' +
      '<div class="doc-sum-row"><span>Sub total</span><span class="v">' + fmtMoney(totals.sub) + '</span></div>' +
      '<div class="doc-sum-row"><span>Discount</span><span class="v">-' + fmtMoney(h.discount) + '</span></div>' +
      (h.tax_on ? '<div class="doc-sum-row"><span>Tax</span><span class="v">' + fmtMoney(totals.tax) + '</span></div>' : '') +
      (totals.extra ? '<div class="doc-sum-row"><span>Loading / Cartage / Cutting</span><span class="v">' + fmtMoney(totals.extra) + '</span></div>' : '') +
      '<div class="doc-sum-row grand"><span>Grand total</span><span class="v">' + fmtMoney(totals.grand) + '</span></div>' +
      '</div>';

    var ftr = (!d.isNew ? '<button type="button" class="btn dgr" id="docDeleteBtn">Delete</button>' : '') +
      (!d.isNew ? '<button type="button" class="btn" id="docPrintBtn">Print</button>' : '') +
      (!d.isNew && h.status === 'open' ? '<button type="button" class="btn" id="docConvertBtn">' + cfg.convertLabel + '</button>' : '') +
      '<button type="button" class="btn" id="cancelBtn">Cancel</button>' +
      '<button type="button" class="btn pri" id="docSaveBtn">Save</button>';

    renderSheet(cfg.title + (d.isNew ? ' — New' : ' — ' + h[cfg.numField]) +
      (h.status && h.status !== 'open' ? ' (' + h.status + ')' : ''), html, ftr);
    renderDocLines();

    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    document.getElementById('d_date').addEventListener('input', function () { h[cfg.dateField] = this.value; });
    document.getElementById('d_taxon').addEventListener('change', function () { h.tax_on = this.checked; renderDocEditor(); });
    document.getElementById('d_discount').addEventListener('input', function () { h.discount = Number(this.value) || 0; renderDocEditor(); });
    document.getElementById('d_narration').addEventListener('input', function () { h.narration = this.value; });
    if (cfg.hasCharges) {
      ['loading', 'cartage', 'cutting'].forEach(function (k) {
        document.getElementById('d_' + k + '_on').addEventListener('change', function () { h[k + '_on'] = this.checked; renderDocEditor(); });
        document.getElementById('d_' + k + '_amt').addEventListener('input', function () { h[k + '_amt'] = Number(this.value) || 0; renderDocEditor(); });
      });
    }
    document.getElementById('docAddLineBtn').addEventListener('click', function () { d.lines.push({ id: null, item_id: null, qty: 0, rate: 0, tax_pct: 0, amount: 0 }); renderDocLines(); });
    document.getElementById('docSaveBtn').addEventListener('click', saveDoc);
    var delBtn = document.getElementById('docDeleteBtn'); if (delBtn) delBtn.addEventListener('click', deleteDoc);
    var printBtnDoc = document.getElementById('docPrintBtn'); if (printBtnDoc) printBtnDoc.addEventListener('click', printDoc);
    var convBtn = document.getElementById('docConvertBtn'); if (convBtn) convBtn.addEventListener('click', convertDoc);
    wireCombos(document.getElementById('editorCard'));
  }

  function renderDocLines() {
    var d = docEditing, h = d.header;
    var body = document.getElementById('docLinesWrap');
    body.innerHTML = d.lines.map(function (l, idx) {
      var rows = '<div class="f2">' +
        '<div class="field"><label>Qty</label><input type="number" step="0.001" data-i="' + idx + '" data-f="qty" class="dlf num" value="' + l.qty + '"></div>' +
        '<div class="field"><label>Rate</label><input type="number" step="0.01" data-i="' + idx + '" data-f="rate" class="dlf num" value="' + l.rate + '"></div>' +
        '</div>';
      if (h.tax_on) {
        rows += '<div class="field"><label>Tax %</label><input type="number" step="0.01" data-i="' + idx + '" data-f="tax_pct" class="dlf num" value="' + l.tax_pct + '"></div>';
      }
      rows += '<div class="doc-sum-row"><span>Amount</span><span class="v">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</span></div>';

      return '<div class="ln"><div class="ln-top">' +
        comboHtml({
          value: l.item_id,
          options: itemComboOptions(d.type === 'quotation' ? 'sale_rate' : 'buy_rate'),
          placeholder: 'Search item…',
          empty: ITEM_EMPTY,
          onPick: (function (i) { return function (id) { applyDocLineField(i, 'item_id', id || ''); }; })(idx)
        }) +
        '<button type="button" data-i="' + idx + '" class="icb dRmLine" aria-label="Remove line">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
        '</button></div>' +
        '<div class="ln-rows">' + rows + '</div></div>';
    }).join('');

    Array.prototype.forEach.call(body.querySelectorAll('.dlf'), function (el) {
      el.addEventListener('change', function () {
        applyDocLineField(Number(el.dataset.i), el.dataset.f, el.type === 'number' ? Number(el.value) : el.value);
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.dRmLine'), function (btn) {
      btn.addEventListener('click', function () { d.lines.splice(Number(btn.dataset.i), 1); renderDocEditor(); });
    });
    wireCombos(body);

  // Same body as the old inline change handler — shared by the native
  // inputs and the item combobox.
  function applyDocLineField(idx, f, val) {
    var d = docEditing;
    var line = d.lines[idx];
    line[f] = val;
    if (f === 'item_id') {
      var item = state.items.filter(function (x) { return x.id === val; })[0];
      if (item) {
        if (!line.rate) line.rate = d.type === 'quotation' ? item.sale_rate : item.buy_rate;
        if (!line.tax_pct) line.tax_pct = item.tax_pct;
      }
    }
    renderDocEditor();
  }

  async function saveDoc() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    if (!d.header.party_id) { errEl.textContent = 'Pick a party first'; return; }
    var validLines = d.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one item with a quantity'; return; }

    var totals = docTotals();
    var payload = Object.assign({}, d.header, { subtotal: totals.sub, tax_total: totals.tax, grand_total: totals.grand });

    try {
      if (d.isNew) {
        // Same client-generated-id pattern as saveVoucher (§14): lets a new
        // quotation/PO be queued offline and still reference its lines.
        var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
        var headerPayload = Object.assign({ id: newId }, payload);
        var linesPayload = validLines.map(function (l) { var c = Object.assign({}, l); delete c.id; c[cfg.fk] = newId; return c; });

        if (!navigator.onLine) {
          OfflineQueue.enqueue({ kind: 'insert', table: cfg.table, payload: headerPayload });
          OfflineQueue.enqueue({ kind: 'insert', table: cfg.lineTable, payload: linesPayload });
          toast('No internet — saved locally as pending. It will get its real number once synced.');
          closeEditor(); loadDocsList(d.type); broadcastRefresh(d.type === 'quotation' ? 'quotations' : 'purchase_orders');
          return;
        }

        var { data: inserted, error: insErr } = await sb.from(cfg.table).insert(headerPayload).select().single();
        if (insErr) {
          if (OfflineQueue.isNetworkError(insErr)) {
            OfflineQueue.enqueue({ kind: 'insert', table: cfg.table, payload: headerPayload });
            OfflineQueue.enqueue({ kind: 'insert', table: cfg.lineTable, payload: linesPayload });
            toast('No internet — saved locally as pending. It will get its real number once synced.');
            closeEditor(); loadDocsList(d.type); broadcastRefresh(d.type === 'quotation' ? 'quotations' : 'purchase_orders');
            return;
          }
          return handleSaveError(insErr, errEl);
        }
        var { error: lineErr } = await sb.from(cfg.lineTable).insert(linesPayload);
        if (lineErr) {
          if (OfflineQueue.isNetworkError(lineErr)) {
            OfflineQueue.enqueue({ kind: 'insert', table: cfg.lineTable, payload: linesPayload });
          } else {
            errEl.textContent = lineErr.message; return;
          }
        }

        if (d.convertingFrom) {
          var srcCfg = DOC_CONFIG[d.convertingFrom.type];
          await sb.from(srcCfg.table).update({ status: 'converted', converted_invoice_id: inserted.id, converted_at: new Date().toISOString() }).eq('id', d.convertingFrom.id);
        }
        toast((inserted && inserted[cfg.numField] ? inserted[cfg.numField] : cfg.title) + ' saved');
        closeEditor(); loadDocsList(d.type); broadcastRefresh(d.type === 'quotation' ? 'quotations' : 'purchase_orders');
        return;
      }

      // Edit path (§14): queue the whole header+lines merge on any network
      // failure (or if already offline) instead of losing the edit — see
      // saveVoucher's queueVoucherEdit for the same pattern.
      function queueDocEdit() {
        OfflineQueue.enqueue({
          kind: 'doc_edit_merge',
          headerTable: cfg.table, headerId: d.id, headerOriginal: d.originalHeader,
          headerNew: payload, headerIgnore: DOC_IGNORE_MAP[d.type],
          lineTable: cfg.lineTable, lineFkCol: cfg.fk,
          lineOriginal: d.originalLines, lineNew: validLines
        });
        toast('No internet — your change is saved locally and will sync when back online.');
        closeEditor(); loadDocsList(d.type); broadcastRefresh(d.type === 'quotation' ? 'quotations' : 'purchase_orders');
      }

      if (!navigator.onLine) { queueDocEdit(); return; }

      var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
        p_table: cfg.table, p_id: d.id, p_original: d.originalHeader, p_new: payload, p_ignore: DOC_IGNORE_MAP[d.type]
      });
      if (mergeErr) return OfflineQueue.isNetworkError(mergeErr) ? queueDocEdit() : handleSaveError(mergeErr, errEl);
      if (mergeRes.status === 'deleted') { errEl.textContent = "'" + d.originalHeader[cfg.numField] + "' kisi aur ne delete kar diya hai"; return; }
      if (mergeRes.status === 'conflict') {
        // NOT auto-retried — see saveVoucher's identical comment: a retry
        // with the current row as the new "original" would silently
        // overwrite the other person's change instead of surfacing it.
        errEl.textContent = "'" + d.originalHeader[cfg.numField] + "' mein '" + mergeRes.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
        return;
      }

      var { data: lineMerge, error: lmErr } = await sb.rpc('smart_merge_lines', {
        p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_original_lines: d.originalLines, p_new_lines: validLines
      });
      if (lmErr) return OfflineQueue.isNetworkError(lmErr) ? queueDocEdit() : handleSaveError(lmErr, errEl);
      if (lineMerge.status === 'conflict') {
        errEl.textContent = "'" + d.originalHeader[cfg.numField] + "' mein '" + lineMerge.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
        return;
      }
      await sb.rpc('apply_merged_lines', { p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_result_lines: lineMerge.lines });

      toast("'" + d.originalHeader[cfg.numField] + "' saved");
      closeEditor(); loadDocsList(d.type); broadcastRefresh(d.type === 'quotation' ? 'quotations' : 'purchase_orders');
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  // Print (§9/§25) — classic A4 quotation/PO. Never carries a paid/balance
  // line: neither table has stock or ledger effect until converted.
  async function printDoc() {
    var d = docEditing, cfg = DOC_CONFIG[d.type], h = d.header;
    var company = await firmForPrint(h.company_id);
    var sigLabels = ['Prepared by', 'Approved by'];
    var po = await askPrintOptions(company, sigLabels);
    if (!po) return;
    var party = state.parties.filter(function (p) { return p.id === h.party_id; })[0];
    var totals = docTotals();
    var showTax = !!h.tax_on;
    var rows = d.lines.filter(function (l) { return l.item_id; }).map(function (l) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      var cells = ['<td>' + esc(item ? item.name : '') + '</td>',
        '<td class="num">' + esc(l.qty) + '</td>', '<td class="num">' + fmtMoney(l.rate) + '</td>'];
      if (showTax) cells.push('<td class="num">' + esc(Number(l.tax_pct) || 0) + '%</td>');
      cells.push('<td class="num">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</td>');
      return cells;
    });
    var cols = [{ label: 'Item' }, { label: 'Qty', cls: 'num' }, { label: 'Rate', cls: 'num' }];
    if (showTax) cols.push({ label: 'Tax', cls: 'num' });
    cols.push({ label: 'Amount', cls: 'num' });
    var totalsRows = [{ label: 'Sub total', value: fmtMoney(totals.sub) }];
    if (Number(h.discount)) totalsRows.push({ label: 'Discount', value: '− ' + fmtMoney(h.discount) });
    if (showTax) totalsRows.push({ label: 'Sales tax', value: fmtMoney(totals.tax) });
    if (cfg.hasCharges) {
      if (h.loading_on) totalsRows.push({ label: 'Loading', value: fmtMoney(h.loading_amt) });
      if (h.cartage_on) totalsRows.push({ label: 'Cartage', value: fmtMoney(h.cartage_amt) });
      if (h.cutting_on) totalsRows.push({ label: 'Cutting', value: fmtMoney(h.cutting_amt) });
    }
    totalsRows.push({ label: 'Grand total', value: fmtMoney(totals.grand), cls: 'grand' });
    var html = buildPdDoc({
      firm: company, tag: cfg.title + ' document',
      docTitle: cfg.title, sub: h[cfg.numField] + ' · ' + h[cfg.dateField],
      metaRows: [[d.type === 'quotation' ? 'Quote no' : 'PO no', h[cfg.numField]], ['Date', h[cfg.dateField]], ['Status', h.status || 'open'], ['Printed', printStamp()]],
      parties: [
        { label: d.type === 'quotation' ? 'Quoted to' : 'Supplier', name: party ? party.name : null, sub: party ? party.city : '' },
        { label: 'From', name: company.name, sub: firmAddrText(company) }
      ],
      cols: cols, rows: rows, totals: totalsRows,
      narrationLabel: 'Note', narration: h.narration,
      sigLabels: sigLabels, sigIndex: po.sigIndex, sigImg: company.signature, stampImg: po.stampOn ? company.stamp : null,
      footerRight: cfg.title + ' · ' + h[cfg.numField]
    });
    showPrintDoc(html, h[cfg.numField] + '.pdf');
  }

  async function deleteDoc() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var ok = await confirmDialog('Delete ' + d.header[cfg.numField] + '?',
      'It never affected stock or the ledger — nothing to reverse.', 'Delete', true);
    if (!ok) return;
    var { error } = await sb.from(cfg.table).update({ deleted_at: new Date().toISOString() }).eq('id', d.id);
    if (error) { sheetErr(error.message); return; }
    toast(d.header[cfg.numField] + ' deleted — restore it from the Recycle Bin');
    closeEditor(); loadDocsList(d.type); broadcastRefresh(d.type === 'quotation' ? 'quotations' : 'purchase_orders');
  }

  function convertDoc() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var newHeader = {
      vtype: cfg.convertVtype, vdate: new Date().toISOString().slice(0, 10), due_date: null,
      party_id: d.header.party_id, company_id: d.header.company_id, narration: d.header.narration,
      tax_on: d.header.tax_on, discount: d.header.discount, paid: 0,
      loading_on: cfg.hasCharges ? d.header.loading_on : false, loading_amt: cfg.hasCharges ? d.header.loading_amt : 0,
      cartage_on: cfg.hasCharges ? d.header.cartage_on : false, cartage_amt: cfg.hasCharges ? d.header.cartage_amt : 0,
      cutting_on: cfg.hasCharges ? d.header.cutting_on : false, cutting_amt: cfg.hasCharges ? d.header.cutting_amt : 0
    };
    var newLines = d.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; }).map(function (l) {
      return { id: null, item_id: l.item_id, qty: l.qty, rate: l.rate, tax_pct: l.tax_pct, amount: l.amount, pcs_on: false, pcs: null, warehouse_id: defaultWarehouseId(), sale_unit: null, sale_qty: null, unit_factor: 1 };
    });
    state.vtype = cfg.convertVtype;
    state.editing = { isNew: true, id: null, header: newHeader, lines: newLines, originalHeader: null, originalLines: [], convertingFrom: { type: d.type, id: d.id } };
    renderEditor();
  }

  // ---------------------------------------------------------------
  // Service Invoices + Service Quotations (§6) — totals are DB-
  // authoritative here (recompute_service_invoice_totals trigger), so the
  // client never sends sub_total/tax_total/grand_total: insert the header
  // first (defaults to 0), then insert lines, and the AFTER trigger fills
  // the real totals in automatically.
  // ---------------------------------------------------------------
  var SVC_CONFIG = {
    sinvoice: { table: 'service_invoices', lineTable: 'service_invoice_lines', fk: 'invoice_id', numField: 'sino', dateField: 'sidate', title: 'Service Invoice' },
    squote: { table: 'service_quotations', lineTable: 'service_quotation_lines', fk: 'quotation_id', numField: 'sqno', dateField: 'sqdate', title: 'Service Quotation' }
  };
  var SVC_IGNORE = ['id', 'created_at', 'created_by', 'updated_at', 'updated_by', 'version', 'deleted_at', 'sub_total', 'tax_total', 'grand_total'];
  var svcState = { list: [], services: [] };
  var svcEditing = null;

  async function loadServices() {
    var { data } = await sb.from('services').select('id,name,rate,tax_pct').is('deleted_at', null).order('name');
    svcState.services = data || [];
  }

  async function loadServiceDocsList(type) {
    var cfg = SVC_CONFIG[type];
    var { data, error } = await sb.from(cfg.table).select('*').is('deleted_at', null).order(cfg.dateField, { ascending: false }).limit(500);
    if (error) { showListError(error); return; }
    svcState.list = data || [];
    renderServiceDocsList(type);
  }

  function renderServiceDocsList(type) {
    var cfg = SVC_CONFIG[type];
    var term = (document.getElementById('search').value || '').toLowerCase();
    var isInv = type === 'sinvoice';
    function balOf(d) { return isInv ? (Number(d.grand_total) || 0) - (Number(d.paid) || 0) : 0; }
    var rows = svcState.list.filter(function (d) {
      if (!passesFilter(d[cfg.dateField], d.company_id, balOf(d))) return false;
      return !term || (d[cfg.numField] || '').toLowerCase().indexOf(term) >= 0 || partyName(d.party_id).toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '' : emptyStateHtml('No ' + cfg.title.toLowerCase() + 's yet',
      term ? 'Nothing matches “' + term + '”.' : 'Tap + New to write the first one.');
    var total = 0, due = 0, converted = 0;
    rows.forEach(function (d) {
      total += Number(d.grand_total) || 0;
      var bal = balOf(d);
      if (bal > 0.004) due += bal;
      if (d.status === 'converted') converted++;
      html += listRowHtml({
        id: d.id, code: isInv ? 'SI' : 'SQ', name: d[cfg.numField], sub: partyName(d.party_id) + ' · ' + d[cfg.dateField],
        badge: isInv ? (bal > 0.004 ? 'Due ' + fmtMoney(bal) : 'Paid') : d.status,
        badgeCls: isInv ? (bal > 0.004 ? 'b-warn' : 'b-ok') : (d.status === 'converted' ? 'b-ok' : 'b-neutral'),
        amount: fmtMoney(d.grand_total),
        tag: isInv ? 'Dr' : '', tagCls: 'dr'
      });
    });
    document.getElementById('listArea').innerHTML = html;
    wireListRows(function (id) { openServiceDocEditor(type, id); });
    setListKpis(isInv ? [
      { label: 'Total billed', val: total, cls: 'dr', ring: 'Rs' },
      { label: 'Receivable', val: due, cls: due > 0.004 ? 'wn' : 'n', ring: '!' },
      { label: 'Invoices', text: String(rows.length), cls: 'n', ring: '#' }
    ] : [
      { label: 'Total value', val: total, cls: 'n', ring: 'Rs' },
      { label: 'Open', text: String(rows.length - converted), cls: 'wn', ring: '○' },
      { label: 'Converted', text: String(converted), cls: 'cr', ring: '✓' }
    ]);
    setListCount(rows.length, rows.length === 1 ? 'document' : 'documents');
    setListSub(rows.length + ' of ' + svcState.list.length + ' · ' + rangeLabel() + (lf.unpaid ? ' · unpaid only' : '') + firmLabel());
  }

  async function openServiceDocEditor(type, id) {
    await loadMasters(); await loadServices();
    var cfg = SVC_CONFIG[type];
    if (!id) {
      var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
      var h = { party_id: null, company_id: defCompany ? defCompany.id : null, narration: '', notes: '', tax_on: false, discount: 0, status: 'open' };
      h[cfg.dateField] = new Date().toISOString().slice(0, 10);
      if (type === 'sinvoice') h.paid = 0;
      svcEditing = { type: type, isNew: true, id: null, header: h, lines: [{ id: null, service_id: null, description: '', qty: 1, rate: 0, tax_pct: 0, amount: 0 }], originalHeader: null, originalLines: [] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from(cfg.table).select('*').eq('id', id).single(),
        sb.from(cfg.lineTable).select('*').eq(cfg.fk, id).order('line_no')
      ]);
      if (!header) { toast('This record was deleted by someone else.', true); loadServiceDocsList(type); return; }
      svcEditing = { type: type, isNew: false, id: id, header: JSON.parse(JSON.stringify(header)), lines: JSON.parse(JSON.stringify(lines || [])),
        originalHeader: JSON.parse(JSON.stringify(header)), originalLines: JSON.parse(JSON.stringify(lines || [])) };
    }
    renderServiceDocEditor();
    showSheet();
  }

  function svcDisplayTotals() {
    var d = svcEditing;
    var sub = 0, tax = 0;
    d.lines.forEach(function (l) {
      var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0);
      sub += amt;
      if (d.header.tax_on) tax += amt * (Number(l.tax_pct) || 0) / 100;
    });
    return { sub: sub, tax: tax, grand: sub - (Number(d.header.discount) || 0) + tax };
  }

    var totals = svcDisplayTotals();

    var html = '<div class="f2">' +
      '<div class="field"><label>Date</label><input type="date" id="s_date" value="' + h[cfg.dateField] + '"></div>' +
      (d.type === 'sinvoice'
        ? '<div class="field"><label>Paid now</label><input type="number" step="0.01" class="num" id="s_paid" value="' + h.paid + '"></div>'

      '</div>';

    html += '<div class="field"><label>Party</label>' +
      comboHtml({
        value: h.party_id,
        options: partyComboOptions(null).filter(function (o) {
          var p = state.parties.filter(function (x) { return x.id === o.id; })[0];
          return p && p.kind !== 'expense';
        }),
        placeholder: 'Search party…',
        empty: PARTY_EMPTY,
        onPick: function (id) { h.party_id = id || null; renderServiceDocEditor(); }

    html += '<div class="sw-row">' +
      '<span class="sw-lbl">Tax</span>' +
      '<label class="sw"><input type="checkbox" id="s_taxon"' + (h.tax_on ? ' checked' : '') + '><span class="trk"></span></label>' +
      '</div>';

    html += '<div class="f2">' +
      '<div class="field"><label>Discount</label><input type="number" step="0.01" class="num" id="s_discount" value="' + h.discount + '"></div>' +
      '<div class="field"><label>Billing period label</label><input id="s_billinglabel" value="' + esc(h.billing_label) + '"></div>' +
      '</div>';

    html += '<div class="group-lbl">Lines</div>';
    html += '<div class="lines" id="svcLinesWrap"></div>';
    html += '<button type="button" class="btn add-more" id="svcAddLineBtn">+ Add line</button>';

    html += '<div class="group-lbl">Notes</div>';
    html += '<div class="field"><textarea id="s_notes" rows="2">' + esc(h.notes) + '</textarea></div>';

    html += '<div class="doc-sum">' +
      '<div class="doc-sum-row"><span>Sub total</span><span class="v">' + fmtMoney(totals.sub) + '</span></div>' +
      '<div class="doc-sum-row"><span>Discount</span><span class="v">-' + fmtMoney(h.discount) + '</span></div>' +
      (h.tax_on ? '<div class="doc-sum-row"><span>Tax</span><span class="v">' + fmtMoney(totals.tax) + '</span></div>' : '') +
      '<div class="doc-sum-row grand"><span>Grand total</span><span class="v">' + fmtMoney(totals.grand) + '</span></div>' +
      '<div class="doc-sum-note">Totals shown are a live preview — the database recomputes the authoritative figures on save.</div>' +
      '</div>';

    var ftr = (!d.isNew ? '<button type="button" class="btn dgr" id="svcDeleteBtn">Delete</button>' : '') +
      (!d.isNew ? '<button type="button" class="btn" id="svcPrintBtn">Print</button>' : '') +
      (!d.isNew && d.type === 'squote' && h.status === 'open' ? '<button type="button" class="btn" id="svcConvertBtn">Convert to Service Invoice</button>' : '') +
      '<button type="button" class="btn" id="cancelBtn">Cancel</button>' +
      '<button type="button" class="btn pri" id="svcSaveBtn">Save</button>';

    renderSheet(cfg.title + (d.isNew ? ' — New' : ' — ' + h[cfg.numField]), html, ftr);
    renderSvcLines();
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);

    document.getElementById('s_taxon').addEventListener('change', function () { h.tax_on = this.checked; renderServiceDocEditor(); });
    document.getElementById('s_discount').addEventListener('input', function () { h.discount = Number(this.value) || 0; renderServiceDocEditor(); });
    document.getElementById('s_billinglabel').addEventListener('input', function () { h.billing_label = this.value; });
    document.getElementById('s_notes').addEventListener('input', function () { h.notes = this.value; });
    if (d.type === 'sinvoice') document.getElementById('s_paid').addEventListener('input', function () { h.paid = Number(this.value) || 0; renderServiceDocEditor(); });
    else document.getElementById('s_validtill').addEventListener('input', function () { h.valid_till = this.value || null; });
    document.getElementById('svcAddLineBtn').addEventListener('click', function () { d.lines.push({ id: null, service_id: null, description: '', qty: 1, rate: 0, tax_pct: 0 }); renderSvcLines(); });
    document.getElementById('svcSaveBtn').addEventListener('click', saveServiceDoc);
    var delBtn = document.getElementById('svcDeleteBtn'); if (delBtn) delBtn.addEventListener('click', deleteServiceDoc);
    var printBtnSvc = document.getElementById('svcPrintBtn'); if (printBtnSvc) printBtnSvc.addEventListener('click', printServiceDoc);
    var convBtn = document.getElementById('svcConvertBtn'); if (convBtn) convBtn.addEventListener('click', convertServiceDoc);

  function renderSvcLines() {
    var d = svcEditing, h = d.header;
    var body = document.getElementById('svcLinesWrap');
    body.innerHTML = d.lines.map(function (l, idx) {
      var rows = '<div class="field"><label>Description</label><input data-i="' + idx + '" data-f="description" class="slf" value="' + esc(l.description) + '"></div>' +
        '<div class="f2">' +
          '<div class="field"><label>Qty</label><input type="number" step="0.001" data-i="' + idx + '" data-f="qty" class="slf num" value="' + l.qty + '"></div>' +
          '<div class="field"><label>Rate</label><input type="number" step="0.01" data-i="' + idx + '" data-f="rate" class="slf num" value="' + l.rate + '"></div>' +
        '</div>';
      if (h.tax_on) {
        rows += '<div class="field"><label>Tax %</label><input type="number" step="0.01" data-i="' + idx + '" data-f="tax_pct" class="slf num" value="' + l.tax_pct + '"></div>';
      }
      rows += '<div class="doc-sum-row"><span>Amount</span><span class="v">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</span></div>';

      return '<div class="ln"><div class="ln-top">' +
        comboHtml({
          value: l.service_id,
          options: svcState.services.map(function (sv) {
            return { id: sv.id, main: sv.name, sub: 'Rate ' + fmtMoney(sv.rate) + (sv.tax_pct ? ' · Tax ' + sv.tax_pct + '%' : '') };
          }),
          placeholder: 'Search service…',
          empty: SERVICE_EMPTY,
          onPick: (function (i) { return function (id) { applySvcLineField(i, 'service_id', id || ''); }; })(idx)
        }) +
        '<button type="button" data-i="' + idx + '" class="icb slRmLine" aria-label="Remove line">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
        '</button></div>' +
        '<div class="ln-rows">' + rows + '</div></div>';
    }).join('');

    Array.prototype.forEach.call(body.querySelectorAll('.slf'), function (el) {
      el.addEventListener('change', function () {
        var f = el.dataset.f;
        applySvcLineField(Number(el.dataset.i), f, (f === 'qty' || f === 'rate' || f === 'tax_pct') ? Number(el.value) : el.value);
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.slRmLine'), function (btn) {
      btn.addEventListener('click', function () { d.lines.splice(Number(btn.dataset.i), 1); renderServiceDocEditor(); });
    });
    wireCombos(body);
  }

  // Same body as the old inline change handler — shared by the native
  // inputs and the service combobox.
  function applySvcLineField(idx, f, val) {
    var d = svcEditing;
    var line = d.lines[idx];
    line[f] = val;
    if (f === 'service_id') {
      var svc = svcState.services.filter(function (sv) { return sv.id === val; })[0];
      if (svc) { if (!line.rate) line.rate = svc.rate; if (!line.tax_pct) line.tax_pct = svc.tax_pct; if (!line.description) line.description = svc.name; }
    }
    renderServiceDocEditor();
  }

  async function saveServiceDoc() {
    var d = svcEditing, cfg = SVC_CONFIG[d.type];
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    if (!d.header.party_id) { errEl.textContent = 'Pick a party first'; return; }
    var validLines = d.lines.filter(function (l) { return (l.service_id || l.description) && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one line with a quantity'; return; }

    try {
      if (d.isNew) {
        var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
        var headerPayload = Object.assign({ id: newId }, d.header);
        var linesPayload = validLines.map(function (l) { var c = Object.assign({}, l); delete c.id; c[cfg.fk] = newId; return c; });

        if (!navigator.onLine) {
          OfflineQueue.enqueue({ kind: 'insert', table: cfg.table, payload: headerPayload });
          OfflineQueue.enqueue({ kind: 'insert', table: cfg.lineTable, payload: linesPayload });
          toast('No internet — saved locally as pending. It will get its real number once synced.');
          closeEditor(); loadServiceDocsList(d.type); broadcastRefresh(d.type === 'sinvoice' ? 'service_invoices' : 'service_quotations');
          return;
        }

        var { data: inserted, error: insErr } = await sb.from(cfg.table).insert(headerPayload).select().single();
        if (insErr) {
          if (OfflineQueue.isNetworkError(insErr)) {
            OfflineQueue.enqueue({ kind: 'insert', table: cfg.table, payload: headerPayload });
            OfflineQueue.enqueue({ kind: 'insert', table: cfg.lineTable, payload: linesPayload });
            toast('No internet — saved locally as pending. It will get its real number once synced.');
            closeEditor(); loadServiceDocsList(d.type); broadcastRefresh(d.type === 'sinvoice' ? 'service_invoices' : 'service_quotations');
            return;
          }
          return handleSaveError(insErr, errEl);
        }
        var { error: lineErr } = await sb.from(cfg.lineTable).insert(linesPayload);
        if (lineErr) {
          if (OfflineQueue.isNetworkError(lineErr)) {
            OfflineQueue.enqueue({ kind: 'insert', table: cfg.lineTable, payload: linesPayload });
          } else {
            errEl.textContent = lineErr.message; return;
          }
        }
        toast((inserted && inserted[cfg.numField] ? inserted[cfg.numField] : cfg.title) + ' saved');
        closeEditor(); loadServiceDocsList(d.type); broadcastRefresh(d.type === 'sinvoice' ? 'service_invoices' : 'service_quotations');
        return;
      }

      function queueSvcDocEdit() {
        OfflineQueue.enqueue({
          kind: 'doc_edit_merge',
          headerTable: cfg.table, headerId: d.id, headerOriginal: d.originalHeader,
          headerNew: d.header, headerIgnore: SVC_IGNORE,
          lineTable: cfg.lineTable, lineFkCol: cfg.fk,
          lineOriginal: d.originalLines, lineNew: validLines
        });
        toast('No internet — your change is saved locally and will sync when back online.');
        closeEditor(); loadServiceDocsList(d.type); broadcastRefresh(d.type === 'sinvoice' ? 'service_invoices' : 'service_quotations');
      }

      if (!navigator.onLine) { queueSvcDocEdit(); return; }

      var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', { p_table: cfg.table, p_id: d.id, p_original: d.originalHeader, p_new: d.header, p_ignore: SVC_IGNORE });
      if (mergeErr) return OfflineQueue.isNetworkError(mergeErr) ? queueSvcDocEdit() : handleSaveError(mergeErr, errEl);
      if (mergeRes.status === 'conflict') {
        // NOT auto-retried — see saveVoucher's identical comment.
        errEl.textContent = 'Kisi aur ne isi waqt "' + mergeRes.conflicts.join(', ') + '" badal diya — taaza dekh kar dobara karein';
        return;
      }

      var { data: lineMerge, error: lmErr } = await sb.rpc('smart_merge_lines', { p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_original_lines: d.originalLines, p_new_lines: validLines });
      if (lmErr) return OfflineQueue.isNetworkError(lmErr) ? queueSvcDocEdit() : handleSaveError(lmErr, errEl);
      if (lineMerge.status === 'conflict') { errEl.textContent = 'Kisi aur ne isi waqt lines mein "' + lineMerge.conflicts.join(', ') + '" badal diya'; return; }
      await sb.rpc('apply_merged_lines', { p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_result_lines: lineMerge.lines });

      toast("'" + d.originalHeader[cfg.numField] + "' saved");
      closeEditor(); loadServiceDocsList(d.type); broadcastRefresh(d.type === 'sinvoice' ? 'service_invoices' : 'service_quotations');
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  // Print (§9/§25) — classic A4 service invoice/quotation. Line names come
  // from the description typed on the line, falling back to the service's
  // own name — the same precedence renderSvcLines already shows on screen.
  async function printServiceDoc() {
    var d = svcEditing, cfg = SVC_CONFIG[d.type], h = d.header;
    var company = await firmForPrint(h.company_id);
    var isInv = d.type === 'sinvoice';
    var sigLabels = isInv ? ['Received by', 'Authorised by'] : ['Prepared by', 'Approved by'];
    var po = await askPrintOptions(company, sigLabels);
    if (!po) return;
    var party = state.parties.filter(function (p) { return p.id === h.party_id; })[0];
    var totals = svcDisplayTotals();
    var showTax = !!h.tax_on;
    var rows = d.lines.filter(function (l) { return l.service_id || l.description; }).map(function (l) {
      var svc = svcState.services.filter(function (x) { return x.id === l.service_id; })[0];
      var cells = ['<td>' + esc(l.description || (svc ? svc.name : '')) + '</td>',
        '<td class="num">' + esc(l.qty) + '</td>', '<td class="num">' + fmtMoney(l.rate) + '</td>'];
      if (showTax) cells.push('<td class="num">' + esc(Number(l.tax_pct) || 0) + '%</td>');
      cells.push('<td class="num">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</td>');
      return cells;
    });
    var cols = [{ label: 'Description' }, { label: 'Qty', cls: 'num' }, { label: 'Rate', cls: 'num' }];
    if (showTax) cols.push({ label: 'Tax', cls: 'num' });
    cols.push({ label: 'Amount', cls: 'num' });
    var totalsRows = [{ label: 'Sub total', value: fmtMoney(totals.sub) }];
    if (Number(h.discount)) totalsRows.push({ label: 'Discount', value: '− ' + fmtMoney(h.discount) });
    if (showTax) totalsRows.push({ label: 'Tax', value: fmtMoney(totals.tax) });
    totalsRows.push({ label: 'Grand total', value: fmtMoney(totals.grand), cls: 'grand' });
    if (isInv) {
      var bal = totals.grand - (Number(h.paid) || 0);
      totalsRows.push({ label: 'Received', value: fmtMoney(h.paid) });
      totalsRows.push({ label: 'Balance due', value: fmtMoney(bal), cls: 'bal' });
    }
    var metaRows = [[isInv ? 'Invoice no' : 'Quote no', h[cfg.numField]], ['Date', h[cfg.dateField]]];
    if (!isInv && h.valid_till) metaRows.push(['Valid till', h.valid_till]);
    metaRows.push(['Printed', printStamp()]);
    var html = buildPdDoc({
      firm: company, tag: isInv ? 'Service invoice' : 'Service quotation',
      docTitle: cfg.title, sub: h[cfg.numField] + ' · ' + h[cfg.dateField],
      metaRows: metaRows,
      parties: [
        { label: 'Bill to', name: party ? party.name : null, sub: party ? party.city : '' },
        { label: 'From', name: company.name, sub: firmAddrText(company) }
      ],
      cols: cols, rows: rows, totals: totalsRows,
      narrationLabel: 'Notes', narration: h.notes || h.narration,
      sigLabels: sigLabels, sigIndex: po.sigIndex, sigImg: company.signature, stampImg: po.stampOn ? company.stamp : null,
      footerRight: cfg.title + ' · ' + h[cfg.numField]
    });
    showPrintDoc(html, h[cfg.numField] + '.pdf');
  }

  async function deleteServiceDoc() {
    var d = svcEditing, cfg = SVC_CONFIG[d.type];
    var ok = await confirmDialog('Delete ' + d.header[cfg.numField] + '?',
      'It can be restored from the Recycle Bin.', 'Delete', true);
    if (!ok) return;
    var { error } = await sb.from(cfg.table).update({ deleted_at: new Date().toISOString() }).eq('id', d.id);

  async function saveTransfer() {
    var t = transferEditing;
    var errEl = document.getElementById('editorErr');
    if (!t.header.from_warehouse || !t.header.to_warehouse) { errEl.textContent = 'Pick both warehouses'; return; }
    if (t.header.from_warehouse === t.header.to_warehouse) { errEl.textContent = 'From and To warehouses must be different'; return; }
    var validLines = t.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one item with a quantity'; return; }

    if (t.isNew) {
      var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
      var headerPayload = Object.assign({ id: newId }, t.header);
      var linesPayload = validLines.map(function (l) { return { transfer_id: newId, item_id: l.item_id, qty: l.qty }; });

      if (!navigator.onLine) {
        OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfers', payload: headerPayload });
        OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfer_lines', payload: linesPayload });
        toast('No internet — saved locally as pending. It will get its real number once synced.');
        closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
        return;
      }

      var { error: insErr } = await sb.from('stock_transfers').insert(headerPayload);
      if (insErr) {
        if (OfflineQueue.isNetworkError(insErr)) {
          OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfers', payload: headerPayload });
          OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfer_lines', payload: linesPayload });
          toast('No internet — saved locally as pending. It will get its real number once synced.');
          closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
          return;
        }
        errEl.textContent = insErr.message; return;
      }
      var { error: lineErr } = await sb.from('stock_transfer_lines').insert(linesPayload);
      if (lineErr) {
        if (OfflineQueue.isNetworkError(lineErr)) {
          OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfer_lines', payload: linesPayload });
        } else {
          errEl.textContent = lineErr.message; return;
        }
      }
    } else {
      var linesPayloadEdit = validLines.map(function (l) { return { transfer_id: t.id, item_id: l.item_id, qty: l.qty }; });

      if (!navigator.onLine) {
        OfflineQueue.enqueue({ kind: 'transfer_edit_replace', table: 'stock_transfers', recordId: t.id, headerPayload: t.header, lineTable: 'stock_transfer_lines', lineFkCol: 'transfer_id', linesPayload: linesPayloadEdit });
        toast('No internet — your change is saved locally and will sync when back online.');
        closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
        return;
      }

      var { error: updErr } = await sb.from('stock_transfers').update(t.header).eq('id', t.id);
      if (updErr) {
        if (OfflineQueue.isNetworkError(updErr)) {
          OfflineQueue.enqueue({ kind: 'transfer_edit_replace', table: 'stock_transfers', recordId: t.id, headerPayload: t.header, lineTable: 'stock_transfer_lines', lineFkCol: 'transfer_id', linesPayload: linesPayloadEdit });
          toast('No internet — your change is saved locally and will sync when back online.');
          closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
          return;
        }
        errEl.textContent = updErr.message; return;
      }
      await sb.from('stock_transfer_lines').delete().eq('transfer_id', t.id);
      await sb.from('stock_transfer_lines').insert(linesPayloadEdit);
    }
    toast('Stock transfer saved');
    closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
  }
