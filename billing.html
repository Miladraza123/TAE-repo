<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Billing — TAE Accounting</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --bg3:#141d2e; --fg:#e2e8f0; --muted:#94a3b8;
    --accent:#3b82f6; --accent2:#2563eb; --danger:#ef4444; --ok:#22c55e; --border:#334155;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);}
  .toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .toolbar h1{font-size:16px;margin:0 12px 0 0;font-weight:700;}
  .toolbar input[type=search]{flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--fg);}
  button{cursor:pointer;border-radius:8px;border:1px solid var(--border);background:#1c2942;color:var(--fg);padding:8px 12px;font-size:13px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{background:var(--accent2);}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .tabs{display:flex;gap:4px;}
  .tabs button{background:transparent;}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  main{padding:14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;}
  tr.row:hover{background:var(--bg3);cursor:pointer;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#1c2942;color:var(--muted);}
  .date-group{color:var(--muted);font-size:12px;margin:16px 0 4px;text-transform:uppercase;letter-spacing:.05em;}
  #editorOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:50;}
  #editorOverlay.open{display:flex;}
  .editor-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:900px;padding:20px;}
  .editor-card h2{margin:0 0 14px;font-size:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px;}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--fg);font-size:13px;}
  textarea{min-height:50px;resize:vertical;}
  .charges-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:var(--bg3);border-radius:8px;}
  .charges-row .chg{display:flex;align-items:center;gap:6px;}
  .lines-table th,.lines-table td{padding:5px 6px;}
  .lines-table input,.lines-table select{padding:5px 6px;font-size:12px;}
  .totals{margin-top:12px;display:flex;justify-content:flex-end;}
  .totals table{width:280px;}
  .totals td{padding:4px 8px;}
  .totals td:last-child{text-align:right;font-variant-numeric:tabular-nums;}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px;}
  .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
  .party-hint{font-size:12px;color:var(--muted);margin-top:4px;}
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;color:#000;background:#fff;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Billing</h1>
  <div class="tabs">
    <button id="tabSale" class="active">Sales</button>
    <button id="tabPurchase">Purchases</button>
    <button id="tabReturns">Returns</button>
    <button id="tabQuotations">Quotations</button>
    <button id="tabPOs">Purchase Orders</button>
    <button id="tabServiceInvoices">Service Invoices</button>
    <button id="tabServiceQuotations">Service Quotations</button>
    <button id="tabStockTransfers">Stock Transfers</button>
  </div>
  <input type="search" id="search" placeholder="Search by number, party...">
  <button class="primary" id="newBtn">+ New</button>
</div>

<main>
  <div id="listArea"></div>
</main>

<div id="editorOverlay">
  <div class="editor-card" id="editorCard"></div>
</div>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  // ---- Foreground-tab auth refresh signaling (§3/§14) ----
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.oht !== 'active') return;
    sb.auth.startAutoRefresh ? (d.active ? sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh()) : null;
  });

  var state = {
    vtype: 'sale',
    vouchers: [],
    parties: [],
    items: [],
    companies: [],
    warehouses: [],
    itemUnits: {}, // item_id -> [{unit,factor}]
    editing: null, // { isNew, original, header, lines, originalLines }
  };

  // ---------------------------------------------------------------
  // Master-data cache (needed by the editor)
  // ---------------------------------------------------------------
  async function loadMasters() {
    var [{ data: parties }, { data: items }, { data: companies }, { data: warehouses }, { data: units }] = await Promise.all([
      sb.from('parties').select('id,name,kind,city,credit_days').is('deleted_at', null).order('name'),
      sb.from('items').select('id,name,unit,sale_rate,buy_rate,tax_pct,stock_qty').is('deleted_at', null).order('name'),
      sb.from('companies').select('id,name,is_default').is('deleted_at', null).order('name'),
      sb.from('warehouses').select('id,name,is_default').eq('active', true).is('deleted_at', null).order('name'),
      sb.from('item_units').select('id,item_id,unit,factor').is('deleted_at', null)
    ]);
    state.parties = parties || [];
    state.items = items || [];
    state.companies = companies || [];
    state.warehouses = warehouses || [];
    state.itemUnits = {};
    (units || []).forEach(function (u) {
      (state.itemUnits[u.item_id] = state.itemUnits[u.item_id] || []).push(u);
    });
  }

  function fmtMoney(n) {
    n = Number(n || 0);
    return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ---------------------------------------------------------------
  // List view
  // ---------------------------------------------------------------
  async function loadList() {
    var q = sb.from('vouchers')
      .select('id,vno,vdate,party_id,grand_total,paid,deleted_at')
      .eq('vtype', state.vtype)
      .is('deleted_at', null)
      .order('vdate', { ascending: false })
      .order('vno', { ascending: false })
      .limit(500);
    var { data, error } = await q;
    if (error) { document.getElementById('listArea').innerHTML = '<p class="err">' + error.message + '</p>'; return; }
    state.vouchers = data || [];
    renderList();
  }

  function partyName(id) {
    var p = state.parties.filter(function (x) { return x.id === id; })[0];
    return p ? p.name : '—';
  }

  function renderList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = state.vouchers.filter(function (v) {
      if (!term) return true;
      return (v.vno || '').toLowerCase().indexOf(term) >= 0 ||
             partyName(v.party_id).toLowerCase().indexOf(term) >= 0;
    });

    var byDate = {};
    rows.forEach(function (v) { (byDate[v.vdate] = byDate[v.vdate] || []).push(v); });
    var dates = Object.keys(byDate).sort().reverse();

    var html = '';
    if (!dates.length) html = '<p style="color:var(--muted)">No ' + state.vtype + ' invoices yet.</p>';
    dates.forEach(function (d) {
      html += '<div class="date-group">' + d + '</div><table><tbody>';
      byDate[d].forEach(function (v) {
        var balance = v.grand_total - v.paid;
        html += '<tr class="row" data-id="' + v.id + '">' +
          '<td style="width:110px"><strong>' + v.vno + '</strong></td>' +
          '<td>' + partyName(v.party_id) + '</td>' +
          '<td style="text-align:right">' + fmtMoney(v.grand_total) + '</td>' +
          '<td style="text-align:right;width:140px">' +
            (balance > 0.004 ? '<span class="badge" style="color:#f59e0b">Due ' + fmtMoney(balance) + '</span>' : '<span class="badge" style="color:var(--ok)">Paid</span>') +
          '</td></tr>';
      });
      html += '</tbody></table>';
    });
    document.getElementById('listArea').innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
      tr.addEventListener('click', function () { openEditor(tr.dataset.id); });
    });
  }

  document.getElementById('search').addEventListener('input', function () {
    if (state.mode === 'return') renderReturnsList();
    else if (state.mode === 'quotation' || state.mode === 'po') renderDocsList(state.mode);
    else if (state.mode === 'sinvoice' || state.mode === 'squote') renderServiceDocsList(state.mode);
    else if (state.mode === 'transfer') renderTransfersList();
    else renderList();
  });
  document.getElementById('tabSale').addEventListener('click', function () { switchTab('sale'); });
  document.getElementById('tabPurchase').addEventListener('click', function () { switchTab('purchase'); });
  document.getElementById('tabReturns').addEventListener('click', function () { switchTab('return'); });
  document.getElementById('tabQuotations').addEventListener('click', function () { switchTab('quotation'); });
  document.getElementById('tabPOs').addEventListener('click', function () { switchTab('po'); });
  document.getElementById('tabServiceInvoices').addEventListener('click', function () { switchTab('sinvoice'); });
  document.getElementById('tabServiceQuotations').addEventListener('click', function () { switchTab('squote'); });
  document.getElementById('tabStockTransfers').addEventListener('click', function () { switchTab('transfer'); });
  state.mode = 'voucher';
  var ALL_TABS = { sale: 'tabSale', purchase: 'tabPurchase', return: 'tabReturns', quotation: 'tabQuotations', po: 'tabPOs', sinvoice: 'tabServiceInvoices', squote: 'tabServiceQuotations', transfer: 'tabStockTransfers' };
  function switchTab(vt) {
    Object.keys(ALL_TABS).forEach(function (k) { document.getElementById(ALL_TABS[k]).classList.toggle('active', k === vt); });
    if (vt === 'return') {
      state.mode = 'return';
      loadReturnsList();
    } else if (vt === 'quotation' || vt === 'po') {
      state.mode = vt;
      loadDocsList(vt);
    } else if (vt === 'sinvoice' || vt === 'squote') {
      state.mode = vt;
      loadServiceDocsList(vt);
    } else if (vt === 'transfer') {
      state.mode = 'transfer';
      loadTransfersList();
    } else {
      state.mode = 'voucher';
      state.vtype = vt;
      loadList();
    }
  }
  document.getElementById('newBtn').addEventListener('click', function () {
    if (state.mode === 'return') openReturnEditor(null);
    else if (state.mode === 'quotation' || state.mode === 'po') openDocEditor(state.mode, null);
    else if (state.mode === 'sinvoice' || state.mode === 'squote') openServiceDocEditor(state.mode, null);
    else if (state.mode === 'transfer') openTransferEditor(null);
    else openEditor(null);
  });

  // ---------------------------------------------------------------
  // Editor
  // ---------------------------------------------------------------
  var IGNORE_HEADER = ['id','vno','created_at','created_by','updated_at','updated_by','version','deleted_at','sub_total','tax_total','grand_total'];

  function blankHeader() {
    var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
    return {
      vtype: state.vtype, vdate: new Date().toISOString().slice(0, 10), due_date: null,
      party_id: null, company_id: defCompany ? defCompany.id : null, narration: '',
      tax_on: false, discount: 0, paid: 0,
      loading_on: false, loading_amt: 0, cartage_on: false, cartage_amt: 0,
      cutting_on: false, cutting_amt: 0
    };
  }

  function blankLine() {
    return { id: null, item_id: null, qty: 0, rate: 0, tax_pct: 0, amount: 0,
      pcs_on: false, pcs: null, warehouse_id: defaultWarehouseId(), sale_unit: null, sale_qty: null, unit_factor: 1 };
  }

  function defaultWarehouseId() {
    var w = state.warehouses.filter(function (x) { return x.is_default; })[0] || state.warehouses[0];
    return w ? w.id : null;
  }

  async function openEditor(id) {
    await loadMasters();
    if (!id) {
      state.editing = { isNew: true, id: null, header: blankHeader(), lines: [blankLine()], originalHeader: null, originalLines: [] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from('vouchers').select('*').eq('id', id).single(),
        sb.from('voucher_lines').select('*').eq('voucher_id', id).order('line_no')
      ]);
      if (!header) { alert('This record was deleted by someone else.'); loadList(); return; }
      // Snapshot captured ONCE, at open time — never re-derived at save time (§14/§25's critical rule).
      state.editing = {
        isNew: false, id: id,
        header: JSON.parse(JSON.stringify(header)),
        lines: JSON.parse(JSON.stringify(lines || [])),
        originalHeader: JSON.parse(JSON.stringify(header)),
        originalLines: JSON.parse(JSON.stringify(lines || []))
      };
    }
    renderEditor();
    document.getElementById('editorOverlay').classList.add('open');
  }

  function closeEditor() {
    document.getElementById('editorOverlay').classList.remove('open');
    state.editing = null;
  }

  function partyOptions(selected) {
    var role = state.vtype === 'sale' ? ['customer', 'both'] : ['supplier', 'both'];
    return state.parties.filter(function (p) { return role.indexOf(p.kind) >= 0; })
      .map(function (p) { return '<option value="' + p.id + '"' + (p.id === selected ? ' selected' : '') + '>' + p.name + '</option>'; }).join('');
  }
  function itemOptions(selected) {
    return '<option value="">Pick item…</option>' + state.items.map(function (it) {
      return '<option value="' + it.id + '"' + (it.id === selected ? ' selected' : '') + '>' + it.name + '</option>';
    }).join('');
  }
  function warehouseOptions(selected) {
    return state.warehouses.map(function (w) {
      return '<option value="' + w.id + '"' + (w.id === selected ? ' selected' : '') + '>' + w.name + '</option>';
    }).join('');
  }

  function computeTotals() {
    var e = state.editing;
    var sub = 0, tax = 0;
    e.lines.forEach(function (l) {
      var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0);
      l.amount = amt;
      sub += amt;
      if (e.header.tax_on) tax += amt * (Number(l.tax_pct) || 0) / 100;
    });
    var extra = 0;
    if (e.header.loading_on) extra += Number(e.header.loading_amt) || 0;
    if (e.header.cartage_on) extra += Number(e.header.cartage_amt) || 0;
    if (e.header.cutting_on) extra += Number(e.header.cutting_amt) || 0;
    var disc = Number(e.header.discount) || 0;
    // Loading/cartage/cutting are billed to the party either way (sale or
    // purchase) — §21 governs their P&L classification (Other Income vs.
    // landed cost), not whether they appear on the invoice total.
    var grand = sub - disc + tax + extra;
    return { sub: sub, tax: tax, grand: grand, extra: extra };
  }

  function renderEditor() {
    var e = state.editing;
    var h = e.header;
    var totals = computeTotals();
    var isSale = state.vtype === 'sale';
    var showCompany = state.companies.length > 1;
    var showWarehouseCol = state.warehouses.length > 1;

    var html = '<h2>' + (isSale ? 'Sales Invoice' : 'Purchase Bill') + (e.isNew ? ' — New' : ' — ' + h.vno) + '</h2>';
    html += '<div class="grid">';
    if (showCompany) {
      html += '<div><label>Firm</label><select id="f_company">' +
        state.companies.map(function (c) { return '<option value="' + c.id + '"' + (c.id === h.company_id ? ' selected' : '') + '>' + c.name + '</option>'; }).join('') +
        '</select></div>';
    }
    html += '<div><label>Date</label><input type="date" id="f_vdate" value="' + h.vdate + '"></div>';
    html += '<div><label>Due date</label><input type="date" id="f_due" value="' + (h.due_date || '') + '"></div>';
    html += '<div><label>' + (isSale ? 'Sold to' : 'Bought from') + '</label><select id="f_party"><option value="">Pick party…</option>' + partyOptions(h.party_id) + '</select></div>';
    html += '<div><label><input type="checkbox" id="f_taxon"' + (h.tax_on ? ' checked' : '') + '> Sales tax</label></div>';
    html += '<div><label>Discount</label><input type="number" step="0.01" id="f_discount" value="' + h.discount + '"></div>';
    html += '<div><label>Paid now</label><input type="number" step="0.01" id="f_paid" value="' + h.paid + '"></div>';
    html += '</div>';

    if (h.party_id) {
      var p = state.parties.filter(function (x) { return x.id === h.party_id; })[0];
      html += '<div class="party-hint" id="partyHint">Loading balance…</div>';
      setTimeout(function () { loadPartyBalance(h.party_id); }, 0);
    }

    html += '<div class="charges-row">';
    ['loading', 'cartage', 'cutting'].forEach(function (k) {
      var label = k.charAt(0).toUpperCase() + k.slice(1);
      html += '<div class="chg"><label style="margin:0"><input type="checkbox" id="f_' + k + '_on"' + (h[k + '_on'] ? ' checked' : '') + '> ' + label + '</label>' +
        '<input type="number" step="0.01" style="width:100px" id="f_' + k + '_amt" value="' + h[k + '_amt'] + '"></div>';
    });
    html += '</div>';

    html += '<table class="lines-table"><thead><tr><th>Item</th><th style="width:90px">Qty</th>' +
      (isSale ? '<th style="width:110px">Unit</th>' : '') +
      '<th style="width:90px">Rate</th>' + (h.tax_on ? '<th style="width:70px">Tax%</th>' : '') +
      (showWarehouseCol ? '<th style="width:120px">Warehouse</th>' : '') +
      '<th style="width:100px">Amount</th><th style="width:30px"></th></tr></thead><tbody id="linesBody"></tbody></table>';
    html += '<button type="button" id="addLineBtn" style="margin-top:8px">+ Add line</button>';

    html += '<div><label style="margin-top:12px">Narration</label><textarea id="f_narration">' + (h.narration || '') + '</textarea></div>';

    html += '<div class="totals"><table>' +
      '<tr><td>Sub total</td><td>' + fmtMoney(totals.sub) + '</td></tr>' +
      '<tr><td>Discount</td><td>-' + fmtMoney(h.discount) + '</td></tr>' +
      (h.tax_on ? '<tr><td>Tax</td><td>' + fmtMoney(totals.tax) + '</td></tr>' : '') +
      (totals.extra ? '<tr><td>Loading/Cartage/Cutting</td><td>' + fmtMoney(totals.extra) + '</td></tr>' : '') +
      '<tr><td><strong>Grand total</strong></td><td><strong>' + fmtMoney(totals.grand) + '</strong></td></tr>' +
      '<tr><td>Paid</td><td>' + fmtMoney(h.paid) + '</td></tr>' +
      '<tr><td>Balance</td><td>' + fmtMoney(totals.grand - h.paid) + '</td></tr>' +
      '</table></div>';

    html += '<div class="err" id="editorErr"></div>';
    html += '<div class="actions">' +
      (e.isNew ? '' : '<button class="danger" id="deleteBtn">Delete</button><button id="printBtn">Print</button>') +
      '<button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div>';

    document.getElementById('editorCard').innerHTML = html;
    renderLines();
    wireEditorEvents();
  }

  async function loadPartyBalance(partyId) {
    // Lightweight running balance hint (full ledger logic lives in reports.html/§11).
    var el = document.getElementById('partyHint');
    if (!el) return;
    var { data: p } = await sb.from('parties').select('opening,opening_side').eq('id', partyId).single();
    var { data: vs } = await sb.from('vouchers').select('vtype,grand_total,paid').eq('party_id', partyId).is('deleted_at', null);
    var bal = p ? (p.opening_side === 'dr' ? p.opening : -p.opening) : 0;
    (vs || []).forEach(function (v) {
      if (v.vtype === 'sale') bal += v.grand_total - v.paid;
      else bal -= v.grand_total - v.paid;
    });
    el.textContent = 'Current balance: ' + fmtMoney(Math.abs(bal)) + ' ' + (bal >= 0 ? 'Dr' : 'Cr');
  }

  function renderLines() {
    var e = state.editing;
    var isSale = state.vtype === 'sale';
    var showWarehouseCol = state.warehouses.length > 1;
    var body = document.getElementById('linesBody');
    body.innerHTML = e.lines.map(function (l, idx) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      var units = item ? (state.itemUnits[item.id] || []) : [];
      var unitCell = '';
      if (isSale && units.length) {
        unitCell = '<td><select data-i="' + idx + '" data-f="sale_unit" class="lf"><option value="">' + (item ? item.unit : '') + '</option>' +
          units.map(function (u) { return '<option value="' + u.unit + '"' + (u.unit === l.sale_unit ? ' selected' : '') + '>' + u.unit + '</option>'; }).join('') +
          '</select></td>';
      } else if (isSale) {
        unitCell = '<td style="color:var(--muted);font-size:12px">' + (item ? item.unit : '') + '</td>';
      }
      return '<tr>' +
        '<td><select data-i="' + idx + '" data-f="item_id" class="lf">' + itemOptions(l.item_id) + '</select></td>' +
        '<td><input type="number" step="0.001" data-i="' + idx + '" data-f="qty" class="lf" value="' + (l.sale_unit ? (l.sale_qty != null ? l.sale_qty : '') : l.qty) + '"></td>' +
        unitCell +
        '<td><input type="number" step="0.01" data-i="' + idx + '" data-f="rate" class="lf" value="' + l.rate + '"></td>' +
        (e.header.tax_on ? '<td><input type="number" step="0.01" data-i="' + idx + '" data-f="tax_pct" class="lf" value="' + l.tax_pct + '"></td>' : '') +
        (showWarehouseCol ? '<td><select data-i="' + idx + '" data-f="warehouse_id" class="lf">' + warehouseOptions(l.warehouse_id) + '</select></td>' : '') +
        '<td style="text-align:right">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</td>' +
        '<td><button type="button" data-i="' + idx + '" class="rmLine" style="color:var(--danger)">✕</button></td>' +
        '</tr>';
    }).join('');

    Array.prototype.forEach.call(body.querySelectorAll('.lf'), function (el) {
      el.addEventListener('change', function () { onLineFieldChange(el); });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.rmLine'), function (btn) {
      btn.addEventListener('click', function () {
        state.editing.lines.splice(Number(btn.dataset.i), 1);
        renderLines();
        refreshTotalsDisplay();
      });
    });
  }

  function onLineFieldChange(el) {
    var idx = Number(el.dataset.i), field = el.dataset.f;
    var line = state.editing.lines[idx];
    var val = el.type === 'number' ? Number(el.value) : el.value;

    if (field === 'qty') {
      // qty is ALWAYS the base-unit, stock/cost-affecting quantity. When an
      // alt sale unit is active, what the user types is sale_qty, and
      // qty = sale_qty × unit_factor, recomputed on every keystroke (§9).
      if (line.sale_unit) {
        line.sale_qty = val;
        line.qty = (Number(val) || 0) * (Number(line.unit_factor) || 1);
      } else {
        line.qty = val;
        line.sale_qty = null;
      }
    } else {
      line[field] = val;
    }

    if (field === 'item_id') {
      var item = state.items.filter(function (x) { return x.id === val; })[0];
      if (item) {
        if (!line.rate) line.rate = state.vtype === 'sale' ? item.sale_rate : item.buy_rate;
        if (!line.tax_pct) line.tax_pct = item.tax_pct;
      }
      line.sale_unit = null; line.sale_qty = null; line.unit_factor = 1;
      renderLines();
    }
    if (field === 'sale_unit') {
      var u = (state.itemUnits[line.item_id] || []).filter(function (x) { return x.unit === val; })[0];
      line.unit_factor = u ? u.factor : 1;
      if (!val) { line.sale_qty = null; } // reverted to base unit: qty typed directly from now on
      else { line.sale_qty = line.sale_qty != null ? line.sale_qty : line.qty; line.qty = (Number(line.sale_qty) || 0) * line.unit_factor; }
      renderLines();
    }
    refreshTotalsDisplay();
  }

  function refreshTotalsDisplay() { renderEditor(); }

  function wireEditorEvents() {
    var e = state.editing;
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    document.getElementById('addLineBtn').addEventListener('click', function () {
      e.lines.push(blankLine()); renderLines();
    });
    ['vdate', 'due', 'party', 'discount', 'paid', 'narration'].forEach(function (k) {
      var el = document.getElementById('f_' + k);
      if (el) el.addEventListener('input', function () {
        var map = { vdate: 'vdate', due: 'due_date', party: 'party_id', discount: 'discount', paid: 'paid', narration: 'narration' };
        e.header[map[k]] = el.type === 'number' ? Number(el.value) : (el.value || null);
      });
    });
    var companyEl = document.getElementById('f_company');
    if (companyEl) companyEl.addEventListener('change', function () { e.header.company_id = companyEl.value; });
    document.getElementById('f_taxon').addEventListener('change', function () {
      e.header.tax_on = document.getElementById('f_taxon').checked; renderEditor();
    });
    ['loading', 'cartage', 'cutting'].forEach(function (k) {
      document.getElementById('f_' + k + '_on').addEventListener('change', function () {
        e.header[k + '_on'] = document.getElementById('f_' + k + '_on').checked; refreshTotalsDisplay();
      });
      document.getElementById('f_' + k + '_amt').addEventListener('input', function () {
        e.header[k + '_amt'] = Number(document.getElementById('f_' + k + '_amt').value) || 0; refreshTotalsDisplay();
      });
    });
    document.getElementById('saveBtn').addEventListener('click', saveVoucher);
    var delBtn = document.getElementById('deleteBtn');
    if (delBtn) delBtn.addEventListener('click', deleteVoucher);
    var printBtn = document.getElementById('printBtn');
    if (printBtn) printBtn.addEventListener('click', printVoucher);
  }

  // ---------------------------------------------------------------
  // Validation (§9's exact conditions)
  // ---------------------------------------------------------------
  function validate() {
    var e = state.editing;
    if (!e.header.party_id) return 'Pick a party first';
    var validLines = e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) return 'Add at least one item with a quantity';
    for (var i = 0; i < e.lines.length; i++) {
      var l = e.lines[i];
      if (l.sale_unit && !l.unit_factor) {
        var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
        return "'" + (item ? item.name : 'Item') + "' par " + l.sale_unit + " chuna hai — conversion likhna zaroori hai (1 " + l.sale_unit + " = kitne " + (item ? item.unit : 'base') + ").";
      }
    }
    return null;
  }

  // ---------------------------------------------------------------
  // Save — via smart_merge_update / smart_merge_lines / apply_merged_lines
  // ---------------------------------------------------------------
  async function saveVoucher() {
    var e = state.editing;
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    var vErr = validate();
    if (vErr) { errEl.textContent = vErr; return; }

    var totals = computeTotals();

    var payload = Object.assign({}, e.header, {
      sub_total: totals.sub, tax_total: totals.tax, grand_total: totals.grand
    });

    try {
      if (e.isNew) {
        var { data: inserted, error: insErr } = await sb.from('vouchers').insert(payload).select().single();
        if (insErr) return handleSaveError(insErr, errEl);
        var linesPayload = e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; })
          .map(function (l) { var c = Object.assign({}, l); delete c.id; return c; });
        var { error: lineErr } = await sb.from('voucher_lines').insert(
          linesPayload.map(function (l) { return Object.assign({}, l, { voucher_id: inserted.id }); })
        );
        if (lineErr) { errEl.textContent = lineErr.message; return; }

        // If this invoice was created via "Convert to Sale/Purchase" from a
        // quotation/PO, stamp the SOURCE doc as converted only now that the
        // real invoice actually exists — never before, so a cancelled
        // conversion never leaves an orphaned "converted" doc (§15/§16).
        if (e.convertingFrom && typeof DOC_CONFIG !== 'undefined') {
          var srcCfg = DOC_CONFIG[e.convertingFrom.type];
          await sb.from(srcCfg.table).update({ status: 'converted', converted_invoice_id: inserted.id, converted_at: new Date().toISOString() }).eq('id', e.convertingFrom.id);
        }
        closeEditor(); loadList();
        return;
      }

      // Header merge
      var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
        p_table: 'vouchers', p_id: e.id, p_original: e.originalHeader, p_new: payload, p_ignore: IGNORE_HEADER
      });
      if (mergeErr) return handleSaveError(mergeErr, errEl);
      if (mergeRes.status === 'deleted') { errEl.textContent = "'" + e.originalHeader.vno + "' kisi aur ne delete kar diya hai"; return; }
      if (mergeRes.status === 'conflict') {
        // one automatic retry against the fresh current state (§14/§27)
        var retryOriginal = mergeRes.current;
        var { data: retryRes, error: retryErr } = await sb.rpc('smart_merge_update', {
          p_table: 'vouchers', p_id: e.id, p_original: retryOriginal, p_new: payload, p_ignore: IGNORE_HEADER
        });
        if (retryErr) return handleSaveError(retryErr, errEl);
        if (retryRes.status === 'conflict') {
          errEl.textContent = "'" + e.originalHeader.vno + "' mein '" + retryRes.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
          return;
        }
      }

      // Line merge
      var newLines = e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
      var { data: lineMerge, error: lmErr } = await sb.rpc('smart_merge_lines', {
        p_line_table: 'voucher_lines', p_fk_col: 'voucher_id', p_fk_id: e.id,
        p_original_lines: e.originalLines, p_new_lines: newLines
      });
      if (lmErr) return handleSaveError(lmErr, errEl);
      if (lineMerge.status === 'conflict') {
        errEl.textContent = "'" + e.originalHeader.vno + "' mein '" + lineMerge.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
        return;
      }
      await sb.rpc('apply_merged_lines', { p_line_table: 'voucher_lines', p_fk_col: 'voucher_id', p_fk_id: e.id, p_result_lines: lineMerge.lines });

      closeEditor();
      loadList();
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  function handleSaveError(error, errEl) {
    if (error.code === '23505') {
      errEl.textContent = 'Ye number pehle se istemal ho chuka — dobara button dabakar naya number lein';
    } else if (!navigator.onLine || /network|fetch/i.test(error.message || '')) {
      errEl.textContent = 'No internet — your change is saved locally and will sync when back online.';
    } else {
      errEl.textContent = error.message;
    }
  }

  async function deleteVoucher() {
    var e = state.editing;
    if (!confirm('Delete ' + e.header.vno + '? It can be restored from the Recycle Bin.')) return;
    var { error } = await sb.from('vouchers').update({ deleted_at: new Date().toISOString() }).eq('id', e.id);
    if (error) { document.getElementById('editorErr').textContent = error.message; return; }
    closeEditor(); loadList();
  }

  // ---------------------------------------------------------------
  // Sales Returns (§6/§18) — always tied to a specific original sale.
  // Returnable-qty cap and cost-carry-back are enforced authoritatively
  // by DB triggers (tested directly against the database, §31 step 5/8);
  // this UI just needs to pick a sale + line(s) and let the trigger reject
  // anything invalid.
  // ---------------------------------------------------------------
  var returnsState = { returns: [] };

  async function loadReturnsList() {
    var { data, error } = await sb.from('sales_returns').select('id,rno,rdate,party_id,grand_total,sale_id').is('deleted_at', null)
      .order('rdate', { ascending: false }).order('rno', { ascending: false }).limit(500);
    if (error) { document.getElementById('listArea').innerHTML = '<p class="err">' + error.message + '</p>'; return; }
    returnsState.returns = data || [];
    renderReturnsList();
  }

  function renderReturnsList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = returnsState.returns.filter(function (r) {
      return !term || (r.rno || '').toLowerCase().indexOf(term) >= 0 || partyName(r.party_id).toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '<table><tbody>' : '<p style="color:var(--muted)">No sales returns yet.</p>';
    rows.forEach(function (r) {
      html += '<tr class="row" data-id="' + r.id + '"><td style="width:110px"><strong>' + r.rno + '</strong></td>' +
        '<td>' + r.rdate + '</td><td>' + partyName(r.party_id) + '</td><td style="text-align:right">' + fmtMoney(r.grand_total) + '</td></tr>';
    });
    if (rows.length) html += '</tbody></table>';
    document.getElementById('listArea').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
      tr.addEventListener('click', function () { openReturnEditor(tr.dataset.id); });
    });
  }

  var returnEditing = null;

  async function openReturnEditor(id) {
    await loadMasters();
    if (!id) {
      returnEditing = { isNew: true, id: null, sale: null, saleLines: [], picked: [] };
    } else {
      var { data: header } = await sb.from('sales_returns').select('*').eq('id', id).single();
      if (!header) { alert('This record was deleted by someone else.'); loadReturnsList(); return; }
      var { data: lines } = await sb.from('sales_return_lines').select('*').eq('return_id', id);
      returnEditing = { isNew: false, id: id, header: header, picked: lines || [] };
    }
    renderReturnEditor();
    document.getElementById('editorOverlay').classList.add('open');
  }

  async function renderReturnEditor() {
    var r = returnEditing;
    var html = '<h2>Sales Return' + (r.isNew ? ' — New' : ' — ' + r.header.rno) + '</h2>';

    if (r.isNew) {
      html += '<div class="grid"><div><label>Pick original sale</label><select id="rt_sale"><option value="">Pick…</option></select></div></div>';
      // Sales list is fetched fresh here rather than reused from state.vouchers,
      // since the Sales tab may never have been opened this session.
      var { data: sales } = await sb.from('vouchers').select('id,vno,vdate,party_id,grand_total').eq('vtype', 'sale').is('deleted_at', null).order('vdate', { ascending: false }).limit(200);
      document.getElementById('editorCard').innerHTML = html;
      var sel = document.getElementById('rt_sale');
      sel.innerHTML = '<option value="">Pick…</option>' + sales.map(function (v) {
        return '<option value="' + v.id + '">' + v.vno + ' — ' + partyName(v.party_id) + ' (' + v.vdate + ')</option>';
      }).join('');
      sel.addEventListener('change', async function () {
        var saleId = sel.value;
        if (!saleId) return;
        var { data: saleHeader } = await sb.from('vouchers').select('*').eq('id', saleId).single();
        var { data: saleLines } = await sb.from('voucher_lines').select('*').eq('voucher_id', saleId);
        var { data: existingReturns } = await sb.from('sales_return_lines').select('sale_line_id,qty').in('sale_line_id', (saleLines || []).map(function (l) { return l.id; }));
        r.sale = saleHeader;
        r.saleLines = (saleLines || []).map(function (l) {
          var already = (existingReturns || []).filter(function (er) { return er.sale_line_id === l.id; }).reduce(function (s, er) { return s + Number(er.qty); }, 0);
          return Object.assign({}, l, { returnable: l.qty - already, returnQty: 0 });
        });
        renderReturnEditorLines();
      });
      return;
    }

    document.getElementById('editorCard').innerHTML = html + '<div id="rt_linesWrap"></div>' +
      '<div class="err" id="editorErr"></div><div class="actions"><button class="danger" id="rt_deleteBtn">Delete</button><button id="cancelBtn">Cancel</button></div>';
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    document.getElementById('rt_deleteBtn').addEventListener('click', deleteReturn);
    var linesHtml = '<table><thead><tr><th>Item</th><th>Qty returned</th><th>Rate</th><th>Amount</th></tr></thead><tbody>';
    r.picked.forEach(function (l) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      linesHtml += '<tr><td>' + (item ? item.name : '') + '</td><td>' + l.qty + '</td><td>' + l.rate + '</td><td>' + fmtMoney(l.amount) + '</td></tr>';
    });
    linesHtml += '</tbody></table>';
    document.getElementById('rt_linesWrap').innerHTML = linesHtml;
  }

  function renderReturnEditorLines() {
    var r = returnEditing;
    var html = '<h2>Sales Return — New (against ' + r.sale.vno + ')</h2>';
    html += '<table><thead><tr><th>Item</th><th>Sold qty</th><th>Still returnable</th><th>Return qty</th><th>Rate</th></tr></thead><tbody>';
    r.saleLines.forEach(function (l, idx) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      html += '<tr><td>' + (item ? item.name : '') + '</td><td>' + l.qty + '</td><td>' + l.returnable + '</td>' +
        '<td><input type="number" step="0.001" min="0" max="' + l.returnable + '" data-idx="' + idx + '" class="rtQty" value="' + l.returnQty + '" style="width:90px"></td>' +
        '<td>' + l.rate + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="err" id="editorErr"></div><div class="actions"><button id="cancelBtn">Cancel</button><button class="primary" id="rt_saveBtn">Save Return</button></div>';
    document.getElementById('editorCard').innerHTML = '<h2>Sales Return — New</h2>' + html;
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    Array.prototype.forEach.call(document.querySelectorAll('.rtQty'), function (el) {
      el.addEventListener('input', function () { r.saleLines[Number(el.dataset.idx)].returnQty = Number(el.value) || 0; });
    });
    document.getElementById('rt_saveBtn').addEventListener('click', saveReturn);
  }

  async function saveReturn() {
    var r = returnEditing;
    var errEl = document.getElementById('editorErr');
    var toReturn = r.saleLines.filter(function (l) { return l.returnQty > 0; });
    if (!toReturn.length) { errEl.textContent = 'Enter a return quantity for at least one line'; return; }
    for (var i = 0; i < toReturn.length; i++) {
      if (toReturn[i].returnQty > toReturn[i].returnable + 0.0001) {
        errEl.textContent = 'Return quantity exceeds what is still returnable on that line';
        return;
      }
    }

    var { data: inserted, error: insErr } = await sb.from('sales_returns').insert({
      sale_id: r.sale.id, party_id: r.sale.party_id, rdate: new Date().toISOString().slice(0, 10),
      subtotal: toReturn.reduce(function (s, l) { return s + l.returnQty * l.rate; }, 0),
      grand_total: toReturn.reduce(function (s, l) { return s + l.returnQty * l.rate; }, 0)
    }).select().single();
    if (insErr) { errEl.textContent = insErr.message; return; }

    var { error: lineErr } = await sb.from('sales_return_lines').insert(
      toReturn.map(function (l) {
        return { return_id: inserted.id, sale_line_id: l.id, item_id: l.item_id, qty: l.returnQty, rate: l.rate, amount: l.returnQty * l.rate, warehouse_id: l.warehouse_id };
      })
    );
    if (lineErr) { errEl.textContent = lineErr.message; return; } // e.g. the DB's own returnable-qty cap trigger firing on a race

    closeEditor();
    loadReturnsList();
  }

  async function deleteReturn() {
    var r = returnEditing;
    if (!confirm('Delete return ' + r.header.rno + '?')) return;
    var { error } = await sb.from('sales_returns').update({ deleted_at: new Date().toISOString() }).eq('id', r.id);
    if (error) { document.getElementById('editorErr').textContent = error.message; return; }
    closeEditor(); loadReturnsList();
  }

  // ---------------------------------------------------------------
  // Quotations (goods) + Purchase Orders (§15/§16) — paper-only documents,
  // zero stock/ledger impact until converted into a real Sales/Purchase
  // Invoice. Reuses the shared smart_merge save path (§8's "build once").
  // ---------------------------------------------------------------
  var DOC_CONFIG = {
    quotation: { table: 'quotations', lineTable: 'quotation_lines', fk: 'quotation_id', numField: 'qno', dateField: 'qdate',
      partyRoles: ['customer', 'both'], hasCharges: true, convertVtype: 'sale', convertLabel: 'Convert to Sale', title: 'Quotation' },
    po: { table: 'purchase_orders', lineTable: 'po_lines', fk: 'po_id', numField: 'pono', dateField: 'podate',
      partyRoles: ['supplier', 'both'], hasCharges: false, convertVtype: 'purchase', convertLabel: 'Convert to Purchase', title: 'Purchase Order' }
  };
  var docsState = { list: [] };
  var docEditing = null;
  var DOC_IGNORE = ['id', 'created_at', 'created_by', 'updated_at', 'updated_by', 'version', 'deleted_at', 'sub_total', 'tax_total', 'grand_total', 'status', 'converted_invoice_id', 'converted_at'];
  var DOC_IGNORE_MAP = { quotation: DOC_IGNORE.concat(['qno']), po: DOC_IGNORE.concat(['pono']) };

  async function loadDocsList(type) {
    var cfg = DOC_CONFIG[type];
    var { data, error } = await sb.from(cfg.table).select('*').is('deleted_at', null)
      .order(cfg.dateField, { ascending: false }).limit(500);
    if (error) { document.getElementById('listArea').innerHTML = '<p class="err">' + error.message + '</p>'; return; }
    docsState.list = data || [];
    renderDocsList(type);
  }

  function renderDocsList(type) {
    var cfg = DOC_CONFIG[type];
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = docsState.list.filter(function (d) {
      return !term || (d[cfg.numField] || '').toLowerCase().indexOf(term) >= 0 || partyName(d.party_id).toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '<table><tbody>' : '<p style="color:var(--muted)">No ' + cfg.title.toLowerCase() + 's yet.</p>';
    rows.forEach(function (d) {
      html += '<tr class="row" data-id="' + d.id + '"><td style="width:110px"><strong>' + d[cfg.numField] + '</strong></td>' +
        '<td>' + d[cfg.dateField] + '</td><td>' + partyName(d.party_id) + '</td><td style="text-align:right">' + fmtMoney(d.grand_total) + '</td>' +
        '<td><span class="badge">' + d.status + '</span></td></tr>';
    });
    if (rows.length) html += '</tbody></table>';
    document.getElementById('listArea').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
      tr.addEventListener('click', function () { openDocEditor(type, tr.dataset.id); });
    });
  }

  function blankDocHeader(type) {
    var cfg = DOC_CONFIG[type];
    var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
    var h = { party_id: null, company_id: defCompany ? defCompany.id : null, narration: '', tax_on: false, discount: 0, status: 'open' };
    h[cfg.dateField] = new Date().toISOString().slice(0, 10);
    if (cfg.hasCharges) { h.loading_on = false; h.loading_amt = 0; h.cartage_on = false; h.cartage_amt = 0; h.cutting_on = false; h.cutting_amt = 0; }
    return h;
  }

  async function openDocEditor(type, id) {
    await loadMasters();
    var cfg = DOC_CONFIG[type];
    if (!id) {
      docEditing = { type: type, isNew: true, id: null, header: blankDocHeader(type), lines: [{ id: null, item_id: null, qty: 0, rate: 0, tax_pct: 0, amount: 0 }], originalHeader: null, originalLines: [] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from(cfg.table).select('*').eq('id', id).single(),
        sb.from(cfg.lineTable).select('*').eq(cfg.fk, id).order('line_no')
      ]);
      if (!header) { alert('This record was deleted by someone else.'); loadDocsList(type); return; }
      docEditing = {
        type: type, isNew: false, id: id,
        header: JSON.parse(JSON.stringify(header)), lines: JSON.parse(JSON.stringify(lines || [])),
        originalHeader: JSON.parse(JSON.stringify(header)), originalLines: JSON.parse(JSON.stringify(lines || []))
      };
    }
    renderDocEditor();
    document.getElementById('editorOverlay').classList.add('open');
  }

  function docTotals() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var sub = 0, tax = 0;
    d.lines.forEach(function (l) {
      var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0);
      l.amount = amt; sub += amt;
      if (d.header.tax_on) tax += amt * (Number(l.tax_pct) || 0) / 100;
    });
    var extra = 0;
    if (cfg.hasCharges) {
      if (d.header.loading_on) extra += Number(d.header.loading_amt) || 0;
      if (d.header.cartage_on) extra += Number(d.header.cartage_amt) || 0;
      if (d.header.cutting_on) extra += Number(d.header.cutting_amt) || 0;
    }
    var disc = Number(d.header.discount) || 0;
    return { sub: sub, tax: tax, extra: extra, grand: sub - disc + tax + extra };
  }

  function renderDocEditor() {
    var d = docEditing, cfg = DOC_CONFIG[d.type], h = d.header;
    var totals = docTotals();

  function renderDocLines() {
    var d = docEditing, h = d.header;
    var body = document.getElementById('docLinesBody');
    body.innerHTML = d.lines.map(function (l, idx) {
      return '<tr>' +
        '<td><select data-i="' + idx + '" data-f="item_id" class="dlf">' + itemOptions(l.item_id) + '</select></td>' +
        '<td><input type="number" step="0.001" data-i="' + idx + '" data-f="qty" class="dlf" value="' + l.qty + '"></td>' +
        '<td><input type="number" step="0.01" data-i="' + idx + '" data-f="rate" class="dlf" value="' + l.rate + '"></td>' +
        (h.tax_on ? '<td><input type="number" step="0.01" data-i="' + idx + '" data-f="tax_pct" class="dlf" value="' + l.tax_pct + '"></td>' : '') +
        '<td style="text-align:right">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</td>' +
        '<td><button type="button" data-i="' + idx + '" class="dRmLine" style="color:var(--danger)">✕</button></td></tr>';
    }).join('');
    Array.prototype.forEach.call(body.querySelectorAll('.dlf'), function (el) {
      el.addEventListener('change', function () {
        var idx = Number(el.dataset.i), f = el.dataset.f;
        var line = d.lines[idx];
        line[f] = el.type === 'number' ? Number(el.value) : el.value;
        if (f === 'item_id') {
          var item = state.items.filter(function (x) { return x.id === el.value; })[0];
          if (item) {
            if (!line.rate) line.rate = d.type === 'quotation' ? item.sale_rate : item.buy_rate;
            if (!line.tax_pct) line.tax_pct = item.tax_pct;
          }
        }
        renderDocEditor();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.dRmLine'), function (btn) {
      btn.addEventListener('click', function () { d.lines.splice(Number(btn.dataset.i), 1); renderDocEditor(); });
    });
  }

  async function saveDoc() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    if (!d.header.party_id) { errEl.textContent = 'Pick a party first'; return; }
    var validLines = d.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one item with a quantity'; return; }

    var totals = docTotals();
    var payload = Object.assign({}, d.header, { sub_total: totals.sub, tax_total: totals.tax, grand_total: totals.grand });

    try {
      if (d.isNew) {
        var { data: inserted, error: insErr } = await sb.from(cfg.table).insert(payload).select().single();
        if (insErr) return handleSaveError(insErr, errEl);
        var { error: lineErr } = await sb.from(cfg.lineTable).insert(
          validLines.map(function (l) { var c = Object.assign({}, l); delete c.id; c[cfg.fk] = inserted.id; return c; })
        );
        if (lineErr) { errEl.textContent = lineErr.message; return; }

        if (d.convertingFrom) {
          var srcCfg = DOC_CONFIG[d.convertingFrom.type];
          await sb.from(srcCfg.table).update({ status: 'converted', converted_invoice_id: inserted.id, converted_at: new Date().toISOString() }).eq('id', d.convertingFrom.id);
        }
        closeEditor(); loadDocsList(d.type);
        return;
      }

      var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
        p_table: cfg.table, p_id: d.id, p_original: d.originalHeader, p_new: payload, p_ignore: DOC_IGNORE_MAP[d.type]
      });
      if (mergeErr) return handleSaveError(mergeErr, errEl);
      if (mergeRes.status === 'deleted') { errEl.textContent = "'" + d.originalHeader[cfg.numField] + "' kisi aur ne delete kar diya hai"; return; }
      if (mergeRes.status === 'conflict') {
        var { data: retryRes, error: retryErr } = await sb.rpc('smart_merge_update', {
          p_table: cfg.table, p_id: d.id, p_original: mergeRes.current, p_new: payload, p_ignore: DOC_IGNORE_MAP[d.type]
        });
        if (retryErr) return handleSaveError(retryErr, errEl);
        if (retryRes.status === 'conflict') {
          errEl.textContent = "'" + d.originalHeader[cfg.numField] + "' mein '" + retryRes.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
          return;
        }
      }

      var { data: lineMerge, error: lmErr } = await sb.rpc('smart_merge_lines', {
        p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_original_lines: d.originalLines, p_new_lines: validLines
      });
      if (lmErr) return handleSaveError(lmErr, errEl);
      if (lineMerge.status === 'conflict') {
        errEl.textContent = "'" + d.originalHeader[cfg.numField] + "' mein '" + lineMerge.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
        return;
      }
      await sb.rpc('apply_merged_lines', { p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_result_lines: lineMerge.lines });

      closeEditor(); loadDocsList(d.type);
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  async function deleteDoc() {
    var d = docEditing, cfg = DOC_CONFIG[d.type];
    if (!confirm('Delete ' + d.header[cfg.numField] + '? It never affected stock or the ledger — nothing to reverse.')) return;
    var { error } = await sb.from(cfg.table).update({ deleted_at: new Date().toISOString() }).eq('id', d.id);
    if (error) { document.getElementById('editorErr').textContent = error.message; return; }
    closeEditor(); loadDocsList(d.type);
  }

    var d = docEditing, cfg = DOC_CONFIG[d.type];
    var newHeader = {
      vtype: cfg.convertVtype, vdate: new Date().toISOString().slice(0, 10), due_date: null,
      party_id: d.header.party_id, company_id: d.header.company_id, narration: d.header.narration,
      tax_on: d.header.tax_on, discount: d.header.discount, paid: 0,
      loading_on: cfg.hasCharges ? d.header.loading_on : false, loading_amt: cfg.hasCharges ? d.header.loading_amt : 0,
      cartage_on: cfg.hasCharges ? d.header.cartage_on : false, cartage_amt: cfg.hasCharges ? d.header.cartage_amt : 0,
      cutting_on: cfg.hasCharges ? d.header.cutting_on : false, cutting_amt: cfg.hasCharges ? d.header.cutting_amt : 0
    };
    var newLines = d.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; }).map(function (l) {
      return { id: null, item_id: l.item_id, qty: l.qty, rate: l.rate, tax_pct: l.tax_pct, amount: l.amount, pcs_on: false, pcs: null, warehouse_id: defaultWarehouseId(), sale_unit: null, sale_qty: null, unit_factor: 1 };
    });
    state.vtype = cfg.convertVtype;
    state.editing = { isNew: true, id: null, header: newHeader, lines: newLines, originalHeader: null, originalLines: [], convertingFrom: { type: d.type, id: d.id } };
    renderEditor();

  // ---------------------------------------------------------------
  // Service Invoices + Service Quotations (§6) — totals are DB-
  // authoritative here (recompute_service_invoice_totals trigger), so the
  // client never sends sub_total/tax_total/grand_total: insert the header
  // first (defaults to 0), then insert lines, and the AFTER trigger fills
  // the real totals in automatically.
  // ---------------------------------------------------------------
  var SVC_CONFIG = {
    sinvoice: { table: 'service_invoices', lineTable: 'service_invoice_lines', fk: 'invoice_id', numField: 'sino', dateField: 'sidate', title: 'Service Invoice' },
    squote: { table: 'service_quotations', lineTable: 'service_quotation_lines', fk: 'quotation_id', numField: 'sqno', dateField: 'sqdate', title: 'Service Quotation' }
  };
  var SVC_IGNORE = ['id', 'created_at', 'created_by', 'updated_at', 'updated_by', 'version', 'deleted_at', 'sub_total', 'tax_total', 'grand_total'];
  var svcState = { list: [], services: [] };
  var svcEditing = null;

  async function loadServices() {
    var { data } = await sb.from('services').select('id,name,rate,tax_pct').is('deleted_at', null).order('name');
    svcState.services = data || [];
  }

  async function loadServiceDocsList(type) {
    var cfg = SVC_CONFIG[type];
    var { data, error } = await sb.from(cfg.table).select('*').is('deleted_at', null).order(cfg.dateField, { ascending: false }).limit(500);
    if (error) { document.getElementById('listArea').innerHTML = '<p class="err">' + error.message + '</p>'; return; }

  function renderServiceDocsList(type) {
    var cfg = SVC_CONFIG[type];
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = svcState.list.filter(function (d) { return !term || (d[cfg.numField] || '').toLowerCase().indexOf(term) >= 0 || partyName(d.party_id).toLowerCase().indexOf(term) >= 0; });
    var html = rows.length ? '<table><tbody>' : '<p style="color:var(--muted)">No ' + cfg.title.toLowerCase() + 's yet.</p>';
    rows.forEach(function (d) {
      html += '<tr class="row" data-id="' + d.id + '"><td style="width:110px"><strong>' + d[cfg.numField] + '</strong></td><td>' + d[cfg.dateField] + '</td>' +
        '<td>' + partyName(d.party_id) + '</td><td style="text-align:right">' + fmtMoney(d.grand_total) + '</td><td><span class="badge">' + d.status + '</span></td></tr>';
    });

  async function openServiceDocEditor(type, id) {
    await loadMasters(); await loadServices();
    var cfg = SVC_CONFIG[type];
    if (!id) {
      var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
      var h = { party_id: null, company_id: defCompany ? defCompany.id : null, narration: '', notes: '', tax_on: false, discount: 0, status: 'open' };
      h[cfg.dateField] = new Date().toISOString().slice(0, 10);
      if (type === 'sinvoice') h.paid = 0;
      svcEditing = { type: type, isNew: true, id: null, header: h, lines: [{ id: null, service_id: null, description: '', qty: 1, rate: 0, tax_pct: 0, amount: 0 }], originalHeader: null, originalLines: [] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from(cfg.table).select('*').eq('id', id).single(),
        sb.from(cfg.lineTable).select('*').eq(cfg.fk, id).order('line_no')
      ]);
      if (!header) { alert('This record was deleted by someone else.'); loadServiceDocsList(type); return; }
      svcEditing = { type: type, isNew: false, id: id, header: JSON.parse(JSON.stringify(header)), lines: JSON.parse(JSON.stringify(lines || [])),
        originalHeader: JSON.parse(JSON.stringify(header)), originalLines: JSON.parse(JSON.stringify(lines || [])) };
    }
    renderServiceDocEditor();
    document.getElementById('editorOverlay').classList.add('open');
  }

  function svcDisplayTotals() {
    var d = svcEditing;
    var sub = 0, tax = 0;
    d.lines.forEach(function (l) {
      var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0);
      sub += amt;
      if (d.header.tax_on) tax += amt * (Number(l.tax_pct) || 0) / 100;
    });
    return { sub: sub, tax: tax, grand: sub - (Number(d.header.discount) || 0) + tax };
  }

    document.getElementById('editorCard').innerHTML = html;

  async function saveServiceDoc() {
    var d = svcEditing, cfg = SVC_CONFIG[d.type];
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    if (!d.header.party_id) { errEl.textContent = 'Pick a party first'; return; }
    var validLines = d.lines.filter(function (l) { return (l.service_id || l.description) && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one line with a quantity'; return; }

    try {
      if (d.isNew) {
        var { data: inserted, error: insErr } = await sb.from(cfg.table).insert(d.header).select().single();
        if (insErr) return handleSaveError(insErr, errEl);
        var { error: lineErr } = await sb.from(cfg.lineTable).insert(
          validLines.map(function (l) { var c = Object.assign({}, l); delete c.id; c[cfg.fk] = inserted.id; return c; })
        );
        if (lineErr) { errEl.textContent = lineErr.message; return; }
        closeEditor(); loadServiceDocsList(d.type);
        return;
      }

      var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', { p_table: cfg.table, p_id: d.id, p_original: d.originalHeader, p_new: d.header, p_ignore: SVC_IGNORE });
      if (mergeErr) return handleSaveError(mergeErr, errEl);
      if (mergeRes.status === 'conflict') {
        var { data: retryRes } = await sb.rpc('smart_merge_update', { p_table: cfg.table, p_id: d.id, p_original: mergeRes.current, p_new: d.header, p_ignore: SVC_IGNORE });
        if (retryRes.status === 'conflict') { errEl.textContent = 'Kisi aur ne isi waqt "' + retryRes.conflicts.join(', ') + '" badal diya — taaza dekh kar dobara karein'; return; }
      }

      var { data: lineMerge, error: lmErr } = await sb.rpc('smart_merge_lines', { p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_original_lines: d.originalLines, p_new_lines: validLines });
      if (lmErr) return handleSaveError(lmErr, errEl);
      if (lineMerge.status === 'conflict') { errEl.textContent = 'Kisi aur ne isi waqt lines mein "' + lineMerge.conflicts.join(', ') + '" badal diya'; return; }
      await sb.rpc('apply_merged_lines', { p_line_table: cfg.lineTable, p_fk_col: cfg.fk, p_fk_id: d.id, p_result_lines: lineMerge.lines });

      closeEditor(); loadServiceDocsList(d.type);
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  async function deleteServiceDoc() {
    var d = svcEditing, cfg = SVC_CONFIG[d.type];
    if (!confirm('Delete ' + d.header[cfg.numField] + '?')) return;
    var { error } = await sb.from(cfg.table).update({ deleted_at: new Date().toISOString() }).eq('id', d.id);
    if (error) { document.getElementById('editorErr').textContent = error.message; return; }
    closeEditor(); loadServiceDocsList(d.type);
  }

  async function convertServiceDoc() {
    var d = svcEditing;
    var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
    var { data: inserted, error: insErr } = await sb.from('service_invoices').insert({
      party_id: d.header.party_id, company_id: d.header.company_id || (defCompany ? defCompany.id : null),
      billing_from: d.header.billing_from, billing_to: d.header.billing_to, billing_label: d.header.billing_label,
      narration: d.header.narration, notes: d.header.notes, tax_on: d.header.tax_on, discount: d.header.discount, paid: 0
    }).select().single();
    if (insErr) { document.getElementById('editorErr').textContent = insErr.message; return; }
    var validLines = d.lines.filter(function (l) { return (l.service_id || l.description) && Number(l.qty) > 0; });
    await sb.from('service_invoice_lines').insert(validLines.map(function (l) {
      return { invoice_id: inserted.id, service_id: l.service_id, description: l.description, qty: l.qty, rate: l.rate, tax_pct: l.tax_pct };
    }));
    await sb.from('service_quotations').update({ status: 'converted', converted_invoice_id: inserted.id, converted_at: new Date().toISOString() }).eq('id', d.id);
    closeEditor();
    openServiceDocEditor('sinvoice', inserted.id);
  }

  // ---------------------------------------------------------------
  // Stock Transfers (§17) — record-of-intent only, NO stock/cost effect
  // ---------------------------------------------------------------
  var transferEditing = null;
  var transferState = { list: [] };

  async function loadTransfersList() {
    var { data, error } = await sb.from('stock_transfers').select('*').is('deleted_at', null).order('tdate', { ascending: false }).limit(500);
    if (error) { document.getElementById('listArea').innerHTML = '<p class="err">' + error.message + '</p>'; return; }
    transferState.list = data || [];
    renderTransfersList();
  }

  function warehouseName(id) { var w = state.warehouses.filter(function (x) { return x.id === id; })[0]; return w ? w.name : '—'; }

  function renderTransfersList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = transferState.list.filter(function (t) { return !term || (t.tno || '').toLowerCase().indexOf(term) >= 0; });
    var html = rows.length ? '<table><tbody>' : '<p style="color:var(--muted)">No stock transfers yet.</p>';
    rows.forEach(function (t) {
      html += '<tr class="row" data-id="' + t.id + '"><td style="width:110px"><strong>' + t.tno + '</strong></td><td>' + t.tdate + '</td>' +
        '<td>' + warehouseName(t.from_warehouse) + ' → ' + warehouseName(t.to_warehouse) + '</td></tr>';
    });
    if (rows.length) html += '</tbody></table>';
    document.getElementById('listArea').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) { tr.addEventListener('click', function () { openTransferEditor(tr.dataset.id); }); });
  }

  async function openTransferEditor(id) {
    await loadMasters();
    if (!id) {
      transferEditing = { isNew: true, id: null, header: { tdate: new Date().toISOString().slice(0, 10), from_warehouse: null, to_warehouse: null, narration: '' }, lines: [{ id: null, item_id: null, qty: 0 }] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from('stock_transfers').select('*').eq('id', id).single(),
        sb.from('stock_transfer_lines').select('*').eq('transfer_id', id).order('line_no')
      ]);
      if (!header) { alert('This record was deleted by someone else.'); loadTransfersList(); return; }
      transferEditing = { isNew: false, id: id, header: header, lines: lines || [] };
    }
    renderTransferEditor();
    document.getElementById('editorOverlay').classList.add('open');
  }

  function renderTransferEditor() {
    var t = transferEditing, h = t.header;
    var html = '<h2>Stock Transfer' + (t.isNew ? ' — New' : ' — ' + h.tno) + '</h2><div class="grid">' +
      '<div><label>Date</label><input type="date" id="t_date" value="' + h.tdate + '"></div>' +
      '<div><label>From warehouse</label><select id="t_from">' + warehouseOptions(h.from_warehouse) + '</select></div>' +
      '<div><label>To warehouse</label><select id="t_to">' + warehouseOptions(h.to_warehouse) + '</select></div>' +
      '</div>';
    html += '<table class="lines-table"><thead><tr><th>Item</th><th>Qty</th><th></th></tr></thead><tbody id="trLinesBody"></tbody></table>';
    html += '<button type="button" id="trAddLineBtn" style="margin-top:8px">+ Add line</button>';
    html += '<div><label style="margin-top:12px">Narration</label><textarea id="t_narration">' + esc(h.narration) + '</textarea></div>';
    html += '<div class="err" id="editorErr"></div><div class="actions">' +
      (!t.isNew ? '<button class="danger" id="trDeleteBtn">Delete</button>' : '') +
      '<button id="cancelBtn">Cancel</button><button class="primary" id="trSaveBtn">Save</button></div>';
    document.getElementById('editorCard').innerHTML = html;
    renderTransferLines();

    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    document.getElementById('t_date').addEventListener('input', function () { h.tdate = this.value; });
    document.getElementById('t_from').addEventListener('change', function () { h.from_warehouse = this.value || null; });
    document.getElementById('t_to').addEventListener('change', function () { h.to_warehouse = this.value || null; });
    document.getElementById('t_narration').addEventListener('input', function () { h.narration = this.value; });
    document.getElementById('trAddLineBtn').addEventListener('click', function () { t.lines.push({ id: null, item_id: null, qty: 0 }); renderTransferLines(); });
    document.getElementById('trSaveBtn').addEventListener('click', saveTransfer);
    var delBtn = document.getElementById('trDeleteBtn'); if (delBtn) delBtn.addEventListener('click', deleteTransfer);
  }

  function renderTransferLines() {
    var t = transferEditing;
    var body = document.getElementById('trLinesBody');
    body.innerHTML = t.lines.map(function (l, idx) {
      return '<tr><td><select data-i="' + idx + '" data-f="item_id" class="trf">' + itemOptions(l.item_id) + '</select></td>' +
        '<td><input type="number" step="0.001" data-i="' + idx + '" data-f="qty" class="trf" value="' + l.qty + '"></td>' +
        '<td><button type="button" data-i="' + idx + '" class="trRmLine" style="color:var(--danger)">✕</button></td></tr>';
    }).join('');
    Array.prototype.forEach.call(body.querySelectorAll('.trf'), function (el) {
      el.addEventListener('change', function () {
        var idx = Number(el.dataset.i), f = el.dataset.f;
        t.lines[idx][f] = f === 'qty' ? Number(el.value) : el.value;
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.trRmLine'), function (btn) {
      btn.addEventListener('click', function () { t.lines.splice(Number(btn.dataset.i), 1); renderTransferLines(); });
    });
  }

  async function saveTransfer() {
    var t = transferEditing;
    var errEl = document.getElementById('editorErr');
    if (!t.header.from_warehouse || !t.header.to_warehouse) { errEl.textContent = 'Pick both warehouses'; return; }
    if (t.header.from_warehouse === t.header.to_warehouse) { errEl.textContent = 'From and To warehouses must be different'; return; }
    var validLines = t.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one item with a quantity'; return; }

    if (t.isNew) {
      var { data: inserted, error: insErr } = await sb.from('stock_transfers').insert(t.header).select().single();
      if (insErr) { errEl.textContent = insErr.message; return; }
      var { error: lineErr } = await sb.from('stock_transfer_lines').insert(validLines.map(function (l) { return { transfer_id: inserted.id, item_id: l.item_id, qty: l.qty }; }));
      if (lineErr) { errEl.textContent = lineErr.message; return; }
    } else {
      var { error: updErr } = await sb.from('stock_transfers').update(t.header).eq('id', t.id);
      if (updErr) { errEl.textContent = updErr.message; return; }
      await sb.from('stock_transfer_lines').delete().eq('transfer_id', t.id);
      await sb.from('stock_transfer_lines').insert(validLines.map(function (l) { return { transfer_id: t.id, item_id: l.item_id, qty: l.qty }; }));
    }
    closeEditor(); loadTransfersList();
  }

  async function deleteTransfer() {
    var t = transferEditing;
    if (!confirm('Delete transfer ' + t.header.tno + '?')) return;
    var { error } = await sb.from('stock_transfers').update({ deleted_at: new Date().toISOString() }).eq('id', t.id);
    if (error) { document.getElementById('editorErr').textContent = error.message; return; }
    closeEditor(); loadTransfersList();
  }

  // ---------------------------------------------------------------
  // Print (§9/§25) — basic letterhead + line table + footer totals
  // ---------------------------------------------------------------
  function printVoucher() {
    var e = state.editing;
    var h = e.header;
    var totals = computeTotals();
    var company = state.companies.filter(function (c) { return c.id === h.company_id; })[0];
    var party = state.parties.filter(function (p) { return p.id === h.party_id; })[0];
    var isSale = state.vtype === 'sale';

    var rows = e.lines.filter(function (l) { return l.item_id; }).map(function (l, i) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      return '<tr><td>' + (i + 1) + '</td><td>' + (item ? item.name : '') + '</td><td>' + l.qty + '</td><td>' + l.rate + '</td><td>' + fmtMoney(l.qty * l.rate) + '</td></tr>';
    }).join('');

    var html = '<div style="font-family:Arial,sans-serif">' +
      '<h2>' + (company ? company.name : 'TAE Accounting') + '</h2>' +
      '<div>' + (company ? (company.address || '') + ' ' + (company.phone || '') : '') + '</div>' +
      '<h3>' + (isSale ? 'Sales Invoice' : 'Purchase Bill') + (h.tax_on ? ' · Sales Tax' : '') + '</h3>' +
      '<div>No: ' + (h.vno || 'PREVIEW') + ' | Date: ' + h.vdate + '</div>' +
      '<div>' + (isSale ? 'Sold to' : 'Bought from') + ': ' + (party ? party.name : '') + '</div>' +
      '<table border="1" cellspacing="0" cellpadding="4" style="width:100%;margin-top:10px;border-collapse:collapse">' +
      '<tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>' + rows + '</table>' +
      '<div style="margin-top:10px;text-align:right">' +
      'Sub total: ' + fmtMoney(totals.sub) + '<br>' +
      'Discount: ' + fmtMoney(h.discount) + '<br>' +
      (h.tax_on ? 'Tax: ' + fmtMoney(totals.tax) + '<br>' : '') +
      '<strong>Grand total: ' + fmtMoney(totals.grand) + '</strong><br>' +
      'Paid: ' + fmtMoney(h.paid) + '<br>' +
      'Balance: ' + fmtMoney(totals.grand - h.paid) +
      '</div></div>';

    document.getElementById('printArea').innerHTML = html;
    var oldTitle = document.title;
    document.title = (h.vno || 'invoice') + '.pdf';
    window.top.document.title = document.title;
    window.addEventListener('afterprint', function restore() {
      document.title = oldTitle; window.top.document.title = oldTitle;
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  }

  // ---------------------------------------------------------------
  // Cross-module refresh (§14): parties/items/companies changed elsewhere
  // ---------------------------------------------------------------
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (d && d.oht === 'refresh' && ['parties', 'items', 'companies', 'warehouses'].indexOf(d.kind) >= 0) {
      loadMasters();
    }
  });

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('listArea').innerHTML = '<p>Please sign in from the main app.</p>';
      return;
    }
    await loadMasters();
    await loadList();
  })();
})();
</script>
</body>
</html>
