<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="theme.css">
<script>
  // Hosted inside the shell's iframe (index.html) almost always — the shell's
  // own categorized sidebar is then the primary nav, so this module's own
  // sidebar/appbar (still fully functional when this file is opened on its
  // own) would just be duplicate navigation. Set before first paint to avoid
  // a flash of the sidebar before it hides.
  if (window.self !== window.top) document.documentElement.className += ' embedded';
</script>
<style>
  /* Page-local CSS is deliberately limited to the print sheet — every screen
     component (shell, sidebar, toolbar, rows, sheet, combo, lines, toasts)
     comes from theme.css so all screens stay in step. */
  html,body{height:100%;}
  #printArea{display:none;}
  .embedded .sidebar, .embedded .appbar{display:none !important;}
  /* Page pattern (theme.css .pg-*): hero band with search/filters, KPI cards
     from the list's own totals, one card holding the list. */
  .main{min-height:0;}
  .bl-scroll{flex:1; min-height:0; overflow-y:auto;}
  .pg-hero.bl-hero > *{max-width:1100px; margin-left:auto; margin-right:auto;}
  .pg-body.bl-body{max-width:1148px; margin-left:auto; margin-right:auto;}
  .pg-search .clear{background:none; border:none; color:#B8AF9E; width:20px; height:20px; display:none; padding:0; flex:none;}
  .pg-search.has-val .clear{display:block;}
  .pg-search .clear svg{display:block; margin:auto;}
  .pg-fld[hidden], .pg-chip[hidden]{display:none;}
  .pg-card .list-area{flex:none; overflow:visible; min-height:0;}
  .pg-card .list-group-hdr{padding:6px 14px; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--mute); font-weight:700; background:var(--panel); border-bottom:1px solid var(--hair);}
  .pg-lrow{cursor:pointer;}
  .pg-lrow .amt .pg-pill{font-family:'IBM Plex Sans',sans-serif;}
  .pg-lrow .av.sq{font-size:9.5px; letter-spacing:.3px;}
  @media (max-width:640px){
    /* Narrow rows: drop the Dr/Cr side tag so the number and status stay readable. */
    .pg-lrow .amt > .pg-pill:first-child:not(:last-child){display:none;}
  }
  /* Print = the classic document in #printArea (theme.css §17 .pd-*). */
  @media print{
    @page{size:A4; margin:14mm 14mm 18mm;}
    body.pd-on .app-shell{display:none !important;}
    body.pd-on #printArea{display:block;}
  }
  .pd .party{display:flex; gap:24px; margin:0 0 14px;}
  .pd .party .blk{flex:1; border:1px solid #D8D0BF; border-radius:6px; padding:8px 12px; background:#FCFAF7;}
  .pd .party .blk .k{font-size:9.5px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:#6B6357;}
  .pd .party .blk .nm{font-size:14px; font-weight:600; margin-top:3px; font-family:'IBM Plex Serif',serif;}
  .pd .party .blk .ad{font-size:10.5px; color:#6B6357; margin-top:2px;}
  .pd .totals{display:flex; justify-content:flex-end; margin-top:14px;}
  .pd .totals table{width:auto; min-width:300px;}
  .pd .totals td{padding:5px 10px; border-bottom:1px solid #E7E1D3; font-size:11.5px;}
  .pd .totals td.num{font-family:'IBM Plex Mono',monospace; text-align:right; font-variant-numeric:tabular-nums;}
  .pd .totals tr.grand td{font-weight:700; font-size:13px; border-top:2px solid #2A2620; border-bottom:3px double #2A2620; background:#F5F1E6;}
  .pd .totals tr.bal td{font-weight:700; color:#A0532E;}
  .pd .narr{margin-top:14px; font-size:11px; color:#6B6357;}
  .pd .narr b{color:#2A2620; text-transform:uppercase; letter-spacing:.6px; font-size:9.5px; display:block; margin-bottom:2px;}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="offline-queue.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  // ---- Foreground-tab auth refresh signaling (§3/§14) ----
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'active') {
      sb.auth.startAutoRefresh ? (d.active ? sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh()) : null;
      return;
    }
    // Deep-link from the shell's sidebar: { oht:'goto', app:'billing', arg:'<doc-type key>' }
    if (d.oht === 'goto' && (!d.app || d.app === 'billing')) {
      if (!d.arg || !ALL_TABS[d.arg]) return;
      if (inited) switchTab(d.arg); else pendingTab = d.arg;
    }
  });
  var inited = false;
  var pendingTab = null;

  var state = {
    vtype: 'sale',
    vouchers: [],
    parties: [],
    items: [],
    companies: [],
    warehouses: [],
    itemUnits: {}, // item_id -> [{unit,factor}]
    editing: null, // { isNew, original, header, lines, originalLines }
  };

  // ---------------------------------------------------------------
  // Master-data cache (needed by the editor)
  // ---------------------------------------------------------------
  async function loadMasters() {
    var [{ data: parties }, { data: items }, { data: companies }, { data: warehouses }, { data: units }] = await Promise.all([
      sb.from('parties').select('id,name,kind,city,credit_days').is('deleted_at', null).order('name'),
      sb.from('items').select('id,name,unit,sale_rate,buy_rate,tax_pct,stock_qty,item_type').is('deleted_at', null).order('name'),
      sb.from('companies').select('id,name,city,phone,ntn,logo,signature,stamp,is_default').is('deleted_at', null).order('name'),
      sb.from('warehouses').select('id,name,is_default').eq('active', true).is('deleted_at', null).order('name'),
      sb.from('item_units').select('id,item_id,unit,factor').is('deleted_at', null)
    ]);
    state.parties = parties || [];
    state.items = items || [];
    state.companies = companies || [];
    state.warehouses = warehouses || [];
    state.itemUnits = {};
    (units || []).forEach(function (u) {
      (state.itemUnits[u.item_id] = state.itemUnits[u.item_id] || []).push(u);
    });
  }

  function fmtMoney(n) {
    n = Number(n || 0);
    return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }

  function newId_fallback() {
    // RFC4122-ish v4 UUID for browsers/contexts without crypto.randomUUID
    // (e.g. non-HTTPS). Only used as a client-generated id for offline
    // queueing, never depended on for cryptographic uniqueness guarantees.
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  // ---------------------------------------------------------------
  // Toasts + confirm dialog
  // Each HTML file is its own document with no shared JS runtime, so this
  // page carries its own copy of these two helpers (same pattern/markup as
  // the other modules, driven by theme.css §14).
  // ---------------------------------------------------------------
  function toast(message, isError) {
    var stack = document.getElementById('toastStack');
    if (!stack) return;
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });
    setTimeout(function () {
      el.classList.remove('on');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, isError ? 6000 : 3200);
  }

  // Promise<boolean>. Replaces window.confirm so a destructive step can
  // state its real consequence instead of a bare browser prompt.
  function confirmDialog(title, body, confirmLabel, isDangerous) {
    return new Promise(function (resolve) {
      var scrim = document.getElementById('confirmScrim');
      scrim.innerHTML =
        '<div class="confirm-card" role="dialog" aria-modal="true">' +
          '<h4></h4><p></p>' +
          '<div class="acts">' +
            '<button type="button" class="btn" data-a="0">Cancel</button>' +
            '<button type="button" class="btn ' + (isDangerous ? 'dgr' : 'pri') + '" data-a="1"></button>' +
          '</div>' +
        '</div>';
      scrim.querySelector('h4').textContent = title;
      scrim.querySelector('p').textContent = body;
      scrim.querySelector('[data-a="1"]').textContent = confirmLabel || 'OK';
      scrim.classList.add('on');

      var done = false;
      function finish(ok) {
        if (done) return;
        done = true;
        scrim.classList.remove('on');
        scrim.innerHTML = '';
        document.removeEventListener('keydown', onKey);
        resolve(ok);
      }
      function onKey(ev) { if (ev.key === 'Escape') finish(false); }
      scrim.querySelector('[data-a="0"]').addEventListener('click', function () { finish(false); });
      scrim.querySelector('[data-a="1"]').addEventListener('click', function () { finish(true); });
      scrim.addEventListener('click', function (ev) { if (ev.target === scrim) finish(false); });
      document.addEventListener('keydown', onKey);
      scrim.querySelector('[data-a="1"]').focus();
    });
  }

  // ---------------------------------------------------------------
  // Searchable combobox (theme.css §10)
  // Used wherever the user has to find one record in a long master list
  // (party, item, raw material, service, the sale a return is against).
  // Genuinely short fixed lists (unit, warehouse, firm, consumption type)
  // stay native <select>s.
  // ---------------------------------------------------------------
  var comboSeq = 0, comboReg = {};

  // cfg: { value, options:[{id,main,sub}], placeholder, empty, onPick }
  function comboHtml(cfg) {
    var key = 'k' + (++comboSeq);
    comboReg[key] = cfg;
    var sel = (cfg.options || []).filter(function (o) { return o.id === cfg.value; })[0];
    return '<div class="combo" data-combo="' + key + '">' +
      '<input type="text" id="cb_' + key + '" role="combobox" aria-expanded="false" autocomplete="off" ' +
      'placeholder="' + esc(cfg.placeholder || 'Search…') + '" value="' + esc(sel ? sel.main : '') + '">' +
      '<div class="combo-menu" id="cbm_' + key + '"></div></div>';
  }

  function wireCombos(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('.combo[data-combo]'), function (wrap) {
      if (wrap.getAttribute('data-wired') === '1') return;
      wrap.setAttribute('data-wired', '1');
      var cfg = comboReg[wrap.getAttribute('data-combo')];
      if (!cfg) return;
      var input = wrap.querySelector('input');
      var menu = wrap.querySelector('.combo-menu');
      var current = cfg.value, matches = [], hi = -1;

      function labelOf(id) {
        var o = (cfg.options || []).filter(function (x) { return x.id === id; })[0];
        return o ? o.main : '';
      }
      function paint() {
        if (!matches.length) {
          menu.innerHTML = '<div class="combo-empty">' + esc(cfg.empty || 'No match found.') + '</div>';
          return;
        }
        menu.innerHTML = matches.map(function (o, i) {
          return '<div class="combo-opt' + (i === hi ? ' hi' : '') + '" data-oi="' + i + '">' +
            '<div class="main">' + esc(o.main) + '</div>' +
            (o.sub ? '<div class="sub">' + esc(o.sub) + '</div>' : '') + '</div>';
        }).join('');
      }
      function openMenu(term) {
        var t = (term || '').trim().toLowerCase();
        matches = (cfg.options || []).filter(function (o) {
          if (!t) return true;
          return (o.main || '').toLowerCase().indexOf(t) >= 0 || (o.sub || '').toLowerCase().indexOf(t) >= 0;
        }).slice(0, 80);
        hi = matches.length ? 0 : -1;
        paint();
        menu.classList.add('on');
        input.setAttribute('aria-expanded', 'true');
      }
      function closeMenu() { menu.classList.remove('on'); input.setAttribute('aria-expanded', 'false'); hi = -1; }
      function pick(o) {
        current = o ? o.id : null;
        input.value = o ? o.main : '';
        closeMenu();
        cfg.onPick(current, o || null);
      }

      input.addEventListener('focus', function () { openMenu(''); input.select(); });
      input.addEventListener('input', function () { openMenu(input.value); });
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          if (!menu.classList.contains('on')) { openMenu(input.value); return; }
          if (!matches.length) return;
          hi = (hi + (ev.key === 'ArrowDown' ? 1 : matches.length - 1)) % matches.length;
          paint();
          var hiEl = menu.querySelector('.combo-opt.hi');
          if (hiEl && hiEl.scrollIntoView) hiEl.scrollIntoView({ block: 'nearest' });
        } else if (ev.key === 'Enter') {
          if (menu.classList.contains('on') && hi >= 0 && matches[hi]) { ev.preventDefault(); pick(matches[hi]); }
        } else if (ev.key === 'Escape') {
          if (menu.classList.contains('on')) { ev.stopPropagation(); closeMenu(); input.value = labelOf(current); }
        }
      });
      // mousedown (not click) so the option survives the input's blur
      menu.addEventListener('mousedown', function (ev) {
        var opt = ev.target;
        while (opt && opt !== menu && !(opt.className && String(opt.className).indexOf('combo-opt') >= 0)) opt = opt.parentNode;
        if (!opt || opt === menu) return;
        ev.preventDefault();
        pick(matches[Number(opt.getAttribute('data-oi'))]);
      });
      input.addEventListener('blur', function () {
        setTimeout(function () {
          if (!document.body.contains(input)) return;
          closeMenu();
          // Typing something that matches nothing must never silently keep a
          // half-typed name: an empty box clears the pick, anything else
          // snaps back to what is actually selected.
          if (!input.value.trim()) { if (current != null) pick(null); }
          else input.value = labelOf(current);
        }, 140);
      });
    });
    // Drop registry entries whose markup was replaced by a re-render.
    Object.keys(comboReg).forEach(function (k) {
      if (!document.getElementById('cb_' + k)) delete comboReg[k];
    });
  }

  function partyComboOptions(roles) {
    return state.parties.filter(function (p) { return !roles || roles.indexOf(p.kind) >= 0; })
      .map(function (p) {
        var bits = [];
        if (p.city) bits.push(p.city);
        if (p.credit_days) bits.push(p.credit_days + ' days credit');
        return { id: p.id, main: p.name, sub: bits.join(' · ') };
      });
  }
  var PARTY_EMPTY = 'No party found — add it in Masters → Parties';
  var ITEM_EMPTY = 'No item found — add it in Masters → Items';
  var SERVICE_EMPTY = 'No service found — add it in Masters → Services';

  function itemComboOptions(rateField, excludeItemId) {
    return state.items
      .filter(function (it) { return !excludeItemId || it.id !== excludeItemId; })
      .map(function (it) {
        var bits = [];
        if (it[rateField] != null) bits.push('Rate ' + fmtMoney(it[rateField]));
        if (it.unit) bits.push(it.unit);
        if (it.stock_qty != null) bits.push('Stock ' + it.stock_qty);
        return { id: it.id, main: it.name, sub: bits.join(' · ') };
      });
  }
  function lineRateField() { return state.vtype === 'sale' ? 'sale_rate' : 'buy_rate'; }

  // ---------------------------------------------------------------
  // Side-sheet editor shell (theme.css §9)
  // Every editor renders into the same sheet: serif title, scrollable body,
  // inline error bar, action footer.
  // ---------------------------------------------------------------
  function showSheet() {
    document.getElementById('editorSheet').classList.add('on');
    document.getElementById('sheetScrim').classList.add('on');
  }
  function hideSheet() {
    document.getElementById('editorSheet').classList.remove('on');
    document.getElementById('sheetScrim').classList.remove('on');
    document.getElementById('editorErr').textContent = '';
  }

  // Paints the sheet. Re-renders are frequent (every totals-affecting edit
  // re-runs the whole editor, exactly as before), so the caret is put back
  // where it was — except inside a combobox, where refocusing would reopen
  // a menu the user just dismissed.
  function renderSheet(title, bodyHtml, footerHtml) {
    var active = document.activeElement;
    var keep = null;
    if (active && active.id && !(active.closest && active.closest('.combo'))) {
      keep = { id: active.id, s: null, e: null };
      try { keep.s = active.selectionStart; keep.e = active.selectionEnd; } catch (ex) { /* number inputs */ }
    }
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('editorErr').textContent = '';
    document.getElementById('editorCard').innerHTML = bodyHtml;
    document.getElementById('sheetFtr').innerHTML = footerHtml || '';
    if (keep) {
      var el = document.getElementById(keep.id);
      if (el && el.focus) {
        el.focus();
        if (keep.s != null) { try { el.setSelectionRange(keep.s, keep.e); } catch (ex) { /* ignore */ } }
      }
    }
  }

  function sheetErr(msg) {
    var el = document.getElementById('editorErr');
    if (el) el.textContent = msg || '';
  }

  // ---------------------------------------------------------------
  // List rows (theme.css §8)
  // ---------------------------------------------------------------
  function docIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">' +
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>' +
      '<path d="M9 13h6"/><path d="M9 17h4"/></svg>';
  }

  // row: { id, code, name, sub, badge, badgeCls, amount, tag, tagCls }
  // badgeCls / tagCls keep the old b-ok / b-warn / b-neutral / dr / cr names
  // the list renderers pass and are mapped onto the shared .pg-pill tones.
  var PILL_TONE = { 'b-ok': 'g', 'b-warn': 'a', 'b-neutral': 'n', 'b-void': 'r', dr: 'dr', cr: 'cr' };
  function listRowHtml(row) {
    var amt = '';
    if (row.amount != null || row.tag || row.badge) {
      amt = '<span class="amt">' +
        (row.tag ? '<span class="pg-pill ' + (PILL_TONE[row.tagCls] || 'n') + '">' + esc(row.tag) + '</span>' : '') +
        (row.amount != null ? esc(row.amount) : '') +
        (row.badge ? '<span class="pg-pill ' + (PILL_TONE[row.badgeCls] || 'n') + '">' + esc(row.badge) + '</span>' : '') +
        '</span>';
    }
    return '<button type="button" class="pg-lrow" data-id="' + esc(row.id) + '">' +
      '<span class="av sq">' + (row.code ? esc(row.code) : docIconSvg()) + '</span>' +
      '<span class="txt"><span class="nm">' + esc(row.name) + '</span><span class="mt">' + esc(row.sub || '') + '</span></span>' +
      amt + '</button>';
  }

  function emptyStateHtml(big, sub) {
    return '<div class="pg-empty"><div class="big">' + esc(big) + '</div>' + esc(sub || '') + '</div>';
  }

  // ---- hero filters + KPI cards (shared by every list) -------------------
  // Quick range / Unpaid / Firm / Warehouse narrow what is on screen only;
  // the queries and the rows they return are unchanged.
  var lf = { range: 'all', unpaid: false, firm: '', wh: '' };
  function firstOfMonthStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
  function passesFilter(dateStr, companyId, balance) {
    if (lf.range === 'month' && !(dateStr && dateStr >= firstOfMonthStr())) return false;
    if (lf.unpaid && !(balance > 0.004)) return false;
    if (lf.firm && companyId !== lf.firm) return false;
    return true;
  }
  function syncFilterChips() {
    document.getElementById('blf_month').classList.toggle('on', lf.range === 'month' && !lf.unpaid);
    document.getElementById('blf_unpaid').classList.toggle('on', lf.unpaid);
    document.getElementById('blf_all').classList.toggle('on', lf.range === 'all' && !lf.unpaid);
  }
  document.getElementById('blf_month').addEventListener('click', function () { lf.range = 'month'; lf.unpaid = false; syncFilterChips(); rerenderCurrentList(); });
  document.getElementById('blf_unpaid').addEventListener('click', function () { lf.unpaid = !lf.unpaid; syncFilterChips(); rerenderCurrentList(); });
  document.getElementById('blf_all').addEventListener('click', function () { lf.range = 'all'; lf.unpaid = false; syncFilterChips(); rerenderCurrentList(); });
  document.getElementById('firmFilter').addEventListener('change', function () { lf.firm = this.value; rerenderCurrentList(); });
  document.getElementById('whFilter').addEventListener('change', function () { lf.wh = this.value; rerenderCurrentList(); });
  function fillFilterSelects() {
    function fill(id, rows, cur) {
      var el = document.getElementById(id);
      el.innerHTML = '<option value="">All</option>' + rows.map(function (r) {
        return '<option value="' + esc(r.id) + '"' + (r.id === cur ? ' selected' : '') + '>' + esc(r.name) + '</option>';
      }).join('');
      if (cur && !rows.some(function (r) { return r.id === cur; })) el.value = '';
      return el.value;
    }
    lf.firm = fill('firmFilter', state.companies, lf.firm);
    lf.wh = fill('whFilter', state.warehouses, lf.wh);
  }
  // Which controls make sense for the tab on screen.
  function showFiltersFor(tab) {
    var unpaidOk = tab === 'sale' || tab === 'purchase' || tab === 'sinvoice';
    var firmOk = tab !== 'return' && tab !== 'transfer';
    document.getElementById('blf_unpaid').hidden = !unpaidOk;
    document.getElementById('firmFld').hidden = !firmOk;
    document.getElementById('whFld').hidden = tab !== 'transfer';
    if (!unpaidOk && lf.unpaid) { lf.unpaid = false; syncFilterChips(); }
  }
  function setListKpis(items) {
    var el = document.getElementById('blKpis');
    if (!items || !items.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    el.innerHTML = items.map(function (it) {
      return '<div class="pg-kpi"><div><div class="k">' + esc(it.label) + '</div><div class="v ' + (it.cls || '') + '">' +
        (it.text != null ? esc(it.text) : fmtMoney(it.val)) + '</div></div><div class="pg-ring ' + (it.cls || 'n') + '">' + esc(it.ring || '') + '</div></div>';
    }).join('');
  }
  function setListCount(n, word) {
    document.getElementById('blCnt').textContent = n == null ? '' : n + ' ' + (word || 'rows');
  }
  function setListSub(text) { document.getElementById('blSub').textContent = text || ''; }
  function rangeLabel() { return lf.range === 'month' ? 'this month' : 'all dates'; }
  function firmLabel() {
    var c = state.companies.filter(function (x) { return x.id === lf.firm; })[0];
    return c ? ' · ' + c.name : '';
  }

  function showListError(error) {
    document.getElementById('listArea').innerHTML =
      emptyStateHtml('Could not load this list', error.message || String(error));
    toast(error.message || String(error), true);
  }

  function wireListRows(onPick) {
    Array.prototype.forEach.call(document.getElementById('listArea').querySelectorAll('.pg-lrow'), function (row) {
      row.addEventListener('click', function () { onPick(row.getAttribute('data-id')); });

  // ---------------------------------------------------------------
  // List view
  // ---------------------------------------------------------------
  async function loadList() {
    var q = sb.from('vouchers')
      .select('id,vno,vdate,party_id,company_id,grand_total,paid,deleted_at')
      .eq('vtype', state.vtype)
      .is('deleted_at', null)
      .order('vdate', { ascending: false })
      .order('vno', { ascending: false })
      .limit(500);
    var { data, error } = await q;
    if (error) { showListError(error); return; }
    state.vouchers = data || [];
    renderList();
  }

  function partyName(id) {
    var p = state.parties.filter(function (x) { return x.id === id; })[0];
    return p ? p.name : '—';
  }

  function renderList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = state.vouchers.filter(function (v) {
      if (!passesFilter(v.vdate, v.company_id, v.grand_total - v.paid)) return false;
      if (!term) return true;
      return (v.vno || '').toLowerCase().indexOf(term) >= 0 ||
             partyName(v.party_id).toLowerCase().indexOf(term) >= 0;
    });

    var byDate = {};
    var total = 0, paid = 0, due = 0;
    rows.forEach(function (v) {
      (byDate[v.vdate] = byDate[v.vdate] || []).push(v);
      total += Number(v.grand_total) || 0; paid += Number(v.paid) || 0;
      var b = (Number(v.grand_total) || 0) - (Number(v.paid) || 0);
      if (b > 0.004) due += b;
    });
    var dates = Object.keys(byDate).sort().reverse();

    var html = '';
    if (!dates.length) {
      html = emptyStateHtml('No ' + (state.vtype === 'sale' ? 'sales invoices' : 'purchase bills') + ' yet',
        term ? 'Nothing matches “' + term + '”.' : 'Tap + New to write the first one.');
    }
    dates.forEach(function (d) {
      html += '<div class="list-group-hdr">' + esc(d) + '</div>';
      byDate[d].forEach(function (v) {
        var balance = v.grand_total - v.paid;
        html += listRowHtml({
          id: v.id,
          code: state.vtype === 'sale' ? 'INV' : 'BILL',
          name: v.vno,
          sub: partyName(v.party_id),
          badge: balance > 0.004 ? 'Due ' + fmtMoney(balance) : 'Paid',
          badgeCls: balance > 0.004 ? 'b-warn' : 'b-ok',
          amount: fmtMoney(v.grand_total),
          tag: state.vtype === 'sale' ? 'Dr' : 'Cr',
          tagCls: state.vtype === 'sale' ? 'dr' : 'cr'
        });
      });
    });
    document.getElementById('listArea').innerHTML = html;
    wireListRows(function (id) { openEditor(id); });
    var isSale = state.vtype === 'sale';
    setListKpis([
      { label: isSale ? 'Total sales' : 'Total purchases', val: total, cls: isSale ? 'dr' : 'cr', ring: 'Rs' },
      { label: isSale ? 'Received' : 'Paid', val: paid, cls: isSale ? 'cr' : 'n', ring: '✓' },
      { label: isSale ? 'Receivable' : 'Payable', val: due, cls: due > 0.004 ? 'wn' : 'n', ring: '!' }
    ]);
    setListCount(rows.length, rows.length === 1 ? 'document' : 'documents');
    setListSub(rows.length + ' of ' + state.vouchers.length + ' · ' + rangeLabel() + (lf.unpaid ? ' · unpaid only' : '') + firmLabel());
  }

    else if (state.mode === 'sinvoice' || state.mode === 'squote') renderServiceDocsList(state.mode);
    else if (state.mode === 'transfer') renderTransfersList();
    else renderList();

    rerenderCurrentList();
  });
  document.getElementById('searchClear').addEventListener('click', function () {

    syncSearchClear();

  document.getElementById('navClose').addEventListener('click', closeNav);
  navScrim.addEventListener('click', closeNav);

  // The sheet's X and its scrim discard exactly like the footer's Cancel.
  // Escape is deliberately NOT bound: losing a half-typed invoice to a
  // stray keypress is worse than one extra click.
  document.getElementById('sheetClose').addEventListener('click', closeEditor);
  document.getElementById('sheetScrim').addEventListener('click', closeEditor);

  state.mode = 'voucher';
  var ALL_TABS = { sale: 'navSale', purchase: 'navPurchase', return: 'navReturn', quotation: 'navQuotation', po: 'navPO', sinvoice: 'navServiceInvoice', squote: 'navServiceQuotation', transfer: 'navTransfer' };
  var TAB_TITLES = { sale: 'Sales', purchase: 'Purchases', return: 'Sales Returns', quotation: 'Quotations', po: 'Purchase Orders', sinvoice: 'Service Invoices', squote: 'Service Quotations', transfer: 'Stock Transfers' };
  Object.keys(ALL_TABS).forEach(function (k) {
    document.getElementById(ALL_TABS[k]).addEventListener('click', function () { switchTab(k); });
  });
  var CARD_TITLES = { sale: 'Sales invoices', purchase: 'Purchase bills', return: 'Sales returns', quotation: 'Quotations', po: 'Purchase orders', sinvoice: 'Service invoices', squote: 'Service quotations', transfer: 'Stock transfers' };
  function switchTab(vt) {
    Object.keys(ALL_TABS).forEach(function (k) { document.getElementById(ALL_TABS[k]).classList.toggle('on', k === vt); });
    document.getElementById('appTitle').textContent = TAB_TITLES[vt] || 'Billing';
    document.getElementById('blTitle').textContent = TAB_TITLES[vt] || 'Billing';
    document.getElementById('blCardTitle').textContent = CARD_TITLES[vt] || 'Documents';
    setListSub(''); setListCount(null); setListKpis([]);
    document.getElementById('listArea').innerHTML = '<div class="pg-empty">Loading…</div>';
    showFiltersFor(vt);
    closeNav();
    if (vt === 'return') {
      state.mode = 'return';
      loadReturnsList();
    } else if (vt === 'quotation' || vt === 'po') {
      state.mode = vt;
      loadDocsList(vt);
    } else if (vt === 'sinvoice' || vt === 'squote') {
      state.mode = vt;
      loadServiceDocsList(vt);
    } else if (vt === 'transfer') {
      state.mode = 'transfer';
      loadTransfersList();

  document.getElementById('newBtn').addEventListener('click', function () {
    if (state.mode === 'return') openReturnEditor(null);
    else if (state.mode === 'quotation' || state.mode === 'po') openDocEditor(state.mode, null);
    else if (state.mode === 'sinvoice' || state.mode === 'squote') openServiceDocEditor(state.mode, null);
    else if (state.mode === 'transfer') openTransferEditor(null);
    else openEditor(null);
  });

  // ---------------------------------------------------------------
  // Editor
  // ---------------------------------------------------------------
  var IGNORE_HEADER = ['id','vno','created_at','created_by','updated_at','updated_by','version','deleted_at','sub_total','tax_total','grand_total'];

  function blankHeader() {
    var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
    return {
      vtype: state.vtype, vdate: new Date().toISOString().slice(0, 10), due_date: null,
      party_id: null, company_id: defCompany ? defCompany.id : null, narration: '',
      tax_on: false, discount: 0, paid: 0,
      loading_on: false, loading_amt: 0, cartage_on: false, cartage_amt: 0,
      cutting_on: false, cutting_amt: 0
    };
  }

  function blankLine() {
    return { id: null, item_id: null, qty: 0, rate: 0, tax_pct: 0, amount: 0,
      pcs_on: false, pcs: null, warehouse_id: defaultWarehouseId(), sale_unit: null, sale_qty: null, unit_factor: 1,
      consumption_type: 'general_goods', materials: [] };
  }

  // voucher_lines' real, client-writable columns. A line object on screen
  // also carries UI-only fields (id before it is saved, and materials —
  // that goes to voucher_line_material_consumption via syncAllLineMaterials,
  // never to this table) that PostgREST rejects outright if sent in an
  // insert ("Could not find the '<field>' column … in the schema cache").
  var VOUCHER_LINE_COLS = ['item_id', 'qty', 'rate', 'tax_pct', 'amount', 'pcs_on', 'pcs',
    'warehouse_id', 'sale_unit', 'sale_qty', 'unit_factor', 'consumption_type'];
  function sanitizeVoucherLine(l) {
    var o = {};
    VOUCHER_LINE_COLS.forEach(function (k) { o[k] = l[k]; });
    return o;
  }

  function blankMaterial() {
    return { id: null, raw_item_id: null, warehouse_id: defaultWarehouseId(), qty: 0, notes: '' };
  }

  function defaultWarehouseId() {
    var w = state.warehouses.filter(function (x) { return x.is_default; })[0] || state.warehouses[0];
    return w ? w.id : null;
  }

  async function openEditor(id) {
    await loadMasters();
    if (!id) {
      state.editing = { isNew: true, id: null, header: blankHeader(), lines: [blankLine()], originalHeader: null, originalLines: [] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from('vouchers').select('*').eq('id', id).single(),
        sb.from('voucher_lines').select('*').eq('voucher_id', id).order('line_no')
      ]);
      if (!header) { toast('This record was deleted by someone else.', true); loadList(); return; }
      var lineIds = (lines || []).map(function (l) { return l.id; });
      var materialsByLine = {};
      if (lineIds.length) {
        var { data: mats } = await sb.from('voucher_line_material_consumption').select('*').in('voucher_line_id', lineIds).order('line_no');
        (mats || []).forEach(function (m) {
          (materialsByLine[m.voucher_line_id] = materialsByLine[m.voucher_line_id] || []).push(m);
        });
      }
      (lines || []).forEach(function (l) { l.materials = materialsByLine[l.id] || []; });
      // Snapshot captured ONCE, at open time — never re-derived at save time (§14/§25's critical rule).
      state.editing = {
        isNew: false, id: id,
        header: JSON.parse(JSON.stringify(header)),
        lines: JSON.parse(JSON.stringify(lines || [])),
        originalHeader: JSON.parse(JSON.stringify(header)),
        originalLines: JSON.parse(JSON.stringify(lines || []))
      };
    }
    renderEditor();
    showSheet();
  }

  function closeEditor() {
    hideSheet();
    state.editing = null;
  }

  function warehouseOptions(selected) {
    return state.warehouses.map(function (w) {
      return '<option value="' + w.id + '"' + (w.id === selected ? ' selected' : '') + '>' + w.name + '</option>';
    }).join('');
  }

  function computeTotals() {
    var e = state.editing;
    var sub = 0, tax = 0;
    e.lines.forEach(function (l) {
      var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0);
      l.amount = amt;
      sub += amt;
      if (e.header.tax_on) tax += amt * (Number(l.tax_pct) || 0) / 100;
    });
    var extra = 0;
    if (e.header.loading_on) extra += Number(e.header.loading_amt) || 0;
    if (e.header.cartage_on) extra += Number(e.header.cartage_amt) || 0;
    if (e.header.cutting_on) extra += Number(e.header.cutting_amt) || 0;
    var disc = Number(e.header.discount) || 0;
    // Loading/cartage/cutting are billed to the party either way (sale or
    // purchase) — §21 governs their P&L classification (Other Income vs.
    // landed cost), not whether they appear on the invoice total.
    var grand = sub - disc + tax + extra;
    return { sub: sub, tax: tax, grand: grand, extra: extra };
  }

  function renderEditor() {
    var e = state.editing;
    var h = e.header;
    var totals = computeTotals();
    var isSale = state.vtype === 'sale';
    var showCompany = state.companies.length > 1;

    var html = '';
    if (showCompany) {
      html += '<div class="field"><label>Firm</label><select id="f_company">' +
        state.companies.map(function (c) { return '<option value="' + c.id + '"' + (c.id === h.company_id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') +
        '</select></div>';
    }
    html += '<div class="f2">' +
      '<div class="field"><label>Date</label><input type="date" id="f_vdate" value="' + h.vdate + '"></div>' +
      '<div class="field"><label>Due date</label><input type="date" id="f_due" value="' + (h.due_date || '') + '"></div>' +
      '</div>';

    html += '<div class="field"><label>' + (isSale ? 'Sold to' : 'Bought from') + '</label>' +
      comboHtml({
        value: h.party_id,
        options: partyComboOptions(isSale ? ['customer', 'both'] : ['supplier', 'both']),
        placeholder: isSale ? 'Search customer…' : 'Search supplier…',
        empty: PARTY_EMPTY,
        onPick: function (id) { e.header.party_id = id || null; renderEditor(); }
      }) +
      (h.party_id ? '<div class="hint" id="partyHint">Loading balance…</div>' : '') +
      '</div>';
    if (h.party_id) setTimeout(function () { loadPartyBalance(h.party_id); }, 0);

    html += '<div class="sw-row">' +
      '<span class="sw-lbl">Sales tax<span class="sw-sub">Bills each line\'s tax % on top</span></span>' +
      '<label class="sw"><input type="checkbox" id="f_taxon"' + (h.tax_on ? ' checked' : '') + '><span class="trk"></span></label>' +
      '</div>';

    html += '<div class="f2">' +
      '<div class="field"><label>Discount</label><input type="number" step="0.01" class="num" id="f_discount" value="' + h.discount + '"></div>' +
      '<div class="field"><label>Paid now</label><input type="number" step="0.01" class="num" id="f_paid" value="' + h.paid + '"></div>' +
      '</div>';

    html += '<div class="group-lbl">Extra charges</div>';
    ['loading', 'cartage', 'cutting'].forEach(function (k) {
      var label = k.charAt(0).toUpperCase() + k.slice(1);
      html += '<div class="sw-row"><span class="sw-lbl">' + label + '</span>' +
        '<label class="sw"><input type="checkbox" id="f_' + k + '_on"' + (h[k + '_on'] ? ' checked' : '') + '><span class="trk"></span></label>' +
        '<input type="number" step="0.01" class="amt-in" id="f_' + k + '_amt" value="' + h[k + '_amt'] + '"></div>';
    });

    html += '<div class="group-lbl">Items</div>';
    html += '<div class="lines" id="linesWrap"></div>';
    html += '<button type="button" class="btn add-more" id="addLineBtn">+ Add line</button>';

    html += '<div class="group-lbl">Narration</div>';
    html += '<div class="field"><textarea id="f_narration" rows="2">' + esc(h.narration || '') + '</textarea></div>';

    html += '<div class="doc-sum">' +
      '<div class="doc-sum-row"><span>Sub total</span><span class="v">' + fmtMoney(totals.sub) + '</span></div>' +
      '<div class="doc-sum-row"><span>Discount</span><span class="v">-' + fmtMoney(h.discount) + '</span></div>' +
      (h.tax_on ? '<div class="doc-sum-row"><span>Tax</span><span class="v">' + fmtMoney(totals.tax) + '</span></div>' : '') +
      (totals.extra ? '<div class="doc-sum-row"><span>Loading / Cartage / Cutting</span><span class="v">' + fmtMoney(totals.extra) + '</span></div>' : '') +
      '<div class="doc-sum-row grand"><span>Grand total</span><span class="v">' + fmtMoney(totals.grand) + '</span></div>' +
      '<div class="doc-sum-row"><span>Paid</span><span class="v">' + fmtMoney(h.paid) + '</span></div>' +
      '<div class="doc-sum-row"><span>Balance</span><span class="v">' + fmtMoney(totals.grand - h.paid) + '</span></div>' +
      '</div>';

        '<button type="button" class="btn" id="printBtn">Print</button>') +

    renderSheet((isSale ? 'Sales Invoice' : 'Purchase Bill') + (e.isNew ? ' — New' : ' — ' + h.vno), html, ftr);

  async function loadPartyBalance(partyId) {
    // Lightweight running balance hint (full ledger logic lives in reports.html/§11).
    var el = document.getElementById('partyHint');
    if (!el) return;
    var { data: p } = await sb.from('parties').select('opening,opening_side').eq('id', partyId).single();
    var { data: vs } = await sb.from('vouchers').select('vtype,grand_total,paid').eq('party_id', partyId).is('deleted_at', null);
    var bal = p ? (p.opening_side === 'dr' ? p.opening : -p.opening) : 0;

      if (v.vtype === 'sale') bal += v.grand_total - v.paid;
      else bal -= v.grand_total - v.paid;
    });
    el.textContent = 'Current balance: ' + fmtMoney(Math.abs(bal)) + ' ' + (bal >= 0 ? 'Dr' : 'Cr');
  }

  // Line items render as a stack of .ln cards (theme.css §11) — the same
  // markup on a phone and on a wide desktop window, no second layout.
  function renderLines() {
    var e = state.editing;
    var isSale = state.vtype === 'sale';
    var showWarehouse = state.warehouses.length > 1;
    var body = document.getElementById('linesWrap');
    body.innerHTML = e.lines.map(function (l, idx) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      var units = item ? (state.itemUnits[item.id] || []) : [];

      var rows = '';
      rows += '<div class="f2">' +
        '<div class="field"><label>Qty</label><input type="number" step="0.001" class="lf num" data-i="' + idx + '" data-f="qty" value="' + (l.sale_unit ? (l.sale_qty != null ? l.sale_qty : '') : l.qty) + '"></div>' +
        '<div class="field"><label>Rate</label><input type="number" step="0.01" class="lf num" data-i="' + idx + '" data-f="rate" value="' + l.rate + '"></div>' +
        '</div>';

      if (isSale) {
        var unitField = units.length
          ? '<div class="field"><label>Unit</label><select class="lf" data-i="' + idx + '" data-f="sale_unit">' +
              '<option value="">' + esc(item ? item.unit : '') + '</option>' +
              units.map(function (u) { return '<option value="' + esc(u.unit) + '"' + (u.unit === l.sale_unit ? ' selected' : '') + '>' + esc(u.unit) + '</option>'; }).join('') +
            '</select></div>'
          : '<div class="field"><label>Unit</label><div class="hint">' + esc(item ? item.unit : '—') + '</div></div>';
        rows += '<div class="f2">' + unitField +
          '<div class="field"><label>Type</label><select class="lf" data-i="' + idx + '" data-f="consumption_type">' +
            '<option value="general_goods"' + (l.consumption_type !== 'raw_material_consumption' ? ' selected' : '') + '>General Goods</option>' +
            '<option value="raw_material_consumption"' + (l.consumption_type === 'raw_material_consumption' ? ' selected' : '') + '>Raw Material</option>' +
          '</select></div></div>';
      }

      var extra = '';
      if (e.header.tax_on) {
        extra += '<div class="field"><label>Tax %</label><input type="number" step="0.01" class="lf num" data-i="' + idx + '" data-f="tax_pct" value="' + l.tax_pct + '"></div>';
      }
      if (showWarehouse) {
        extra += '<div class="field"><label>Warehouse</label><select class="lf" data-i="' + idx + '" data-f="warehouse_id">' + warehouseOptions(l.warehouse_id) + '</select></div>';
      }
      if (extra) rows += '<div class="f2">' + extra + '</div>';

      rows += '<div class="doc-sum-row"><span>Amount</span><span class="v">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</span></div>';

      // The raw-material sub-panel lives INSIDE its own line's card now
      // (it used to be a second <tr> spanning the whole table).
      if (isSale && l.consumption_type === 'raw_material_consumption') {
        rows += '<div id="matPanel_' + idx + '"></div>';
      }

      return '<div class="ln">' +
        '<div class="ln-top">' +
          comboHtml({
            value: l.item_id,
            options: itemComboOptions(lineRateField()),
            placeholder: 'Search item…',
            empty: ITEM_EMPTY,
            onPick: (function (i) { return function (id) { applyLineField(i, 'item_id', id || ''); }; })(idx)
          }) +
          '<button type="button" class="icb rmLine" data-i="' + idx + '" aria-label="Remove line">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="ln-rows">' + rows + '</div>' +
      '</div>';
    }).join('');

    Array.prototype.forEach.call(body.querySelectorAll('.lf'), function (el) {
      el.addEventListener('change', function () { onLineFieldChange(el); });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.rmLine'), function (btn) {
      btn.addEventListener('click', function () {
        state.editing.lines.splice(Number(btn.dataset.i), 1);
        renderLines();
        refreshTotalsDisplay();
      });
    });

    e.lines.forEach(function (l, idx) {
      if (isSale && l.consumption_type === 'raw_material_consumption') renderMaterialPanel(idx);

  function onLineFieldChange(el) {
    var idx = Number(el.dataset.i), field = el.dataset.f;
    var val = el.type === 'number' ? Number(el.value) : el.value;
    applyLineField(idx, field, val, function () { el.value = state.editing.lines[idx][field]; });
  }

  // Applies one field of one line. Split out of the old change handler so a
  // combobox pick and a native <select>/<input> change run the exact same
  // logic; `revert` puts a rejected native control back where it was.
  function applyLineField(idx, field, val, revert) {
    var line = state.editing.lines[idx];

    if (field === 'consumption_type') {
      // Accidental-switch protection (§ approved): the line always defaults
      // to the item's own item_type; switching away from that default needs
      // an explicit confirmation, since it changes which item's stock gets
      // deducted by this line.
      var pickedItem = state.items.filter(function (x) { return x.id === line.item_id; })[0];
      var itemDefault = pickedItem ? pickedItem.item_type : 'general_goods';
      if (val !== itemDefault) {
        var msg = val === 'general_goods'
          ? 'Is item ka apna stock minus hoga (raw material consumption use nahi hoga is baar). Sure?'
          : "Is item ka apna stock minus NAHI hoga — sirf jo raw materials neeche enter karenge wo minus honge. Sure?";
        confirmDialog(val === 'general_goods' ? 'Switch to General Goods?' : 'Switch to Raw Material?', msg, 'Haan, badal do', false)
          .then(function (ok) {
            if (!ok) { if (revert) revert(); return; }
            commitConsumptionType(idx, val);
          });
        return;
      }
      commitConsumptionType(idx, val);
      return;
    }

    if (field === 'qty') {
      // qty is ALWAYS the base-unit, stock/cost-affecting quantity. When an
      // alt sale unit is active, what the user types is sale_qty, and
      // qty = sale_qty × unit_factor, recomputed on every keystroke (§9).
      if (line.sale_unit) {
        line.sale_qty = val;
        line.qty = (Number(val) || 0) * (Number(line.unit_factor) || 1);
      } else {
        line.qty = val;
        line.sale_qty = null;
      }
    } else {
      line[field] = val;
    }

    if (field === 'item_id') {
      var item = state.items.filter(function (x) { return x.id === val; })[0];
      if (item) {
        if (!line.rate) line.rate = state.vtype === 'sale' ? item.sale_rate : item.buy_rate;
        if (!line.tax_pct) line.tax_pct = item.tax_pct;
      }
      line.sale_unit = null; line.sale_qty = null; line.unit_factor = 1;
      // The item changed, so any raw materials entered were against the OLD
      // final product — they no longer make sense here (§ item master's own
      // type is always the default for a newly-picked item).
      line.consumption_type = item ? item.item_type : 'general_goods';
      line.materials = [];
      renderLines();
    }
    if (field === 'sale_unit') {
      var u = (state.itemUnits[line.item_id] || []).filter(function (x) { return x.unit === val; })[0];
      line.unit_factor = u ? u.factor : 1;
      if (!val) { line.sale_qty = null; } // reverted to base unit: qty typed directly from now on
      else { line.sale_qty = line.sale_qty != null ? line.sale_qty : line.qty; line.qty = (Number(line.sale_qty) || 0) * line.unit_factor; }
      renderLines();
    }
    refreshTotalsDisplay();
  }

  function commitConsumptionType(idx, val) {
    var line = state.editing.lines[idx];
    line.consumption_type = val;
    if (val !== 'raw_material_consumption') line.materials = [];
    renderLines();
    refreshTotalsDisplay();
  }

  function refreshTotalsDisplay() { renderEditor(); }

  // ---------------------------------------------------------------
  // Raw Material Consumption panel (per sale line, § approved design)
  // ---------------------------------------------------------------
  var lastUsedRecipeCache = {}; // final_item_id -> materials array | null, cached per editor session

  async function getLastUsedRecipe(finalItemId) {
    if (lastUsedRecipeCache.hasOwnProperty(finalItemId)) return lastUsedRecipeCache[finalItemId];
    var { data: lastLine } = await sb.from('voucher_lines').select('id')
      .eq('item_id', finalItemId).eq('consumption_type', 'raw_material_consumption')
      .order('created_at', { ascending: false }).limit(1).maybeSingle();
    var result = null;
    if (lastLine) {
      var { data: mats } = await sb.from('voucher_line_material_consumption')
        .select('raw_item_id,warehouse_id,qty,unit,unit_factor,notes').eq('voucher_line_id', lastLine.id).order('line_no');
      if (mats && mats.length) result = mats;
    }
    lastUsedRecipeCache[finalItemId] = result;
    return result;
  }

  function rawMaterialComboOptions(finalItemId) {
    // Self-consumption prevention starts here: the final product can never
    // be offered as one of its own raw materials (validate() enforces it
    // again at save time).
    return state.items
      .filter(function (it) { return it.id !== finalItemId; })
      .map(function (it) {
        var bits = [];
        if (it.stock_qty != null) bits.push('Available ' + it.stock_qty + (it.unit ? ' ' + it.unit : ''));
        return { id: it.id, main: it.name, sub: bits.join(' · ') };
      });
  }

  // Renders inside the owning line's .ln card (theme.css §11) as a nested
  // card stack — same fields, same ids, same handlers as the old table.
  function renderMaterialPanel(idx) {
    var el = document.getElementById('matPanel_' + idx);
    if (!el) return;
    var line = state.editing.lines[idx];
    var mats = line.materials || [];
    var showCost = canViewMaterialCost();
    var totalCost = mats.reduce(function (s, m) { return s + (Number(m.cost_amount) || 0); }, 0);

    var html = '<div class="group-lbl">Raw material used</div>';
    html += '<div class="lines">';
    if (!mats.length) {
      html += '<div class="ln"><div class="hint">Nothing added yet — this line will not deduct any stock until a raw material is entered.</div></div>';
    }
    mats.forEach(function (m, mi) {
      var raw = state.items.filter(function (x) { return x.id === m.raw_item_id; })[0];
      html += '<div class="ln">' +
        '<div class="ln-top">' +
          comboHtml({
            value: m.raw_item_id,
            options: rawMaterialComboOptions(line.item_id),
            placeholder: 'Search raw material…',
            empty: ITEM_EMPTY,
            onPick: (function (li, mIdx) { return function (id) { setMaterialField(li, mIdx, 'raw_item_id', id || ''); }; })(idx, mi)
          }) +
          '<button type="button" data-mi="' + mi + '" class="icb rmMat" aria-label="Remove raw material">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="ln-rows">' +
          '<div class="f2">' +
            '<div class="field"><label>Warehouse</label><select data-mi="' + mi + '" data-mf="warehouse_id" class="matf">' + warehouseOptions(m.warehouse_id) + '</select></div>' +
            '<div class="field"><label>Qty</label><input type="number" step="0.001" data-mi="' + mi + '" data-mf="qty" class="matf num" value="' + m.qty + '"></div>' +
          '</div>' +
          '<div class="field"><label>Notes</label><input data-mi="' + mi + '" data-mf="notes" class="matf" value="' + esc(m.notes || '') + '"></div>' +
          '<div class="doc-sum-row"><span>Available</span><span class="v">' + esc((raw ? raw.stock_qty : '—') + (raw ? ' ' + raw.unit : '')) + '</span></div>' +
          (showCost ? '<div class="doc-sum-row"><span>Cost</span><span class="v">' + fmtMoney(m.cost_amount || 0) + '</span></div>' : '') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    html += '<button type="button" class="btn add-more" id="addMatBtn_' + idx + '">+ Add raw material</button>';
    html += '<div id="quickFillWrap_' + idx + '"></div>';
    html += '<div class="doc-sum-note">' + mats.length + ' raw material(s)' +
      (showCost ? ' · Material cost: ' + fmtMoney(totalCost) : '') + '</div>';
    el.innerHTML = html;
    wireCombos(el);

    Array.prototype.forEach.call(el.querySelectorAll('.matf'), function (fld) {
      fld.addEventListener('change', function () { onMaterialFieldChange(idx, fld); });
    });
    Array.prototype.forEach.call(el.querySelectorAll('.rmMat'), function (btn) {
      btn.addEventListener('click', function () {
        line.materials.splice(Number(btn.dataset.mi), 1);
        renderMaterialPanel(idx);
        refreshTotalsSilent();
      });
    });
    document.getElementById('addMatBtn_' + idx).addEventListener('click', function () {
      line.materials.push(blankMaterial());
      renderMaterialPanel(idx);
    });

    // Quick-fill offer (§ approved: never auto-filled, shown as an explicit
    // action; only relevant when this line has no materials yet).
    if (!mats.length && line.item_id) {
      getLastUsedRecipe(line.item_id).then(function (recipe) {
        var wrap = document.getElementById('quickFillWrap_' + idx);
        if (!wrap || !recipe || (state.editing.lines[idx] || {}).materials.length) return;
        var names = recipe.map(function (m) {
          var it = state.items.filter(function (x) { return x.id === m.raw_item_id; })[0];
          return it ? it.name : '?';
        }).slice(0, 3).join(', ');
        wrap.innerHTML = '<button type="button" class="btn add-more" id="quickFillBtn_' + idx + '">Last used: ' + names +
          (recipe.length > 3 ? ' +' + (recipe.length - 3) + ' more' : '') + ' (' + recipe.length + ') — Use this?</button>';
        document.getElementById('quickFillBtn_' + idx).addEventListener('click', function () {
          state.editing.lines[idx].materials = recipe.map(function (m) {
            return { id: null, raw_item_id: m.raw_item_id, warehouse_id: m.warehouse_id || defaultWarehouseId(), qty: m.qty, notes: m.notes || '' };
          });
          renderMaterialPanel(idx);
        });
      });
    }
  }

  function onMaterialFieldChange(lineIdx, fld) {
    var mi = Number(fld.dataset.mi), mf = fld.dataset.mf;
    setMaterialField(lineIdx, mi, mf, fld.type === 'number' ? Number(fld.value) : fld.value);
  }

  // Same single write + repaint the old change handler did — shared so a
  // raw-material combobox pick behaves exactly like the old <select>.
  function setMaterialField(lineIdx, mi, mf, val) {
    var mat = state.editing.lines[lineIdx].materials[mi];
    mat[mf] = val;
    renderMaterialPanel(lineIdx);
  }

  // Re-render just the totals/summary line without rebuilding the whole
  // editor (used after a materials-only change, which doesn't affect the
  // invoice's own Qty/Rate/Amount totals).
  function refreshTotalsSilent() { /* no-op: material cost doesn't affect invoice totals shown to the customer */ }

  function wireEditorEvents() {
    var e = state.editing;
    document.getElementById('cancelBtn').addEventListener('click', closeEditor);
    document.getElementById('addLineBtn').addEventListener('click', function () {
      e.lines.push(blankLine()); renderLines();
    });
    // NOTE: the party field is a combobox now — it writes header.party_id
    // from its own onPick, so it is no longer in this id-driven list.
    ['vdate', 'due', 'discount', 'paid', 'narration'].forEach(function (k) {
      var el = document.getElementById('f_' + k);
      if (el) el.addEventListener('input', function () {
        var map = { vdate: 'vdate', due: 'due_date', discount: 'discount', paid: 'paid', narration: 'narration' };
        e.header[map[k]] = el.type === 'number' ? Number(el.value) : (el.value || null);
      });
    });
    var companyEl = document.getElementById('f_company');
    if (companyEl) companyEl.addEventListener('change', function () { e.header.company_id = companyEl.value; });
    document.getElementById('f_taxon').addEventListener('change', function () {
      e.header.tax_on = document.getElementById('f_taxon').checked; renderEditor();
    });
    ['loading', 'cartage', 'cutting'].forEach(function (k) {
      document.getElementById('f_' + k + '_on').addEventListener('change', function () {
        e.header[k + '_on'] = document.getElementById('f_' + k + '_on').checked; refreshTotalsDisplay();
      });
      document.getElementById('f_' + k + '_amt').addEventListener('input', function () {
        e.header[k + '_amt'] = Number(document.getElementById('f_' + k + '_amt').value) || 0; refreshTotalsDisplay();
      });
    });
    document.getElementById('saveBtn').addEventListener('click', saveVoucher);
    var delBtn = document.getElementById('deleteBtn');
    if (delBtn) delBtn.addEventListener('click', deleteVoucher);
    var printBtn = document.getElementById('printBtn');
    if (printBtn) printBtn.addEventListener('click', printVoucher);
  }

  // ---------------------------------------------------------------
  // Validation (§9's exact conditions)
  // ---------------------------------------------------------------
  function validate() {
    var e = state.editing;
    if (!e.header.party_id) return 'Pick a party first';
    var validLines = e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) return 'Add at least one item with a quantity';
    for (var i = 0; i < e.lines.length; i++) {
      var l = e.lines[i];
      if (l.sale_unit && !l.unit_factor) {
        var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
        return "'" + (item ? item.name : 'Item') + "' par " + l.sale_unit + " chuna hai — conversion likhna zaroori hai (1 " + l.sale_unit + " = kitne " + (item ? item.unit : 'base') + ").";
      }
      if (state.vtype === 'sale' && l.consumption_type === 'raw_material_consumption' && l.item_id && Number(l.qty) > 0) {
        var finalItem = state.items.filter(function (x) { return x.id === l.item_id; })[0];
        var mats = l.materials || [];
        if (!mats.length) return "'" + (finalItem ? finalItem.name : 'Item') + "' Raw Material hai — kam az kam ek raw material line enter karein.";
        for (var j = 0; j < mats.length; j++) {
          var m = mats[j];
          if (!m.raw_item_id) return "'" + (finalItem ? finalItem.name : 'Item') + "' ki raw material list mein item chunna zaroori hai.";
          if (m.raw_item_id === l.item_id) return "'" + (finalItem ? finalItem.name : 'Item') + "' apni khud ki raw material nahi ho sakta.";
          if (!m.warehouse_id) return "'" + (finalItem ? finalItem.name : 'Item') + "' ki raw material list mein warehouse chunna zaroori hai.";
          if (!(Number(m.qty) > 0)) return "'" + (finalItem ? finalItem.name : 'Item') + "' ki raw material quantity 0 se zyada honi chahiye.";
        }
      }
    }
    return null;
  }

  // Merge duplicate raw-material lines (same raw item + same warehouse) into
  // one summed line before saving, rather than rejecting the invoice.
  function mergeMaterialDuplicates(mats) {
    var byKey = {};
    var order = [];
    mats.forEach(function (m) {
      var key = m.raw_item_id + '|' + (m.warehouse_id || '');
      if (!byKey[key]) { byKey[key] = Object.assign({}, m); order.push(key); }
      else { byKey[key].qty = (Number(byKey[key].qty) || 0) + (Number(m.qty) || 0); if (m.notes) byKey[key].notes = (byKey[key].notes ? byKey[key].notes + '; ' : '') + m.notes; }
    });
    return order.map(function (k) { return byKey[k]; });
  }

  // Replaces a voucher_line's raw-material consumption rows entirely (a
  // safe full reversal + repost, explicitly allowed by the approved spec
  // for editing consumption) — duplicate raw-item+warehouse lines are
  // summed first rather than rejected (§ approved).
  async function syncMaterialsForLine(voucherLineId, materials) {
    var merged = mergeMaterialDuplicates(
      (materials || []).filter(function (m) { return m.raw_item_id && m.warehouse_id && Number(m.qty) > 0; })
    );
    await sb.from('voucher_line_material_consumption').delete().eq('voucher_line_id', voucherLineId);
    if (merged.length) {
      var rows = merged.map(function (m, i) {
        return { voucher_line_id: voucherLineId, raw_item_id: m.raw_item_id, warehouse_id: m.warehouse_id, qty: m.qty, notes: m.notes || null, line_no: i + 1 };
      });
      var { error } = await sb.from('voucher_line_material_consumption').insert(rows);
      if (error) throw error;
    }
  }

  // Pairs each in-memory line (which carries .materials) with its REAL,
  // persisted voucher_line id, then syncs materials for every raw-material
  // line. `finalLines` is the authoritative final row set (existing lines
  // keep their original id; genuinely new lines are matched by item/qty/
  // rate, since that's all a freshly-inserted line can be identified by).
  async function syncAllLineMaterials(memoryLines, finalLines) {
    var usedIds = {};
    (finalLines || []).forEach(function (fl) { if (memoryLines.some(function (ml) { return ml.id === fl.id; })) usedIds[fl.id] = true; });
    for (var i = 0; i < memoryLines.length; i++) {
      var ml = memoryLines[i];
      if (ml.consumption_type !== 'raw_material_consumption') continue;
      var realId = ml.id;
      if (!realId) {
        var candidate = (finalLines || []).filter(function (fl) {
          return !usedIds[fl.id] && fl.item_id === ml.item_id && Number(fl.qty) === Number(ml.qty) && Number(fl.rate) === Number(ml.rate);
        })[0];
        if (candidate) { usedIds[candidate.id] = true; realId = candidate.id; }
      }
      if (realId) await syncMaterialsForLine(realId, ml.materials);
    }
  }

  // ---------------------------------------------------------------
  // Save — via smart_merge_update / smart_merge_lines / apply_merged_lines
  // ---------------------------------------------------------------
  async function saveVoucher() {
    var e = state.editing;
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    var vErr = validate();
    if (vErr) { errEl.textContent = vErr; return; }

    var totals = computeTotals();

    var payload = Object.assign({}, e.header, {
      sub_total: totals.sub, tax_total: totals.tax, grand_total: totals.grand
    });

    try {
      if (e.isNew) {
        // Generate the id client-side (§14: "the browser generates the
        // row's real uuid before going online") so an offline insert can
        // still be queued — the lines can reference this id immediately,
        // and a retried insert with the same id is a safe no-op (23505).
        // The trade-off: vno isn't known until the queued insert actually
        // reaches the server and the numbering trigger fires.
        var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
        var headerPayload = Object.assign({ id: newId }, payload);
        var linesPayload = e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; })
          .map(function (l) { var c = sanitizeVoucherLine(l); c.voucher_id = newId; return c; });

        if (!navigator.onLine) {
          OfflineQueue.enqueue({ kind: 'insert', table: 'vouchers', payload: headerPayload });
          OfflineQueue.enqueue({ kind: 'insert', table: 'voucher_lines', payload: linesPayload });
          errEl.textContent = '';
          toast('No internet — saved locally as pending. It will get its real invoice number once synced.');
          closeEditor(); loadList(); broadcastRefresh('vouchers'); broadcastRefresh('items');
          return;
        }

        var { data: inserted, error: insErr } = await sb.from('vouchers').insert(headerPayload).select().single();
        if (insErr) {
          if (OfflineQueue.isNetworkError(insErr)) {
            OfflineQueue.enqueue({ kind: 'insert', table: 'vouchers', payload: headerPayload });
            OfflineQueue.enqueue({ kind: 'insert', table: 'voucher_lines', payload: linesPayload });
            toast('No internet — saved locally as pending. It will get its real invoice number once synced.');
            closeEditor(); loadList(); broadcastRefresh('vouchers'); broadcastRefresh('items');
            return;
          }
          return handleSaveError(insErr, errEl);
        }
        var { data: insertedLines, error: lineErr } = await sb.from('voucher_lines').insert(linesPayload).select();
        if (lineErr) {
          if (OfflineQueue.isNetworkError(lineErr)) {
            OfflineQueue.enqueue({ kind: 'insert', table: 'voucher_lines', payload: linesPayload });
          } else {
            errEl.textContent = lineErr.message; return;
          }
        } else if (state.vtype === 'sale') {
          // Raw-material sync needs real line ids — not queued offline (§
          // known limitation: dynamic consumption requires a live connection
          // to save, even though the rest of the invoice can go offline).
          await syncAllLineMaterials(e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; }), insertedLines);
        }

        // If this invoice was created via "Convert to Sale/Purchase" from a
        // quotation/PO, stamp the SOURCE doc as converted only now that the
        // real invoice actually exists — never before, so a cancelled
        // conversion never leaves an orphaned "converted" doc (§15/§16).
        if (e.convertingFrom && typeof DOC_CONFIG !== 'undefined') {
          var srcCfg = DOC_CONFIG[e.convertingFrom.type];
          await sb.from(srcCfg.table).update({ status: 'converted', converted_invoice_id: inserted.id, converted_at: new Date().toISOString() }).eq('id', e.convertingFrom.id);
        }
        toast((inserted && inserted.vno ? inserted.vno : (state.vtype === 'sale' ? 'Invoice' : 'Bill')) + ' saved');
        closeEditor(); loadList(); broadcastRefresh('vouchers'); broadcastRefresh('items');
        return;
      }

      // Edit path (§14): if we're already offline, or any merge step fails
      // with a network error, queue the whole header+lines merge as one
      // 'doc_edit_merge' op instead of losing the in-progress edit — the
      // original snapshots (e.originalHeader/e.originalLines) captured at
      // open-time are exactly what the deferred merge needs to run later.
      var newLines = e.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
      function queueVoucherEdit() {
        OfflineQueue.enqueue({
          kind: 'doc_edit_merge',
          headerTable: 'vouchers', headerId: e.id, headerOriginal: e.originalHeader,
          headerNew: payload, headerIgnore: IGNORE_HEADER,
          lineTable: 'voucher_lines', lineFkCol: 'voucher_id',
          lineOriginal: e.originalLines, lineNew: newLines
        });
        toast('No internet — your change is saved locally and will sync when back online.');
        closeEditor(); loadList(); broadcastRefresh('vouchers'); broadcastRefresh('items');
      }

      if (!navigator.onLine) { queueVoucherEdit(); return; }

      // Header merge
      var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
        p_table: 'vouchers', p_id: e.id, p_original: e.originalHeader, p_new: payload, p_ignore: IGNORE_HEADER
      });
      if (mergeErr) return OfflineQueue.isNetworkError(mergeErr) ? queueVoucherEdit() : handleSaveError(mergeErr, errEl);
      if (mergeRes.status === 'deleted') { errEl.textContent = "'" + e.originalHeader.vno + "' kisi aur ne delete kar diya hai"; return; }
      if (mergeRes.status === 'conflict') {
        // NOT auto-retried: retrying with the current row as the new
        // "original" but the SAME unchanged payload would make the merge
        // see "nobody changed it since [now]" and silently overwrite
        // whatever the other person just saved — the opposite of what
        // conflict detection is for. Surface it instead (§14/§27).
        errEl.textContent = "'" + e.originalHeader.vno + "' mein '" + mergeRes.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
        return;
      }

      // Line merge
      var { data: lineMerge, error: lmErr } = await sb.rpc('smart_merge_lines', {
        p_line_table: 'voucher_lines', p_fk_col: 'voucher_id', p_fk_id: e.id,
        p_original_lines: e.originalLines, p_new_lines: newLines
      });
      if (lmErr) return OfflineQueue.isNetworkError(lmErr) ? queueVoucherEdit() : handleSaveError(lmErr, errEl);
      if (lineMerge.status === 'conflict') {
        errEl.textContent = "'" + e.originalHeader.vno + "' mein '" + lineMerge.conflicts.join(', ') + "' kisi aur ne bhi isi waqt badla — taaza dekh kar dobara karein";
        return;
      }
      var { data: finalLines } = await sb.rpc('apply_merged_lines', { p_line_table: 'voucher_lines', p_fk_col: 'voucher_id', p_fk_id: e.id, p_result_lines: lineMerge.lines });
      if (state.vtype === 'sale') {
        // Raw-material sync needs real line ids — not queued offline (§
        // known limitation: dynamic consumption requires a live connection
        // to save, even though the rest of the invoice can go offline).
        await syncAllLineMaterials(newLines, finalLines);
      }

      toast("'" + e.originalHeader.vno + "' saved");
      closeEditor();
      loadList();
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  function handleSaveError(error, errEl) {
    if (error.code === '23505') {
      errEl.textContent = 'Ye number pehle se istemal ho chuka — dobara button dabakar naya number lein';
    } else if (!navigator.onLine || /network|fetch/i.test(error.message || '')) {
      errEl.textContent = 'No internet — your change is saved locally and will sync when back online.';
    } else {
      errEl.textContent = error.message;
    }
  }

  async function deleteVoucher() {
    var e = state.editing;

  // ---------------------------------------------------------------
  // Sales Returns (§6/§18) — always tied to a specific original sale.
  // Returnable-qty cap and cost-carry-back are enforced authoritatively
  // by DB triggers (tested directly against the database, §31 step 5/8);
  // this UI just needs to pick a sale + line(s) and let the trigger reject
  // anything invalid.

  var returnsState = { returns: [] };

  async function loadReturnsList() {
    var { data, error } = await sb.from('sales_returns').select('id,rno,rdate,party_id,grand_total,sale_id').is('deleted_at', null)
      .order('rdate', { ascending: false }).order('rno', { ascending: false }).limit(500);

    renderReturnsList();
  }

  function renderReturnsList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = returnsState.returns.filter(function (r) {
      if (!passesFilter(r.rdate, null, 0)) return false;
      return !term || (r.rno || '').toLowerCase().indexOf(term) >= 0 || partyName(r.party_id).toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '' : emptyStateHtml('No sales returns yet',
      term ? 'Nothing matches “' + term + '”.' : 'A return is always written against an existing sale.');
    var total = 0;
    rows.forEach(function (r) {
      total += Number(r.grand_total) || 0;
      html += listRowHtml({
        id: r.id, code: 'RET', name: r.rno, sub: partyName(r.party_id) + ' · ' + r.rdate,
        amount: fmtMoney(r.grand_total), tag: 'Cr', tagCls: 'cr'
      });

    document.getElementById('listArea').innerHTML = html;
    wireListRows(function (id) { openReturnEditor(id); });
    setListKpis([
      { label: 'Total returned', val: total, cls: 'cr', ring: 'Rs' },
      { label: 'Returns', text: String(rows.length), cls: 'n', ring: '#' }
    ]);
    setListCount(rows.length, rows.length === 1 ? 'return' : 'returns');
    setListSub(rows.length + ' of ' + returnsState.returns.length + ' · ' + rangeLabel());
  }

  var returnEditing = null;

  async function openReturnEditor(id) {
    await loadMasters();
    if (!id) {
      returnEditing = { isNew: true, id: null, sale: null, saleLines: [], picked: [] };
    } else {
      var { data: header } = await sb.from('sales_returns').select('*').eq('id', id).single();
      if (!header) { toast('This record was deleted by someone else.', true); loadReturnsList(); return; }
      var { data: lines } = await sb.from('sales_return_lines').select('*').eq('return_id', id);
      returnEditing = { isNew: false, id: id, header: header, picked: lines || [] };
    }
    renderReturnEditor();
    showSheet();

  async function renderReturnEditor() {
    var r = returnEditing;

    if (r.isNew) {
      // Sales list is fetched fresh here rather than reused from state.vouchers,
      // since the Sales tab may never have been opened this session.
      var { data: sales } = await sb.from('vouchers').select('id,vno,vdate,party_id,grand_total').eq('vtype', 'sale').is('deleted_at', null).order('vdate', { ascending: false }).limit(200);
      var html = '<div class="field"><label>Pick original sale</label>' +
        comboHtml({
          value: null,
          options: (sales || []).map(function (v) {
            return { id: v.id, main: v.vno, sub: partyName(v.party_id) + ' · ' + v.vdate + ' · ' + fmtMoney(v.grand_total) };
          }),
          placeholder: 'Search invoice number or party…',
          empty: 'No sale found — a return is always written against an existing sales invoice.',
          onPick: function (id) { if (id) pickReturnSale(id); }
        }) +
        '<div class="hint">A return always belongs to one sale. The returnable quantity is capped by the database.</div></div>';

    }
