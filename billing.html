  // ---------------------------------------------------------------
  // Print (§9/§25) — classic A4 document (theme.css §17 .pd-*): firm
  // letterhead with logo + meta box, party block, numbered line table,
  // totals block, narration, signatures and the "Powered by" footer.
  // ---------------------------------------------------------------
  var firmCache = {};
  // Letterhead details (city/phone/NTN/logo) are not in the editor's slim
  // companies list, so they are fetched once per firm when printing.
  async function firmForPrint(companyId) {
    var key = companyId || '_default';
    if (firmCache[key]) return firmCache[key];
    var q = sb.from('companies').select('id,name,city,phone,ntn,logo,signature,stamp,is_default').is('deleted_at', null);
    q = companyId ? q.eq('id', companyId) : q.order('is_default', { ascending: false }).limit(1);
    var res = await q.maybeSingle().catch(function () { return { data: null }; });
    var row = (res && res.data) || state.companies.filter(function (c) { return c.id === companyId; })[0] ||
      state.companies.filter(function (c) { return c.is_default; })[0] || { name: 'OHT Accounting System' };
    firmCache[key] = row;
    return row;
  }
  function firmMarkHtml(f) {
    if (f && f.logo) return '<img src="' + esc(f.logo) + '" alt="">';
    return esc(((f && f.name) || 'O').trim().charAt(0).toUpperCase() || 'O');
  }
  function firmAddrText(f) {
    return f ? [f.city, f.phone, f.ntn ? 'NTN ' + f.ntn : ''].filter(Boolean).join(' \u00B7 ') : '';
  }
  function printStamp() {
    var d = new Date();
    return d.toISOString().slice(0, 10) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // Builds the "<div>Label</div>" signature-line row shared by every print
  // document. The company's own uploaded signature/stamp images (§25) are
  // only ever drawn on the one line the user chose in askPrintOptions() —
  // never on every line, and never without an explicit choice.
  function pdSigHtml(labels, sigIndex, sigImg, stampImg) {
    return '<div class="pd-sig">' + labels.map(function (s, i) {
      var extra = '';
      if (i === sigIndex && (sigImg || stampImg)) {
        extra = '<span class="sig-wrap">' +
          (sigImg ? '<img class="sig-img" src="' + esc(sigImg) + '">' : '') +
          (stampImg ? '<img class="stamp-img" src="' + esc(stampImg) + '">' : '') +
          '</span>';
      }
      return '<div>' + extra + esc(s) + '</div>';
    }).join('') + '</div>';
  }

  // Asks, right before printing, which signature line (if any) gets the
  // company's real uploaded signature and whether to include its stamp —
  // skipped entirely when the company has neither, so printing stays a
  // single click for anyone who never uploaded them. Resolves to null if
  // the user cancels (caller must not print in that case).
  function askPrintOptions(company, sigLabels) {
    var hasSig = !!(company && company.signature);
    var hasStamp = !!(company && company.stamp);
    if (!hasSig && !hasStamp) return Promise.resolve({ sigIndex: -1, stampOn: false });
    return new Promise(function (resolve) {
      var scrim = document.getElementById('confirmScrim');
      var defaultIdx = sigLabels.length - 1;
      var radios = hasSig ? '<div class="po-lbl">Place the signature on</div><div class="po-opt">' +
        sigLabels.map(function (s, i) {
          return '<label class="po-radio"><input type="radio" name="poSig" value="' + i + '"' + (i === defaultIdx ? ' checked' : '') + '> ' + esc(s) + '</label>';
        }).join('') +
        '<label class="po-radio"><input type="radio" name="poSig" value="-1"> None</label></div>' : '';
      var stampRow = hasStamp ? '<label class="po-check"><input type="checkbox" id="poStamp" checked> Include company stamp</label>' : '';
      scrim.innerHTML =
        '<div class="confirm-card po-card" role="dialog" aria-modal="true">' +
          '<h4>Print options</h4>' + radios + stampRow +
          '<div class="acts">' +
            '<button type="button" class="btn" data-a="0">Cancel</button>' +
            '<button type="button" class="btn pri" data-a="1">Print</button>' +
          '</div>' +
        '</div>';
      scrim.classList.add('on');
      var done = false;
      function finish(result) {
        if (done) return;
        done = true;
        scrim.classList.remove('on'); scrim.innerHTML = '';
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onKey(ev) { if (ev.key === 'Escape') finish(null); }
      scrim.querySelector('[data-a="0"]').addEventListener('click', function () { finish(null); });
      scrim.querySelector('[data-a="1"]').addEventListener('click', function () {
        var sel = scrim.querySelector('input[name="poSig"]:checked');
        finish({
          sigIndex: hasSig && sel ? Number(sel.value) : -1,
          stampOn: hasStamp && !!scrim.querySelector('#poStamp').checked
        });
      });
      scrim.addEventListener('click', function (ev) { if (ev.target === scrim) finish(null); });
      document.addEventListener('keydown', onKey);
    });
  }

  // Puts the built .pd HTML on screen, flips on the print stylesheet, and
  // restores everything once the print dialog closes — the same sequence
  // printVoucher() below uses inline, factored out for the four print
  // functions this phase adds (Return / Quotation-PO / Service doc / Transfer).
  function showPrintDoc(html, filename) {
    document.getElementById('printArea').innerHTML = html;
    document.body.classList.add('pd-on');
    var oldTitle = document.title;
    document.title = filename;
    try { window.top.document.title = document.title; } catch (ex) {}
    window.addEventListener('afterprint', function restore() {
      document.title = oldTitle;
      try { window.top.document.title = oldTitle; } catch (ex) {}
      document.body.classList.remove('pd-on');
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  }

  // Builds one classic A4 document (theme.css §17 .pd-*): letterhead + meta
  // box, title, an optional party block (1-2 parties), a numbered line
  // table, an optional totals block, an optional narration, and the
  // signature / "Powered by" footer. Every print function below is just
  // "gather this document's own fields" + one call to this.
  //   opts: { firm, tag, docTitle, sub, metaRows:[[label,value]],
  //           parties: [{label,name,sub}] | null,
  //           cols:[{label,cls}], rows:[[tdHtml,...]],
  //           totals: [{label,value,cls}] | null,
  //           narrationLabel, narration, sigLabels:[...], footerRight,
  //           sigIndex, sigImg, stampImg (from askPrintOptions(), §25) }
  function buildPdDoc(opts) {
    var html = '<div class="pd">' +
      '<div class="pd-lh">' +
        '<div class="mk">' + firmMarkHtml(opts.firm) + '</div>' +
        '<div><div class="fn">' + esc((opts.firm && opts.firm.name) || 'OHT Accounting System') + '</div>' +
          '<div class="fa">' + esc(firmAddrText(opts.firm)) + '</div><div class="tag">' + esc(opts.tag || '') + '</div></div>' +
        '<div class="pd-meta">' +
          opts.metaRows.map(function (r) { return '<div><b>' + esc(r[0]) + '</b><span class="mono">' + esc(r[1] == null ? '—' : r[1]) + '</span></div>'; }).join('') +
        '</div>' +
      '</div><div class="pd-rule"></div><div class="pd-rule2"></div>' +
      '<div class="pd-ttl"><h1>' + esc(opts.docTitle) + '</h1><span class="sub">' + esc(opts.sub || '') + '</span><span class="basis">Amounts in PKR</span></div>';

    if (opts.parties && opts.parties.length) {
      html += '<div class="party">' + opts.parties.map(function (p) {
        return '<div class="blk"><div class="k">' + esc(p.label) + '</div><div class="nm">' + esc(p.name || '—') + '</div>' +
          (p.sub ? '<div class="ad">' + esc(p.sub) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }

    if (opts.cols) {
      html += '<table><thead><tr><th class="idx">#</th>' +
        opts.cols.map(function (c) { return '<th' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + esc(c.label) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        (opts.rows.length ? opts.rows.map(function (r, i) { return '<tr><td class="idx mono">' + (i + 1) + '</td>' + r.join('') + '</tr>'; }).join('')
          : '<tr><td colspan="' + (opts.cols.length + 1) + '" style="color:#6B6357">No lines</td></tr>') +
        '</tbody></table>';
    }

    if (opts.totals && opts.totals.length) {
      html += '<div class="totals"><table>' + opts.totals.map(function (t) {
        return '<tr class="' + (t.cls || '') + '"><td>' + esc(t.label) + '</td><td class="num">' + esc(t.value) + '</td></tr>';
      }).join('') + '</table></div>';
    }

    if (opts.narration) {
      html += '<div class="narr"><b>' + esc(opts.narrationLabel || 'Narration') + '</b>' + esc(opts.narration) + '</div>';
    }

    html += '<div class="pd-spacer"></div>' +
      '<div class="pd-foot">' + pdSigHtml(opts.sigLabels, opts.sigIndex != null ? opts.sigIndex : -1, opts.sigImg, opts.stampImg) +
        '<div class="pd-fl"><span>Powered by "OHT Solutions"</span><span>' + esc(opts.footerRight || '') + '</span></div></div>' +
      '</div>';
    return html;
  }

  async function printVoucher() {
    var e = state.editing;
    var h = e.header;
    var totals = computeTotals();
    var company = await firmForPrint(h.company_id);
    var sigLabels = ['Received by', 'Authorised by'];
    var po = await askPrintOptions(company, sigLabels);
    if (!po) return;
    var party = state.parties.filter(function (p) { return p.id === h.party_id; })[0];
    var isSale = state.vtype === 'sale';
    var docTitle = (isSale ? 'Sales Invoice' : 'Purchase Bill') + (h.tax_on ? ' \u00B7 Sales Tax' : '');
    var showTax = !!h.tax_on;

    var rows = e.lines.filter(function (l) { return l.item_id; }).map(function (l, i) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      var qty = l.sale_unit ? (l.sale_qty != null ? l.sale_qty : l.qty) : l.qty;
      var unit = l.sale_unit || (item ? item.unit : '') || '';
      return '<tr><td class="idx mono">' + (i + 1) + '</td><td>' + esc(item ? item.name : '') +
        (l.sale_unit && item && item.unit && l.sale_unit !== item.unit ? '<div style="font-size:10px;color:#6B6357">= ' + esc(l.qty) + ' ' + esc(item.unit) + '</div>' : '') +
        '</td><td class="num">' + esc(qty) + '</td><td>' + esc(unit) + '</td>' +
        '<td class="num">' + fmtMoney(l.rate) + '</td>' +
        (showTax ? '<td class="num">' + esc(Number(l.tax_pct) || 0) + '%</td>' : '') +
        '<td class="num">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</td></tr>';
    }).join('');
    var balance = totals.grand - (Number(h.paid) || 0);

    var totalRows = '<tr><td>Sub total</td><td class="num">' + fmtMoney(totals.sub) + '</td></tr>' +
      ((Number(h.discount) || 0) ? '<tr><td>Discount</td><td class="num">\u2212 ' + fmtMoney(h.discount) + '</td></tr>' : '') +
      (showTax ? '<tr><td>Sales tax</td><td class="num">' + fmtMoney(totals.tax) + '</td></tr>' : '') +
      (h.loading_on ? '<tr><td>Loading</td><td class="num">' + fmtMoney(h.loading_amt) + '</td></tr>' : '') +
      (h.cartage_on ? '<tr><td>Cartage</td><td class="num">' + fmtMoney(h.cartage_amt) + '</td></tr>' : '') +
      (h.cutting_on ? '<tr><td>Cutting</td><td class="num">' + fmtMoney(h.cutting_amt) + '</td></tr>' : '') +
      '<tr class="grand"><td>Grand total</td><td class="num">' + fmtMoney(totals.grand) + '</td></tr>' +
      '<tr><td>' + (isSale ? 'Received' : 'Paid') + '</td><td class="num">' + fmtMoney(h.paid) + '</td></tr>' +
      '<tr class="bal"><td>Balance ' + (isSale ? 'due' : 'payable') + '</td><td class="num">' + fmtMoney(balance) + '</td></tr>';

    var html = '<div class="pd">' +
      '<div class="pd-lh">' +
        '<div class="mk">' + firmMarkHtml(company) + '</div>' +
        '<div><div class="fn">' + esc(company.name || 'OHT Accounting System') + '</div>' +
          '<div class="fa">' + esc(firmAddrText(company)) + '</div><div class="tag">' + esc(isSale ? 'Sales document' : 'Purchase document') + '</div></div>' +
        '<div class="pd-meta">' +
          '<div><b>' + (isSale ? 'Invoice no' : 'Bill no') + '</b><span class="mono">' + esc(h.vno || 'PREVIEW') + '</span></div>' +
          '<div><b>Date</b><span class="mono">' + esc(h.vdate) + '</span></div>' +
          (h.due_date ? '<div><b>Due</b><span class="mono">' + esc(h.due_date) + '</span></div>' : '') +
          '<div><b>Printed</b><span class="mono">' + esc(printStamp()) + '</span></div>' +
        '</div>' +
      '</div><div class="pd-rule"></div><div class="pd-rule2"></div>' +
      '<div class="pd-ttl"><h1>' + esc(docTitle) + '</h1><span class="sub">' + esc(h.vno || 'Preview') + ' \u00B7 ' + esc(h.vdate) + '</span><span class="basis">Amounts in PKR</span></div>' +
      '<div class="party" style="margin-top:12px">' +
        '<div class="blk"><div class="k">' + (isSale ? 'Bill to' : 'Supplier') + '</div><div class="nm">' + esc(party ? party.name : '\u2014') + '</div>' +
          '<div class="ad">' + esc(party ? [party.city].filter(Boolean).join(' \u00B7 ') : '') + '</div></div>' +
        '<div class="blk"><div class="k">' + (isSale ? 'From' : 'Bought by') + '</div><div class="nm">' + esc(company.name || '') + '</div><div class="ad">' + esc(firmAddrText(company)) + '</div></div>' +
      '</div>' +
      '<table><thead><tr><th class="idx">#</th><th>Item</th><th class="num">Qty</th><th>Unit</th><th class="num">Rate</th>' +
        (showTax ? '<th class="num">Tax</th>' : '') + '<th class="num">Amount</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="7" style="color:#6B6357">No items</td></tr>') + '</tbody></table>' +
      '<div class="totals"><table>' + totalRows + '</table></div>' +
      (h.narration ? '<div class="narr"><b>Narration</b>' + esc(h.narration) + '</div>' : '') +
      '<div class="pd-spacer"></div>' +
      '<div class="pd-foot">' + pdSigHtml(sigLabels, po.sigIndex, company.signature, po.stampOn ? company.stamp : null) +
        '<div class="pd-fl"><span>Powered by "OHT Solutions"</span><span>' + esc(docTitle + ' \u00B7 ' + (h.vno || 'Preview')) + '</span></div></div>' +
      '</div>';

    document.getElementById('printArea').innerHTML = html;
    document.body.classList.add('pd-on');
    var oldTitle = document.title;
    document.title = (h.vno || 'invoice') + '.pdf';
    try { window.top.document.title = document.title; } catch (ex) {}
    window.addEventListener('afterprint', function restore() {
      document.title = oldTitle;
      try { window.top.document.title = oldTitle; } catch (ex) {}
      document.body.classList.remove('pd-on');
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  }

  // ---------------------------------------------------------------
  // Cross-module refresh (§14): a change in Masters/Billing/Daily Ledger
  // anywhere else re-fetches the master-data caches this module also uses,
  // and re-fetches the list currently on screen — so nothing here goes
  // stale or shows removed data until the user happens to switch tabs.
  // ---------------------------------------------------------------
  function broadcastRefresh(kind) {
    try { window.parent.postMessage({ oht: 'refresh', kind: kind }, '*'); } catch (e) {}
  }
  function reloadCurrentList() {
    if (state.mode === 'return') loadReturnsList();
    else if (state.mode === 'quotation' || state.mode === 'po') loadDocsList(state.mode);
    else if (state.mode === 'sinvoice' || state.mode === 'squote') loadServiceDocsList(state.mode);
    else if (state.mode === 'transfer') loadTransfersList();
    else loadList();
  }
  var MASTER_REFRESH_KINDS = ['parties', 'items', 'companies', 'warehouses', 'services'];
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.oht !== 'refresh' || MASTER_REFRESH_KINDS.indexOf(d.kind) < 0) return;
    (d.kind === 'services' ? loadServices() : loadMasters().then(fillFilterSelects)).then(reloadCurrentList);
  });

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  var me = { isAdmin: false, perms: {} };
  function canViewMaterialCost() { return me.isAdmin || !!me.perms.material_cost_view; }

  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('listArea').innerHTML =
        emptyStateHtml('Not signed in', 'Please sign in from the main app.');
      return;
    }
    var { data: profile } = await sb.from('app_users').select('is_admin,perms').eq('id', userData.user.id).maybeSingle();
    if (profile) { me.isAdmin = profile.is_admin; me.perms = profile.perms || {}; }
    await loadMasters();
    fillFilterSelects();
    if (pendingTab && ALL_TABS[pendingTab]) { switchTab(pendingTab); pendingTab = null; }
    else { showFiltersFor('sale'); await loadList(); }
    inited = true;
    OfflineQueue.startAutoFlush(sb);
  })();
})();
</script>
</body>
</html>
