  async function saveTransfer() {
    var t = transferEditing;
    var errEl = document.getElementById('editorErr');
    if (!t.header.from_warehouse || !t.header.to_warehouse) { errEl.textContent = 'Pick both warehouses'; return; }
    if (t.header.from_warehouse === t.header.to_warehouse) { errEl.textContent = 'From and To warehouses must be different'; return; }
    var validLines = t.lines.filter(function (l) { return l.item_id && Number(l.qty) > 0; });
    if (!validLines.length) { errEl.textContent = 'Add at least one item with a quantity'; return; }

    if (t.isNew) {
      var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
      var headerPayload = Object.assign({ id: newId }, t.header);
      var linesPayload = validLines.map(function (l) { return { transfer_id: newId, item_id: l.item_id, qty: l.qty }; });

      if (!navigator.onLine) {
        OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfers', payload: headerPayload });
        OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfer_lines', payload: linesPayload });
        toast('No internet — saved locally as pending. It will get its real number once synced.');
        closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
        return;
      }

      var { error: insErr } = await sb.from('stock_transfers').insert(headerPayload);
      if (insErr) {
        if (OfflineQueue.isNetworkError(insErr)) {
          OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfers', payload: headerPayload });
          OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfer_lines', payload: linesPayload });
          toast('No internet — saved locally as pending. It will get its real number once synced.');
          closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
          return;
        }
        errEl.textContent = insErr.message; return;
      }
      var { error: lineErr } = await sb.from('stock_transfer_lines').insert(linesPayload);
      if (lineErr) {
        if (OfflineQueue.isNetworkError(lineErr)) {
          OfflineQueue.enqueue({ kind: 'insert', table: 'stock_transfer_lines', payload: linesPayload });
        } else {
          errEl.textContent = lineErr.message; return;
        }
      }
    } else {
      var linesPayloadEdit = validLines.map(function (l) { return { transfer_id: t.id, item_id: l.item_id, qty: l.qty }; });

      if (!navigator.onLine) {
        OfflineQueue.enqueue({ kind: 'transfer_edit_replace', table: 'stock_transfers', recordId: t.id, headerPayload: t.header, lineTable: 'stock_transfer_lines', lineFkCol: 'transfer_id', linesPayload: linesPayloadEdit });
        toast('No internet — your change is saved locally and will sync when back online.');
        closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
        return;
      }

      var { error: updErr } = await sb.from('stock_transfers').update(t.header).eq('id', t.id);
      if (updErr) {
        if (OfflineQueue.isNetworkError(updErr)) {
          OfflineQueue.enqueue({ kind: 'transfer_edit_replace', table: 'stock_transfers', recordId: t.id, headerPayload: t.header, lineTable: 'stock_transfer_lines', lineFkCol: 'transfer_id', linesPayload: linesPayloadEdit });
          toast('No internet — your change is saved locally and will sync when back online.');
          closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');
          return;
        }
        errEl.textContent = updErr.message; return;
      }
      await sb.from('stock_transfer_lines').delete().eq('transfer_id', t.id);
      await sb.from('stock_transfer_lines').insert(linesPayloadEdit);
    }
    toast('Stock transfer saved');
    closeEditor(); loadTransfersList(); broadcastRefresh('stock_transfers'); broadcastRefresh('items');

  // ---------------------------------------------------------------
  // Stock Adjustments — toota/kharab maal, ginti ka farq, gum/chori.
  // One item per adjustment (SA-0001). qty is signed in the table:
  // negative removes stock, positive adds it. The costing engine moves
  // only the quantity at the current average cost; Period Lock, the
  // Recycle Bin, the audit log and the Item Stock Ledger already cover
  // this table on the database side.
  // ---------------------------------------------------------------
  var ADJ_REASONS = ['Toot gaya / kharab', 'Ginti mein kam nikla', 'Ginti mein zyada nikla', 'Gum / chori', 'Apna istemal / sample', 'Other'];
  var adjEditing = null;
  var adjState = { list: [] };

  async function loadAdjustList() {
    var { data, error } = await sb.from('stock_adjustments').select('*').is('deleted_at', null).order('adj_date', { ascending: false }).order('created_at', { ascending: false }).limit(500);
    if (state.mode !== 'adjust') return; // the user moved to another tab meanwhile
    if (error) { showListError(error); return; }
    adjState.list = data || [];
    renderAdjustList();
  }
  function fmtQty(n) { var v = Math.round(Number(n || 0) * 1000) / 1000; return v.toLocaleString('en-US', { maximumFractionDigits: 3 }); }

  function renderAdjustList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = adjState.list.filter(function (a) {
      if (!passesFilter(a.adj_date, null, 0)) return false;
      var it = itemById(a.item_id);
      return !term || (a.adjno || '').toLowerCase().indexOf(term) >= 0 ||
        (it && it.name.toLowerCase().indexOf(term) >= 0) || (a.reason || '').toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '' : emptyStateHtml('No stock adjustments yet',
      term ? 'Nothing matches “' + term + '”.' : 'Toota hua maal, ginti ka farq ya gum hua maal yahan se stock mein kam/zyada karein.');
    var outN = 0, inN = 0;
    rows.forEach(function (a) {
      var it = itemById(a.item_id), q = Number(a.qty);
      if (q < 0) outN++; else inN++;
      html += listRowHtml({
        id: a.id, code: 'SA', name: (a.adjno || 'SA') + ' · ' + (it ? it.name : '—'),
        sub: a.adj_date + (a.reason ? ' · ' + a.reason : ''),
        tag: (q < 0 ? '− ' : '+ ') + fmtQty(Math.abs(q)) + (it && it.unit ? ' ' + it.unit : ''), tagCls: q < 0 ? 'b-void' : 'b-ok'
      });
    });
    document.getElementById('listArea').innerHTML = html;
    wireListRows(function (id) { openAdjustEditor(id); });
    setListKpis([
      { label: 'Adjustments', text: String(rows.length), cls: 'n', ring: '#' },
      { label: 'Stock kam kiya', text: String(outN), cls: 'dr', ring: '−' },
      { label: 'Stock barhaya', text: String(inN), cls: 'cash', ring: '+' }
    ]);
    setListCount(rows.length, rows.length === 1 ? 'adjustment' : 'adjustments');
    setListSub(rows.length + ' of ' + adjState.list.length + ' · ' + rangeLabel());
  }

  function splitReason(r) {
    r = r || '';
    for (var i = 0; i < ADJ_REASONS.length; i++) {
      var k = ADJ_REASONS[i];
      if (r === k) return { kind: k, notes: '' };
      if (r.indexOf(k + ' — ') === 0) return { kind: k, notes: r.slice(k.length + 3) };
    }
    return { kind: r ? 'Other' : ADJ_REASONS[0], notes: r };
  }

  async function openAdjustEditor(id) {
    var seq = ++viewSeq;
    await loadMasters();
    if (seq !== viewSeq) return; // user moved to another tab/document meanwhile
    if (!id) {
      adjEditing = { isNew: true, id: null, header: { adj_date: todayStr(), item_id: null, dir: 'out', qty_abs: '', reason_kind: ADJ_REASONS[0], notes: '', adjno: '' } };
    } else {
      var { data: a } = await sb.from('stock_adjustments').select('*').eq('id', id).maybeSingle();
      if (seq !== viewSeq) return;
      if (!a || a.deleted_at) { toast('This record was deleted by someone else.', true); loadAdjustList(); return; }
      var rs = splitReason(a.reason);
      adjEditing = { isNew: false, id: id, origItem: a.item_id, origQty: Number(a.qty),
        header: { adj_date: a.adj_date, item_id: a.item_id, dir: Number(a.qty) < 0 ? 'out' : 'in', qty_abs: Math.abs(Number(a.qty)),
          reason_kind: rs.kind, notes: rs.notes, adjno: a.adjno },

  // "Abhi stock → Save ke baad" for the item on screen. When editing, the

  function adjPreviewText() {
    var t = adjEditing, h = t.header, it = itemById(h.item_id);
    if (!it) return 'Item chunein — us ka abhi ka stock yahan nazar aayega.';

    var u = it.unit ? ' ' + it.unit : '';
    return 'Abhi stock: ' + fmtQty(base) + u + '  →  Save ke baad: ' + fmtQty(after) + u + (after < 0 ? '  (minus mein chala jayega!)' : '');
  }

  var adjSaving = false;
  async function saveAdjust() {
    if (adjSaving) return;
    var t = adjEditing, h = t.header;
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    var q = Number(h.qty_abs);
    if (!h.item_id) { errEl.textContent = 'Item chunein'; return; }
    if (!h.adj_date) { errEl.textContent = 'Date likhein'; return; }
    if (!(q > 0)) { errEl.textContent = 'Qty 0 se zyada likhein'; return; }
    if (isLockedDate(h.adj_date)) { errEl.textContent = 'Ye tareekh Period Lock mein hai — is din ki entry nahi ho sakti.'; return; }
    if (!navigator.onLine) { errEl.textContent = 'Stock adjustment ke liye internet zaroori hai.'; return; }
    var reason = h.reason_kind + (String(h.notes || '').trim() ? ' — ' + String(h.notes).trim() : '');
    var payload = { item_id: h.item_id, adj_date: h.adj_date, qty: h.dir === 'out' ? -q : q, reason: reason };
    adjSaving = true;
    var res = t.isNew
      ? await sb.from('stock_adjustments').insert(payload).select('adjno').single()
      : await sb.from('stock_adjustments').update(payload).eq('id', t.id).select('adjno').single();
    adjSaving = false;
    if (res.error) { errEl.textContent = res.error.message; return; }
    toast((res.data && res.data.adjno ? res.data.adjno + ' ' : '') + 'saved — stock updated');

  }

  // ---------------------------------------------------------------
  // Delivery Challans — Quotation → DC (partial, as many as needed) →
  // Sales Invoice (from one or more DCs). A DC carries NO rates; rates go
  // on the invoice. Stock leaves at the DC for "General supply" lines and
  // never again on an invoice made from it (voucher_lines.dc_line_id —
  // the costing engine skips those lines). "Manufactured" lines move no
  // stock of their own: their raw material leaves through Material Issues
  // against the quotation.
  // ---------------------------------------------------------------
  var dcState = { list: [], perDc: {}, qnos: {} };
  var dcEditing = null;
  var X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function itemById(id) { return state.items.filter(function (x) { return x.id === id; })[0] || null; }
  function qtyStr(n) { return String(Math.round((Number(n) || 0) * 1000) / 1000); }

  // Sum of billed qty per DC line, from live invoices only.
  async function billedByDcLine(ids) {
    var out = {};
    if (!ids.length) return out;
    var { data } = await sb.from('voucher_lines').select('dc_line_id,qty,vouchers!inner(deleted_at)')
      .in('dc_line_id', ids).is('vouchers.deleted_at', null);
    (data || []).forEach(function (b) { out[b.dc_line_id] = (out[b.dc_line_id] || 0) + Number(b.qty || 0); });
    return out;
  }

  async function loadDcList() {
    var [{ data, error }, { data: lines }, { data: billed }, { data: quotes }] = await Promise.all([
      sb.from('delivery_challans').select('*').is('deleted_at', null).order('dc_date', { ascending: false }).order('dcno', { ascending: false }).limit(500),
      sb.from('dc_lines').select('id,dc_id,qty,delivery_challans!inner(deleted_at)').is('delivery_challans.deleted_at', null).range(0, 4999),
      sb.from('voucher_lines').select('dc_line_id,qty,vouchers!inner(deleted_at)').not('dc_line_id', 'is', null).is('vouchers.deleted_at', null).range(0, 4999),
      sb.from('quotations').select('id,qno').range(0, 4999)
    ]);
    if (state.mode !== 'dc') return; // the user moved to another tab meanwhile
    if (error) { showListError(error); return; }
    dcState.list = data || [];
    var billedByLine = {};
    (billed || []).forEach(function (b) { billedByLine[b.dc_line_id] = (billedByLine[b.dc_line_id] || 0) + Number(b.qty || 0); });
    dcState.perDc = {};
    (lines || []).forEach(function (l) {
      var x = dcState.perDc[l.dc_id] = dcState.perDc[l.dc_id] || { qty: 0, billed: 0 };
      x.qty += Number(l.qty || 0);
      x.billed += Math.min(Number(l.qty || 0), billedByLine[l.id] || 0);
    });
    dcState.qnos = {};
    (quotes || []).forEach(function (q) { dcState.qnos[q.id] = q.qno; });
    renderDcList();
  }

  function dcBillStatus(dcId) {
    var x = dcState.perDc[dcId];
    if (!x || x.billed <= 0.0005) return { label: 'Unbilled', cls: 'b-warn' };
    if (x.billed + 0.0005 >= x.qty) return { label: 'Billed', cls: 'b-ok' };
    return { label: 'Part billed', cls: 'b-neutral' };
  }

  function renderDcList() {
    var term = (document.getElementById('search').value || '').toLowerCase();
    var rows = dcState.list.filter(function (d) {
      if (!passesFilter(d.dc_date, d.company_id, 0)) return false;
      return !term || (d.dcno || '').toLowerCase().indexOf(term) >= 0 ||
        partyName(d.party_id).toLowerCase().indexOf(term) >= 0 ||
        (dcState.qnos[d.quotation_id] || '').toLowerCase().indexOf(term) >= 0;
    });
    var html = rows.length ? '' : emptyStateHtml('No delivery challans yet',
      term ? 'Nothing matches “' + term + '”.' : 'Make one from a quotation (Delivery Challan button), or tap + New.');
    var open = 0;
    rows.forEach(function (d) {
      var st = dcBillStatus(d.id);
      if (st.label !== 'Billed') open++;
      html += listRowHtml({
        id: d.id, code: 'DC', name: d.dcno,
        sub: partyName(d.party_id) + ' · ' + d.dc_date + (dcState.qnos[d.quotation_id] ? ' · ' + dcState.qnos[d.quotation_id] : ''),
        badge: st.label, badgeCls: st.cls
      });
    });
    document.getElementById('listArea').innerHTML = html;
    wireListRows(function (id) { openDcEditor(id); });
    setListKpis([
      { label: 'Challans', text: String(rows.length), cls: 'n', ring: '#' },
      { label: 'Not fully billed', text: String(open), cls: open ? 'wn' : 'n', ring: '!' }
    ]);
    setListCount(rows.length, rows.length === 1 ? 'challan' : 'challans');
    setListSub(rows.length + ' of ' + dcState.list.length + ' · ' + rangeLabel() + firmLabel());
  }

  function blankDcLine() {
    return { id: null, item_id: null, custom_name: null, custom_unit: null, description: '', qty: 0,
      consumption_type: 'general_goods', warehouse_id: defaultWarehouseId(), quotation_line_id: null };
  }
  function isCustomDcLine(l) { return !l.item_id && l.custom_name != null; }
  function dcLineValid(l) { return (l.item_id || String(l.custom_name || '').trim()) && Number(l.qty) > 0; }
  function dcLineName(l) { var it = itemById(l.item_id); return it ? it.name : (l.custom_name || ''); }
  function dcLineUnit(l) { var it = itemById(l.item_id); return it ? (it.unit || '') : (l.custom_unit || 'pcs'); }
  function defaultDcType(item) { return item && item.item_type === 'raw_material_consumption' ? 'manufactured' : 'general_goods'; }

  // Ordered / delivered / billed per quotation line, the quotation's DCs,
  // and its material issues — shared by the quotation's progress panel,
  // Quotation → DC, and the DC editor's "ordered … pending" hints.
  async function quoteProgress(qid) {
    var [{ data: q }, { data: qlines }, { data: dls }, { data: mis }] = await Promise.all([
      sb.from('quotations').select('id,qno,party_id,company_id,walkin_name,status').eq('id', qid).maybeSingle(),
      sb.from('quotation_lines').select('*').eq('quotation_id', qid).order('line_no'),
      sb.from('dc_lines').select('id,dc_id,qty,quotation_line_id,delivery_challans!inner(dcno,quotation_id,deleted_at)')
        .eq('delivery_challans.quotation_id', qid).is('delivery_challans.deleted_at', null),
      sb.from('material_issues').select('id,item_id,qty,cost_amount').eq('quotation_id', qid).is('deleted_at', null)
    ]);
    var billed = await billedByDcLine((dls || []).map(function (l) { return l.id; }));
    var dcnos = {};
    (dls || []).forEach(function (l) { dcnos[l.dc_id] = l.delivery_challans.dcno; });
    var lines = (qlines || []).map(function (ql) {
      var mine = (dls || []).filter(function (l) { return l.quotation_line_id === ql.id; });
      var delivered = mine.reduce(function (s, l) { return s + Number(l.qty || 0); }, 0);
      var invoiced = mine.reduce(function (s, l) { return s + Math.min(Number(l.qty || 0), billed[l.id] || 0); }, 0);
      return { ql: ql, ordered: Number(ql.qty || 0), delivered: delivered, invoiced: invoiced,
        pending: Math.max(0, Number(ql.qty || 0) - delivered), dcLines: mine };
    });
    return {
      quote: q, lines: lines, dcnos: dcnos, issues: mis || [],
      issueCost: (mis || []).reduce(function (s, m) { return s + Number(m.cost_amount || 0); }, 0)
    };
  }

  // qinfo: quotation_line_id -> { ordered, deliveredElsewhere } for a DC's hints.
  function dcQuoteInfo(prog, dcId) {
    var info = {};
    prog.lines.forEach(function (x) {
      info[x.ql.id] = {
        ordered: x.ordered,
        deliveredElsewhere: x.dcLines.filter(function (l) { return l.dc_id !== dcId; }).reduce(function (s, l) { return s + Number(l.qty || 0); }, 0)
      };
    });
    return info;
  }

  async function openDcEditor(id, preset) {
    var seq = ++viewSeq;
    await loadMasters();
    if (seq !== viewSeq) return; // user moved to another tab/document meanwhile
    if (preset) {
      dcEditing = preset;
    } else if (!id) {
      var defCompany = state.companies.filter(function (c) { return c.is_default; })[0] || state.companies[0];
      dcEditing = { isNew: true, id: null, billed: {}, qinfo: {}, originalLines: [],
        header: { dc_date: todayStr(), party_id: null, company_id: defCompany ? defCompany.id : null, quotation_id: null, narration: '' },
        lines: [blankDcLine()] };
    } else {
      var [{ data: header }, { data: lines }] = await Promise.all([
        sb.from('delivery_challans').select('*').eq('id', id).single(),
        sb.from('dc_lines').select('*').eq('dc_id', id).order('line_no')
      ]);
      if (seq !== viewSeq) return; // user moved to another tab/document meanwhile
      if (!header) { toast('This record was deleted by someone else.', true); loadDcList(); return; }
      var billed = await billedByDcLine((lines || []).map(function (l) { return l.id; }));
      var prog = header.quotation_id ? await quoteProgress(header.quotation_id) : null;
      if (seq !== viewSeq) return; // user moved to another tab/document meanwhile
      dcEditing = { isNew: false, id: id, header: header, lines: lines || [], billed: billed, qinfo: {},
        originalLines: JSON.parse(JSON.stringify(lines || [])) };
      if (prog) {
        dcEditing.qno = prog.quote ? prog.quote.qno : '';
        dcEditing.qinfo = dcQuoteInfo(prog, id);
      }
      dcEditing.locked = isLockedDate(header.dc_date);
    }
    renderDcEditor();
    markSaved('dc', dcEditing);
    showSheet();
  }

  function dcHasBilled(t) { return Object.keys(t.billed || {}).some(function (k) { return t.billed[k] > 0.0005; }); }
  function dcUnbilledLeft(t) {
    return (t.originalLines || []).some(function (l) { return Number(l.qty || 0) - ((t.billed || {})[l.id] || 0) > 0.0005; });
  }

  function renderDcLines() {
    var t = dcEditing;
    var body = document.getElementById('dcLinesWrap');
    var showWarehouse = state.warehouses.length > 1;
    body.innerHTML = t.lines.map(function (l, idx) {
      var billed = l.id ? ((t.billed || {})[l.id] || 0) : 0;
      var lineLocked = billed > 0.0005;
      var custom = isCustomDcLine(l);
      var item = itemById(l.item_id);
      var rows = '<div class="f2">' +
        '<div class="field"><label>Qty' + (dcLineName(l) ? ' (' + esc(dcLineUnit(l)) + ')' : '') + '</label>' +
          '<input type="number" step="0.001" class="dcf num" data-i="' + idx + '" data-f="qty" value="' + esc(l.qty) + '"></div>' +
        '<div class="field"><label>Type</label><select class="dcf" data-i="' + idx + '" data-f="consumption_type"' + (custom || lineLocked ? ' disabled' : '') + '>' +
          '<option value="general_goods"' + (l.consumption_type === 'general_goods' && !custom ? ' selected' : '') + '>General supply</option>' +
          '<option value="manufactured"' + (l.consumption_type === 'manufactured' || custom ? ' selected' : '') + '>Manufactured</option>' +
        '</select></div></div>';
      if (custom) {
        rows += '<div class="field"><label>Unit</label><input class="dcf" data-i="' + idx + '" data-f="custom_unit" value="' + esc(l.custom_unit || '') + '" placeholder="pcs"></div>';
      }
      if (showWarehouse && !custom && l.consumption_type === 'general_goods') {
        rows += '<div class="field"><label>From warehouse</label><select class="dcf" data-i="' + idx + '" data-f="warehouse_id">' + warehouseOptions(l.warehouse_id) + '</select></div>';
      }
      rows += '<div class="field"><label>Description</label><textarea rows="2" class="dcf" data-i="' + idx + '" data-f="description" placeholder="Prints under the item name">' + esc(l.description || '') + '</textarea></div>';
      var hints = [];
      var qi = l.quotation_line_id && t.qinfo ? t.qinfo[l.quotation_line_id] : null;
      if (qi) hints.push('Ordered ' + qtyStr(qi.ordered) + ' · on other DCs ' + qtyStr(qi.deliveredElsewhere) + ' · pending ' + qtyStr(Math.max(0, qi.ordered - qi.deliveredElsewhere)));
      if (item && l.consumption_type === 'general_goods') hints.push('In stock ' + qtyStr(item.stock_qty) + ' ' + (item.unit || ''));
      if (lineLocked) hints.push('Billed ' + qtyStr(billed));
      if (hints.length) rows += '<div class="hint">' + esc(hints.join(' · ')) + '</div>';
      if (!l.id) {
        rows += '<button type="button" class="btn rowbtn dcCustomToggle" data-i="' + idx + '">' +
          (custom ? 'Pick a stock item instead' : 'Custom product (not in Masters)') + '</button>';
      }
      var picker;
      if (lineLocked) picker = '<div class="combo"><input value="' + esc(dcLineName(l)) + '" readonly></div>';
      else if (custom) picker = '<div class="combo"><input class="dcf" data-i="' + idx + '" data-f="custom_name" value="' + esc(l.custom_name || '') + '" placeholder="Custom product name…" aria-label="Custom product name"></div>';
      else picker = comboHtml({
        value: l.item_id,
        options: itemComboOptions('sale_rate'),
        placeholder: 'Search item…',
        empty: ITEM_EMPTY,
        onPick: (function (i) { return function (id) { applyDcLineField(i, 'item_id', id || ''); }; })(idx)
      });
      return '<div class="ln"><div class="ln-top">' + picker +
        (lineLocked ? '' : '<button type="button" data-i="' + idx + '" class="icb dcRmLine" aria-label="Remove line">' + X_ICON + '</button>') +
        '</div><div class="ln-rows">' + rows + '</div></div>';
    }).join('');
    Array.prototype.forEach.call(body.querySelectorAll('.dcf'), function (el) {
      el.addEventListener('change', function () {
        applyDcLineField(Number(el.dataset.i), el.dataset.f, el.type === 'number' ? Number(el.value) : el.value);
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.dcCustomToggle'), function (btn) {
      btn.addEventListener('click', function () {
        var l = t.lines[Number(btn.dataset.i)];
        if (isCustomDcLine(l)) { l.custom_name = null; l.custom_unit = null; l.consumption_type = 'general_goods'; }
        else { l.item_id = null; l.custom_name = ''; l.custom_unit = ''; l.consumption_type = 'manufactured'; }
        renderDcLines();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('.dcRmLine'), function (btn) {
      btn.addEventListener('click', function () { t.lines.splice(Number(btn.dataset.i), 1); renderDcLines(); });
    });
    wireCombos(body);
  }

  function applyDcLineField(idx, f, val) {
    var l = dcEditing.lines[idx];
    l[f] = val;
    if (f === 'item_id') {
      var item = itemById(val);
      l.consumption_type = defaultDcType(item);
      if (item && !String(l.description || '').trim()) l.description = specsSummary(item.id);
    }
    if (f === 'custom_name' || f === 'custom_unit' || f === 'description') return;
    // A change often fires on blur, when the user has just clicked another
    // control; rebuilding the lines inside that blur throws ("node to be
    // removed is no longer a child"). Redraw on the next tick instead.
    setTimeout(function () { if (dcEditing && document.getElementById('dcLinesWrap')) renderDcLines(); }, 0);
  }

  function dcLinePayload(l, i, dcId) {
    var custom = !l.item_id;
    var o = {
      line_no: i + 1,
      item_id: l.item_id || null,
      custom_name: custom ? String(l.custom_name || '').trim() : null,
      custom_unit: custom ? (String(l.custom_unit || '').trim() || null) : null,
      description: String(l.description || '').trim() || null,
      qty: Number(l.qty) || 0,
      consumption_type: custom ? 'manufactured' : (l.consumption_type || 'general_goods'),
      warehouse_id: l.warehouse_id || null,
      quotation_line_id: l.quotation_line_id || null
    };
    if (dcId) o.dc_id = dcId;
    return o;
  }

  async function saveDc() {
    var t = dcEditing, h = t.header;
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    if (!h.party_id) { errEl.textContent = 'Pick the customer first'; return; }
    if (!h.dc_date) { errEl.textContent = 'Pick the date'; return; }
    var valid = t.lines.filter(dcLineValid);
    if (!valid.length) { errEl.textContent = 'Add at least one item with a quantity'; return; }
    // Never more than the quotation still has pending for that line.
    for (var vi = 0; vi < valid.length; vi++) {
      var vl = valid[vi], qi = vl.quotation_line_id && t.qinfo ? t.qinfo[vl.quotation_line_id] : null;
      if (!qi) continue;
      var pend = Math.max(0, qi.ordered - qi.deliveredElsewhere);
      if (Number(vl.qty) > pend + 0.0005) {
        errEl.textContent = "'" + dcLineName(vl) + "' — quotation mein " + qtyStr(qi.ordered) + ' order hai, doosre challans par ' +
          qtyStr(qi.deliveredElsewhere) + ' ja chuka, sirf ' + qtyStr(pend) + ' pending hai. Zyada dena ho to pehle quotation mein qty barhayein.';
        return;
      }
    }
    var headerPayload = { dc_date: h.dc_date, party_id: h.party_id, company_id: h.company_id || null,
      quotation_id: h.quotation_id || null, narration: String(h.narration || '').trim() || null };
    function done(msg) {
      toast(msg);
      closeEditor();
      if (state.mode === 'dc') loadDcList();
      broadcastRefresh('delivery_challans'); broadcastRefresh('items');
      loadMasters();
    }
    try {
      if (t.isNew) {
        var newId = (crypto.randomUUID ? crypto.randomUUID() : newId_fallback());
        var hp = Object.assign({ id: newId }, headerPayload);
        var lp = valid.map(function (l, i) { return dcLinePayload(l, i, newId); });
        function queueNew() {
          OfflineQueue.enqueue({ kind: 'insert', table: 'delivery_challans', payload: hp });
          OfflineQueue.enqueue({ kind: 'insert', table: 'dc_lines', payload: lp });
          done('No internet — saved locally as pending. It will get its DC number once synced.');
        }
        if (!navigator.onLine) { queueNew(); return; }
        var { data: inserted, error: insErr } = await sb.from('delivery_challans').insert(hp).select().single();
        if (insErr) return OfflineQueue.isNetworkError(insErr) ? queueNew() : handleSaveError(insErr, errEl);
        var { error: lineErr } = await sb.from('dc_lines').insert(lp);
        if (lineErr) {
          if (OfflineQueue.isNetworkError(lineErr)) OfflineQueue.enqueue({ kind: 'insert', table: 'dc_lines', payload: lp });
          else { errEl.textContent = await undoHeaderAfterLineError('delivery_challans', inserted, inserted && inserted.dcno, lineErr); return; }
        }
        done((inserted && inserted.dcno ? inserted.dcno : 'Delivery Challan') + ' saved');
        return;
      }
      if (!navigator.onLine) { errEl.textContent = 'Changing a saved challan needs internet — try again when online.'; return; }
      var { error: updErr } = await sb.from('delivery_challans').update(headerPayload).eq('id', t.id);
      if (updErr) return handleSaveError(updErr, errEl);
      var keep = {};
      valid.forEach(function (l) { if (l.id) keep[l.id] = true; });
      var removed = (t.originalLines || []).filter(function (o) { return !keep[o.id]; });
      for (var r = 0; r < removed.length; r++) {
        var { error: delErr } = await sb.from('dc_lines').delete().eq('id', removed[r].id);
        if (delErr) { errEl.textContent = delErr.message; return; }
      }
      for (var i = 0; i < valid.length; i++) {
        var l = valid[i];
        var res = l.id
          ? await sb.from('dc_lines').update(dcLinePayload(l, i, null)).eq('id', l.id)
          : await sb.from('dc_lines').insert(dcLinePayload(l, i, t.id));
        if (res.error) { errEl.textContent = res.error.message; return; }
      }
      done("'" + h.dcno + "' saved");
    } catch (ex) {
      errEl.textContent = ex.message || String(ex);
    }
  }

  async function deleteDc() {
    var t = dcEditing;
    var ok = await confirmDialog('Delete ' + t.header.dcno + '?',
      'Its general-supply stock comes back to the godown. It can be restored from the Recycle Bin.', 'Delete', true);
    if (!ok) return;
    var { error } = await sb.from('delivery_challans').update({ deleted_at: new Date().toISOString() }).eq('id', t.id);
    if (error) { sheetErr(error.message); return; }
    toast(t.header.dcno + ' deleted — restore it from the Recycle Bin');
    closeEditor();
    if (state.mode === 'dc') loadDcList();
    broadcastRefresh('delivery_challans'); broadcastRefresh('items');
    loadMasters();
  }

  // Classic A4 challan — item, qty and unit only (no rates on a DC).

    if (!(await printGuard('dc', t))) return;
    var company = await firmForPrint(h.company_id);

    meta.push(['Printed', printStamp()]);

      firm: company, tag: 'Delivery challan — goods delivered, not an invoice', noAmounts: true,

      metaRows: meta,
      parties: [
        { label: 'Deliver to', name: party ? party.name : '—', sub: party ? party.city : '' },

      footerRight: 'Delivery Challan · ' + h.dcno

  // Picks which of the party's unbilled challans go on one invoice (this
  // one is ticked; others of the same customer can be added).
  function pickDcsDialog(groups, currentId) {
    return new Promise(function (resolve) {
      var scrim = document.getElementById('confirmScrim');
      scrim.innerHTML =
        '<div class="confirm-card po-card" role="dialog" aria-modal="true">' +
          '<h4>Bill which challans?</h4>' +
          '<div class="po-lbl">Unbilled challans of this customer</div><div class="po-opt">' +
          groups.map(function (g) {
            return '<label class="po-check" style="margin:0"><input type="checkbox" value="' + esc(g.id) + '"' + (g.id === currentId ? ' checked' : '') + '> ' +
              esc(g.dcno + ' · ' + g.date + ' · ' + g.lines.length + ' line' + (g.lines.length === 1 ? '' : 's')) + '</label>';
          }).join('') +
          '</div>' +
          '<div class="acts"><button type="button" class="btn" data-a="0">Cancel</button><button type="button" class="btn pri" data-a="1">Make invoice</button></div>' +
        '</div>';
      scrim.classList.add('on');
      var finished = false;
      function finish(v) {
        if (finished) return; finished = true;
        scrim.classList.remove('on'); scrim.innerHTML = '';
        document.removeEventListener('keydown', onKey);
        resolve(v);
      }
      function onKey(ev) { if (ev.key === 'Escape') finish(null); }
      scrim.querySelector('[data-a="0"]').addEventListener('click', function () { finish(null); });
      scrim.querySelector('[data-a="1"]').addEventListener('click', function () {
        finish(Array.prototype.map.call(scrim.querySelectorAll('input[type="checkbox"]:checked'), function (c) { return c.value; }));
      });
      scrim.addEventListener('click', function (ev) { if (ev.target === scrim) finish(null); });
      document.addEventListener('keydown', onKey);
    });
  }

  async function makeInvoiceFromDc() {
    var t = dcEditing, partyId = t.header.party_id;
    var { data: dls, error } = await sb.from('dc_lines')
      .select('*, delivery_challans!inner(id,dcno,dc_date,party_id,company_id,deleted_at)')
      .eq('delivery_challans.party_id', partyId).is('delivery_challans.deleted_at', null).order('line_no');
    if (error) { sheetErr(error.message); return; }
    var billed = await billedByDcLine((dls || []).map(function (l) { return l.id; }));
    var groups = {}, order = [];
    (dls || []).forEach(function (l) {
      var left = Number(l.qty || 0) - (billed[l.id] || 0);
      if (left <= 0.0005) return;
      var dc = l.delivery_challans;
      if (!groups[dc.id]) { groups[dc.id] = { id: dc.id, dcno: dc.dcno, date: dc.dc_date, company_id: dc.company_id, lines: [] }; order.push(dc.id); }
      groups[dc.id].lines.push({ dl: l, left: left, billed: billed[l.id] || 0 });
    });
    var list = order.map(function (k) { return groups[k]; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.dcno < b.dcno ? -1 : 1); });
    if (!list.length) { toast('Everything on this challan is already billed.', true); return; }
    var picked = list.length === 1 ? [list[0].id] : await pickDcsDialog(list, t.id);
    if (!picked || !picked.length) return;
    var chosen = list.filter(function (g) { return picked.indexOf(g.id) >= 0; });
    var qlIds = [];
    chosen.forEach(function (g) { g.lines.forEach(function (x) { if (x.dl.quotation_line_id) qlIds.push(x.dl.quotation_line_id); }); });
    var qlRates = {};
    if (qlIds.length) {
      var { data: qls } = await sb.from('quotation_lines').select('id,rate,tax_pct').in('id', qlIds);
      (qls || []).forEach(function (q) { qlRates[q.id] = q; });
    }
    var lines = [];
    chosen.forEach(function (g) {
      g.lines.forEach(function (x) {
        var dl = x.dl, item = itemById(dl.item_id), ql = qlRates[dl.quotation_line_id];
        dcLineInfo[dl.id] = { dcno: g.dcno, dcQty: Number(dl.qty), billedElsewhere: x.billed };
        lines.push(Object.assign(blankLine(), {
          item_id: dl.item_id || null,
          custom_name: dl.item_id ? null : dl.custom_name,
          custom_unit: dl.item_id ? null : dl.custom_unit,
          description: dl.description || '',
          qty: x.left,
          rate: ql ? Number(ql.rate) : (item ? Number(item.sale_rate) || 0 : 0),
          tax_pct: ql ? Number(ql.tax_pct) || 0 : (item ? Number(item.tax_pct) || 0 : 0),
          dc_line_id: dl.id,
          consumption_type: dl.consumption_type === 'general_goods' ? 'general_goods' : 'raw_material_consumption',
          warehouse_id: dl.warehouse_id || defaultWarehouseId(),
          materials: []
        }));
      });
    });
    var header = Object.assign(blankHeader(), {
      vtype: 'sale', party_id: partyId, company_id: chosen[0].company_id || blankHeader().company_id,
      narration: 'Against ' + chosen.map(function (g) { return g.dcno; }).join(', ')
    });
    header.vtype = 'sale';
    closeEditor();
    switchTab('sale');
    state.vtype = 'sale';
    state.editing = { isNew: true, id: null, header: header, lines: lines, originalHeader: null, originalLines: [] };
    renderEditor();
    showSheet();
    toast('Rates come from the quotation (or the item) — check them, then Save.');
  }

  // ---- Quotation side: progress panel, Quotation → DC, Material Issue ----
  async function fillQuoteProgress(d) {
    var el = document.getElementById('qProgress');
    if (!el || d.isNew || d.type !== 'quotation') return;
    if (!d.progress) {
      el.innerHTML = '<div class="hint">Loading delivery status…</div>';
      d.progress = await quoteProgress(d.id);
      el = document.getElementById('qProgress');
      if (!el || docEditing !== d) return;
    }
    var p = d.progress;
    var rows = p.lines.map(function (x) {
      var item = itemById(x.ql.item_id);
      var name = item ? item.name : (x.ql.custom_name || '');
      return '<div class="doc-sum-row"><span>' + esc(name) + '</span><span class="v">' +
        esc('Ordered ' + qtyStr(x.ordered) + ' · Delivered ' + qtyStr(x.delivered) + ' · Billed ' + qtyStr(x.invoiced) + ' · Pending ' + qtyStr(x.pending)) +
        '</span></div>';
    }).join('');
    var dcs = Object.keys(p.dcnos).map(function (k) { return p.dcnos[k]; }).sort();
    var html = rows +
      '<div class="hint">' + (dcs.length ? 'Challans: ' + esc(dcs.join(', ')) : 'No delivery challan yet.') +
      ' · Material issued: ' + p.issues.length + ' time' + (p.issues.length === 1 ? '' : 's') +
      (canViewMaterialCost() ? ' (cost ' + fmtMoney(p.issueCost) + ')' : '') + '</div>';
    el.innerHTML = html;
    // Once goods went out on a DC, a direct "Convert to Sale" would take
    // the stock out a second time — bill through the challans instead.
    var conv = document.getElementById('docConvertBtn');
    if (conv && dcs.length) conv.remove();
    var dcBtn = document.getElementById('docDcBtn');
    if (dcBtn && !p.lines.some(function (x) { return x.pending > 0.0005; })) dcBtn.remove();
  }

  async function quoteToDc() {
    var d = docEditing;
    var p = d.progress || (d.progress = await quoteProgress(d.id));
    var pending = p.lines.filter(function (x) { return x.pending > 0.0005; });
    if (!pending.length) { toast('Everything on this quotation is already delivered.', true); return; }
    var q = p.quote || {};
    var lines = pending.map(function (x) {
      var ql = x.ql, item = itemById(ql.item_id);
      return Object.assign(blankDcLine(), {
        item_id: ql.item_id || null,
        custom_name: ql.item_id ? null : (ql.custom_name || 'Item'),
        custom_unit: ql.item_id ? null : (ql.custom_unit || null),
        description: ql.description || '',
        qty: x.pending,
        consumption_type: ql.item_id ? defaultDcType(item) : 'manufactured',
        quotation_line_id: ql.id
      });
    });
    var preset = {
      isNew: true, id: null, billed: {}, originalLines: [], qno: q.qno, qinfo: dcQuoteInfo(p, null),
      header: { dc_date: todayStr(), party_id: q.party_id || null, company_id: q.company_id || null, quotation_id: d.id, narration: '' },
      lines: lines
    };
    closeEditor();
    switchTab('dc');
    await openDcEditor(null, preset);
    if (!q.party_id) toast('This quotation is for a walk-in customer — pick a real party (Masters) for the challan.', true);
    else toast('Pending qty filled in — change it for a partial delivery, then Save.');
  }

  // An issue belongs to a quotation (the order's pool, shared by all its
  // challans) or to a direct DC (made without a quotation).
  // miEditing.target is { quotation_id } or { dc_id }; .back() reopens
  // whichever editor the sheet was opened from.
  var miEditing = null;
  function openMiSheet(target, label, hint, backLabel, back) {
    miEditing = { target: target, label: label, hint: hint, backLabel: backLabel, back: back, list: [],
      draft: { issue_date: todayStr(), item_id: null, qty: 0, warehouse_id: defaultWarehouseId(), notes: '' } };
    return reloadMaterialIssues();
  }
  async function openMaterialIssues() {
    var d = docEditing;
    await openMiSheet({ quotation_id: d.id }, d.header.qno,
      'the total is shared over the manufactured items delivered on its challans.', 'Back to quotation',
      function () { docEditing = d; d.progress = null; renderDocEditor(); });
  }
  async function openMaterialIssuesForDc() {
    var t = dcEditing, h = t.header;
    var back = function () { dcEditing = t; renderDcEditor(); };
    if (h.quotation_id) {
      // A DC made from a quotation uses that order's pool.
      await openMiSheet({ quotation_id: h.quotation_id }, (t.qno || 'Quotation') + ' (from ' + h.dcno + ')',
        'this challan came from ' + (t.qno || 'a quotation') + ', so material goes to that order and is shared over all its challans.',
        'Back to challan', back);
    } else {
      await openMiSheet({ dc_id: t.id }, h.dcno,
        'the total is shared over this challan\'s Manufactured lines, by qty.', 'Back to challan', back);
    }
  }
  async function reloadMaterialIssues() {
    var m = miEditing;
    if (!m) return; // the user went back to the quotation meanwhile
    var key = Object.keys(m.target)[0];
    var { data, error } = await sb.from('material_issues').select('*').eq(key, m.target[key]).is('deleted_at', null)
      .order('issue_date').order('created_at');
    if (error) { toast(error.message, true); return; }
    if (miEditing !== m) return;
    m.list = data || [];
    renderMaterialIssues();
  }
  function renderMaterialIssues() {
    lastEditorRender = renderMaterialIssues;
    var m = miEditing, dr = m.draft, showCost = canViewMaterialCost();
    var showWarehouse = state.warehouses.length > 1;
    var byItem = {}, order = [], totalCost = 0;
    m.list.forEach(function (r) {
      if (!byItem[r.item_id]) { byItem[r.item_id] = { qty: 0, cost: 0 }; order.push(r.item_id); }
      byItem[r.item_id].qty += Number(r.qty || 0);
      byItem[r.item_id].cost += Number(r.cost_amount || 0);
      totalCost += Number(r.cost_amount || 0);
    });
    var html = '<div class="hint">Raw material taken out for this job. Stock goes out on the issue date — issue as many times as needed; ' +
      esc(m.hint) + '</div>';
    html += '<div class="group-lbl">Total issued</div>';
    html += order.length ? order.map(function (id) {
      var it = itemById(id);
      return '<div class="doc-sum-row"><span>' + esc(it ? it.name : '?') + '</span><span class="v">' +
        esc(qtyStr(byItem[id].qty) + ' ' + (it ? it.unit || '' : '')) + (showCost ? ' · ' + fmtMoney(byItem[id].cost) : '') + '</span></div>';
    }).join('') + (showCost ? '<div class="doc-sum-row grand"><span>Material cost</span><span class="v">' + fmtMoney(totalCost) + '</span></div>' : '')
      : '<div class="hint">Nothing issued yet.</div>';

    html += '<div class="group-lbl">New issue</div>';
    html += '<div class="lines"><div class="ln"><div class="ln-top">' +
      comboHtml({
        value: dr.item_id,
        options: rawMaterialComboOptions(null),
        placeholder: 'Search raw material…',
        empty: ITEM_EMPTY,
        onPick: function (id) { dr.item_id = id || null; }
      }) + '</div><div class="ln-rows">' +
      '<div class="f2"><div class="field"><label>Date</label><input type="date" id="mi_date" value="' + esc(dr.issue_date) + '"></div>' +
      '<div class="field"><label>Qty</label><input type="number" step="0.001" class="num" id="mi_qty" value="' + esc(dr.qty) + '"></div></div>' +
      (showWarehouse ? '<div class="field"><label>Warehouse</label><select id="mi_wh">' + warehouseOptions(dr.warehouse_id) + '</select></div>' : '') +
      '<div class="field"><label>Notes</label><input id="mi_notes" value="' + esc(dr.notes || '') + '" placeholder="e.g. first batch"></div>' +
      '<button type="button" class="btn pri" id="miAddBtn">Issue material</button>' +
      '</div></div></div>';

    html += '<div class="group-lbl">Issue history (' + m.list.length + ')</div><div class="lines">';
    html += m.list.map(function (r) {
      var it = itemById(r.item_id);
      return '<div class="ln"><div class="ln-top"><div class="combo"><input value="' + esc((it ? it.name : '?') + (it && it.unit ? ' (' + it.unit + ')' : '')) + '" readonly></div>' +
        '<button type="button" class="icb miDel" data-id="' + esc(r.id) + '" aria-label="Delete issue">' + X_ICON + '</button></div>' +
        '<div class="ln-rows"><div class="f2">' +
          '<div class="field"><label>Date</label><input type="date" class="mif" data-id="' + esc(r.id) + '" data-f="issue_date" value="' + esc(r.issue_date) + '"></div>' +
          '<div class="field"><label>Qty</label><input type="number" step="0.001" class="mif num" data-id="' + esc(r.id) + '" data-f="qty" value="' + esc(r.qty) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Notes</label><input class="mif" data-id="' + esc(r.id) + '" data-f="notes" value="' + esc(r.notes || '') + '"></div>' +
        (showWarehouse ? '<div class="hint">Warehouse: ' + esc(warehouseName(r.warehouse_id)) + '</div>' : '') +
        (showCost ? '<div class="doc-sum-row"><span>Cost</span><span class="v">' + fmtMoney(r.cost_amount || 0) + '</span></div>' : '') +
        '<button type="button" class="btn rowbtn miSave" data-id="' + esc(r.id) + '">Save change</button>' +
        '</div></div>';
    }).join('');
    html += '</div>';

    var ftr = '<button type="button" class="btn" id="miBackBtn">' + esc(m.backLabel) + '</button>';
    renderSheet('Material Issue — ' + (m.label || ''), html, ftr);
    wireCombos(document.getElementById('editorCard'));
    document.getElementById('mi_date').addEventListener('input', function () { dr.issue_date = this.value; });
    document.getElementById('mi_qty').addEventListener('input', function () { dr.qty = Number(this.value) || 0; });
    document.getElementById('mi_notes').addEventListener('input', function () { dr.notes = this.value; });
    var wh = document.getElementById('mi_wh'); if (wh) wh.addEventListener('change', function () { dr.warehouse_id = this.value || null; });
    document.getElementById('miAddBtn').addEventListener('click', addMaterialIssue);
    document.getElementById('miBackBtn').addEventListener('click', function () {
      miEditing = null;
      m.back();
    });
    Array.prototype.forEach.call(document.querySelectorAll('.miSave'), function (btn) {
      btn.addEventListener('click', function () { saveMaterialIssueRow(btn.dataset.id); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.miDel'), function (btn) {
      btn.addEventListener('click', function () { deleteMaterialIssue(btn.dataset.id); });
    });
  }
  function afterIssueChange(msg) {
    toast(msg);
    broadcastRefresh('material_issues'); broadcastRefresh('items');
    return loadMasters().then(reloadMaterialIssues);
  }
  async function addMaterialIssue() {
    var m = miEditing, dr = m.draft;
    var errEl = document.getElementById('editorErr');
    errEl.textContent = '';
    if (!dr.item_id) { errEl.textContent = 'Pick the raw material'; return; }
    if (!(Number(dr.qty) > 0)) { errEl.textContent = 'Qty must be more than 0'; return; }
    if (!dr.issue_date) { errEl.textContent = 'Pick the date'; return; }
    var { error } = await sb.from('material_issues').insert({
      quotation_id: m.target.quotation_id || null, dc_id: m.target.dc_id || null, issue_date: dr.issue_date, item_id: dr.item_id, qty: Number(dr.qty),
      warehouse_id: dr.warehouse_id || null, notes: String(dr.notes || '').trim() || null
    });
    if (error) { errEl.textContent = error.message; return; }
    var it = itemById(dr.item_id);
    m.draft = { issue_date: dr.issue_date, item_id: null, qty: 0, warehouse_id: dr.warehouse_id, notes: '' };
    await afterIssueChange(qtyStr(dr.qty) + ' ' + (it ? it.unit + ' ' + it.name : '') + ' issued');
  }
  async function saveMaterialIssueRow(id) {
    var patch = {};
    Array.prototype.forEach.call(document.querySelectorAll('.mif[data-id="' + id + '"]'), function (el) {
      patch[el.dataset.f] = el.type === 'number' ? Number(el.value) : (el.value || null);
    });
    if (!(Number(patch.qty) > 0)) { sheetErr('Qty must be more than 0 — use ✕ to remove an issue'); return; }
    if (!patch.issue_date) { sheetErr('Pick the date'); return; }
    var { error } = await sb.from('material_issues').update(patch).eq('id', id);
    if (error) { sheetErr(error.message); return; }
    await afterIssueChange('Issue updated');
  }
  async function deleteMaterialIssue(id) {
    var ok = await confirmDialog('Delete this issue?', 'Its stock comes back to the godown. It can be restored from the Recycle Bin.', 'Delete', true);
    if (!ok) return;
    var { error } = await sb.from('material_issues').update({ deleted_at: new Date().toISOString() }).eq('id', id);
    if (error) { sheetErr(error.message); return; }
    await afterIssueChange('Issue deleted');
  }

  // ---------------------------------------------------------------
  // Print (§9/§25) — classic A4 document (theme.css §17 .pd-*): firm
  // letterhead with logo + meta box, party block, numbered line table,
  // totals block, narration, signatures and the "Powered by" footer.
  // ---------------------------------------------------------------
  var firmCache = {};
  // Letterhead details (city/phone/NTN/logo) are not in the editor's slim
  // companies list, so they are fetched once per firm when printing.
  async function firmForPrint(companyId) {
    var key = companyId || '_default';
    if (firmCache[key]) return firmCache[key];
    var q = sb.from('companies').select('id,name,city,phone,ntn,logo,signature,stamp,is_default').is('deleted_at', null);
    q = companyId ? q.eq('id', companyId) : q.order('is_default', { ascending: false }).limit(1);
    // .then(null, …), not .catch — query builders have no .catch, and the
    // TypeError used to abort every Print before anything was shown.
    var res = await q.maybeSingle().then(null, function () { return { data: null }; });
    var row = (res && res.data) || state.companies.filter(function (c) { return c.id === companyId; })[0] ||
      state.companies.filter(function (c) { return c.is_default; })[0] || { name: 'OHT Accounting System' };
    if (row.logo && !row.logoTrim) row.logoTrim = await trimLogo(row.logo);
    firmCache[key] = row;
    return row;
  }
  function firmMarkHtml(f) {
    if (f && f.logo) return '<img src="' + esc(f.logoTrim || f.logo) + '" alt="">';
    return esc(((f && f.name) || 'O').trim().charAt(0).toUpperCase() || 'O');
  }
  function firmAddrText(f) {
    return f ? [f.city, f.phone, f.ntn ? 'NTN ' + f.ntn : ''].filter(Boolean).join(' \u00B7 ') : '';
  }
  function printStamp() {
    var d = new Date();
    return d.toISOString().slice(0, 10) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // Builds the "<div>Label</div>" signature-line row shared by every print
  // document. The company's own uploaded signature/stamp images (§25) are
  // only ever drawn on the one line the user chose in askPrintOptions() —
  // never on every line, and never without an explicit choice.
  function pdSigHtml(labels, sigIndex, sigImg, stampImg) {
    return '<div class="pd-sig">' + labels.map(function (s, i) {
      var extra = '';
      if (i === sigIndex && (sigImg || stampImg)) {
        extra = '<span class="sig-wrap">' +
          (sigImg ? '<img class="sig-img" src="' + esc(sigImg) + '">' : '') +
          (stampImg ? '<img class="stamp-img" src="' + esc(stampImg) + '">' : '') +
          '</span>';
      }
      return '<div>' + extra + esc(s) + '</div>';
    }).join('') + '</div>';
  }

  // Asks, right before printing, which signature line (if any) gets the
  // company's real uploaded signature and whether to include its stamp —
  // skipped entirely when the company has neither, so printing stays a
  // single click for anyone who never uploaded them. Resolves to null if
  // the user cancels (caller must not print in that case).
  function askPrintOptions(company, sigLabels) {
    var hasSig = !!(company && company.signature);
    var hasStamp = !!(company && company.stamp);
    if (!hasSig && !hasStamp) return Promise.resolve({ sigIndex: -1, stampOn: false });
    return new Promise(function (resolve) {
      var scrim = document.getElementById('confirmScrim');
      var defaultIdx = sigLabels.length - 1;
      var radios = hasSig ? '<div class="po-lbl">Place the signature on</div><div class="po-opt">' +
        sigLabels.map(function (s, i) {
          return '<label class="po-radio"><input type="radio" name="poSig" value="' + i + '"' + (i === defaultIdx ? ' checked' : '') + '> ' + esc(s) + '</label>';
        }).join('') +
        '<label class="po-radio"><input type="radio" name="poSig" value="-1"> None</label></div>' : '';
      var stampRow = hasStamp ? '<label class="po-check"><input type="checkbox" id="poStamp" checked> Include company stamp</label>' : '';
      scrim.innerHTML =
        '<div class="confirm-card po-card" role="dialog" aria-modal="true">' +
          '<h4>Print options</h4>' + radios + stampRow +
          '<div class="acts">' +
            '<button type="button" class="btn" data-a="0">Cancel</button>' +
            '<button type="button" class="btn pri" data-a="1">Print</button>' +
          '</div>' +
        '</div>';
      scrim.classList.add('on');
      var done = false;
      function finish(result) {
        if (done) return;
        done = true;
        scrim.classList.remove('on'); scrim.innerHTML = '';
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }
      function onKey(ev) { if (ev.key === 'Escape') finish(null); }
      scrim.querySelector('[data-a="0"]').addEventListener('click', function () { finish(null); });
      scrim.querySelector('[data-a="1"]').addEventListener('click', function () {
        var sel = scrim.querySelector('input[name="poSig"]:checked');
        finish({
          sigIndex: hasSig && sel ? Number(sel.value) : -1,
          stampOn: hasStamp && !!scrim.querySelector('#poStamp').checked
        });
      });
      scrim.addEventListener('click', function (ev) { if (ev.target === scrim) finish(null); });
      document.addEventListener('keydown', onKey);
    });
  }

  // Puts the built .pd HTML on screen, flips on the print stylesheet, and
  // restores everything once the print dialog closes — the same sequence
  // printVoucher() below uses inline, factored out for the four print
  // functions this phase adds (Return / Quotation-PO / Service doc / Transfer).
  function showPrintDoc(html, filename) {
    document.getElementById('printArea').innerHTML = html;
    document.body.classList.add('pd-on');
    var oldTitle = document.title;
    document.title = filename;
    try { window.top.document.title = document.title; } catch (ex) {}
    window.addEventListener('afterprint', function restore() {
      document.title = oldTitle;
      try { window.top.document.title = oldTitle; } catch (ex) {}
      document.body.classList.remove('pd-on');
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  }

  // Builds one classic A4 document (theme.css §17 .pd-*): letterhead + meta
  // box, title, an optional party block (1-2 parties), a numbered line
  // table, an optional totals block, an optional narration, and the
  // signature / "Powered by" footer. Every print function below is just
  // "gather this document's own fields" + one call to this.
  //   opts: { firm, tag, docTitle, sub, metaRows:[[label,value]],
  //           parties: [{label,name,sub}] | null,
  //           cols:[{label,cls}], rows:[[tdHtml,...]],
  //           totals: [{label,value,cls}] | null,
  //           narrationLabel, narration, sigLabels:[...], footerRight,
  //           sigIndex, sigImg, stampImg (from askPrintOptions(), §25) }
  function buildPdDoc(opts) {
    var html = '<div class="pd">' +
      '<div class="pd-lh">' +
        '<div class="mk">' + firmMarkHtml(opts.firm) + '</div>' +
        '<div><div class="fn">' + esc((opts.firm && opts.firm.name) || 'OHT Accounting System') + '</div>' +
          '<div class="fa">' + esc(firmAddrText(opts.firm)) + '</div><div class="tag">' + esc(opts.tag || '') + '</div></div>' +
        '<div class="pd-meta">' +
          opts.metaRows.map(function (r) { return '<div><b>' + esc(r[0]) + '</b><span class="mono">' + esc(r[1] == null ? '—' : r[1]) + '</span></div>'; }).join('') +
        '</div>' +
      '</div><div class="pd-rule"></div><div class="pd-rule2"></div>' +
      '<div class="pd-ttl"><h1>' + esc(opts.docTitle) + '</h1><span class="sub">' + esc(opts.sub || '') + '</span>' + (opts.noAmounts ? '' : '<span class="basis">Amounts in PKR</span>') + '</div>';

    if (opts.parties && opts.parties.length) {
      html += '<div class="party">' + opts.parties.map(function (p) {
        return '<div class="blk"><div class="k">' + esc(p.label) + '</div><div class="nm">' + esc(p.name || '—') + '</div>' +
          (p.sub ? '<div class="ad">' + esc(p.sub) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    }

    if (opts.cols) {
      html += '<table><thead><tr><th class="idx">#</th>' +
        opts.cols.map(function (c) { return '<th' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + esc(c.label) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        (opts.rows.length ? opts.rows.map(function (r, i) { return '<tr><td class="idx mono">' + (i + 1) + '</td>' + r.join('') + '</tr>'; }).join('')
          : '<tr><td colspan="' + (opts.cols.length + 1) + '" style="color:#6B6357">No lines</td></tr>') +
        '</tbody></table>';
    }

    if (opts.totals && opts.totals.length) {
      html += '<div class="totals"><table>' + opts.totals.map(function (t) {
        return '<tr class="' + (t.cls || '') + '"><td>' + esc(t.label) + '</td><td class="num">' + esc(t.value) + '</td></tr>';
      }).join('') + '</table></div>';
    }

    if (opts.narration) {
      html += '<div class="narr"><b>' + esc(opts.narrationLabel || 'Narration') + '</b>' + esc(opts.narration) + '</div>';
    }

    html += '<div class="pd-spacer"></div>' +
      '<div class="pd-foot">' + pdSigHtml(opts.sigLabels, opts.sigIndex != null ? opts.sigIndex : -1, opts.sigImg, opts.stampImg) +
        '<div class="pd-fl"><span>Powered by "OHT Solutions"</span><span>' + esc(opts.footerRight || '') + '</span></div></div>' +
      '</div>';
    return html;
  }

  async function printVoucher() {
    var e = state.editing;
    if (!(await printGuard('voucher', e))) return;
    var h = e.header;
    var totals = computeTotals();
    var company = await firmForPrint(h.company_id);
    var sigLabels = ['Received by', 'Authorised by'];
    var po = await askPrintOptions(company, sigLabels);
    if (!po || state.editing !== e) return; // the editor was closed/replaced meanwhile
    var party = state.parties.filter(function (p) { return p.id === h.party_id; })[0];
    var isSale = state.vtype === 'sale';
    var docTitle = (isSale ? 'Sales Invoice' : 'Purchase Bill') + (h.tax_on ? ' \u00B7 Sales Tax' : '');
    var showTax = !!h.tax_on;

    var rows = e.lines.filter(function (l) { return l.item_id || l.custom_name; }).map(function (l, i) {
      var item = state.items.filter(function (x) { return x.id === l.item_id; })[0];
      var qty = l.sale_unit ? (l.sale_qty != null ? l.sale_qty : l.qty) : l.qty;
      var unit = saleLineUnit(l);
      var dcRef = l.dc_line_id && dcLineInfo[l.dc_line_id] ? '<div style="font-size:10px;color:#6B6357">' + esc(dcLineInfo[l.dc_line_id].dcno) + '</div>' : '';
      return '<tr><td class="idx mono">' + (i + 1) + '</td><td>' + esc(saleLineName(l)) + descHtml(l.description) + dcRef +
        (l.sale_unit && item && item.unit && l.sale_unit !== item.unit ? '<div style="font-size:10px;color:#6B6357">= ' + esc(l.qty) + ' ' + esc(item.unit) + '</div>' : '') +
        '</td><td class="num">' + esc(qty) + '</td><td>' + esc(unit) + '</td>' +
        '<td class="num">' + fmtMoney(shownRate(l)) + '</td>' +
        (showTax ? '<td class="num">' + esc(Number(l.tax_pct) || 0) + '%</td>' : '') +
        '<td class="num">' + fmtMoney((Number(l.qty) || 0) * (Number(l.rate) || 0)) + '</td></tr>';
    }).join('');
    var balance = totals.grand - (Number(h.paid) || 0);

    var totalRows = '<tr><td>Sub total</td><td class="num">' + fmtMoney(totals.sub) + '</td></tr>' +
      ((Number(h.discount) || 0) ? '<tr><td>Discount</td><td class="num">\u2212 ' + fmtMoney(h.discount) + '</td></tr>' : '') +
      (showTax ? '<tr><td>Sales tax</td><td class="num">' + fmtMoney(totals.tax) + '</td></tr>' : '') +
      (h.loading_on ? '<tr><td>Loading</td><td class="num">' + fmtMoney(h.loading_amt) + '</td></tr>' : '') +
      (h.cartage_on ? '<tr><td>Cartage</td><td class="num">' + fmtMoney(h.cartage_amt) + '</td></tr>' : '') +
      (h.cutting_on ? '<tr><td>Cutting</td><td class="num">' + fmtMoney(h.cutting_amt) + '</td></tr>' : '') +
      (h.other_charge_on ? '<tr><td>' + esc(h.other_charge_name || 'Other') + '</td><td class="num">' + fmtMoney(h.other_charge_amt) + '</td></tr>' : '') +
      '<tr class="grand"><td>Grand total</td><td class="num">' + fmtMoney(totals.grand) + '</td></tr>' +
      '<tr><td>' + (isSale ? 'Received' : 'Paid') + '</td><td class="num">' + fmtMoney(h.paid) + '</td></tr>' +
      '<tr class="bal"><td>Balance ' + (isSale ? 'due' : 'payable') + '</td><td class="num">' + fmtMoney(balance) + '</td></tr>';

    var html = '<div class="pd">' +
      '<div class="pd-lh">' +
        '<div class="mk">' + firmMarkHtml(company) + '</div>' +
        '<div><div class="fn">' + esc(company.name || 'OHT Accounting System') + '</div>' +
          '<div class="fa">' + esc(firmAddrText(company)) + '</div><div class="tag">' + esc(isSale ? 'Sales document' : 'Purchase document') + '</div></div>' +
        '<div class="pd-meta">' +
          '<div><b>' + (isSale ? 'Invoice no' : 'Bill no') + '</b><span class="mono">' + esc(h.vno || 'PREVIEW') + '</span></div>' +
          '<div><b>Date</b><span class="mono">' + esc(h.vdate) + '</span></div>' +
          (h.due_date ? '<div><b>Due</b><span class="mono">' + esc(h.due_date) + '</span></div>' : '') +
          '<div><b>Printed</b><span class="mono">' + esc(printStamp()) + '</span></div>' +
        '</div>' +
      '</div><div class="pd-rule"></div><div class="pd-rule2"></div>' +
      '<div class="pd-ttl"><h1>' + esc(docTitle) + '</h1><span class="sub">' + esc(h.vno || 'Preview') + ' \u00B7 ' + esc(h.vdate) + '</span><span class="basis">Amounts in PKR</span></div>' +
      '<div class="party" style="margin-top:12px">' +
        '<div class="blk"><div class="k">' + (isSale ? 'Bill to' : 'Supplier') + '</div><div class="nm">' + esc(party ? party.name : '\u2014') + '</div>' +
          '<div class="ad">' + esc(party ? [party.city].filter(Boolean).join(' \u00B7 ') : '') + '</div></div>' +
        '<div class="blk"><div class="k">' + (isSale ? 'From' : 'Bought by') + '</div><div class="nm">' + esc(company.name || '') + '</div><div class="ad">' + esc(firmAddrText(company)) + '</div></div>' +
      '</div>' +
      '<table><thead><tr><th class="idx">#</th><th>Item</th><th class="num">Qty</th><th>Unit</th><th class="num">Rate</th>' +
        (showTax ? '<th class="num">Tax</th>' : '') + '<th class="num">Amount</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="7" style="color:#6B6357">No items</td></tr>') + '</tbody></table>' +
      '<div class="totals"><table>' + totalRows + '</table></div>' +
      (h.narration ? '<div class="narr"><b>Narration</b>' + esc(h.narration) + '</div>' : '') +
      '<div class="pd-spacer"></div>' +
      '<div class="pd-foot">' + pdSigHtml(sigLabels, po.sigIndex, company.signature, po.stampOn ? company.stamp : null) +
        '<div class="pd-fl"><span>Powered by "OHT Solutions"</span><span>' + esc(docTitle + ' \u00B7 ' + (h.vno || 'Preview')) + '</span></div></div>' +
      '</div>';

    document.getElementById('printArea').innerHTML = html;
    document.body.classList.add('pd-on');
    var oldTitle = document.title;
    document.title = (h.vno || 'invoice') + '.pdf';
    try { window.top.document.title = document.title; } catch (ex) {}
    window.addEventListener('afterprint', function restore() {
      document.title = oldTitle;
      try { window.top.document.title = oldTitle; } catch (ex) {}
      document.body.classList.remove('pd-on');
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  }

  // ---------------------------------------------------------------
  // Cross-module refresh (§14): a change in Masters/Billing/Daily Ledger
  // anywhere else re-fetches the master-data caches this module also uses,
  // and re-fetches the list currently on screen — so nothing here goes
  // stale or shows removed data until the user happens to switch tabs.
  // ---------------------------------------------------------------
  function broadcastRefresh(kind) {
    try { window.parent.postMessage({ oht: 'refresh', kind: kind }, '*'); } catch (e) {}
  }
  function reloadCurrentList() {
    if (state.mode === 'return') loadReturnsList();
    else if (state.mode === 'quotation' || state.mode === 'po') loadDocsList(state.mode);
    else if (state.mode === 'sinvoice' || state.mode === 'squote') loadServiceDocsList(state.mode);
    else if (state.mode === 'transfer') loadTransfersList();
    else if (state.mode === 'adjust') loadAdjustList();
    else if (state.mode === 'dc') loadDcList();
    else loadList();
  }
  var MASTER_REFRESH_KINDS = ['period_lock', 'parties', 'party_kinds', 'items', 'item_units', 'item_specs', 'companies', 'warehouses', 'services'];
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.oht !== 'refresh' || MASTER_REFRESH_KINDS.indexOf(d.kind) < 0) return;
    (d.kind === 'services' ? loadServices() : loadMasters().then(fillFilterSelects))
      .then(reloadCurrentList).then(rerenderOpenEditor);
  });

  // A form already open keeps its own copy of the party/item/service lists
  // inside its search boxes, so a change in Masters only showed after the
  // form was reopened. Re-render it from its (unchanged) draft — but never
  // while the user is typing in a search box; then wait until they leave it.
  function rerenderOpenEditor() {
    if (!document.getElementById('editorSheet').classList.contains('on')) return;
    var act = document.activeElement;
    if (act && act.closest && act.closest('.combo')) {
      act.addEventListener('blur', function once() {
        act.removeEventListener('blur', once);
        setTimeout(rerenderOpenEditor, 0);
      });
      return;
    }
    if (lastEditorRender) lastEditorRender();
  }
  var lastEditorRender = null; // set by each editor's render function

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  var me = { isAdmin: false, perms: {} };
  function canViewMaterialCost() { return me.isAdmin || !!me.perms.material_cost_view; }

  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('listArea').innerHTML =
        emptyStateHtml('Not signed in', 'Please sign in from the main app.');
      return;
    }
    var { data: profile } = await sb.from('app_users').select('is_admin,perms').eq('id', userData.user.id).maybeSingle();
    if (profile) { me.isAdmin = profile.is_admin; me.perms = profile.perms || {}; }
    await loadMasters();
    fillFilterSelects();
    if (pendingTab && ALL_TABS[pendingTab]) { switchTab(pendingTab); pendingTab = null; }
    else { showFiltersFor('sale'); await loadList(); }
    inited = true;
    OfflineQueue.startAutoFlush(sb);
  })();
})();
</script>
</body>
</html>
