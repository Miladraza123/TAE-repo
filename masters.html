<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Masters — OHT Accounting System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script>
  // Hosted inside the shell's iframe (index.html) almost always — the shell's
  // own categorized sidebar is then the primary nav, so this module's own
  // sidebar/appbar (still fully functional when this file is opened on its
  // own) would just be duplicate navigation. Set before first paint to avoid
  // a flash of the sidebar before it hides.
  if (window.self !== window.top) document.documentElement.className += ' embedded';
</script>
<style>
  /* Page skeleton only — every component/token comes from theme.css. */
  html,body{height:100%;}
  main{flex:1; overflow-y:auto;}
  .embedded .sidebar, .embedded .appbar{display:none !important;}
  .page{max-width:900px; margin:0 auto; padding-bottom:28px;}
  .page > .doc-sheet{max-width:640px; margin:14px auto;}
  .panel{background:var(--paper); border-bottom:1px solid var(--hair);}
  .panel .toolbar{max-width:900px; margin:0 auto;}
  .pad{padding:14px;}
  .page-h{font-size:17px; margin:0 0 4px;}
  .page-sub{font-size:12.5px; color:var(--mute); line-height:1.5; margin:0 0 14px;}
</style>
</head>
<body>

<div class="app-shell">

  <nav class="sidebar" id="sidebar">
    <div class="head">
      <span class="mark">OHT</span>
      <span class="title">Masters</span>
      <button class="close" id="navClose" type="button" aria-label="Close menu">✕</button>
    </div>
    <div class="grp" id="navMain"></div>
    <hr class="sep">
    <div class="grp">
      <div class="grp-lbl">Tools &amp; Reports</div>
      <div id="navTools"></div>
      <div id="navReports"></div>
    </div>
    <hr class="sep">
    <div class="grp" id="navAccount"></div>
  </nav>

  <div class="scrim" id="navScrim"></div>

  <div class="main">
    <div class="appbar">
      <button class="hamburger" id="navOpen" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="title" id="appbarTitle">Masters</span>
    </div>
    <main id="content"></main>
  </div>

</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="hdr">
    <h3 class="sheet-title" id="sheetTitle"></h3>
    <button class="icb" id="sheetClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="body" id="sheetBody"></div>
  <div class="ftr" id="sheetFtr"></div>
</aside>

<div id="toastStack" class="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="offline-queue.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  var inited = false;
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.oht) return;
    if (d.oht === 'active') {
      d.active ? sb.auth.startAutoRefresh && sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh && sb.auth.stopAutoRefresh();
      return;
    }
    if (d.oht === 'goto' && (!d.app || d.app === 'masters')) {
      if (!d.arg || !VIEWS[d.arg]) return;
      activeView = d.arg;
      if (inited) { buildNav(); render(); }
    }
  });

  function broadcastRefresh(kind) {
    window.parent.postMessage({ oht: 'refresh', kind: kind }, '*');
    refreshCounts();
  }

  // Deep-link into another module through the shell (index.html):
  //   { oht:'open', app:'<moduleKey>', arg:<any> }
  // The shell opens/switches to that module's iframe and relays
  //   { oht:'goto', app:'<moduleKey>', arg:<any> }
  // into it. Used here for the sidebar's report links (app 'reports', arg =
  // one of reports.html's TABS keys).
  function openInModule(app, arg) {
    window.parent.postMessage({ oht: 'open', app: app, arg: arg }, '*');
  }

  // ===================================================================
  // Shared UI helpers (§14) — toast + confirm dialog. Each module is its
  // own document with no shared JS runtime, so each carries its own copy.
  // ===================================================================
  var MAX_TOASTS = 3;
  function toast(message, isError) {
    var stack = document.getElementById('toastStack');
    if (!stack) return;
    // A second toast never silently replaces an unread first one — they
    // stack (column-reverse); only the oldest is evicted past MAX_TOASTS.
    while (stack.children.length >= MAX_TOASTS) stack.removeChild(stack.firstChild);
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });
    setTimeout(function () {
      el.classList.remove('on');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    }, isError ? 5200 : 3200);
  }

  function confirmDialog(title, body, confirmLabel, isDangerous) {
    return new Promise(function (resolve) {
      var scrim = document.createElement('div');
      scrim.className = 'confirm-scrim on';
      var card = document.createElement('div');
      card.className = 'confirm-card';
      var h = document.createElement('h4'); h.textContent = title;
      var p = document.createElement('p'); p.textContent = body;
      var acts = document.createElement('div'); acts.className = 'acts';
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn'; cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
      var okBtn = document.createElement('button');
      okBtn.className = 'btn ' + (isDangerous ? 'dgr' : 'pri'); okBtn.type = 'button';
      okBtn.textContent = confirmLabel || 'OK';
      acts.appendChild(cancelBtn); acts.appendChild(okBtn);
      card.appendChild(h); card.appendChild(p); card.appendChild(acts);
      scrim.appendChild(card);
      function close(val) {
        document.removeEventListener('keydown', onKey, true);
        if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
        resolve(val);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(false); }
        else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); close(true); }
      }
      cancelBtn.addEventListener('click', function () { close(false); });
      okBtn.addEventListener('click', function () { close(true); });
      scrim.addEventListener('click', function (e) { if (e.target === scrim) close(false); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(scrim);
      okBtn.focus();
    });
  }

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }
  function fmt(n) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return ((parts[0][0] || '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  // ===================================================================
  // Icons — theme.css's recipe: 24-box, no fill, currentColor stroke 1.8
  // ===================================================================
  function ico(path, size) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"' + (size ? ' width="' + size + '" height="' + size + '"' : '') +
      ' aria-hidden="true">' + path + '</svg>';
  }
  var ICON = {
    parties: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
    items: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
    services: '<path d="M14.7 6.3a4 4 0 0 0 5 5l-9 9a2.8 2.8 0 0 1-4-4l9-9z"/><path d="M14.7 6.3L17.5 3.5"/>',
    companies: '<path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M15 9h2a2 2 0 0 1 2 2v10"/><path d="M9 7h2M9 11h2M9 15h2"/>',
    warehouses: '<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-7h6v7"/>',
    partykinds: '<path d="M20.6 13.4L12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
    backup: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
    recyclebin: '<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
    periodlock: '<rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    report: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
    users: '<path d="M12 2l8 4v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6z"/><circle cx="12" cy="11" r="2.2"/><path d="M8.5 17a3.8 3.8 0 0 1 7 0"/>',
    changepw: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3"/><path d="M17 6l2.5 2.5M15 8l2 2"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    close: '<path d="M18 6L6 18M6 6l12 12"/>'
  };

  // ===================================================================
  // Navigation model — mirrors the reference app's sidebar grouping.
  // Report links are NOT local views: they deep-link into reports.html
  // through the shell using its own tab keys.
  // ===================================================================
  var NAV_MAIN = [
    { key: 'parties', label: 'Parties', table: 'parties', icon: ICON.parties },
    { key: 'items', label: 'Items', table: 'items', icon: ICON.items },
    { key: 'services', label: 'Services', table: 'services', icon: ICON.services },
    { key: 'companies', label: 'Firms', table: 'companies', icon: ICON.companies },
    { key: 'warehouses', label: 'Warehouses', table: 'warehouses', icon: ICON.warehouses },
    { key: 'partykinds', label: 'Party Kinds', table: 'party_kinds', icon: ICON.partykinds }
  ];
  var NAV_TOOLS = [
    { key: 'backup', label: 'Backup / Restore', icon: ICON.backup },
    { key: 'recyclebin', label: 'Recycle Bin', icon: ICON.recyclebin },
    { key: 'periodlock', label: 'Period Lock', icon: ICON.periodlock }
  ];
  // arg values are reports.html's TABS keys — verified against that file.
  var NAV_REPORTS = [
    { arg: 'trial', label: 'Trial Balance' },
    { arg: 'aging', label: 'Receivable Aging' },
    { arg: 'pl', label: 'Profit & Loss' },
    { arg: 'statement', label: 'Statement of Account' },
    { arg: 'stockledger', label: 'Item Stock Ledger' },
    { arg: 'matcons', label: 'Material Consumption' },
    { arg: 'matprofit', label: 'Material Cost & Profit' },
    { arg: 'mataudit', label: 'Consumption Audit' }
  ];
  var NAV_ACCOUNT = [
    { key: 'users', label: 'Manage Users', icon: ICON.users },
    { key: 'changepw', label: 'Change Password', icon: ICON.changepw }
  ];

  var activeView = 'parties';
  var searchTerm = '';
  var me = { isAdmin: false, perms: {} };
  var navCounts = {};

  function labelFor(key) {
    var all = NAV_MAIN.concat(NAV_TOOLS, NAV_ACCOUNT);
    for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i].label;
    return 'Masters';
  }

  function navItemHtml(it, withCount) {
    return '<button type="button" class="navitem' + (it.key === activeView ? ' on' : '') + '" data-key="' + it.key + '">' +
      ico(it.icon) + '<span>' + esc(it.label) + '</span>' +
      (withCount ? '<span class="count" data-count="' + it.key + '">' + (navCounts[it.key] == null ? '' : navCounts[it.key]) + '</span>' : '') +
      '</button>';
  }

  function buildNav() {
    document.getElementById('navMain').innerHTML = NAV_MAIN.map(function (it) { return navItemHtml(it, true); }).join('');
    document.getElementById('navTools').innerHTML = NAV_TOOLS.map(function (it) { return navItemHtml(it, false); }).join('');
    document.getElementById('navReports').innerHTML = NAV_REPORTS.map(function (r) {
      return '<button type="button" class="navitem" data-report="' + r.arg + '">' +
        ico(ICON.report) + '<span>' + esc(r.label) + '</span><span class="count">↗</span></button>';
    }).join('');
    document.getElementById('navAccount').innerHTML = NAV_ACCOUNT.map(function (it) { return navItemHtml(it, false); }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.navitem[data-key]'), function (b) {
      b.addEventListener('click', function () { navigate(b.dataset.key); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.navitem[data-report]'), function (b) {
      b.addEventListener('click', function () {
        setDrawer(false);
        openInModule('reports', b.dataset.report);
      });
    });
    document.getElementById('appbarTitle').textContent = labelFor(activeView);
  }

  function navigate(key) {
    if (!VIEWS[key]) return;
    activeView = key;
    searchTerm = '';
    closeSheet();
    setDrawer(false);
    buildNav();
    render();
  }

  // ---- off-canvas drawer (≤860px; theme.css owns the transform/backdrop) ----
  function setDrawer(open) {
    document.getElementById('sidebar').classList.toggle('open', !!open);
    document.getElementById('navScrim').classList.toggle('on', !!open);
  }
  document.getElementById('navOpen').addEventListener('click', function () { setDrawer(true); });
  document.getElementById('navClose').addEventListener('click', function () { setDrawer(false); });
  document.getElementById('navScrim').addEventListener('click', function () { setDrawer(false); });

  // ---- live count badges: one cheap head-count per master table ----
  // Debounced, because a bulk restore calls broadcastRefresh() once per table.
  var countsTimer = null;
  function refreshCounts() {
    clearTimeout(countsTimer);
    countsTimer = setTimeout(doRefreshCounts, 200);
  }
  async function doRefreshCounts() {
    for (var i = 0; i < NAV_MAIN.length; i++) {
      var it = NAV_MAIN[i];
      var res = await sb.from(it.table).select('*', { count: 'exact', head: true }).is('deleted_at', null);
      if (res.error) continue;
      navCounts[it.key] = res.count || 0;
      var el = document.querySelector('.count[data-count="' + it.key + '"]');
      if (el) el.textContent = navCounts[it.key];
    }
  }

  // ===================================================================
  // Editor side-sheet (§9)
  // ===================================================================
  var sheetEl = document.getElementById('sheet');
  var sheetScrimEl = document.getElementById('sheetScrim');
  function openSheet(title, bodyHtml, ftrHtml) {
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').innerHTML = bodyHtml;
    document.getElementById('sheetFtr').innerHTML = ftrHtml || '';
    sheetEl.classList.add('on');
    sheetScrimEl.classList.add('on');
    document.getElementById('sheetBody').scrollTop = 0;
  }
  function closeSheet() {
    sheetEl.classList.remove('on');
    sheetScrimEl.classList.remove('on');
    document.getElementById('sheetBody').innerHTML = '';
    document.getElementById('sheetFtr').innerHTML = '';
  }
  function sheetOpen() { return sheetEl.classList.contains('on'); }
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheetScrimEl.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetOpen()) closeSheet();
  });

  // Standard footer for an editor sheet. Ids are the ones the save/delete
  // handlers below already bind to.
  function editorFtr(canDelete) {
    return (canDelete ? '<button type="button" class="btn dgr" id="delBtn">Delete</button>' : '') +
      '<div style="flex:1"></div>' +
      '<button type="button" class="btn" id="cancelBtn">Cancel</button>' +
      '<button type="button" class="btn pri" id="saveBtn">Save</button>';
  }

  // ===================================================================
  // List chrome: toolbar + search (§8)
  // ===================================================================
  function toolbarHtml(placeholder, addLabel) {
    return '<div class="panel"><div class="toolbar">' +
      '<div class="search-wrap' + (searchTerm ? ' has-val' : '') + '">' +
        ico(ICON.search, 16).replace('<svg ', '<svg class="icn" ') +
        '<input type="search" id="search" placeholder="' + esc(placeholder) + '" value="' + esc(searchTerm) + '">' +
        '<button type="button" class="clear" id="searchClear" aria-label="Clear search">' + ico(ICON.close, 14) + '</button>' +
      '</div>' +
      (addLabel ? '<button type="button" class="btn pri" id="addBtn">' + esc(addLabel) + '</button>' : '') +
      '</div></div>';
  }
  // Wires the search box to repaint ONLY the list container, so typing never
  // re-renders (and never re-focuses) the input itself.
  function wireToolbar(paint) {
    var inp = document.getElementById('search');
    if (!inp) return;
    var wrap = inp.parentNode;
    inp.addEventListener('input', function () {
      searchTerm = inp.value || '';
      wrap.classList.toggle('has-val', !!searchTerm);
      paint();
    });
    document.getElementById('searchClear').addEventListener('click', function () {
      searchTerm = '';
      inp.value = '';
      wrap.classList.remove('has-val');
      paint();
      inp.focus();
    });
  }

  function emptyState(big, sub) {
    return '<div class="empty-state"><div class="empty-big">' + esc(big) + '</div>' +
      '<div class="empty-sub">' + esc(sub) + '</div></div>';
  }

  // One list row (§8): avatar, name + muted subtitle, optional badge,
  // optional right-aligned monospace trailing amount.
  function rowHtml(o) {
    return '<button type="button" class="list-row' + (o.inactive ? ' inactive' : '') + '" data-id="' + esc(o.id) + '">' +
      '<span class="avatar">' + (o.icon ? ico(o.icon, 17) : esc(o.initials || '')) + '</span>' +
      '<span class="body"><span class="name">' + esc(o.name) + '</span>' +
      '<span class="sub">' + esc(o.sub || '') + '</span></span>' +
      (o.badge || '') +
      (o.amt != null ? '<span class="trail"><span class="amt mono">' + esc(o.amt) + '</span>' +
        (o.tag ? '<span class="tag">' + esc(o.tag) + '</span>' : '') + '</span>' : '') +
      '<span class="chev"></span></button>';
  }
  function kindBadge(kind) {
    var map = { customer: 'b-customer', supplier: 'b-supplier', both: 'b-both', expense: 'b-expense' };
    if (!map[kind]) return '';
    return '<span class="badge ' + map[kind] + '">' + esc(kind) + '</span>';
  }

  // ===================================================================
  // Generic simple-table CRUD helper (used by Firms/Warehouses/Services/
  // Party Kinds). The data-loading, merge-save and delete logic below is
  // unchanged — only the markup around it moved to list-rows + a sheet.
  // ===================================================================
  function simpleCrud(opts) {
    // opts: {table, perm, editPerm, deletePerm, columns:[{key,label,type}], title}
    return {
      async render() {
        var { data, error } = await sb.from(opts.table).select('*').is('deleted_at', null).order(opts.columns[0].key);
        if (error) { document.getElementById('content').innerHTML = '<div class="page"><div class="doc-sheet"><p class="warn-txt">' + esc(error.message) + '</p></div></div>'; return; }
        var all = data || [];
        document.getElementById('content').innerHTML =
          toolbarHtml('Search ' + opts.title.toLowerCase() + '…', '+ Add ' + opts.title.replace(/s$/, '')) +
          '<div class="page" id="listWrap"></div>';

        var rows = [];
        function paint() {
          var term = (searchTerm || '').toLowerCase();
          rows = all.filter(function (r) {
            return !term || opts.columns.some(function (c) { return String(r[c.key] || '').toLowerCase().indexOf(term) >= 0; });
          });
          var html = rows.map(function (r) {
            return rowHtml({
              id: r.id,
              icon: opts.icon,
              name: r[opts.columns[0].key],
              sub: opts.sub ? opts.sub(r) : '',
              badge: opts.badge ? opts.badge(r) : '',
              amt: opts.amt ? opts.amt(r) : null,
              tag: opts.tag || '',
              inactive: r.hasOwnProperty('active') ? r.active === false : false
            });
          }).join('');
          document.getElementById('listWrap').innerHTML = html ||
            emptyState('No ' + opts.title.toLowerCase() + ' yet', term ? 'Nothing matches “' + term + '”.' : 'Use “+ Add ' + opts.title.replace(/s$/, '') + '” to create the first one.');
          Array.prototype.forEach.call(document.querySelectorAll('#listWrap .list-row'), function (el) {
            el.addEventListener('click', function () { openForm(el.dataset.id, rows); });
          });
        }
        paint();
        wireToolbar(paint);
        document.getElementById('addBtn').addEventListener('click', function () { openForm(null, rows); });

        function openForm(id, rows) {
          var rec = id ? rows.filter(function (r) { return r.id === id; })[0] : {};
          // Captured ONCE, at open time — never re-derived at save time. This
          // matters most for image fields (§25's exact critical gotcha):
          // picking a logo mutates the live editing object immediately, so a
          // save-time-derived "original" would look identical to "new" and
          // the merge would wrongly conclude nothing changed.
          var originalSnapshot = id ? JSON.parse(JSON.stringify(rec)) : null;

          var body = '', pending = [];
          function flushPending() {
            while (pending.length) {
              var chunk = pending.splice(0, 2);
              body += chunk.length === 2 ? '<div class="f2">' + chunk.join('') + '</div>' : chunk[0];
            }
          }
          opts.columns.forEach(function (c) {
            if (c.type === 'bool') {
              flushPending();
              body += '<div class="swrow"><label class="sw"><input type="checkbox" id="f_' + c.key + '"' + (rec[c.key] ? ' checked' : '') + '><span class="trk"></span></label>' +
                '<span class="swlbl">' + esc(c.label) + '</span></div>';
            } else if (c.type === 'image') {
              flushPending();
              body += '<div class="field"><label for="f_' + c.key + '_file">' + esc(c.label) + '</label>' +
                '<input type="file" accept="image/*" id="f_' + c.key + '_file">' +
                (rec[c.key] ? '<img class="thumb" style="margin-top:6px" src="' + esc(rec[c.key]) + '" alt="">' : '') + '</div>';
            } else {
              pending.push('<div class="field"><label for="f_' + c.key + '">' + esc(c.label) + '</label>' +
                '<input id="f_' + c.key + '" value="' + esc(rec[c.key]) + '"></div>');
            }
          });
          flushPending();
          body += '<div class="warn-txt" id="formErr"></div>';

          openSheet((id ? 'Edit ' : 'New ') + opts.title.replace(/s$/, ''), body, editorFtr(!!id));

          var pendingImages = {};
          opts.columns.filter(function (c) { return c.type === 'image'; }).forEach(function (c) {
            var fileEl = document.getElementById('f_' + c.key + '_file');
            fileEl.addEventListener('change', function () {
              var file = fileEl.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function () { pendingImages[c.key] = reader.result; };
              reader.readAsDataURL(file);
            });
          });

          document.getElementById('cancelBtn').addEventListener('click', closeSheet);
          document.getElementById('saveBtn').addEventListener('click', async function () {
            var payload = {};
            opts.columns.forEach(function (c) {
              if (c.type === 'bool') payload[c.key] = document.getElementById('f_' + c.key).checked;
              else if (c.type === 'image') { if (pendingImages[c.key] !== undefined) payload[c.key] = pendingImages[c.key]; }
              else payload[c.key] = document.getElementById('f_' + c.key).value;
            });
            var errEl = document.getElementById('formErr');
            if (id && opts.useMerge) {
              function queueCrudMergeEdit() {
                OfflineQueue.enqueue({ kind: 'doc_edit_merge', headerTable: opts.table, headerId: id, headerOriginal: originalSnapshot, headerNew: payload });
                toast('No internet — your change is saved locally and will sync when back online.', true);
              }
              if (!navigator.onLine) { queueCrudMergeEdit(); broadcastRefresh(opts.table); closeSheet(); render(); return; }
              var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
                p_table: opts.table, p_id: id, p_original: originalSnapshot, p_new: payload
              });
              if (mergeErr) {
                if (OfflineQueue.isNetworkError(mergeErr)) { queueCrudMergeEdit(); broadcastRefresh(opts.table); closeSheet(); render(); return; }
                errEl.textContent = mergeErr.message; return;
              }
              if (mergeRes.status === 'deleted') { errEl.textContent = 'This record was deleted by someone else.'; return; }
              if (mergeRes.status === 'conflict') {
                // NOT auto-retried: retrying with the current row as the
                // new "original" but the SAME unchanged payload would make
                // the merge see "nobody changed it since [now]" and
                // silently overwrite what the other person just saved.
                errEl.textContent = 'Someone else changed "' + mergeRes.conflicts.join(', ') + '" at the same time — reopen and redo your change.';
                return;
              }
            } else if (id) {
              // No merge protection on this table (§14 offline concern still
              // applies): queue a plain update on network failure.
              if (!navigator.onLine) {
                OfflineQueue.enqueue({ kind: 'update', table: opts.table, recordId: id, payload: payload });
                toast('No internet — your change is saved locally and will sync when back online.', true);
                broadcastRefresh(opts.table); closeSheet(); render(); return;
              }
              var updRes = await sb.from(opts.table).update(payload).eq('id', id);
              if (updRes.error) {
                if (OfflineQueue.isNetworkError(updRes.error)) {
                  OfflineQueue.enqueue({ kind: 'update', table: opts.table, recordId: id, payload: payload });
                  toast('No internet — your change is saved locally and will sync when back online.', true);
                } else {
                  errEl.textContent = updRes.error.message; return;
                }
              }
            } else {
              var newId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
              var withId = Object.assign({ id: newId }, payload);
              if (!navigator.onLine) {
                OfflineQueue.enqueue({ kind: 'insert', table: opts.table, payload: withId });
                toast('No internet — saved locally, will sync automatically.', true);
              } else {
                var insRes = await sb.from(opts.table).insert(withId);
                if (insRes.error) {
                  if (OfflineQueue.isNetworkError(insRes.error)) {
                    OfflineQueue.enqueue({ kind: 'insert', table: opts.table, payload: withId });
                    toast('No internet — saved locally, will sync automatically.', true);
                  } else {
                    errEl.textContent = insRes.error.message; return;
                  }
                }
              }
            }
            broadcastRefresh(opts.table);
            closeSheet();
            render();
          });
          var delBtn = document.getElementById('delBtn');
          if (delBtn) delBtn.addEventListener('click', async function () {
            var noun = opts.title.replace(/s$/, '').toLowerCase();
            var ok = await confirmDialog(
              'Delete ' + (rec[opts.columns[0].key] || 'this ' + noun) + '?',
              'This ' + noun + ' moves to the Recycle Bin. Nothing already recorded against it changes, and anyone with the Recycle Bin permission can restore it.',
              'Delete', true);
            if (!ok) return;
            var res = await sb.from(opts.table).update({ deleted_at: new Date().toISOString() }).eq('id', id);
            if (res.error) { document.getElementById('formErr').textContent = res.error.message; return; }
            toast(noun.charAt(0).toUpperCase() + noun.slice(1) + ' moved to the Recycle Bin.');
            broadcastRefresh(opts.table);
            closeSheet();
            render();
          });
        }
      }
    };
  }

            var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
              p_table: 'items', p_id: id, p_original: originalSnapshot, p_new: payload
            });
            if (mergeErr) {
              if (OfflineQueue.isNetworkError(mergeErr)) { queueItemEdit(); broadcastRefresh('items'); closeSheet(); render(); return; }
              document.getElementById('formErr').textContent = mergeErr.message;
              return;
            }
            if (mergeRes.status === 'deleted') { document.getElementById('formErr').textContent = 'This item was deleted by someone else.'; return; }
            if (mergeRes.status === 'conflict') {
              // NOT auto-retried — see the identical comment in simpleCrud's
              // save handler above.
              document.getElementById('formErr').textContent = 'Someone else changed "' + mergeRes.conflicts.join(', ') + '" at the same time — reopen and redo your change.';
              return;
            }
          } else {
            var newItemId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
            var withId = Object.assign({ id: newItemId }, payload);
            if (!navigator.onLine) {
              OfflineQueue.enqueue({ kind: 'insert', table: 'items', payload: withId });
              toast('No internet — saved locally, will sync automatically.', true);
            } else {
              var insRes = await sb.from('items').insert(withId);
              if (insRes.error) {
                if (OfflineQueue.isNetworkError(insRes.error)) {
                  OfflineQueue.enqueue({ kind: 'insert', table: 'items', payload: withId });
                  toast('No internet — saved locally, will sync automatically.', true);
                } else {
                  document.getElementById('formErr').textContent = insRes.error.message;
                  return;
                }
              }
            }
          }
          broadcastRefresh('items');
          closeSheet();
          render();
        });
        var delBtn = document.getElementById('delBtn');
        if (delBtn) delBtn.addEventListener('click', async function () {
          var ok = await confirmDialog(
            'Delete ' + (rec.name || 'this item') + '?',
            'The item moves to the Recycle Bin. Invoices and stock history already recorded for it are kept exactly as they are, and anyone with the Recycle Bin permission can restore it.',

          broadcastRefresh('items');
          closeSheet();
          render();

  // ===================================================================
  // Backup / Restore (§23) — in-app "Backup now" (plain JSON) and restore
  // (auto-detects plain .json or .json.gz; .json.enc from the nightly
  // encrypted email needs decrypting locally first — not supported in this
  // lightweight in-browser tool). Restore here is a MERGE (upsert by id
  // into whichever tables the file contains) — it never deletes rows the
  // backup doesn't mention, which is the safe default for recovering from
  // an accidental change without risking a wider wipe.
  // ===================================================================
  var BACKUP_TABLES = ['app_users', 'companies', 'warehouses', 'period_lock', 'party_kinds', 'parties',
    'items', 'item_units', 'services', 'vouchers', 'voucher_lines', 'sales_returns', 'sales_return_lines',
    'stock_adjustments', 'quotations', 'quotation_lines', 'purchase_orders', 'po_lines',
    'service_invoices', 'service_invoice_lines', 'service_quotations', 'service_quotation_lines',
    'recurring_service_templates', 'stock_transfers', 'stock_transfer_lines', 'sheets'];

  var backupView = {
    async render() {
      if (!me.isAdmin) {
        document.getElementById('content').innerHTML = '<div class="page"><div class="doc-sheet">' +
          emptyState('Admins only', 'Only an admin can back up or restore this company’s data.') + '</div></div>';
        return;
      }
      var html = '<div class="page"><div class="doc-sheet">' +
        '<h2 class="page-h doc-h">Backup now</h2>' +
        '<p class="page-sub">Downloads a plain, unencrypted JSON snapshot of every table for local safekeeping.</p>' +
        '<button type="button" class="btn pri" id="bk_run">Download backup.json</button>' +
        '<div class="group-lbl">Restore (merge)</div>' +
        '<p class="page-sub">Upserts by id into whichever tables the file contains — it never deletes anything the file doesn’t mention. Accepts .json or .json.gz.</p>' +
        '<div class="field" style="max-width:340px"><label for="rs_file">Backup file</label><input type="file" id="rs_file" accept=".json,.gz"></div>' +
        '<button type="button" class="btn pri" id="rs_run" disabled>Restore</button>' +
        '<div class="warn-txt" id="rs_err" style="margin-top:8px;white-space:pre-line"></div><div class="ok-txt" id="rs_ok"></div>' +
        '</div></div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('bk_run').addEventListener('click', backupView.runBackup);

      var fileEl = document.getElementById('rs_file');
      var picked = null;
      fileEl.addEventListener('change', function () { picked = fileEl.files[0]; document.getElementById('rs_run').disabled = !picked; });
      document.getElementById('rs_run').addEventListener('click', async function () {
        var ok = await confirmDialog(
          'Restore from this file?',
          'Every record in the file is written over the matching record here (matched by id). Records that are not in the file are left untouched — nothing is deleted.',
          'Restore', true);
        if (!ok) return;
        backupView.runRestore(picked);
      });
    },

    async runBackup() {
      var out = { exported_at: new Date().toISOString(), tables: {} };
      for (var i = 0; i < BACKUP_TABLES.length; i++) {
        var table = BACKUP_TABLES[i];
        var all = [], from = 0;
        for (;;) {
          var { data, error } = await sb.from(table).select('*').range(from, from + 999);
          if (error) break; // table not present yet, or no read access — skip silently like the nightly job does
          all = all.concat(data);
          if (data.length < 1000) break;
          from += 1000;
        }
        out.tables[table] = all;
      }
      var blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'OHT-Backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      toast('Backup downloaded.');
    },

    async runRestore(file) {
      var errEl = document.getElementById('rs_err'), okEl = document.getElementById('rs_ok');
      errEl.textContent = ''; okEl.textContent = '';
      if (!file) { errEl.textContent = 'Pick a file first'; return; }
      try {
        var buf = await file.arrayBuffer();
        var bytes = new Uint8Array(buf);
        var isGzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
        var text;
        if (isGzip) {
          if (typeof pako === 'undefined') { errEl.textContent = 'Gzip support failed to load — try again, or ungzip the file locally first.'; return; }
          text = pako.inflate(bytes, { to: 'string' });
        } else if (file.name.endsWith('.enc')) {
          errEl.textContent = 'Encrypted (.json.enc) backups must be decrypted locally first — this in-app tool only accepts plain .json or .json.gz.';
          return;
        } else {
          text = new TextDecoder('utf-8').decode(bytes);
        }
        var parsed = JSON.parse(text);
        var tables = parsed.tables || {};
        var counts = {};
        for (var table in tables) {
          if (BACKUP_TABLES.indexOf(table) < 0) continue;
          var rows = tables[table];
          if (!rows || !rows.length) continue;
          var res = await sb.from(table).upsert(rows, { onConflict: 'id' });
          if (res.error) { errEl.textContent += table + ': ' + res.error.message + '\n'; continue; }
          counts[table] = rows.length;
        }
        okEl.textContent = 'Restored: ' + Object.keys(counts).map(function (t) { return t + ' (' + counts[t] + ')'; }).join(', ');
        Object.keys(counts).forEach(broadcastRefresh);
      } catch (e) {
        errEl.textContent = e.message || String(e);
      }
    }
  };

  };

  async function render() {
    var v = VIEWS[activeView];
    if (v) await v.render();
  }

  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('content').innerHTML = '<div class="page"><div class="doc-sheet">' +
        emptyState('Not signed in', 'Please sign in from the main app.') + '</div></div>';
      return;
    }
    var { data: profile } = await sb.from('app_users').select('is_admin,perms').eq('id', userData.user.id).maybeSingle();
    if (profile) { me.isAdmin = profile.is_admin; me.perms = profile.perms || {}; }
    buildNav();
    render();
    refreshCounts();
    OfflineQueue.startAutoFlush(sb);
    inited = true;
  })();
})();
</script>
</body>
</html>
