<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Masters — OHT Accounting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DDE1E6; --bg2:#FFFFFF; --bg3:#F5F7F8; --fg:#1F2933; --muted:#7B8794;
    --accent:#A67C2E; --accent2:#8F6B27; --danger:#9B2C2C; --ok:#14614A; --border:#CBD2D9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);}
  .toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .toolbar h1{font-size:16px;margin:0 12px 0 0;font-weight:700;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;}
  button{cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);padding:8px 12px;font-size:13px;}
  .tabs button{background:transparent;}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{background:var(--accent2);}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  input[type=search]{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);min-width:180px;}
  main{padding:14px;max-width:1100px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;}
  tr.row:hover{background:var(--bg3);cursor:pointer;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px;}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:13px;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
  .card h2{margin:0 0 14px;font-size:15px;}
  .actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
  .ok{color:var(--ok);font-size:13px;margin-top:8px;min-height:16px;}
  .chk{display:flex;align-items:center;gap:6px;}
  .balance{font-size:11px;color:var(--muted);}
  img.thumb{max-height:40px;max-width:80px;border-radius:4px;background:#fff;padding:2px;}
</style>
</head>
<body>

<div class="toolbar">
  <h1>Masters</h1>
  <div class="tabs" id="tabs"></div>
  <input type="search" id="search" placeholder="Search...">
</div>

<main id="content"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="offline-queue.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://zvzxoxbrwzjgevvkjaiu.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2enhveGJyd3pqZ2V2dmtqYWl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTYxMzQsImV4cCI6MjEwNTIzMjEzNH0.hyK-JevmCcK9D4iUbCC95ixVukGS1NPy_0pkbY1AXMk';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false }
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.oht !== 'active') return;
    d.active ? sb.auth.startAutoRefresh && sb.auth.startAutoRefresh() : sb.auth.stopAutoRefresh && sb.auth.stopAutoRefresh();
  });

  function broadcastRefresh(kind) {
    window.parent.postMessage({ oht: 'refresh', kind: kind }, '*');
  }

  var TABS = [
    { key: 'parties', label: 'Parties' },
    { key: 'items', label: 'Items' },
    { key: 'services', label: 'Services' },
    { key: 'companies', label: 'Firms' },
    { key: 'warehouses', label: 'Warehouses' },
    { key: 'partykinds', label: 'Party Kinds' },
    { key: 'users', label: 'Manage Users' },
    { key: 'recyclebin', label: 'Recycle Bin' },
    { key: 'backup', label: 'Backup / Restore' }
  ];
  var activeTab = 'parties';
  var me = { isAdmin: false, perms: {} };

  function buildTabs() {
    var tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.textContent = t.label;
      b.className = t.key === activeTab ? 'active' : '';
      b.addEventListener('click', function () { activeTab = t.key; buildTabs(); render(); });
      tabsEl.appendChild(b);
    });
  }

  document.getElementById('search').addEventListener('input', render);

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }

  // ===================================================================
  // Generic simple-table CRUD helper (used by Companies/Warehouses)
  // ===================================================================
  function simpleCrud(opts) {
    // opts: {table, perm, editPerm, deletePerm, columns:[{key,label,type}], title}
    return {
      async render() {
        var term = (document.getElementById('search').value || '').toLowerCase();
        var { data, error } = await sb.from(opts.table).select('*').is('deleted_at', null).order(opts.columns[0].key);
        var rows = (data || []).filter(function (r) {
          return !term || opts.columns.some(function (c) { return String(r[c.key] || '').toLowerCase().indexOf(term) >= 0; });
        });
        var html = '<div class="card"><h2>' + opts.title + '</h2>';
        html += '<button class="primary" id="addBtn">+ Add ' + opts.title.replace(/s$/, '') + '</button></div>';
        html += '<table><thead><tr>' + opts.columns.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') + '<th></th></tr></thead><tbody>';
        (rows || []).forEach(function (r) {
          html += '<tr class="row" data-id="' + r.id + '">' +
            opts.columns.map(function (c) {
              if (c.type === 'image') return '<td>' + (r[c.key] ? '<img class="thumb" src="' + r[c.key] + '">' : '') + '</td>';
              if (c.type === 'bool') return '<td>' + (r[c.key] ? '✓' : '') + '</td>';
              return '<td>' + esc(r[c.key]) + '</td>';
            }).join('') +
            '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('content').innerHTML = html;
        document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
        Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
          tr.addEventListener('click', function () { openForm(tr.dataset.id, rows); });
        });

        function openForm(id, rows) {
          var rec = id ? rows.filter(function (r) { return r.id === id; })[0] : {};
          // Captured ONCE, at open time — never re-derived at save time. This
          // matters most for image fields (§25's exact critical gotcha):
          // picking a logo mutates the live editing object immediately, so a
          // save-time-derived "original" would look identical to "new" and
          // the merge would wrongly conclude nothing changed.
          var originalSnapshot = id ? JSON.parse(JSON.stringify(rec)) : null;
          var html2 = '<div class="card"><h2>' + (id ? 'Edit' : 'New') + ' ' + opts.title.replace(/s$/, '') + '</h2><div class="grid">';
          opts.columns.forEach(function (c) {
            if (c.type === 'bool') {
              html2 += '<div class="chk"><input type="checkbox" id="f_' + c.key + '"' + (rec[c.key] ? ' checked' : '') + '><label style="margin:0">' + c.label + '</label></div>';
            } else if (c.type === 'image') {
              html2 += '<div><label>' + c.label + '</label><input type="file" accept="image/*" id="f_' + c.key + '_file">' +
                (rec[c.key] ? '<img class="thumb" src="' + rec[c.key] + '" style="margin-top:6px">' : '') + '</div>';
            } else {
              html2 += '<div><label>' + c.label + '</label><input id="f_' + c.key + '" value="' + esc(rec[c.key]) + '"></div>';
            }
          });
          html2 += '</div><div class="err" id="formErr"></div><div class="actions">' +
            (id ? '<button class="danger" id="delBtn">Delete</button>' : '') +
            '<button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div></div>';
          document.getElementById('content').innerHTML = html2;

          var pendingImages = {};
          opts.columns.filter(function (c) { return c.type === 'image'; }).forEach(function (c) {
            var fileEl = document.getElementById('f_' + c.key + '_file');
            fileEl.addEventListener('change', function () {
              var file = fileEl.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function () { pendingImages[c.key] = reader.result; };
              reader.readAsDataURL(file);
            });
          });

          document.getElementById('cancelBtn').addEventListener('click', render);
          document.getElementById('saveBtn').addEventListener('click', async function () {
            var payload = {};
            opts.columns.forEach(function (c) {
              if (c.type === 'bool') payload[c.key] = document.getElementById('f_' + c.key).checked;
              else if (c.type === 'image') { if (pendingImages[c.key] !== undefined) payload[c.key] = pendingImages[c.key]; }
              else payload[c.key] = document.getElementById('f_' + c.key).value;
            });
            var errEl = document.getElementById('formErr');
            if (id && opts.useMerge) {
              function queueCrudMergeEdit() {
                OfflineQueue.enqueue({ kind: 'doc_edit_merge', headerTable: opts.table, headerId: id, headerOriginal: originalSnapshot, headerNew: payload });
                alert('No internet — your change is saved locally and will sync when back online.');
              }
              if (!navigator.onLine) { queueCrudMergeEdit(); broadcastRefresh(opts.table); render(); return; }
              var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
                p_table: opts.table, p_id: id, p_original: originalSnapshot, p_new: payload
              });
              if (mergeErr) {
                if (OfflineQueue.isNetworkError(mergeErr)) { queueCrudMergeEdit(); broadcastRefresh(opts.table); render(); return; }
                errEl.textContent = mergeErr.message; return;
              }
              if (mergeRes.status === 'deleted') { errEl.textContent = 'This record was deleted by someone else.'; return; }
              if (mergeRes.status === 'conflict') {
                // NOT auto-retried: retrying with the current row as the
                // new "original" but the SAME unchanged payload would make
                // the merge see "nobody changed it since [now]" and
                // silently overwrite what the other person just saved.
                errEl.textContent = 'Someone else changed "' + mergeRes.conflicts.join(', ') + '" at the same time — reopen and redo your change.';
                return;
              }
            } else if (id) {
              // No merge protection on this table (§14 offline concern still
              // applies): queue a plain update on network failure.
              if (!navigator.onLine) {
                OfflineQueue.enqueue({ kind: 'update', table: opts.table, recordId: id, payload: payload });
                alert('No internet — your change is saved locally and will sync when back online.');
                broadcastRefresh(opts.table); render(); return;
              }
              var updRes = await sb.from(opts.table).update(payload).eq('id', id);
              if (updRes.error) {
                if (OfflineQueue.isNetworkError(updRes.error)) {
                  OfflineQueue.enqueue({ kind: 'update', table: opts.table, recordId: id, payload: payload });
                  alert('No internet — your change is saved locally and will sync when back online.');
                } else {
                  errEl.textContent = updRes.error.message; return;
                }
              }
            } else {
              var newId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
              var withId = Object.assign({ id: newId }, payload);
              if (!navigator.onLine) {
                OfflineQueue.enqueue({ kind: 'insert', table: opts.table, payload: withId });
                alert('No internet — saved locally, will sync automatically.');
              } else {
                var insRes = await sb.from(opts.table).insert(withId);
                if (insRes.error) {
                  if (OfflineQueue.isNetworkError(insRes.error)) {
                    OfflineQueue.enqueue({ kind: 'insert', table: opts.table, payload: withId });
                    alert('No internet — saved locally, will sync automatically.');
                  } else {
                    errEl.textContent = insRes.error.message; return;
                  }
                }
              }
            }
            broadcastRefresh(opts.table);
            render();
          });
          var delBtn = document.getElementById('delBtn');
          if (delBtn) delBtn.addEventListener('click', async function () {
            if (!confirm('Delete this ' + opts.title.replace(/s$/, '').toLowerCase() + '?')) return;
            var res = await sb.from(opts.table).update({ deleted_at: new Date().toISOString() }).eq('id', id);
            if (res.error) { document.getElementById('formErr').textContent = res.error.message; return; }
            broadcastRefresh(opts.table);
            render();
          });
        }
      }
    };
  }

  var companiesCrud = simpleCrud({
    table: 'companies', title: 'Firms', useMerge: true,
    columns: [
      { key: 'name', label: 'Name' }, { key: 'city', label: 'City' }, { key: 'phone', label: 'Phone' },
      { key: 'ntn', label: 'NTN' }, { key: 'is_default', label: 'Default', type: 'bool' },
      { key: 'logo', label: 'Logo', type: 'image' }, { key: 'signature', label: 'Signature', type: 'image' }, { key: 'stamp', label: 'Stamp', type: 'image' }
    ]
  });
  var warehousesCrud = simpleCrud({
    table: 'warehouses', title: 'Warehouses',
    columns: [{ key: 'name', label: 'Name' }, { key: 'city', label: 'City' }, { key: 'is_default', label: 'Default', type: 'bool' }, { key: 'active', label: 'Active', type: 'bool' }]
  });
  var servicesCrud = simpleCrud({
    table: 'services', title: 'Services', useMerge: true,
    columns: [{ key: 'name', label: 'Name' }, { key: 'rate', label: 'Rate' }, { key: 'tax_pct', label: 'Tax %' }, { key: 'notes', label: 'Notes' }, { key: 'active', label: 'Active', type: 'bool' }]
  });
  var partyKindsCrud = simpleCrud({
    table: 'party_kinds', title: 'Party Kinds',
    columns: [{ key: 'name', label: 'Name' }]
  });

  // ===================================================================
  // Parties (customer/supplier/both/expense)
  // ===================================================================
  var partiesView = {
    async render() {
      var term = (document.getElementById('search').value || '').toLowerCase();
      var { data } = await sb.from('parties').select('*').is('deleted_at', null).order('name');
      var rows = (data || []).filter(function (p) { return !term || p.name.toLowerCase().indexOf(term) >= 0; });
      var html = '<div class="card"><h2>Parties</h2><button class="primary" id="addBtn">+ Add Party</button></div>';
      html += '<table><thead><tr><th>Name</th><th>Kind</th><th>City</th><th>Phone</th><th>Opening</th></tr></thead><tbody>';
      rows.forEach(function (p) {
        html += '<tr class="row" data-id="' + p.id + '"><td>' + esc(p.name) + '</td><td>' + p.kind + '</td><td>' + esc(p.city) + '</td><td>' + esc(p.phone) + '</td>' +
          '<td>' + (p.opening || 0) + ' ' + p.opening_side + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
        tr.addEventListener('click', function () { openForm(tr.dataset.id, rows); });
      });

      function openForm(id, rows) {
        var rec = id ? rows.filter(function (r) { return r.id === id; })[0] : { kind: 'customer', opening_side: 'dr', credit_days: 0, active: true };
        var originalSnapshot = id ? JSON.parse(JSON.stringify(rec)) : null; // captured once, at open time (§25/§27)
        var html2 = '<div class="card"><h2>' + (id ? 'Edit' : 'New') + ' Party</h2><div class="grid">' +
          '<div><label>Name</label><input id="f_name" value="' + esc(rec.name) + '"></div>' +
          '<div><label>Kind</label><select id="f_kind">' +
            ['customer', 'supplier', 'both', 'expense'].map(function (k) { return '<option value="' + k + '"' + (k === rec.kind ? ' selected' : '') + '>' + k + '</option>'; }).join('') +
          '</select></div>' +
          '<div><label>Phone</label><input id="f_phone" value="' + esc(rec.phone) + '"></div>' +
          '<div><label>City</label><input id="f_city" value="' + esc(rec.city) + '"></div>' +
          '<div><label>Address</label><input id="f_address" value="' + esc(rec.address) + '"></div>' +
          '<div><label>NTN</label><input id="f_ntn" value="' + esc(rec.ntn) + '"></div>' +
          '<div><label>Opening</label><input type="number" step="0.01" id="f_opening" value="' + (rec.opening || 0) + '"></div>' +
          '<div><label>Opening side</label><select id="f_opening_side"><option value="dr"' + (rec.opening_side === 'dr' ? ' selected' : '') + '>Dr</option><option value="cr"' + (rec.opening_side === 'cr' ? ' selected' : '') + '>Cr</option></select></div>' +
          '<div><label>Opening date</label><input type="date" id="f_opening_date" value="' + (rec.opening_date || '') + '"></div>' +
          '<div><label>Credit days</label><input type="number" id="f_credit_days" value="' + (rec.credit_days || 0) + '"></div>' +
          '<div id="expenseTypeWrap" style="display:' + (rec.kind === 'expense' ? 'block' : 'none') + '"><label>Expense type</label><select id="f_expense_type"><option value="">Operating</option><option value="bank_charges"' + (rec.expense_type === 'bank_charges' ? ' selected' : '') + '>Bank charges</option></select></div>' +
          '</div><div><label>Notes</label><textarea id="f_notes">' + esc(rec.notes) + '</textarea></div>' +
          '<div class="err" id="formErr"></div><div class="actions">' +
          (id ? '<button class="danger" id="delBtn">Delete</button>' : '') +
          '<button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div></div>';
        document.getElementById('content').innerHTML = html2;

        document.getElementById('f_kind').addEventListener('change', function () {
          document.getElementById('expenseTypeWrap').style.display = this.value === 'expense' ? 'block' : 'none';
        });
        document.getElementById('cancelBtn').addEventListener('click', render);
        document.getElementById('saveBtn').addEventListener('click', async function () {
          var payload = {
            name: document.getElementById('f_name').value,
            kind: document.getElementById('f_kind').value,
            phone: document.getElementById('f_phone').value || null,
            city: document.getElementById('f_city').value || null,
            address: document.getElementById('f_address').value || null,
            ntn: document.getElementById('f_ntn').value || null,
            opening: Number(document.getElementById('f_opening').value) || 0,
            opening_side: document.getElementById('f_opening_side').value,
            opening_date: document.getElementById('f_opening_date').value || null,
            credit_days: Number(document.getElementById('f_credit_days').value) || 0,
            expense_type: document.getElementById('f_expense_type') ? (document.getElementById('f_expense_type').value || null) : null,
            notes: document.getElementById('f_notes').value || null
          };
          if (!payload.name) { document.getElementById('formErr').textContent = 'Name is required'; return; }
          if (id) {
            function queuePartyEdit() {
              OfflineQueue.enqueue({ kind: 'doc_edit_merge', headerTable: 'parties', headerId: id, headerOriginal: originalSnapshot, headerNew: payload });
              alert('No internet — your change is saved locally and will sync when back online.');
            }
            if (!navigator.onLine) { queuePartyEdit(); broadcastRefresh('parties'); render(); return; }
            var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
              p_table: 'parties', p_id: id, p_original: originalSnapshot, p_new: payload
            });
            if (mergeErr) {
              if (OfflineQueue.isNetworkError(mergeErr)) { queuePartyEdit(); broadcastRefresh('parties'); render(); return; }
              document.getElementById('formErr').textContent = mergeErr.message;
              return;
            }
            if (mergeRes.status === 'deleted') { document.getElementById('formErr').textContent = 'This party was deleted by someone else.'; return; }
            if (mergeRes.status === 'conflict') {
              // NOT auto-retried — see the identical comment in simpleCrud's
              // save handler above.
              document.getElementById('formErr').textContent = 'Someone else changed "' + mergeRes.conflicts.join(', ') + '" at the same time — reopen and redo your change.';
              return;
            }
          } else {
            var newId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
            var withId = Object.assign({ id: newId }, payload);
            if (!navigator.onLine) {
              OfflineQueue.enqueue({ kind: 'insert', table: 'parties', payload: withId });
              alert('No internet — saved locally, will sync automatically.');
            } else {
              var insRes = await sb.from('parties').insert(withId);
              if (insRes.error) {
                if (OfflineQueue.isNetworkError(insRes.error)) {
                  OfflineQueue.enqueue({ kind: 'insert', table: 'parties', payload: withId });
                  alert('No internet — saved locally, will sync automatically.');
                } else {
                  document.getElementById('formErr').textContent = insRes.error.message;
                  return;
                }
              }
            }
          }
          broadcastRefresh('parties');
          render();
        });
        var delBtn = document.getElementById('delBtn');
        if (delBtn) delBtn.addEventListener('click', async function () {
          if (!confirm('Delete this party?')) return;
          var res = await sb.from('parties').update({ deleted_at: new Date().toISOString() }).eq('id', id);
          if (res.error) { document.getElementById('formErr').textContent = res.error.message; return; }
          broadcastRefresh('parties');
          render();
        });
      }
    }
  };

  // ===================================================================
  // Items
  // ===================================================================
  async function loadItemUnits(itemId) {
    var { data } = await sb.from('item_units').select('*').eq('item_id', itemId).is('deleted_at', null).order('unit');
    var units = data || [];
    var wrap = document.getElementById('unitsWrap');
    if (!wrap) return;
    var html = '<div class="card"><h2>Alternate Units</h2><table><thead><tr><th>Unit</th><th>1 unit = how many base units</th><th></th></tr></thead><tbody>';
    units.forEach(function (u) {
      html += '<tr><td>' + esc(u.unit) + '</td><td>' + u.factor + '</td><td><button type="button" class="rmUnitBtn" data-id="' + u.id + '" style="color:var(--danger)">✕</button></td></tr>';
    });
    html += '</tbody></table><div style="display:flex;gap:8px;margin-top:8px;align-items:flex-end">' +
      '<div><label>Unit name</label><input id="newUnitName" style="width:120px"></div>' +
      '<div><label>Factor</label><input type="number" step="0.0001" id="newUnitFactor" value="1" style="width:100px"></div>' +
      '<button type="button" id="addUnitBtn">+ Add unit</button></div></div>';
    wrap.innerHTML = html;
    Array.prototype.forEach.call(wrap.querySelectorAll('.rmUnitBtn'), function (btn) {
      btn.addEventListener('click', async function () {
        await sb.from('item_units').update({ deleted_at: new Date().toISOString() }).eq('id', btn.dataset.id);
        loadItemUnits(itemId);
      });
    });
    document.getElementById('addUnitBtn').addEventListener('click', async function () {
      var unitName = document.getElementById('newUnitName').value.trim();
      var factor = Number(document.getElementById('newUnitFactor').value) || 1;
      if (!unitName) return;
      var res = await sb.from('item_units').insert({ item_id: itemId, unit: unitName, factor: factor });
      if (res.error) { alert(res.error.message); return; }
      loadItemUnits(itemId);
    });
  }

  var itemsView = {
    async render() {
      var term = (document.getElementById('search').value || '').toLowerCase();
      var { data } = await sb.from('items').select('*').is('deleted_at', null).order('name');
      var rows = (data || []).filter(function (i) { return !term || i.name.toLowerCase().indexOf(term) >= 0; });
      var html = '<div class="card"><h2>Items</h2><button class="primary" id="addBtn">+ Add Item</button></div>';
      html += '<table><thead><tr><th>Name</th><th>Type</th><th>Unit</th><th>Sale rate</th><th>Buy rate</th><th>Stock</th><th>Avg cost</th></tr></thead><tbody>';
      rows.forEach(function (i) {
        var low = i.reorder_level && i.stock_qty <= i.reorder_level;
        html += '<tr class="row" data-id="' + i.id + '"><td>' + esc(i.name) + (low ? ' <span style="color:#f59e0b">● low</span>' : '') + '</td>' +
          '<td>' + (i.item_type === 'raw_material_consumption' ? 'Raw Material' : 'General Goods') + '</td><td>' + esc(i.unit) + '</td>' +
          '<td>' + i.sale_rate + '</td><td>' + i.buy_rate + '</td><td>' + i.stock_qty + '</td><td>' + i.avg_cost + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
        tr.addEventListener('click', function () { openForm(tr.dataset.id, rows); });
      });

      function openForm(id, rows) {
        var rec = id ? rows.filter(function (r) { return r.id === id; })[0] : { unit: 'pcs', active: true, item_type: 'general_goods' };
        var originalSnapshot = id ? JSON.parse(JSON.stringify(rec)) : null; // captured once, at open time (§25/§27)
        var html2 = '<div class="card"><h2>' + (id ? 'Edit' : 'New') + ' Item</h2><div class="grid">' +
          '<div><label>Name</label><input id="f_name" value="' + esc(rec.name) + '"></div>' +
          '<div><label>Item Type</label><select id="f_item_type">' +
            '<option value="general_goods"' + (rec.item_type !== 'raw_material_consumption' ? ' selected' : '') + '>General Goods</option>' +
            '<option value="raw_material_consumption"' + (rec.item_type === 'raw_material_consumption' ? ' selected' : '') + '>Raw Material</option>' +
          '</select></div>' +
          '<div><label>Unit</label><input id="f_unit" value="' + esc(rec.unit) + '"></div>' +
          '<div><label>Sale rate</label><input type="number" step="0.01" id="f_sale_rate" value="' + (rec.sale_rate || 0) + '"></div>' +
          '<div><label>Buy rate</label><input type="number" step="0.01" id="f_buy_rate" value="' + (rec.buy_rate || 0) + '"></div>' +
          '<div><label>Tax %</label><input type="number" step="0.01" id="f_tax_pct" value="' + (rec.tax_pct || 0) + '"></div>' +
          '<div><label>Opening qty</label><input type="number" step="0.001" id="f_opening_qty" value="' + (rec.opening_qty || 0) + '"' + (id ? '' : '') + '></div>' +
          '<div><label>Opening rate</label><input type="number" step="0.01" id="f_opening_rate" value="' + (rec.opening_rate || 0) + '"></div>' +
          '<div><label>Reorder level</label><input type="number" step="0.001" id="f_reorder_level" value="' + (rec.reorder_level || 0) + '"></div>' +
          '<div><label>HS code</label><input id="f_hs_code" value="' + esc(rec.hs_code) + '"></div>' +
          '</div>' +
          (id ? '<p class="balance">Live stock: ' + rec.stock_qty + ' @ avg cost ' + rec.avg_cost + ' (computed by the costing engine — not editable directly)</p>' : '') +
          (id ? '<div id="unitsWrap"></div>' : '') +
          '<div class="err" id="formErr"></div><div class="actions">' +
          (id ? '<button class="danger" id="delBtn">Delete</button>' : '') +
          '<button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div></div>';
        document.getElementById('content').innerHTML = html2;
        if (id) loadItemUnits(id);

        document.getElementById('cancelBtn').addEventListener('click', render);
        document.getElementById('saveBtn').addEventListener('click', async function () {
          var payload = {
            name: document.getElementById('f_name').value,
            item_type: document.getElementById('f_item_type').value,
            unit: document.getElementById('f_unit').value || 'pcs',
            sale_rate: Number(document.getElementById('f_sale_rate').value) || 0,
            buy_rate: Number(document.getElementById('f_buy_rate').value) || 0,
            tax_pct: Number(document.getElementById('f_tax_pct').value) || 0,
            opening_qty: Number(document.getElementById('f_opening_qty').value) || 0,
            opening_rate: Number(document.getElementById('f_opening_rate').value) || 0,
            reorder_level: Number(document.getElementById('f_reorder_level').value) || 0,
            hs_code: document.getElementById('f_hs_code').value || null
          };
          if (!payload.name) { document.getElementById('formErr').textContent = 'Name is required'; return; }
          if (id) {
            function queueItemEdit() {
              OfflineQueue.enqueue({ kind: 'doc_edit_merge', headerTable: 'items', headerId: id, headerOriginal: originalSnapshot, headerNew: payload });
              alert('No internet — your change is saved locally and will sync when back online.');
            }
            if (!navigator.onLine) { queueItemEdit(); broadcastRefresh('items'); render(); return; }
            var { data: mergeRes, error: mergeErr } = await sb.rpc('smart_merge_update', {
              p_table: 'items', p_id: id, p_original: originalSnapshot, p_new: payload
            });
            if (mergeErr) {
              if (OfflineQueue.isNetworkError(mergeErr)) { queueItemEdit(); broadcastRefresh('items'); render(); return; }
              document.getElementById('formErr').textContent = mergeErr.message;
              return;
            }
            if (mergeRes.status === 'deleted') { document.getElementById('formErr').textContent = 'This item was deleted by someone else.'; return; }
            if (mergeRes.status === 'conflict') {
              // NOT auto-retried — see the identical comment in simpleCrud's
              // save handler above.
              document.getElementById('formErr').textContent = 'Someone else changed "' + mergeRes.conflicts.join(', ') + '" at the same time — reopen and redo your change.';
              return;
            }
          } else {
            var newItemId = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2));
            var withId = Object.assign({ id: newItemId }, payload);
            if (!navigator.onLine) {
              OfflineQueue.enqueue({ kind: 'insert', table: 'items', payload: withId });
              alert('No internet — saved locally, will sync automatically.');
            } else {
              var insRes = await sb.from('items').insert(withId);
              if (insRes.error) {
                if (OfflineQueue.isNetworkError(insRes.error)) {
                  OfflineQueue.enqueue({ kind: 'insert', table: 'items', payload: withId });
                  alert('No internet — saved locally, will sync automatically.');
                } else {
                  document.getElementById('formErr').textContent = insRes.error.message;
                  return;
                }
              }
            }
          }
          broadcastRefresh('items');
          render();
        });
        var delBtn = document.getElementById('delBtn');
        if (delBtn) delBtn.addEventListener('click', async function () {
          if (!confirm('Delete this item?')) return;
          var res = await sb.from('items').update({ deleted_at: new Date().toISOString() }).eq('id', id);
          if (res.error) { document.getElementById('formErr').textContent = res.error.message; return; }
          broadcastRefresh('items');
          render();
        });
      }
    }
  };

  // ===================================================================
  // Manage Users (§7/§22) — admin-provisions-users model
  // ===================================================================
  var PERM_GROUPS = {
    'Bills & Entries': ['bill_create', 'bill_edit', 'bill_delete', 'ledger_create', 'ledger_delete', 'material_cost_view'],
    'Masters': ['masters_edit', 'masters_categories', 'masters_import', 'masters_delete'],
    'Reports & Tools': ['reports_view', 'period_lock', 'backup_restore', 'recycle_bin'],
    'Quotations & Purchase Orders': ['quotation_create', 'quotation_edit', 'quotation_delete', 'po_create', 'po_edit', 'po_delete']
  };

  var usersView = {
    async render() {
      if (!me.isAdmin) {
        document.getElementById('content').innerHTML = '<div class="card"><p>Only admins can manage users.</p></div>';
        return;
      }
      var { data } = await sb.from('app_users').select('*').order('username');
      var rows = data || [];
      var { count: activeCount } = await sb.from('app_users').select('id', { count: 'exact', head: true }).eq('is_active', true);
      var html = '<div class="card"><h2>Manage Users</h2><p class="balance">' + (activeCount || 0) + ' / 15 active users (Professional plan limit)</p>' +
        '<button class="primary" id="addBtn">+ New user</button></div>';
      html += '<table><thead><tr><th>Username</th><th>Admin</th><th>Active</th></tr></thead><tbody>';
      rows.forEach(function (u) {
        html += '<tr class="row" data-id="' + u.id + '"><td>' + esc(u.username) + '</td><td>' + (u.is_admin ? '✓' : '') + '</td><td>' + (u.is_active ? '✓' : '✗') + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('addBtn').addEventListener('click', function () { openForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll('tr.row'), function (tr) {
        tr.addEventListener('click', function () { openForm(tr.dataset.id, rows); });
      });

      function openForm(id, rows) {
        var rec = id ? rows.filter(function (r) { return r.id === id; })[0] : { is_active: true, perms: {} };
        var perms = rec.perms || {};
        var html2 = '<div class="card"><h2>' + (id ? 'Edit' : 'New') + ' User</h2><div class="grid">';
        if (!id) html2 += '<div style="grid-column:1/-1"><label>Supabase Auth User ID</label><input id="f_id" placeholder="paste the auth.users id created in Supabase Dashboard"></div>';
        html2 += '<div><label>Username</label><input id="f_username" value="' + esc(rec.username) + '"></div>' +
          '<div class="chk"><input type="checkbox" id="f_is_admin"' + (rec.is_admin ? ' checked' : '') + '><label style="margin:0">Admin (bypasses all permission checks)</label></div>' +
          '<div class="chk"><input type="checkbox" id="f_is_active"' + (rec.is_active ? ' checked' : '') + '><label style="margin:0">Active</label></div>' +
          '</div>';
        Object.keys(PERM_GROUPS).forEach(function (group) {
          html2 += '<div style="margin-top:10px"><strong style="font-size:12px">' + group + '</strong> <button type="button" class="selectAllBtn" data-group="' + esc(group) + '" style="margin-left:8px;font-size:11px;padding:2px 8px">select all</button><div class="grid">';
          PERM_GROUPS[group].forEach(function (key) {
            html2 += '<div class="chk"><input type="checkbox" class="permChk" data-group="' + esc(group) + '" data-key="' + key + '"' + (perms[key] ? ' checked' : '') + '><label style="margin:0">' + key + '</label></div>';
          });
          html2 += '</div></div>';
        });
        html2 += '<div class="err" id="formErr"></div><div class="actions">' +
          '<button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div></div>';
        document.getElementById('content').innerHTML = html2;

        Array.prototype.forEach.call(document.querySelectorAll('.selectAllBtn'), function (btn) {

          });

          var payload = {

  // ===================================================================
  // Recycle Bin (§22/§28: gated by the recycle_bin permission via the
  // enforce_perm_on_update trigger — this UI just calls the same UPDATE
  // ...set deleted_at=null every restore path uses, and lets the trigger
  // accept or reject it)
  // ===================================================================
  var RECYCLE_TABLES = [
    { table: 'parties', label: 'Parties', field: 'name' },
    { table: 'items', label: 'Items', field: 'name' },
    { table: 'companies', label: 'Firms', field: 'name' },
    { table: 'warehouses', label: 'Warehouses', field: 'name' },
    { table: 'services', label: 'Services', field: 'name' },
    { table: 'party_kinds', label: 'Party Kinds', field: 'name' },
    { table: 'vouchers', label: 'Sales/Purchase Invoices', field: 'vno' },
    { table: 'sales_returns', label: 'Sales Returns', field: 'rno' },
    { table: 'quotations', label: 'Quotations', field: 'qno' },
    { table: 'purchase_orders', label: 'Purchase Orders', field: 'pono' },
    { table: 'service_invoices', label: 'Service Invoices', field: 'sino' },
    { table: 'service_quotations', label: 'Service Quotations', field: 'sqno' },
    { table: 'stock_transfers', label: 'Stock Transfers', field: 'tno' },
    { table: 'stock_adjustments', label: 'Stock Adjustments', field: 'reason' },
    { table: 'sheets', label: 'Daily Cash Book sheets', field: 'sheet_date' }
  ];

  var recycleBinView = {
    async render() {
      var html = '<div class="card"><h2>Recycle Bin</h2><p class="balance">Soft-deleted records across every module. Restoring requires the recycle_bin permission (or admin).</p></div>';
      document.getElementById('content').innerHTML = html + '<div id="rb_rows">Loading…</div>';
      var rowsHtml = '';
      for (var i = 0; i < RECYCLE_TABLES.length; i++) {
        var t = RECYCLE_TABLES[i];
        var { data, error } = await sb.from(t.table).select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false }).limit(50);
        if (error || !data || !data.length) continue;
        rowsHtml += '<div class="card"><h2>' + t.label + '</h2><table><tbody>';
        data.forEach(function (r) {
          rowsHtml += '<tr><td>' + esc(r[t.field]) + '</td><td style="color:var(--muted);font-size:11px">deleted ' + (r.deleted_at || '').slice(0, 19) + '</td>' +
            '<td><button class="restoreBtn" data-table="' + t.table + '" data-id="' + r.id + '">Restore</button></td></tr>';
        });

      }

      Array.prototype.forEach.call(document.querySelectorAll('.restoreBtn'), function (btn) {
        btn.addEventListener('click', async function () {
          var res = await sb.from(btn.dataset.table).update({ deleted_at: null }).eq('id', btn.dataset.id);
          if (res.error) { alert(res.error.message); return; }

        });
      });
    }
  };

  // ===================================================================
  // Backup / Restore (§23) — in-app "Backup now" (plain JSON) and restore
  // (auto-detects plain .json or .json.gz; .json.enc from the nightly
  // encrypted email needs decrypting locally first — not supported in this
  // lightweight in-browser tool). Restore here is a MERGE (upsert by id
  // into whichever tables the file contains) — it never deletes rows the
  // backup doesn't mention, which is the safe default for recovering from
  // an accidental change without risking a wider wipe.
  // ===================================================================
  var BACKUP_TABLES = ['app_users', 'companies', 'warehouses', 'period_lock', 'party_kinds', 'parties',
    'items', 'item_units', 'services', 'vouchers', 'voucher_lines', 'sales_returns', 'sales_return_lines',
    'stock_adjustments', 'quotations', 'quotation_lines', 'purchase_orders', 'po_lines',
    'service_invoices', 'service_invoice_lines', 'service_quotations', 'service_quotation_lines',
    'recurring_service_templates', 'stock_transfers', 'stock_transfer_lines', 'sheets'];

  var backupView = {
    async render() {
      if (!me.isAdmin) {
        document.getElementById('content').innerHTML = '<div class="card"><p>Only admins can back up or restore.</p></div>';
        return;
      }
      var html = '<div class="card"><h2>Backup now</h2><p class="balance">Downloads a plain, unencrypted JSON snapshot of every table for local safekeeping.</p>' +
        '<button class="primary" id="bk_run">Download backup.json</button></div>';
      html += '<div class="card"><h2>Restore (merge)</h2><p class="balance">Upserts by id into whichever tables the file contains — never deletes anything the file doesn\'t mention. Accepts .json or .json.gz.</p>' +
        '<input type="file" id="rs_file" accept=".json,.gz"> <button class="primary" id="rs_run" disabled>Restore</button>' +
        '<div class="err" id="rs_err"></div><div class="ok" id="rs_ok"></div></div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('bk_run').addEventListener('click', backupView.runBackup);

      var fileEl = document.getElementById('rs_file');
      var picked = null;
      fileEl.addEventListener('change', function () { picked = fileEl.files[0]; document.getElementById('rs_run').disabled = !picked; });
      document.getElementById('rs_run').addEventListener('click', function () { backupView.runRestore(picked); });
    },

    async runBackup() {
      var out = { exported_at: new Date().toISOString(), tables: {} };
      for (var i = 0; i < BACKUP_TABLES.length; i++) {
        var table = BACKUP_TABLES[i];
        var all = [], from = 0;
        for (;;) {
          var { data, error } = await sb.from(table).select('*').range(from, from + 999);
          if (error) break; // table not present yet, or no read access — skip silently like the nightly job does
          all = all.concat(data);
          if (data.length < 1000) break;
          from += 1000;
        }
        out.tables[table] = all;
      }
      var blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'OHT-Backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
    },

    async runRestore(file) {
      var errEl = document.getElementById('rs_err'), okEl = document.getElementById('rs_ok');
      errEl.textContent = ''; okEl.textContent = '';
      if (!file) { errEl.textContent = 'Pick a file first'; return; }
      try {
        var buf = await file.arrayBuffer();
        var bytes = new Uint8Array(buf);
        var isGzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
        var text;
        if (isGzip) {
          if (typeof pako === 'undefined') { errEl.textContent = 'Gzip support failed to load — try again, or ungzip the file locally first.'; return; }
          text = pako.inflate(bytes, { to: 'string' });
        } else if (file.name.endsWith('.enc')) {
          errEl.textContent = 'Encrypted (.json.enc) backups must be decrypted locally first — this in-app tool only accepts plain .json or .json.gz.';
          return;
        } else {
          text = new TextDecoder('utf-8').decode(bytes);
        }
        var parsed = JSON.parse(text);
        var tables = parsed.tables || {};
        var counts = {};
        for (var table in tables) {
          if (BACKUP_TABLES.indexOf(table) < 0) continue;
          var rows = tables[table];
          if (!rows || !rows.length) continue;
          var res = await sb.from(table).upsert(rows, { onConflict: 'id' });
          if (res.error) { errEl.textContent += table + ': ' + res.error.message + '\n'; continue; }
          counts[table] = rows.length;
        }
        okEl.textContent = 'Restored: ' + Object.keys(counts).map(function (t) { return t + ' (' + counts[t] + ')'; }).join(', ');
        Object.keys(counts).forEach(broadcastRefresh);
      } catch (e) {
        errEl.textContent = e.message || String(e);
      }
    }
  };

  var VIEWS = { parties: partiesView, items: itemsView, services: servicesCrud, companies: companiesCrud, warehouses: warehousesCrud, partykinds: partyKindsCrud, users: usersView, recyclebin: recycleBinView, backup: backupView };

  async function render() {
    var v = VIEWS[activeTab];
    if (v) await v.render();
  }

  (async function init() {
    var { data: userData } = await sb.auth.getUser();
    if (!userData || !userData.user) {
      document.getElementById('content').innerHTML = '<p>Please sign in from the main app.</p>';
      return;
    }
    var { data: profile } = await sb.from('app_users').select('is_admin,perms').eq('id', userData.user.id).maybeSingle();
    if (profile) { me.isAdmin = profile.is_admin; me.perms = profile.perms || {}; }
    buildTabs();
    render();
    OfflineQueue.startAutoFlush(sb);
  })();
})();
